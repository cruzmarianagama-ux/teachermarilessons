<style>
  :root {
    --orange: #FF5C23;
    --purple: #1D1050;
    --purple-light: #5340c8;
    --green: #04392F;
    --cream: #FAEAD3;
    --cream-light: #fff8f0;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --red: #ef4444;
    --teal: #0d9488;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 20px rgba(29,16,80,0.10);
    --shadow-sm: 0 2px 8px rgba(29,16,80,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--cream-light);
    color: var(--purple);
    min-height: 100vh;
  }
  button, input, textarea, select { font-family: 'Poppins', sans-serif; }

  /* ── WELCOME SCREEN ── */
  #welcome-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  #welcome-screen.hidden { display: none; }
  .welcome-card {
    background: var(--white);
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .welcome-logo { height: 48px; max-width: 100%; object-fit: contain; margin-bottom: 16px; }
  .welcome-hi { font-size: 1.5rem; font-weight: 800; color: var(--purple); margin-bottom: 6px; }
  .welcome-sub { font-size: 0.82rem; color: var(--gray); margin-bottom: 24px; line-height: 1.5; }
  .welcome-input {
    width: 100%;
    border: 2px solid var(--gray-light);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--purple);
    text-align: center;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .welcome-input:focus { border-color: var(--purple-light); }
  .welcome-btn {
    width: 100%;
    padding: 13px;
    background: var(--orange);
    color: var(--white);
    border: none;
    border-radius: 99px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255,92,35,0.35);
    transition: all 0.2s;
  }
  .welcome-btn:hover { background: #e84d18; transform: translateY(-1px); }

  /* ── HELLO BANNER ── */
  #hello-banner {
    display: none;
    background: linear-gradient(90deg, var(--orange), #ff8c5a);
    color: var(--white);
    text-align: center;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 700;
  }
  #hello-banner.show { display: block; }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
    padding: 28px 24px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,92,35,0.18);
  }
  .header::after {
    content: ''; position: absolute; bottom: -30px; left: -30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,92,35,0.12);
  }
  .header-inner { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; position: relative; z-index: 1; }
  .header-logo { height: 72px; max-width: 100%; object-fit: contain; }
  .header h1 { font-size: 1.5rem; font-weight: 800; color: var(--white); letter-spacing: -0.5px; }
  .header .subtitle {
    font-size: 0.82rem; font-weight: 500;
    color: rgba(255,255,255,0.70);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  /* ── PROGRESS BAR ── */
  .progress-section { background: var(--white); padding: 16px 20px; box-shadow: var(--shadow-sm); }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.78rem; font-weight: 600; color: var(--purple);
    margin-bottom: 8px;
  }
  .progress-track { height: 10px; background: var(--gray-light); border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), #ff8c5a);
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  /* ── MOTIVATION ── */
  .motivation-bar {
    background: linear-gradient(90deg, var(--green), #0a6655);
    color: var(--white);
    text-align: center;
    padding: 10px 16px;
    font-size: 0.82rem;
    font-weight: 500;
  }

  /* ── TABS ── */
  .tabs-wrap {
    background: var(--white);
    overflow-x: auto;
    border-bottom: 2px solid var(--gray-light);
    position: sticky; top: 0; z-index: 50;
    box-shadow: var(--shadow-sm);
    -webkit-overflow-scrolling: touch;
  }
  .tabs { display: flex; min-width: max-content; padding: 0 8px; }
  .tab-btn {
    padding: 14px 16px;
    font-size: 0.78rem; font-weight: 600;
    color: var(--gray);
    background: none; border: none; cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--purple-light); }
  .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
  .tab-btn.done::after { content: ' ✓'; color: var(--teal); font-weight: 800; }

  /* ── CONTENT ── */
  .content { max-width: 780px; margin: 0 auto; padding: 24px 16px 60px; }
  .day-panel { display: none; }
  .day-panel.active { display: block; }

  .day-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .day-number {
    background: var(--orange); color: var(--white);
    font-size: 1.1rem; font-weight: 800;
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(255,92,35,0.3);
  }
  .day-title { font-size: 1.2rem; font-weight: 700; color: var(--purple); }
  .day-desc { font-size: 0.82rem; color: var(--gray); margin-top: 2px; }

  /* ── EXERCISE CARD ── */
  .ex-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--purple-light);
  }
  .ex-card.grammar { border-left-color: var(--orange); }
  .ex-card.reading { border-left-color: var(--teal); }
  .ex-card.writing { border-left-color: var(--green); }
  .ex-card.challenge { border-left-color: var(--orange); background: linear-gradient(135deg, #fff8f0, #fff); }
  .ex-title { font-size: 0.98rem; font-weight: 700; color: var(--purple); margin-bottom: 4px; }
  .ex-instruction { font-size: 0.82rem; color: var(--gray); margin-bottom: 18px; line-height: 1.5; }
  .done-chip {
    display: none;
    font-size: 0.68rem; font-weight: 700;
    background: #f0fdfa; color: var(--teal);
    border: 1px solid #99f6e4;
    border-radius: 99px; padding: 1px 8px;
    margin-left: 6px; vertical-align: middle;
  }
  .ex-card.done .done-chip { display: inline-block; }

  /* ── ITEM LAYOUT ── */
  .item { margin-bottom: 16px; }
  .q-row { display: flex; gap: 8px; align-items: flex-start; }
  .q-num { font-weight: 700; color: var(--purple-light); flex-shrink: 0; min-width: 18px; font-size: 0.88rem; line-height: 1.9; }
  .q-body { flex: 1; min-width: 0; font-size: 0.88rem; font-weight: 500; color: var(--purple); line-height: 1.9; }
  .blank { color: var(--gray); letter-spacing: 1px; font-weight: 600; }

  /* ── DIALOGUE ── */
  .dlg { display: flex; flex-direction: column; gap: 2px; }
  .dline { display: flex; gap: 8px; align-items: baseline; }
  .dline .speaker { color: var(--orange); font-weight: 700; flex-shrink: 0; min-width: 20px; }
  .dline .say { flex: 1; min-width: 0; }

  /* ── WHY / CORRECTION BOX ── */
  .why-slot {
    display: none;
    margin-top: 8px;
    font-size: 0.8rem;
    line-height: 1.55;
    background: #f0fdfa;
    border-left: 3px solid var(--teal);
    padding: 8px 10px;
    border-radius: 0 6px 6px 0;
    color: var(--purple);
  }
  .why-slot.show { display: block; }
  .why-slot .bad { color: var(--red); font-weight: 700; }
  .why-slot .good { color: var(--teal); font-weight: 700; }
  .why-slot .why { display: block; margin-top: 2px; }
  .why-slot .row + .row { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #99f6e4; }

  /* ── MULTIPLE CHOICE ── */
  .mc-options { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .mc-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--gray-light);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.85rem; font-weight: 500;
    background: var(--white);
    line-height: 1.4;
  }
  .mc-option:hover { border-color: var(--purple-light); background: #f5f3ff; }
  .mc-option.selected { border-color: var(--purple-light); background: #f5f3ff; }
  .mc-option.correct { border-color: var(--teal); background: #f0fdfa; color: var(--teal); font-weight: 700; }
  .mc-option.wrong { border-color: var(--red); background: #fef2f2; color: var(--red); font-weight: 700; }
  .mc-option input[type=radio] { accent-color: var(--purple-light); flex-shrink: 0; }

  /* ── FILL IN ── */
  .fill-input {
    border: none;
    border-bottom: 2px solid var(--purple-light);
    padding: 1px 6px;
    font-size: 0.88rem; font-weight: 600;
    color: var(--purple);
    background: #faf9ff;
    width: 120px;
    max-width: 100%;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    display: inline-block;
    border-radius: 4px 4px 0 0;
  }
  .fill-input:focus { border-bottom-color: var(--orange); background: #fff5ee; }
  .fill-input.correct { border-bottom-color: var(--teal); color: var(--teal); background: #f0fdfa; }
  .fill-input.wrong { border-bottom-color: var(--red); color: var(--red); background: #fef2f2; }

  /* ── INLINE CHOICE (No / Yes) ── */
  .ic-opt {
    display: inline-block;
    padding: 1px 10px;
    margin: 0 2px;
    border-radius: 6px;
    border: 2px solid var(--purple-light);
    background: var(--white);
    color: var(--purple);
    font-size: 0.86rem; font-weight: 700;
    cursor: pointer;
    line-height: 1.5;
    transition: all 0.15s;
  }
  .ic-opt:hover { background: #f5f3ff; }
  .ic-opt.selected { background: var(--purple); color: var(--white); border-color: var(--purple); }
  .ic-opt.correct { background: var(--teal); border-color: var(--teal); color: var(--white); }
  .ic-opt.wrong { background: var(--red); border-color: var(--red); color: var(--white); }
  .ic-sep { color: var(--gray); font-weight: 600; }

  /* ── TEXTAREA ── */
  .writing-area {
    width: 100%;
    border: 2px solid var(--gray-light);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 0.88rem;
    color: var(--purple);
    resize: vertical;
    outline: none;
    min-height: 180px;
    transition: border-color 0.2s;
    margin-top: 14px;
  }
  .writing-area:focus { border-color: var(--purple-light); }
  .word-count { font-size: 0.75rem; color: var(--gray); margin-top: 4px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 0.82rem; font-weight: 700;
    cursor: pointer; border: none;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary { background: var(--orange); color: var(--white); box-shadow: 0 4px 12px rgba(255,92,35,0.25); }
  .btn-primary:hover { background: #e84d18; transform: translateY(-1px); }
  .btn-secondary { background: var(--gray-light); color: var(--purple); }
  .btn-secondary:hover { background: #e5e7eb; }
  .btn-whatsapp { background: #25D366; color: var(--white); box-shadow: 0 4px 12px rgba(37,211,102,0.25); }
  .btn-whatsapp:hover { background: #1fb855; transform: translateY(-1px); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  /* ── FEEDBACK ── */
  .feedback {
    display: none;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.83rem; font-weight: 600;
    margin-top: 14px;
    line-height: 1.5;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #f0fdfa; color: var(--teal); border: 1px solid #99f6e4; }
  .feedback.err { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
  .feedback.partial { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }

  /* ── CLICK-MATCH ── */
  .cm-wrap { display: flex; gap: 24px; align-items: flex-start; }
  .cm-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .cm-item {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--gray-light);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.85rem; font-weight: 600;
    color: var(--purple);
    background: var(--white);
    text-align: center;
    user-select: none;
    word-break: break-word;
  }
  .cm-item:hover { border-color: var(--purple-light); background: #f5f3ff; }
  .cm-item.active { border-color: var(--orange); background: #fff5ee; outline: 2px solid var(--orange); }
  .cm-item.linked { border-color: var(--purple-light); background: #f5f3ff; }
  .cm-item.correct-link { border-color: var(--teal); background: #f0fdfa; color: var(--teal); }
  .cm-item.wrong-link { border-color: var(--red); background: #fef2f2; color: var(--red); }
  .cm-pair-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--purple-light); color: #fff;
    font-size: 0.65rem; font-weight: 700;
    margin-left: 6px;
  }
  .cm-tip { font-size: 0.75rem; color: var(--gray); margin-bottom: 10px; }

  /* ── TRUE / FALSE ── */
  .tf-btns { display: inline-flex; gap: 6px; margin-left: 4px; vertical-align: middle; }
  .tf-btn {
    padding: 2px 14px;
    border-radius: 99px;
    border: 2px solid var(--gray-light);
    font-size: 0.78rem; font-weight: 700;
    cursor: pointer;
    background: var(--white);
    color: var(--purple);
    transition: all 0.2s;
  }
  .tf-btn:hover { border-color: var(--purple-light); }
  .tf-btn.selected { border-color: var(--purple); background: var(--purple); color: #fff; }
  .tf-btn.correct { border-color: var(--teal); background: var(--teal); color: #fff; }
  .tf-btn.wrong { border-color: var(--red); background: var(--red); color: #fff; }

  /* ── SENTENCE BUILDER ── */
  .sb-words {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 6px 0 8px; min-height: 40px;
    padding: 8px; background: var(--gray-light);
    border-radius: var(--radius-sm);
  }
  .sb-zone {
    display: flex; flex-wrap: wrap; gap: 8px;
    min-height: 44px; padding: 8px 10px;
    background: var(--white);
    border: 2px dashed var(--purple-light);
    border-radius: var(--radius-sm);
    transition: border-color 0.2s;
  }
  .sb-zone.correct-zone { border-color: var(--teal); border-style: solid; background: #f0fdfa; }
  .sb-zone.wrong-zone { border-color: var(--red); border-style: solid; background: #fef2f2; }
  .sb-chip {
    background: var(--purple); color: var(--white);
    border: none; border-radius: 6px;
    padding: 5px 12px;
    font-size: 0.84rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .sb-chip:hover { background: var(--purple-light); }
  .sb-chip.in-zone { background: var(--orange); }
  .sb-label { font-size: 0.72rem; font-weight: 700; color: var(--gray); }

  /* ── READING ── */
  .reading-text {
    background: linear-gradient(135deg, var(--cream), #fff5e6);
    border-radius: var(--radius-sm);
    padding: 18px;
    margin-bottom: 18px;
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--purple);
    font-weight: 500;
    border-left: 4px solid var(--teal);
  }
  .reading-text p + p { margin-top: 10px; }
  .reading-title { font-weight: 800; font-size: 1rem; margin-bottom: 6px; }
  .listen-btn {
    background: var(--white); border: 1px solid #99f6e4; cursor: pointer;
    font-size: 0.75rem; font-weight: 700; color: var(--teal);
    padding: 3px 10px; border-radius: 99px;
    margin-bottom: 8px;
  }

  /* ── WRITING ── */
  .example-box {
    background: linear-gradient(135deg, var(--cream), #fff5e6);
    border-radius: var(--radius-sm);
    padding: 16px;
    font-size: 0.88rem;
    line-height: 1.8;
    color: var(--purple);
    font-weight: 500;
    border: 2px dashed var(--orange);
  }
  .example-box .ex-label { font-size: 0.72rem; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .checklist { list-style: none; margin: 14px 0 0; }
  .checklist li {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0;
    font-size: 0.86rem; font-weight: 500;
    color: var(--purple);
    border-bottom: 1px solid var(--gray-light);
  }
  .checklist li:last-child { border-bottom: none; }
  .check-icon { color: var(--teal); font-weight: 800; }
  .guide-title { font-size: 0.82rem; font-weight: 700; color: var(--purple); margin-top: 16px; }

  /* ── BANKS ── */
  .bank-section { margin-bottom: 28px; }
  .bank-title {
    font-size: 0.9rem; font-weight: 700; color: var(--purple);
    margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 2px solid var(--gray-light);
  }
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(130px, 100%), 1fr)); gap: 10px; }
  .vocab-chip {
    background: var(--white);
    border: 2px solid var(--gray-light);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    text-align: center;
    font-size: 0.82rem; font-weight: 600;
    color: var(--purple);
    cursor: pointer;
    transition: all 0.2s;
  }
  .vocab-chip:hover { border-color: var(--purple-light); background: #f5f3ff; }
  .vocab-chip .vc-en { font-weight: 700; font-size: 0.86rem; }
  .vocab-chip .vc-def { font-size: 0.72rem; color: var(--gray); font-weight: 500; margin-top: 2px; }
  .table-wrap { width: 100%; overflow-x: auto; }
  .grammar-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .grammar-table th { background: var(--purple); color: var(--white); padding: 8px 12px; text-align: left; font-weight: 600; }
  .grammar-table td { padding: 8px 12px; border-bottom: 1px solid var(--gray-light); color: var(--purple); font-weight: 500; }
  .grammar-table tr:nth-child(even) td { background: var(--cream-light); }
  .grammar-table .orange { color: var(--orange); font-weight: 700; }
  .grammar-table .teal { color: var(--teal); font-weight: 700; }
  .grammar-table .red { color: var(--red); font-weight: 700; }
  .tip-box {
    background: #fffbeb;
    border-left: 4px solid #f59e0b;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: #92400e;
    margin-top: 12px;
    line-height: 1.6;
  }

  /* ── SUMMARY / CONFETTI ── */
  .summary-card {
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    color: var(--white);
    margin-top: 10px;
  }
  .summary-card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
  .summary-card p { font-size: 0.82rem; opacity: 0.85; margin-bottom: 16px; }
  .score-big { font-size: 2.8rem; font-weight: 800; color: var(--orange); }
  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    color: #fff; padding: 14px 28px; border-radius: 99px;
    font-size: 1rem; font-weight: 700;
    box-shadow: 0 8px 30px rgba(29,16,80,0.35);
    z-index: 9999; opacity: 0;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s;
    max-width: 90vw; text-align: center;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .header h1 { font-size: 1.1rem; }
    .header { padding: 20px 16px 16px; }
    .header-logo { height: 56px; }
    .content { padding: 14px 10px 50px; }
    .ex-card { padding: 14px 12px; }
    .day-header { gap: 10px; margin-bottom: 16px; }
    .day-number { width: 42px; height: 42px; font-size: 0.95rem; }
    .day-title { font-size: 1rem; }
    .tab-btn { padding: 12px 10px; font-size: 0.72rem; }
    .mc-option { font-size: 0.82rem; padding: 8px 10px; }
    .btn { font-size: 0.78rem; padding: 9px 16px; }
    .fill-input { width: 100px; font-size: 0.84rem; }
    .q-body { font-size: 0.85rem; }
    .cm-wrap { gap: 10px; }

Which description matches the pericardial findings?", "opts": ["Thickened surfaces, yellow fibrinous material and cloudy fluid.", "Thin surfaces, clear fluid and no visible changes.", "Multiple fluid-filled cysts and an irregular cut surface."], "ans": 0, "why": "All three findings were described in the pericardial sac."}], "intro": "Case 1 — An Unexpected Finding in a Cow\n\nA six-year-old dairy cow had shown reduced appetite, weight loss and discomfort when moving. After the animal died, its body was submitted for a necropsy.\n\nDuring the gross examination, the pathologist found a sharp metallic object penetrating the wall of the reticulum. A tract extended through the diaphragm toward the pericardial sac. The pericardium was thickened, and its surfaces were covered with yellow fibrinous material. Cloudy fluid was also present inside the sac.\n\nThe pathologist collected samples from the reticulum, diaphragm and pericardium. Representative tissue samples were fixed in formalin for histopathology. A separate sample was collected aseptically for bacterial culture.\n\nThe findings supported an association between the penetrating object and the inflammatory changes. However, the gross examination alone could not identify the bacteria involved."}, {"id": "c1b", "day": 2, "title": "Question 4 — Match the evidence", "instruction": "Match each item with its description. Choose a letter from Column B.", "kind": "match", "items": [{"q": "Tissue fixed in formalin", "opts": ["Investigate which bacteria may be involved.", "Examine tissue structure microscopically."], "ans": 1, "why": "Examine tissue structure microscopically."}, {"q": "Separately collected sample for bacterial culture", "opts": ["Investigate which bacteria may be involved.", "Examine tissue structure microscopically."], "ans": 0, "why": "Investigate which bacteria may be involved."}], "intro": "Case 1 — An Unexpected Finding in a Cow\n\nA six-year-old dairy cow had shown reduced appetite, weight loss and discomfort when moving. After the animal died, its body was submitted for a necropsy.\n\nDuring the gross examination, the pathologist found a sharp metallic object penetrating the wall of the reticulum. A tract extended through the diaphragm toward the pericardial sac. The pericardium was thickened, and its surfaces were covered with yellow fibrinous material. Cloudy fluid was also present inside the sac.\n\nThe pathologist collected samples from the reticulum, diaphragm and pericardium. Representative tissue samples were fixed in formalin for histopathology. A separate sample was collected aseptically for bacterial culture.\n\nThe findings supported an association between the penetrating object and the inflammatory changes. However, the gross examination alone could not identify the bacteria involved."}, {"id": "c1c", "day": 2, "title": "Question 5 — Observation, Interpretation or Not Established", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Yellow fibrinous material covered the pericardial surfaces.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 0, "why": "The material was directly observed."}, {"q": "The penetrating object was associated with the inflammatory changes.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 1, "why": "This explains the relationship between findings."}, {"q": "The exact bacterial species involved was identified during the gross examination.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 2, "why": "Bacterial identity was not established by the gross examination."}], "intro": "Case 1 — An Unexpected Finding in a Cow\n\nA six-year-old dairy cow had shown reduced appetite, weight loss and discomfort when moving. After the animal died, its body was submitted for a necropsy.\n\nDuring the gross examination, the pathologist found a sharp metallic object penetrating the wall of the reticulum. A tract extended through the diaphragm toward the pericardial sac. The pericardium was thickened, and its surfaces were covered with yellow fibrinous material. Cloudy fluid was also present inside the sac.\n\nThe pathologist collected samples from the reticulum, diaphragm and pericardium. Representative tissue samples were fixed in formalin for histopathology. A separate sample was collected aseptically for bacterial culture.\n\nThe findings supported an association between the penetrating object and the inflammatory changes. However, the gross examination alone could not identify the bacteria involved.\n\nClassify each statement using the case. First ask whether the statement is supported: if not, choose Not established. For supported statements, choose Observation for something directly seen, measured or detected; choose Interpretation for an explanation or conclusion drawn from the findings."}, {"id": "c1d", "day": 2, "title": "Question 6 — Limits of the evidence", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which conclusion is best supported?", "opts": ["The metallic object had no relationship to the tissue changes.", "The gross findings identified a specific bacterial species.", "The findings linked the penetrating object to inflammation, but further testing was needed to identify bacteria."], "ans": 2, "why": "The findings supported an association, but bacterial identification required additional testing."}], "intro": "Case 1 — An Unexpected Finding in a Cow\n\nA six-year-old dairy cow had shown reduced appetite, weight loss and discomfort when moving. After the animal died, its body was submitted for a necropsy.\n\nDuring the gross examination, the pathologist found a sharp metallic object penetrating the wall of the reticulum. A tract extended through the diaphragm toward the pericardial sac. The pericardium was thickened, and its surfaces were covered with yellow fibrinous material. Cloudy fluid was also present inside the sac.\n\nThe pathologist collected samples from the reticulum, diaphragm and pericardium. Representative tissue samples were fixed in formalin for histopathology. A separate sample was collected aseptically for bacterial culture.\n\nThe findings supported an association between the penetrating object and the inflammatory changes. However, the gross examination alone could not identify the bacteria involved."}, {"id": "c2a", "day": 2, "title": "Case 2 — A Small Mass on a Dog’s Forelimb — Questions 1–3", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which description matches the mass?", "opts": ["Soft, flat and located on the abdomen.", "Firm, raised and located on the left forelimb.", "Fluid-filled, diffuse and located in both kidneys."], "ans": 1, "why": "The mass was firm, raised and on the left forelimb."}, {"q": "Why was the cytology sample insufficient?", "opts": ["It contained few cells and considerable blood.", "It contained too much formalin.", "The laboratory had received no slides."], "ans": 0, "why": "Few cells and considerable blood limited classification."}, {"q": "What was performed after the cytology result?", "opts": ["Bacterial culture of the entire limb.", "A necropsy.", "An incisional biopsy."], "ans": 2, "why": "An incisional biopsy followed the insufficient cytology result."}], "intro": "Case 2 — A Small Mass on a Dog’s Forelimb\n\nAn eight-year-old dog was examined because of a slowly growing mass on its left forelimb. The owner reported that the mass had been present for several months. It was firm, raised and approximately two centimeters in diameter.\n\nThe veterinarian collected a fine-needle aspirate and submitted several slides for cytology. The sample contained few cells and a considerable amount of blood. The laboratory report stated that the material was insufficient for a reliable classification of the mass.\n\nAn incisional biopsy was then performed. The tissue was placed in a labeled container with formalin and submitted for histopathology. Microscopic examination revealed a spindle-cell neoplasm. Some cells showed atypical features, but the report did not assign a specific tumor type.\n\nBecause the biopsy represented only part of the mass, the pathologist could not assess the surgical margins of the entire lesion. Further evaluation was recommended."}, {"id": "c2b", "day": 2, "title": "Question 4 — Match the evidence", "instruction": "Match each item with its description. Choose a letter from Column B.", "kind": "match", "items": [{"q": "Cytology of the aspirate", "opts": ["A piece of tissue, allowing examination of tissue architecture.", "Cells collected using a needle and placed on slides."], "ans": 1, "why": "Cells collected using a needle and placed on slides."}, {"q": "Histopathology of the biopsy", "opts": ["A piece of tissue, allowing examination of tissue architecture.", "Cells collected using a needle and placed on slides."], "ans": 0, "why": "A piece of tissue, allowing examination of tissue architecture."}], "intro": "Case 2 — A Small Mass on a Dog’s Forelimb\n\nAn eight-year-old dog was examined because of a slowly growing mass on its left forelimb. The owner reported that the mass had been present for several months. It was firm, raised and approximately two centimeters in diameter.\n\nThe veterinarian collected a fine-needle aspirate and submitted several slides for cytology. The sample contained few cells and a considerable amount of blood. The laboratory report stated that the material was insufficient for a reliable classification of the mass.\n\nAn incisional biopsy was then performed. The tissue was placed in a labeled container with formalin and submitted for histopathology. Microscopic examination revealed a spindle-cell neoplasm. Some cells showed atypical features, but the report did not assign a specific tumor type.\n\nBecause the biopsy represented only part of the mass, the pathologist could not assess the surgical margins of the entire lesion. Further evaluation was recommended."}, {"id": "c2c", "day": 2, "title": "Question 5 — Observation, Interpretation or Not Established", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Microscopic examination supported classification as a spindle-cell neoplasm.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 1, "why": "Classification is an interpretation of microscopic findings."}, {"q": "The exact tumor type was established.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 2, "why": "The report did not assign a specific tumor type."}, {"q": "The mass measured approximately two centimeters.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 0, "why": "Size was directly measured."}], "intro": "Case 2 — A Small Mass on a Dog’s Forelimb\n\nAn eight-year-old dog was examined because of a slowly growing mass on its left forelimb. The owner reported that the mass had been present for several months. It was firm, raised and approximately two centimeters in diameter.\n\nThe veterinarian collected a fine-needle aspirate and submitted several slides for cytology. The sample contained few cells and a considerable amount of blood. The laboratory report stated that the material was insufficient for a reliable classification of the mass.\n\nAn incisional biopsy was then performed. The tissue was placed in a labeled container with formalin and submitted for histopathology. Microscopic examination revealed a spindle-cell neoplasm. Some cells showed atypical features, but the report did not assign a specific tumor type.\n\nBecause the biopsy represented only part of the mass, the pathologist could not assess the surgical margins of the entire lesion. Further evaluation was recommended.\n\nClassify each statement using the case. First ask whether the statement is supported: if not, choose Not established. For supported statements, choose Observation for something directly seen, measured or detected; choose Interpretation for an explanation or conclusion drawn from the findings."}, {"id": "c2d", "day": 2, "title": "Question 6 — Limits of the evidence", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Why could the margins of the entire mass not be assessed?", "opts": ["The biopsy represented only part of the mass.", "Cytology had already proved that the entire mass was benign.", "The mass was too small to contain any margins."], "ans": 0, "why": "Only part of the lesion was represented."}], "intro": "Case 2 — A Small Mass on a Dog’s Forelimb\n\nAn eight-year-old dog was examined because of a slowly growing mass on its left forelimb. The owner reported that the mass had been present for several months. It was firm, raised and approximately two centimeters in diameter.\n\nThe veterinarian collected a fine-needle aspirate and submitted several slides for cytology. The sample contained few cells and a considerable amount of blood. The laboratory report stated that the material was insufficient for a reliable classification of the mass.\n\nAn incisional biopsy was then performed. The tissue was placed in a labeled container with formalin and submitted for histopathology. Microscopic examination revealed a spindle-cell neoplasm. Some cells showed atypical features, but the report did not assign a specific tumor type.\n\nBecause the biopsy represented only part of the mass, the pathologist could not assess the surgical margins of the entire lesion. Further evaluation was recommended."}, {"id": "c3a", "day": 2, "title": "Case 3 — Multiple Changes in a Cat’s Kidneys — Questions 1–3", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "What does “bilateral kidney changes” mean?", "opts": ["Changes affecting only the left kidney.", "Changes affecting tissue outside the kidneys.", "Changes affecting both kidneys."], "ans": 2, "why": "Bilateral means affecting both sides or paired organs."}, {"q": "Why were the cysts described as multifocal?", "opts": ["They formed one single continuous lesion.", "They occurred in several separate locations.", "They were visible only under a microscope."], "ans": 1, "why": "Multifocal describes several separate affected areas."}, {"q": "What did histopathology reveal?", "opts": ["Cystic spaces and fibrosis in surrounding tissue.", "A metallic object penetrating the reticulum.", "No changes in the renal tissue."], "ans": 0, "why": "Microscopy revealed cystic spaces and surrounding fibrosis."}], "intro": "Case 3 — Multiple Changes in a Cat’s Kidneys\n\nA five-year-old Persian cat had a history of increased thirst, frequent urination and progressive weight loss. Blood tests performed before death had shown increased blood urea and creatinine concentrations.\n\nAt necropsy, both kidneys were enlarged and had irregular surfaces. On the cut surfaces, numerous fluid-filled cysts of different sizes were distributed throughout the renal tissue. Some areas appeared pale and firm.\n\nThe pathologist described the cysts as multifocal because they occurred in several separate locations. Tissue samples were collected from both kidneys, including cyst walls and areas between the cysts.\n\nHistopathology showed cystic spaces and fibrosis in the surrounding tissue. The final report stated that the findings were consistent with polycystic kidney disease. It also explained that the loss and replacement of functional renal tissue could contribute to impaired kidney function.\n\nThe clinical history, gross findings and microscopic findings were considered together."}, {"id": "c3b", "day": 2, "title": "Question 4 — Match the evidence", "instruction": "Match each item with its description. Choose a letter from Column B.", "kind": "match", "items": [{"q": "Enlarged", "opts": ["Contents", "Surface appearance", "Size", "Consistency"], "ans": 2, "why": "Size"}, {"q": "Irregular surfaces", "opts": ["Contents", "Surface appearance", "Size", "Consistency"], "ans": 1, "why": "Surface appearance"}, {"q": "Fluid-filled", "opts": ["Contents", "Surface appearance", "Size", "Consistency"], "ans": 0, "why": "Contents"}, {"q": "Firm", "opts": ["Contents", "Surface appearance", "Size", "Consistency"], "ans": 3, "why": "Consistency"}], "intro": "Case 3 — Multiple Changes in a Cat’s Kidneys\n\nA five-year-old Persian cat had a history of increased thirst, frequent urination and progressive weight loss. Blood tests performed before death had shown increased blood urea and creatinine concentrations.\n\nAt necropsy, both kidneys were enlarged and had irregular surfaces. On the cut surfaces, numerous fluid-filled cysts of different sizes were distributed throughout the renal tissue. Some areas appeared pale and firm.\n\nThe pathologist described the cysts as multifocal because they occurred in several separate locations. Tissue samples were collected from both kidneys, including cyst walls and areas between the cysts.\n\nHistopathology showed cystic spaces and fibrosis in the surrounding tissue. The final report stated that the findings were consistent with polycystic kidney disease. It also explained that the loss and replacement of functional renal tissue could contribute to impaired kidney function.\n\nThe clinical history, gross findings and microscopic findings were considered together."}, {"id": "c3c", "day": 2, "title": "Question 5 — Observation, Interpretation or Not Established", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "The cat’s genetic status was confirmed by testing.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 2, "why": "No genetic testing was reported."}, {"q": "Both kidneys contained numerous cysts.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 0, "why": "The cysts were directly observed."}, {"q": "Loss and replacement of functional tissue could contribute to impaired kidney function.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 1, "why": "This interprets the functional consequences of the changes."}], "intro": "Case 3 — Multiple Changes in a Cat’s Kidneys\n\nA five-year-old Persian cat had a history of increased thirst, frequent urination and progressive weight loss. Blood tests performed before death had shown increased blood urea and creatinine concentrations.\n\nAt necropsy, both kidneys were enlarged and had irregular surfaces. On the cut surfaces, numerous fluid-filled cysts of different sizes were distributed throughout the renal tissue. Some areas appeared pale and firm.\n\nThe pathologist described the cysts as multifocal because they occurred in several separate locations. Tissue samples were collected from both kidneys, including cyst walls and areas between the cysts.\n\nHistopathology showed cystic spaces and fibrosis in the surrounding tissue. The final report stated that the findings were consistent with polycystic kidney disease. It also explained that the loss and replacement of functional renal tissue could contribute to impaired kidney function.\n\nThe clinical history, gross findings and microscopic findings were considered together.\n\nClassify each statement using the case. First ask whether the statement is supported: if not, choose Not established. For supported statements, choose Observation for something directly seen, measured or detected; choose Interpretation for an explanation or conclusion drawn from the findings."}, {"id": "c3d", "day": 2, "title": "Question 6 — Limits of the evidence", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which statement best represents the report’s reasoning?", "opts": ["The diagnosis relied only on the cat’s breed.", "Kidney function was assessed only from surface color.", "Clinical history, gross examination and histopathology were considered together."], "ans": 2, "why": "The report integrated all three sources of information."}], "intro": "Case 3 — Multiple Changes in a Cat’s Kidneys\n\nA five-year-old Persian cat had a history of increased thirst, frequent urination and progressive weight loss. Blood tests performed before death had shown increased blood urea and creatinine concentrations.\n\nAt necropsy, both kidneys were enlarged and had irregular surfaces. On the cut surfaces, numerous fluid-filled cysts of different sizes were distributed throughout the renal tissue. Some areas appeared pale and firm.\n\nThe pathologist described the cysts as multifocal because they occurred in several separate locations. Tissue samples were collected from both kidneys, including cyst walls and areas between the cysts.\n\nHistopathology showed cystic spaces and fibrosis in the surrounding tissue. The final report stated that the findings were consistent with polycystic kidney disease. It also explained that the loss and replacement of functional renal tissue could contribute to impaired kidney function.\n\nThe clinical history, gross findings and microscopic findings were considered together."}, {"id": "c4a", "day": 2, "title": "Case 4 — A Laboratory Result That Needed Context — Questions 1–3", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which signs were reported in the flock?", "opts": ["Diarrhea, reduced feed intake and poor growth.", "Increased thirst, a forelimb mass and blindness.", "Weight gain, increased appetite and normal growth."], "ans": 0, "why": "These signs were reported in the flock."}, {"q": "Which finding supported an infectious process?", "opts": ["The submission form was incomplete.", "Organisms were detected within inflamed intestinal tissue.", "The birds were submitted together."], "ans": 1, "why": "Organisms within inflamed tissue supported an infectious process."}, {"q": "Which information was missing?", "opts": ["The species of animal submitted.", "Whether intestinal samples had been collected.", "When signs began, how many birds were affected and whether treatment had been given."], "ans": 2, "why": "Onset, number affected and treatment history were missing."}], "intro": "Case 4 — A Laboratory Result That Needed Context\n\nSeveral chickens in a flock developed diarrhea, reduced feed intake and poor growth. Two recently deceased birds were submitted to a diagnostic laboratory.\n\nDuring necropsy, the pathologist observed thickened intestinal walls and multifocal areas of mucosal damage. Some intestinal contents were mixed with blood. Samples were collected for histopathology and additional testing.\n\nMicroscopic examination revealed intestinal inflammation and organisms within the affected tissue. These findings supported an infectious process, but identifying the organisms required further evaluation.\n\nThe submission form contained little information about the flock. It did not state when the signs had started, how many birds were affected or whether treatment had already been given. The laboratory contacted the veterinarian to request these details.\n\nThe pathologist explained that laboratory findings must be interpreted alongside the flock history. A result from two birds does not automatically explain every problem affecting the entire flock."}, {"id": "c4b", "day": 2, "title": "Question 4 — Match the evidence", "instruction": "Match each item with its description. Choose a letter from Column B.", "kind": "match", "items": [{"q": "Reduced feed intake", "opts": ["Microscopic examination", "Gross examination", "Clinical history"], "ans": 2, "why": "Clinical history"}, {"q": "Thickened intestinal walls", "opts": ["Microscopic examination", "Gross examination", "Clinical history"], "ans": 1, "why": "Gross examination"}, {"q": "Organisms within affected tissue", "opts": ["Microscopic examination", "Gross examination", "Clinical history"], "ans": 0, "why": "Microscopic examination"}], "intro": "Case 4 — A Laboratory Result That Needed Context\n\nSeveral chickens in a flock developed diarrhea, reduced feed intake and poor growth. Two recently deceased birds were submitted to a diagnostic laboratory.\n\nDuring necropsy, the pathologist observed thickened intestinal walls and multifocal areas of mucosal damage. Some intestinal contents were mixed with blood. Samples were collected for histopathology and additional testing.\n\nMicroscopic examination revealed intestinal inflammation and organisms within the affected tissue. These findings supported an infectious process, but identifying the organisms required further evaluation.\n\nThe submission form contained little information about the flock. It did not state when the signs had started, how many birds were affected or whether treatment had already been given. The laboratory contacted the veterinarian to request these details.\n\nThe pathologist explained that laboratory findings must be interpreted alongside the flock history. A result from two birds does not automatically explain every problem affecting the entire flock."}, {"id": "c4c", "day": 2, "title": "Question 5 — Observation, Interpretation or Not Established", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Organisms were detected within the affected intestinal tissue.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 0, "why": "Organisms were detected microscopically."}, {"q": "The findings supported an infectious process.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 1, "why": "This is an interpretation of the findings."}, {"q": "The same process explained every health problem in the entire flock.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 2, "why": "The findings cannot automatically explain every flock problem."}], "intro": "Case 4 — A Laboratory Result That Needed Context\n\nSeveral chickens in a flock developed diarrhea, reduced feed intake and poor growth. Two recently deceased birds were submitted to a diagnostic laboratory.\n\nDuring necropsy, the pathologist observed thickened intestinal walls and multifocal areas of mucosal damage. Some intestinal contents were mixed with blood. Samples were collected for histopathology and additional testing.\n\nMicroscopic examination revealed intestinal inflammation and organisms within the affected tissue. These findings supported an infectious process, but identifying the organisms required further evaluation.\n\nThe submission form contained little information about the flock. It did not state when the signs had started, how many birds were affected or whether treatment had already been given. The laboratory contacted the veterinarian to request these details.\n\nThe pathologist explained that laboratory findings must be interpreted alongside the flock history. A result from two birds does not automatically explain every problem affecting the entire flock.\n\nClassify each statement using the case. First ask whether the statement is supported: if not, choose Not established. For supported statements, choose Observation for something directly seen, measured or detected; choose Interpretation for an explanation or conclusion drawn from the findings."}, {"id": "c4d", "day": 2, "title": "Question 6 — Limits of the evidence", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which conclusion is most appropriate?", "opts": ["Results from two birds automatically explain all problems in the flock.", "The findings require interpretation alongside flock history and further testing.", "The missing history makes every laboratory observation incorrect."], "ans": 1, "why": "Interpretation required broader context and further testing."}], "intro": "Case 4 — A Laboratory Result That Needed Context\n\nSeveral chickens in a flock developed diarrhea, reduced feed intake and poor growth. Two recently deceased birds were submitted to a diagnostic laboratory.\n\nDuring necropsy, the pathologist observed thickened intestinal walls and multifocal areas of mucosal damage. Some intestinal contents were mixed with blood. Samples were collected for histopathology and additional testing.\n\nMicroscopic examination revealed intestinal inflammation and organisms within the affected tissue. These findings supported an infectious process, but identifying the organisms required further evaluation.\n\nThe submission form contained little information about the flock. It did not state when the signs had started, how many birds were affected or whether treatment had already been given. The laboratory contacted the veterinarian to request these details.\n\nThe pathologist explained that laboratory findings must be interpreted alongside the flock history. A result from two birds does not automatically explain every problem affecting the entire flock."}, {"id": "c5a", "day": 2, "title": "Case 5 — Disease or Post-Mortem Change? — Questions 1–3", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which circumstances may have contributed to poor preservation?", "opts": ["Immediate submission and controlled cooling.", "A labeled container and a complete history.", "A long delay and warm weather."], "ans": 2, "why": "Delay and warm conditions may have contributed to decomposition."}, {"q": "How did extensive autolysis affect the examination?", "opts": ["It made some cellular details difficult to evaluate reliably.", "It confirmed the cause of death.", "It improved tissue preservation."], "ans": 0, "why": "Autolysis limited evaluation of cellular details."}, {"q": "What additional information did the laboratory request?", "opts": ["The owner’s preferred treatment.", "Time of death, storage conditions and signs before death.", "Only the horse’s coat color."], "ans": 1, "why": "These details could help interpret the changes."}], "intro": "Case 5 — Disease or Post-Mortem Change?\n\nA horse’s body arrived at a laboratory after a long delay in warm weather. The submission form stated that the animal had died unexpectedly, but it provided no detailed clinical history.\n\nDuring necropsy, several organs were unusually soft. Parts of the intestinal wall were discolored, and tissue architecture was difficult to recognize in some samples. The pathologist considered whether these changes reflected disease, post-mortem decomposition or a combination of both.\n\nHistopathology showed extensive autolysis in several specimens. As a result, the pathologist could not reliably evaluate some cellular details. The report clearly described these limitations.\n\nOne well-preserved tissue sample contained a distinct focal lesion. This finding was recorded separately from the widespread post-mortem changes. The pathologist avoided treating every discolored or softened area as evidence of disease.\n\nThe laboratory requested information about the time of death, storage conditions and any signs observed before death. These details could help interpret the findings, although they could not reverse decomposition."}, {"id": "c5b", "day": 2, "title": "Question 4 — Match the evidence", "instruction": "Match each item with its description. Choose a letter from Column B.", "kind": "match", "items": [{"q": "Extensive autolysis in several specimens", "opts": ["A separately recorded localized lesion", "Widespread post-mortem change"], "ans": 1, "why": "Widespread post-mortem change"}, {"q": "A distinct focal lesion in well-preserved tissue", "opts": ["A separately recorded localized lesion", "Widespread post-mortem change"], "ans": 0, "why": "A separately recorded localized lesion"}], "intro": "Case 5 — Disease or Post-Mortem Change?\n\nA horse’s body arrived at a laboratory after a long delay in warm weather. The submission form stated that the animal had died unexpectedly, but it provided no detailed clinical history.\n\nDuring necropsy, several organs were unusually soft. Parts of the intestinal wall were discolored, and tissue architecture was difficult to recognize in some samples. The pathologist considered whether these changes reflected disease, post-mortem decomposition or a combination of both.\n\nHistopathology showed extensive autolysis in several specimens. As a result, the pathologist could not reliably evaluate some cellular details. The report clearly described these limitations.\n\nOne well-preserved tissue sample contained a distinct focal lesion. This finding was recorded separately from the widespread post-mortem changes. The pathologist avoided treating every discolored or softened area as evidence of disease.\n\nThe laboratory requested information about the time of death, storage conditions and any signs observed before death. These details could help interpret the findings, although they could not reverse decomposition."}, {"id": "c5c", "day": 2, "title": "Question 5 — Observation, Interpretation or Not Established", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Some changes could reflect post-mortem decomposition.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 1, "why": "Decomposition was considered as an explanation."}, {"q": "Every discolored area was caused by disease before death.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 2, "why": "Disease did not conclusively explain every alteration."}, {"q": "Several organs were unusually soft.", "opts": ["Observation", "Interpretation", "Not established"], "ans": 0, "why": "Softness was directly observed."}], "intro": "Case 5 — Disease or Post-Mortem Change?\n\nA horse’s body arrived at a laboratory after a long delay in warm weather. The submission form stated that the animal had died unexpectedly, but it provided no detailed clinical history.\n\nDuring necropsy, several organs were unusually soft. Parts of the intestinal wall were discolored, and tissue architecture was difficult to recognize in some samples. The pathologist considered whether these changes reflected disease, post-mortem decomposition or a combination of both.\n\nHistopathology showed extensive autolysis in several specimens. As a result, the pathologist could not reliably evaluate some cellular details. The report clearly described these limitations.\n\nOne well-preserved tissue sample contained a distinct focal lesion. This finding was recorded separately from the widespread post-mortem changes. The pathologist avoided treating every discolored or softened area as evidence of disease.\n\nThe laboratory requested information about the time of death, storage conditions and any signs observed before death. These details could help interpret the findings, although they could not reverse decomposition.\n\nClassify each statement using the case. First ask whether the statement is supported: if not, choose Not established. For supported statements, choose Observation for something directly seen, measured or detected; choose Interpretation for an explanation or conclusion drawn from the findings."}, {"id": "c5d", "day": 2, "title": "Question 6 — Limits of the evidence", "instruction": "Choose the correct answer based on the case.", "kind": "mc", "items": [{"q": "Which statement is most accurate?", "opts": ["Every color change proves that disease was present.", "A detailed history can reverse autolysis.", "Tissue changes must be assessed carefully to distinguish disease from post-mortem alterations."], "ans": 2, "why": "Findings require careful interpretation before being attributed to disease."}], "intro": "Case 5 — Disease or Post-Mortem Change?\n\nA horse’s body arrived at a laboratory after a long delay in warm weather. The submission form stated that the animal had died unexpectedly, but it provided no detailed clinical history.\n\nDuring necropsy, several organs were unusually soft. Parts of the intestinal wall were discolored, and tissue architecture was difficult to recognize in some samples. The pathologist considered whether these changes reflected disease, post-mortem decomposition or a combination of both.\n\nHistopathology showed extensive autolysis in several specimens. As a result, the pathologist could not reliably evaluate some cellular details. The report clearly described these limitations.\n\nOne well-preserved tissue sample contained a distinct focal lesion. This finding was recorded separately from the widespread post-mortem changes. The pathologist avoided treating every discolored or softened area as evidence of disease.\n\nThe laboratory requested information about the time of death, storage conditions and any signs observed before death. These details could help interpret the findings, although they could not reverse decomposition."}, {"id": "final", "day": 3, "title": "Compare the Cases — What Could Not Be Concluded?", "instruction": "Match each item with its description. Choose a letter from Column B.", "kind": "match", "items": [{"q": "Cow", "opts": ["Genetic status was not established by the information provided.", "A partial biopsy did not allow assessment of the entire mass’s margins.", "The gross examination did not identify the bacterial species involved.", "Autolysis prevented reliable evaluation of some cellular details.", "Findings from two animals could not automatically explain every problem in the group."], "ans": 2, "why": "The gross examination did not identify the bacterial species involved."}, {"q": "Dog", "opts": ["Genetic status was not established by the information provided.", "A partial biopsy did not allow assessment of the entire mass’s margins.", "The gross examination did not identify the bacterial species involved.", "Autolysis prevented reliable evaluation of some cellular details.", "Findings from two animals could not automatically explain every problem in the group."], "ans": 1, "why": "A partial biopsy did not allow assessment of the entire mass’s margins."}, {"q": "Cat", "opts": ["Genetic status was not established by the information provided.", "A partial biopsy did not allow assessment of the entire mass’s margins.", "The gross examination did not identify the bacterial species involved.", "Autolysis prevented reliable evaluation of some cellular details.", "Findings from two animals could not automatically explain every problem in the group."], "ans": 0, "why": "Genetic status was not established by the information provided."}, {"q": "Chickens", "opts": ["Genetic status was not established by the information provided.", "A partial biopsy did not allow assessment of the entire mass’s margins.", "The gross examination did not identify the bacterial species involved.", "Autolysis prevented reliable evaluation of some cellular details.", "Findings from two animals could not automatically explain every problem in the group."], "ans": 4, "why": "Findings from two animals could not automatically explain every problem in the group."}, {"q": "Horse", "opts": ["Genetic status was not established by the information provided.", "A partial biopsy did not allow assessment of the entire mass’s margins.", "The gross examination did not identify the bacterial species involved.", "Autolysis prevented reliable evaluation of some cellular details.", "Findings from two animals could not automatically explain every problem in the group."], "ans": 3, "why": "Autolysis prevented reliable evaluation of some cellular details."}], "intro": ""}];

function setMode(m){cancelGameAdvance();if(m==='gamified'&&state.day==='vocab'){state.day=state.game.day;save('day',state.day)}state.mode=m;save('mode',m);document.body.classList.toggle('game-mode',m==='gamified');$('mode-traditional').classList.toggle('active',m==='traditional');$('mode-gamified').classList.toggle('active',m==='gamified');$('mode-traditional').setAttribute('aria-pressed',m==='traditional');$('mode-gamified').setAttribute('aria-pressed',m==='gamified');if(state.day==='vocab')renderVocab();else if(m==='gamified'){if(state.game.day!==state.day)state.game={day:state.day,ex:0,item:0};renderGame()}else renderTraditional()}

function startWelcome(){const n=$('student-name-input').value.trim();if(!n){$('student-name-input').focus();return}student=n;try{localStorage.setItem(base+'lastStudent',JSON.stringify(n))}catch{}initState();$('welcome-screen').classList.add('hidden');$('hello-banner').textContent=`Hello, ${student}! 👋`;$('hello-banner').classList.add('show');setMode(state.mode);updateProgress()}
$('welcome-start-btn').onclick=startWelcome;$('student-name-input').onkeydown=e=>{if(e.key==='Enter')startWelcome()};
if(student){$('welcome-screen').classList.add('hidden');$('hello-banner').textContent=`Hello, ${student}! 👋`;$('hello-banner').classList.add('show')}
setMode(state.mode);updateProgress();
</script></body></html>
