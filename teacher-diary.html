<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teacher Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --orange:#FF5C23;--green:#04392F;--purple:#1D1050;--lime:#CAE78D;
  --lavender:#B4A1FF;--cream:#FAEAD3;--white:#FFFFFF;
  --sidebar-bg:var(--green);--sidebar-text:var(--cream);
  --sidebar-hover:rgba(202,231,141,0.12);--sidebar-active:rgba(180,161,255,0.18);
  --page-bg:#F7F4EF;--surface:var(--white);--border:#E8E2D9;--border-soft:#F0EBE3;
  --text-primary:var(--purple);--text-secondary:#6B6180;--text-muted:#A199B5;
  --accent:var(--lavender);--accent-dark:#7B64E0;--accent-soft:rgba(180,161,255,0.12);
  --success:#2D7A4F;--success-soft:rgba(45,122,79,0.1);
  --warning:var(--orange);--warning-soft:rgba(255,92,35,0.1);
  --sidebar-width:232px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(29,16,80,0.06);--shadow-md:0 4px 16px rgba(29,16,80,0.08);
  --font:'Poppins',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;font-family:var(--font);background:var(--page-bg);color:var(--text-primary);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.app{display:flex;height:100vh;overflow:hidden;}
.main{flex:1;overflow-y:auto;padding:32px 36px;}
/* SIDEBAR */
.sb{width:var(--sidebar-width);background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;height:100vh;overflow:hidden;flex-shrink:0;}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid rgba(250,234,211,0.1);}
.sb-title{font-size:15px;font-weight:700;color:var(--cream);letter-spacing:0.01em;}
.sb-sub{font-size:10px;font-weight:400;color:rgba(250,234,211,0.45);letter-spacing:0.06em;margin-top:2px;}
.sb-nav{flex:1;overflow-y:auto;padding:10px 0;}
.sb-label{font-size:10px;font-weight:600;letter-spacing:0.08em;color:rgba(250,234,211,0.38);padding:8px 20px 4px;}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;background:none;border:none;cursor:pointer;color:rgba(250,234,211,0.82);font-family:var(--font);font-size:13px;font-weight:400;text-align:left;transition:background .15s,color .15s;}
.sb-btn:hover{background:var(--sidebar-hover);color:var(--cream);}
.sb-btn.active{background:var(--sidebar-active);color:var(--lavender);font-weight:500;}
.sb-av{width:26px;height:26px;border-radius:50%;background:rgba(180,161,255,0.2);color:var(--lavender);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-footer{padding:14px 16px;border-top:1px solid rgba(250,234,211,0.1);display:flex;flex-direction:column;gap:6px;}
.sb-action{width:100%;padding:8px 14px;background:rgba(180,161,255,0.13);color:var(--lavender);border:1px dashed rgba(180,161,255,0.28);border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.sb-action:hover{background:rgba(180,161,255,0.22);border-color:rgba(180,161,255,0.5);}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--lavender);color:var(--purple);}
.btn-primary:hover{background:var(--accent-dark);color:var(--white);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:none;color:var(--text-secondary);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--border-soft);color:var(--text-primary);}
.btn-danger{background:rgba(220,53,69,0.08);color:#c0392b;border:1px solid rgba(220,53,69,0.2);}
.btn-danger:hover{background:rgba(220,53,69,0.15);}
.btn-sm{padding:5px 11px;font-size:12px;}
/* PAGE */
.ph{margin-bottom:26px;}
.ph-row{display:flex;justify-content:space-between;align-items:flex-start;}
.page-title{font-size:21px;font-weight:700;color:var(--purple);line-height:1.2;}
.page-sub{font-size:13px;color:var(--text-secondary);margin-top:3px;}
/* SECTIONS */
.section{margin-bottom:32px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:10.5px;font-weight:600;letter-spacing:0.07em;color:var(--text-muted);text-transform:uppercase;}
/* CLASS ITEM */
.ci{display:flex;align-items:flex-start;gap:14px;padding:13px 17px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.ci:hover{border-color:var(--lavender);box-shadow:var(--shadow-md);}
.ci+.ci{margin-top:6px;}
.ci-time{font-size:12px;font-weight:600;color:var(--text-muted);min-width:44px;padding-top:2px;}
.ci-info{flex:1;}
.ci-student{font-size:13px;font-weight:600;color:var(--purple);}
.ci-content{font-size:13px;color:var(--text-secondary);margin-top:2px;}
/* TODO */
.ti{display:flex;align-items:flex-start;gap:10px;padding:10px 15px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);transition:border-color .15s;}
.ti+.ti{margin-top:5px;}
.ti.done .ti-text{text-decoration:line-through;color:var(--text-muted);}
.ti-check{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:none;padding:0;}
.ti-check.checked{background:var(--success);border-color:var(--success);}
.ti-check:hover:not(.checked){border-color:var(--lavender);}
.ti-body{flex:1;min-width:0;}
.ti-text{font-size:13px;color:var(--text-primary);line-height:1.4;}
.ti-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;}
.tag{font-size:11px;color:var(--text-muted);background:var(--border-soft);padding:1px 7px;border-radius:20px;}
.imp-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);flex-shrink:0;margin-top:7px;}
/* ATTENTION */
.ai{display:flex;align-items:flex-start;gap:12px;padding:10px 15px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--lavender);border-radius:var(--radius-md);}
.ai+.ai{margin-top:5px;}
.ai-student{font-size:12px;font-weight:600;color:var(--accent-dark);}
.ai-text{font-size:13px;color:var(--text-primary);margin-top:2px;}
/* DAY GROUP */
.day-lbl{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border-soft);}
.day-group{margin-bottom:18px;}
/* STUDENT HEADER */
.sh{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:28px;box-shadow:var(--shadow-sm);}
.sh-name{font-size:24px;font-weight:700;color:var(--purple);}
.sh-meta{display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:10px;}
.sh-item{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px;}
.sh-lbl{font-weight:500;color:var(--text-muted);font-size:12px;}
/* CLASS PAGE */
.cp-hdr{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:24px;box-shadow:var(--shadow-sm);}
.cp-title{font-size:19px;font-weight:700;color:var(--purple);}
.cp-meta{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap;}
.cp-meta span{font-size:13px;color:var(--text-secondary);}
.cs{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 22px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.cs-title{font-size:10.5px;font-weight:600;letter-spacing:0.07em;color:var(--text-muted);text-transform:uppercase;margin-bottom:11px;}
/* FORMS */
.fl{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:5px;}
.fi,.fta,.fsel{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;color:var(--text-primary);background:var(--white);outline:none;transition:border-color .15s,box-shadow .15s;}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--lavender);box-shadow:0 0 0 3px rgba(180,161,255,0.15);}
.fta{resize:vertical;min-height:76px;line-height:1.6;}
.fta.tall{min-height:130px;}
.fta.transcript{min-height:220px;font-size:13px;}
.fg{margin-bottom:14px;}
/* MODAL */
.mb{position:fixed;inset:0;background:rgba(29,16,80,0.38);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--white);border-radius:var(--radius-lg);padding:26px 30px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(29,16,80,0.18);}
.modal-title{font-size:16px;font-weight:700;color:var(--purple);margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border-soft);}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-scheduled{background:rgba(180,161,255,0.15);color:var(--accent-dark);}
.badge-done{background:var(--success-soft);color:var(--success);}
/* MISC */
.empty{padding:22px 16px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--border-soft);border-radius:var(--radius-md);border:1px dashed var(--border);}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:14px;cursor:pointer;border:none;background:none;font-family:var(--font);transition:color .15s;}
.back-link:hover{color:var(--text-primary);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.col2{grid-column:1/-1;}
.toast{position:fixed;bottom:24px;right:24px;z-index:200;padding:10px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:500;box-shadow:var(--shadow-md);font-family:var(--font);color:white;}
.transcript-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--accent-dark);background:none;border:none;font-family:var(--font);padding:0;}
.transcript-toggle:hover{color:var(--purple);}
.transcript-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
details summary{font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none;padding:6px 0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── UUID ────────────────────────────────────────────────────
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function now() { return new Date().toISOString(); }

// ── DB ──────────────────────────────────────────────────────
function load(k) { try { return JSON.parse(localStorage.getItem(k)||'[]'); } catch { return []; } }
function save(k,d) { localStorage.setItem(k, JSON.stringify(d)); }

const db = {
  students: {
    list() { return load('td_s').sort((a,b)=>a.name.localeCompare(b.name)); },
    get(id) { return load('td_s').find(s=>s.id===id)||null; },
    create(d) { const r={id:uuid(),created_at:now(),...d}; save('td_s',[...load('td_s'),r]); return r; },
    update(id,d) { save('td_s',load('td_s').map(s=>s.id===id?{...s,...d}:s)); },
    delete(id) {
      save('td_s',load('td_s').filter(s=>s.id!==id));
      save('td_c',load('td_c').filter(c=>c.student_id!==id));
      save('td_t',load('td_t').filter(t=>t.student_id!==id));
      save('td_n',load('td_n').filter(n=>n.student_id!==id));
    },
  },
  classes: {
    get(id) {
      const c=load('td_c').find(c=>c.id===id)||null;
      if(!c) return null;
      return {...c, students: db.students.get(c.student_id)};
    },
    forStudent(sid) {
      return load('td_c').filter(c=>c.student_id===sid)
        .sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
    },
    scheduled() {
      return load('td_c').filter(c=>c.status==='scheduled')
        .sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''))
        .map(c=>({...c,students:db.students.get(c.student_id)}));
    },
    done() {
      return load('td_c').filter(c=>c.status==='done')
        .sort((a,b)=>b.date.localeCompare(a.date))
        .map(c=>({...c,students:db.students.get(c.student_id)}));
    },
    create(d) { const r={id:uuid(),created_at:now(),status:'scheduled',...d}; save('td_c',[...load('td_c'),r]); return r; },
    update(id,d) { save('td_c',load('td_c').map(c=>c.id===id?{...c,...d}:c)); },
    delete(id) {
      save('td_c',load('td_c').filter(c=>c.id!==id));
      save('td_t',load('td_t').map(t=>t.class_id===id?{...t,class_id:null}:t));
      save('td_n',load('td_n').map(n=>n.class_id===id?{...n,class_id:null}:n));
    },
  },
  todos: {
    _enrich(t) {
      const cls=t.class_id?load('td_c').find(c=>c.id===t.class_id)||null:null;
      return {...t,students:db.students.get(t.student_id),classes:cls};
    },
    open() { return load('td_t').filter(t=>t.status==='open').map(t=>db.todos._enrich(t)).sort((a,b)=>(b.is_important?1:0)-(a.is_important?1:0)||a.created_at.localeCompare(b.created_at)); },
    forStudent(sid) { return load('td_t').filter(t=>t.student_id===sid).map(t=>db.todos._enrich(t)).sort((a,b)=>(b.is_important?1:0)-(a.is_important?1:0)||a.created_at.localeCompare(b.created_at)); },
    forClass(cid) { return load('td_t').filter(t=>t.class_id===cid).map(t=>db.todos._enrich(t)).sort((a,b)=>a.created_at.localeCompare(b.created_at)); },
    create(d) { const r={id:uuid(),created_at:now(),status:'open',is_important:false,...d}; save('td_t',[...load('td_t'),r]); return r; },
    update(id,d) { save('td_t',load('td_t').map(t=>t.id===id?{...t,...d}:t)); },
    delete(id) { save('td_t',load('td_t').filter(t=>t.id!==id)); },
  },
  attention: {
    _enrich(n) { return {...n,students:db.students.get(n.student_id)}; },
    open() { return load('td_n').filter(n=>n.status==='open').map(n=>db.attention._enrich(n)).sort((a,b)=>a.created_at.localeCompare(b.created_at)); },
    forStudent(sid) { return load('td_n').filter(n=>n.student_id===sid&&n.status==='open').map(n=>db.attention._enrich(n)).sort((a,b)=>a.created_at.localeCompare(b.created_at)); },
    forClass(cid) { return load('td_n').filter(n=>n.class_id===cid).map(n=>db.attention._enrich(n)).sort((a,b)=>a.created_at.localeCompare(b.created_at)); },
    create(d) { const r={id:uuid(),created_at:now(),status:'open',...d}; save('td_n',[...load('td_n'),r]); return r; },
    update(id,d) { save('td_n',load('td_n').map(n=>n.id===id?{...n,...d}:n)); },
    delete(id) { save('td_n',load('td_n').filter(n=>n.id!==id)); },
  },
};

// ── BACKUP ─────────────────────────────────────────────────
function exportData() {
  return {version:1,exported_at:now(),students:load('td_s'),classes:load('td_c'),todos:load('td_t'),needs_attention:load('td_n')};
}
function importData(json) {
  if(!json?.version||!Array.isArray(json?.students)) throw new Error('invalid');
  save('td_s',json.students||[]);save('td_c',json.classes||[]);
  save('td_t',json.todos||[]);save('td_n',json.needs_attention||[]);
}
function triggerDownload(data, filename) {
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}
function manualExport() {
  const d=new Date().toISOString().split('T')[0];
  triggerDownload(exportData(),`teacher-diary-backup-${d}.json`);
}
function checkAutoBackup() {
  const today=new Date().toISOString().split('T')[0];
  if(localStorage.getItem('td_last_backup')===today) return false;
  if(load('td_s').length===0) return false;
  triggerDownload(exportData(),`teacher-diary-backup-${today}.json`);
  localStorage.setItem('td_last_backup',today);
  return true;
}

// ── HELPERS ─────────────────────────────────────────────────
function fDate(str) {
  if(!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fDateShort(str) {
  if(!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function fDateFull(str) {
  if(!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function fTime(t) { return t?t.slice(0,5):''; }
function initials(name) { return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function groupByDay(list) {
  const g={};
  for(const c of list){
    if(!g[c.date]){
      const lbl=new Date(c.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short'});
      g[c.date]={label:lbl,items:[]};
    }
    g[c.date].items.push(c);
  }
  return Object.values(g);
}

// ── SMALL COMPONENTS ────────────────────────────────────────
function Chk({svg}){ return <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>; }

function TodoItem({todo, showStudent, showClass, onChanged}) {
  function toggle() { db.todos.update(todo.id,{status:todo.status==='done'?'open':'done'}); onChanged(); }
  function toggleImp() { db.todos.update(todo.id,{is_important:!todo.is_important}); onChanged(); }
  function del() { db.todos.delete(todo.id); onChanged(); }
  const done=todo.status==='done';
  return (
    <div className={`ti${done?' done':''}`}>
      {todo.is_important&&!done&&<div className="imp-dot"/>}
      <button className={`ti-check${done?' checked':''}`} onClick={toggle}>
        {done&&<Chk/>}
      </button>
      <div className="ti-body">
        <div className="ti-text">{todo.text}</div>
        <div className="ti-meta">
          {showStudent&&todo.students?.name&&<span className="tag">👤 {todo.students.name}</span>}
          {showClass&&todo.classes?.title&&<span className="tag">📚 {todo.classes.title}</span>}
          <span className="tag">{fDateShort(todo.created_at)}</span>
        </div>
      </div>
      <div style={{display:'flex',gap:4,flexShrink:0}}>
        <button onClick={toggleImp} title="Important" style={{background:'none',border:'none',cursor:'pointer',fontSize:13,opacity:todo.is_important?1:0.28,padding:'2px 4px'}}>{todo.is_important?'★':'☆'}</button>
        <button onClick={del} title="Delete" style={{background:'none',border:'none',cursor:'pointer',fontSize:15,opacity:0.28,padding:'2px 4px'}} onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.28'}>×</button>
      </div>
    </div>
  );
}

function AddTodo({studentId, classId, onAdded}) {
  const [open,setOpen]=useState(false);
  const [text,setText]=useState('');
  const [imp,setImp]=useState(false);
  function add() {
    if(!text.trim()) return;
    db.todos.create({student_id:studentId,class_id:classId||null,text:text.trim(),is_important:imp});
    setText('');setImp(false);setOpen(false);onAdded();
  }
  function onKey(e) {
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add();}
    if(e.key==='Escape'){setOpen(false);setText('');}
  }
  if(!open) return <button className="btn btn-ghost btn-sm" onClick={()=>setOpen(true)} style={{marginTop:8}}>+ Add to-do</button>;
  return (
    <div style={{marginTop:8,background:'var(--border-soft)',borderRadius:'var(--radius-md)',padding:'11px 13px'}}>
      <input className="fi" autoFocus value={text} onChange={e=>setText(e.target.value)} onKeyDown={onKey} placeholder="What do you need to do?"/>
      <div style={{display:'flex',alignItems:'center',gap:10,marginTop:8}}>
        <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'var(--text-secondary)',cursor:'pointer'}}>
          <input type="checkbox" checked={imp} onChange={e=>setImp(e.target.checked)}/> Important
        </label>
        <div style={{flex:1}}/>
        <button className="btn btn-ghost btn-sm" onClick={()=>{setOpen(false);setText('');}}>Cancel</button>
        <button className="btn btn-primary btn-sm" onClick={add} disabled={!text.trim()}>Add</button>
      </div>
    </div>
  );
}

function AttentionItem({item, showStudent, onChanged}) {
  function resolve() { db.attention.update(item.id,{status:'resolved'}); onChanged(); }
  function del() { db.attention.delete(item.id); onChanged(); }
  return (
    <div className="ai">
      <div style={{flex:1}}>
        {showStudent&&item.students?.name&&<div className="ai-student">{item.students.name}</div>}
        <div className="ai-text">{item.text}</div>
      </div>
      <div style={{display:'flex',gap:4,flexShrink:0}}>
        <button onClick={resolve} style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'var(--success)',padding:'2px 6px',fontFamily:'var(--font)',fontWeight:500}}>✓ Done</button>
        <button onClick={del} style={{background:'none',border:'none',cursor:'pointer',fontSize:15,opacity:0.28,padding:'2px 4px'}} onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.28'}>×</button>
      </div>
    </div>
  );
}

function AddAttention({studentId, classId, onAdded}) {
  const [open,setOpen]=useState(false);
  const [text,setText]=useState('');
  function add() {
    if(!text.trim()) return;
    db.attention.create({student_id:studentId,class_id:classId||null,text:text.trim()});
    setText('');setOpen(false);onAdded();
  }
  function onKey(e) {
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add();}
    if(e.key==='Escape'){setOpen(false);setText('');}
  }
  if(!open) return <button className="btn btn-ghost btn-sm" onClick={()=>setOpen(true)} style={{marginTop:8}}>+ Add item</button>;
  return (
    <div style={{marginTop:8,background:'var(--border-soft)',borderRadius:'var(--radius-md)',padding:'11px 13px'}}>
      <input className="fi" autoFocus value={text} onChange={e=>setText(e.target.value)} onKeyDown={onKey} placeholder="What needs to be revisited?"/>
      <div style={{display:'flex',gap:8,marginTop:8,justifyContent:'flex-end'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>{setOpen(false);setText('');}}>Cancel</button>
        <button className="btn btn-primary btn-sm" onClick={add} disabled={!text.trim()}>Add</button>
      </div>
    </div>
  );
}

function AutoField({label, value, onChange, placeholder, tall, isTranscript}) {
  const [local,setLocal]=useState(value||'');
  const timer=useRef(null);
  useEffect(()=>setLocal(value||''),[value]);
  function handleChange(e) {
    const v=e.target.value; setLocal(v);
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>onChange(v),500);
  }
  return (
    <div className="fg">
      {label&&<label className="fl">{label}</label>}
      <textarea className={`fta${tall?' tall':''}${isTranscript?' transcript':''}`} value={local} onChange={handleChange} placeholder={placeholder}/>
    </div>
  );
}

function StudentModal({student, onClose, onSaved}) {
  const E={name:'',level:'',frequency:'',schedule_days:'',current_material:'',current_unit:'',notes:''};
  const [f,setF]=useState(student?{...E,...student}:E);
  function set(k,v){setF(p=>({...p,[k]:v}));}
  function save_() {
    if(!f.name.trim()) return;
    if(student?.id) db.students.update(student.id,f); else db.students.create(f);
    onSaved(); onClose();
  }
  function del() {
    if(!student?.id) return;
    if(!confirm(`Delete ${student.name}? All their classes and to-dos will also be deleted.`)) return;
    db.students.delete(student.id); onSaved(); onClose();
  }
  return (
    <div className="mb" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">{student?'Edit Student':'Add Student'}</div>
        <div className="fg"><label className="fl">Name *</label><input className="fi" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Student name"/></div>
        <div className="grid2">
          <div className="fg"><label className="fl">Level</label><input className="fi" value={f.level} onChange={e=>set('level',e.target.value)} placeholder="e.g. Beginner"/></div>
          <div className="fg"><label className="fl">Frequency</label><input className="fi" value={f.frequency} onChange={e=>set('frequency',e.target.value)} placeholder="e.g. 2x/week"/></div>
          <div className="fg"><label className="fl">Schedule Days</label><input className="fi" value={f.schedule_days} onChange={e=>set('schedule_days',e.target.value)} placeholder="e.g. Tue & Thu"/></div>
          <div className="fg"><label className="fl">Current Material</label><input className="fi" value={f.current_material} onChange={e=>set('current_material',e.target.value)} placeholder="e.g. Beginner 2"/></div>
        </div>
        <div className="fg"><label className="fl">Current Unit</label><input className="fi" value={f.current_unit} onChange={e=>set('current_unit',e.target.value)} placeholder="e.g. Unit 5B"/></div>
        <div className="fg"><label className="fl">Notes</label><textarea className="fta" value={f.notes} onChange={e=>set('notes',e.target.value)} placeholder="Any relevant info…"/></div>

    const payload={student_id:f.student_id,date:f.date,time:f.time||null,title:f.title||null,planned_content:f.planned_content||null};

function ClassPage({classId, onNavigate, onRefresh}) {
  const [cls,setCls]=useState(()=>db.classes.get(classId));
  const [todoList,setTodoList]=useState(()=>db.todos.forClass(classId));
  const [attention,setAttention]=useState(()=>db.attention.forClass(classId));
  const [transcriptOpen,setTranscriptOpen]=useState(false);
  const [showEditModal,setShowEditModal]=useState(false);
  const [tick,setTick]=useState(0);

  function reload() {
    setCls(db.classes.get(classId));
    setTodoList(db.todos.forClass(classId));
    setAttention(db.attention.forClass(classId));
    setTick(t=>t+1);
    onRefresh();
  }

  function updateField(field,value) {
    db.classes.update(classId,{[field]:value});
    setCls(prev=>prev?{...prev,[field]:value}:prev);
  }

  function markDone() {
    if(!confirm('Mark this class as done? You can still edit it afterwards.')) return;
    if(cls?.next_class?.trim()) {
      cls.next_class.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
        db.attention.create({student_id:cls.students.id,class_id:classId,text:line});
      });
    }
    db.classes.update(classId,{status:'done'});
    reload();
  }

  function markScheduled() { db.classes.update(classId,{status:'scheduled'}); reload(); }

  if(!cls) { onNavigate('dashboard'); return null; }

  const student=cls.students;
  const isDone=cls.status==='done';
  const openTodos=todoList.filter(t=>t.status==='open');
  const doneTodos=todoList.filter(t=>t.status==='done');

          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:9}}>Auto-created from Next Class, or added manually.</div>
          {attention.length===0&&<div className="empty" style={{marginBottom:8}}>Nothing flagged from this class.</div>}
          {attention.map(item=><AttentionItem key={item.id} item={item} onChanged={reload}/>)}
          <AddAttention studentId={student?.id} classId={classId} onAdded={reload}/>
        </div>

        <div className="cs col2">
          <button className="transcript-toggle" onClick={()=>setTranscriptOpen(o=>!o)}>
            <span>{transcriptOpen?'▾':'▸'}</span>
            {transcriptOpen?'Hide Transcript':'View Transcript'}
          </button>
          {transcriptOpen&&(
            <div className="transcript-body">
              <AutoField key={`tr-${tick}`} value={cls.transcript} onChange={v=>updateField('transcript',v)} placeholder="Paste the class transcript here…" isTranscript/>
            </div>
          )}
        </div>
      </div>

      {showEditModal&&<ClassModal cls={cls} students={student?[student]:[]} defaultStudentId={student?.id} onClose={()=>setShowEditModal(false)} onSaved={reload}/>}
    </div>
  );
}

// ── SIDEBAR ─────────────────────────────────────────────────
function Sidebar({currentView, currentId, onNavigate, onAddStudent, onExport, onImportClick}) {
  const students=db.students.list();
  return (
    <aside className="sb">
      <div className="sb-logo">
        <div className="sb-title">Teacher Diary</div>
        <div className="sb-sub">TEACHER MARI</div>
      </div>
      <nav className="sb-nav">
        <div className="sb-label">Dashboard</div>
        <button className={`sb-btn${currentView==='dashboard'?' active':''}`} onClick={()=>onNavigate('dashboard')}>
          <span className="sb-av" style={{background:'rgba(202,231,141,0.2)',color:'#CAE78D'}}>⌂</span>
          Overview
        </button>
        <div className="sb-label" style={{marginTop:10}}>Students</div>
        {students.map(s=>(
          <button key={s.id} className={`sb-btn${currentView==='student'&&currentId===s.id?' active':''}`} onClick={()=>onNavigate('student',s.id)}>
            <span className="sb-av">{initials(s.name)}</span>
            {s.name}
          </button>
        ))}
      </nav>
      <div className="sb-footer">
        <button className="sb-action" onClick={onAddStudent}><span>+</span> Add Student</button>
        <button className="sb-action" onClick={onExport} title="Download backup">↓ Export backup</button>
        <button className="sb-action" onClick={onImportClick} title="Restore backup">↑ Import backup</button>
      </div>
    </aside>
  );
}

// ── APP ─────────────────────────────────────────────────────
function App() {
  const [view,setView]=useState('dashboard');
  const [currentId,setCurrentId]=useState(null);
  const [tick,setTick]=useState(0);
  const [toast,setToast]=useState(null);
  const [showAddStudent,setShowAddStudent]=useState(false);
  const [showAddClass,setShowAddClass]=useState(false);
  const fileRef=useRef(null);

  useEffect(()=>{
    const did=checkAutoBackup();
    if(did) showToast('Daily backup downloaded.','success');
  },[]);

  function showToast(text,type='success') {
    setToast({text,type});
    setTimeout(()=>setToast(null),4000);
  }

  function navigate(v,id=null) {
    setView(v);
    setCurrentId(id);
    setTick(t=>t+1);
  }

  function refresh(v,id) {
    if(v&&id) navigate(v,id);
    else setTick(t=>t+1);
  }

  function handleImportFile(e) {
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const json=JSON.parse(ev.target.result);
        if(!confirm('This will REPLACE all current data with the backup. Continue?')) return;
        importData(json); setTick(t=>t+1); showToast('Backup restored successfully.','success');
      } catch { showToast('Invalid backup file.','error'); }
    };
    reader.readAsText(file);
    e.target.value='';
  }

  const allStudents=db.students.list();

  return (
    <div className="app">
      <Sidebar
        key={tick}
        currentView={view}
        currentId={currentId}
        onNavigate={navigate}
        onAddStudent={()=>setShowAddStudent(true)}
        onExport={manualExport}
        onImportClick={()=>fileRef.current?.click()}
      />
      <main className="main" key={`${view}-${currentId}-${tick}`}>
        {view==='dashboard'&&<Dashboard onScheduleClass={()=>setShowAddClass(true)} onRefresh={refresh}/>}
        {view==='student'&&currentId&&<StudentPage key={currentId} studentId={currentId} onNavigate={navigate} onRefresh={()=>setTick(t=>t+1)}/>}
        {view==='class'&&currentId&&<ClassPage key={currentId} classId={currentId} onNavigate={navigate} onRefresh={()=>setTick(t=>t+1)}/>}
      </main>

      {toast&&<div className="toast" style={{background:toast.type==='success'?'var(--success)':'#c0392b'}}>{toast.text}</div>}
      <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImportFile}/>
      {showAddStudent&&<StudentModal student={null} onClose={()=>setShowAddStudent(false)} onSaved={()=>setTick(t=>t+1)}/>}
      {showAddClass&&<ClassModal cls={null} students={allStudents} onClose={()=>setShowAddClass(false)} onSaved={()=>setTick(t=>t+1)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
