      doc.setFont("Poppins", "normal"); doc.setFontSize(6.5); doc.setTextColor(140, 130, 120);
      doc.text(doc.splitTextToSize(s[0], larguraCard - 8), x + 5, y + 7);
      doc.setFont("Poppins", "bold"); doc.setFontSize(17); doc.setTextColor(...roxo);
      doc.text(String(s[1]), x + 5, y + 18);
    });
    y += 32;

    doc.setFont("Poppins", "bold"); doc.setFontSize(12); doc.setTextColor(...laranja);
    doc.text("THIS MONTH LEARNING JOURNEY", margem, y);
    y += 9;
    doc.setFontSize(10);
    if (relatorio.learningJourney.length === 0) {
      doc.setFont("Poppins", "normal"); doc.setTextColor(120, 120, 120);
      doc.text("No units registered for this month.", margem, y); y += 9;
    }
    relatorio.learningJourney.forEach((u) => {
      if (y > 258) { doc.addPage(); desenharMoldura(); y = 24; }
      doc.setFont("Poppins", "semibold"); doc.setFontSize(11); doc.setTextColor(...roxo);
      doc.text(u.rotulo, margem, y); y += 7;
      doc.setFont("Poppins", "normal"); doc.setFontSize(9.5); doc.setTextColor(70, 70, 70);
      u.assuntos.forEach((a) => {
        if (!a) return;
        const linhas = doc.splitTextToSize(a, larguraPagina - margem * 2 - 8);
        doc.text("\u2022", margem + 2, y);
        doc.text(linhas, margem + 7, y); y += linhas.length * 5.2;
      });
      y += 5;
    });

    y += 3;
    const alturaCaixas = 46;
    if (y + alturaCaixas > alturaPagina - 16) { doc.addPage(); desenharMoldura(); y = 24; }

    doc.setFillColor(...creme); doc.setDrawColor(...lavanda); doc.setLineWidth(0.4);
    doc.roundedRect(margem, y, 84, alturaCaixas, 3, 3, "FD");
    doc.setFont("Poppins", "bold"); doc.setFontSize(9); doc.setTextColor(...laranja);
    doc.text("LEVEL PROGRESS", margem + 7, y + 9);
    doc.setFont("Poppins", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 78, 65);
    doc.text(`Start of ${meses[relatorioMesAno.mes]}: ${relatorio.pctInicio}% completed`, margem + 7, y + 19, { maxWidth: 72 });
    doc.text(`End of ${meses[relatorioMesAno.mes]}: ${relatorio.pctFim}% completed`, margem + 7, y + 29, { maxWidth: 72 });
    doc.setFont("Poppins", "bold"); doc.setFontSize(9.5); doc.setTextColor(...roxo);
    doc.text(`You advanced ${Math.max(relatorio.pctFim - relatorio.pctInicio, 0)}% this month`, margem + 7, y + 40, { maxWidth: 72 });

    const xDireita = margem + 92;
    doc.setFillColor(...roxo); doc.setDrawColor(...laranja); doc.setLineWidth(0.4);
    doc.roundedRect(xDireita, y, larguraPagina - margem - xDireita, alturaCaixas, 3, 3, "FD");
    doc.setFont("Poppins", "bold"); doc.setFontSize(8.5); doc.setTextColor(...laranja);
    doc.text(`WHAT YOU WILL ACHIEVE IN ${meses[(relatorioMesAno.mes + 1) % 12].toUpperCase()}`, xDireita + 7, y + 8, { maxWidth: larguraPagina - margem - xDireita - 12 });
    doc.setFont("Poppins", "normal"); doc.setFontSize(7.5); doc.setTextColor(210, 200, 245);
    doc.text(`Scheduled Classes: ${relatorio.aulasProxMes}`, xDireita + 7, y + 15);
    let yAch = y + 21;
    doc.setFontSize(8); doc.setTextColor(255, 255, 255);
    relatorio.achieve.forEach((a) => {
      if (!a) return;
      const linhas = doc.splitTextToSize(`\u2022 ${a}`, larguraPagina - margem - xDireita - 12);
      doc.text(linhas, xDireita + 7, yAch); yAch += linhas.length * 5;
    });
    y += alturaCaixas + 10;

    const notasValidas = relatorio.notas.filter(Boolean);
    const alturaNotas = 14 + notasValidas.length * 6.5;
    if (y + alturaNotas > alturaPagina - 16) { doc.addPage(); desenharMoldura(); y = 24; }
    doc.setFillColor(...roxo); doc.setDrawColor(...laranja); doc.setLineWidth(0.4);
    doc.roundedRect(margem, y, larguraPagina - margem * 2, alturaNotas, 3, 3, "FD");
    doc.setFont("Poppins", "bold"); doc.setFontSize(9); doc.setTextColor(...laranja);
    doc.text("TEACHER NOTES", margem + 7, y + 9);
    doc.setFont("Poppins", "normal"); doc.setFontSize(9); doc.setTextColor(255, 255, 255);
    let yNotas = y + 17;
    notasValidas.forEach((n) => {
      doc.text(`\u2022 ${n}`, margem + 7, yNotas, { maxWidth: larguraPagina - margem * 2 - 14 }); yNotas += 6.5;
    });

    doc.save(`relatorio-${relatorio.studentName.replace(/\s+/g, "-").toLowerCase()}-${meses[relatorioMesAno.mes].toLowerCase()}-${relatorioMesAno.ano}.pdf`);
  };

  const excluirAluno = async () => {
    const confirmacao = window.confirm(`Tem certeza que quer excluir ${student.nome}? Isso apaga login, aulas, homework e cobrança — não pode ser desfeito.`);
    if (!confirmacao) return;
    const { data: sessionData } = await supabase.auth.getSession();
    if (!sessionData.session) {
      alert("Sua sessão expirou. Saia e entre de novo pra continuar.");
      return;
    }
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/delete-student`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${sessionData.session.access_token}` },
      body: JSON.stringify({ studentId }),
    });
    if (!resp.ok) {
      const resultado = await resp.json();
      alert("Erro ao excluir: " + (resultado.error || "tente novamente."));
      return;
    }
    alert(`${student.nome} foi excluído(a).`);
    onBack();
  };

  const bg = dark ? palette.purple : palette.cream;
  const cardBg = dark ? "#2A1D66" : "#FFFFFF";
  const textSecondary = dark ? `${palette.lavender}CC` : `${palette.purple}99`;
  const cobrancaVencida = cobranca
    .filter((c) => c.status !== "pago")
    .map((c) => ({ ...c, diasParaVencer: Math.ceil((new Date(c.vencimentoISO + "T00:00:00") - new Date(new Date().toDateString())) / 86400000) }))
    .filter((c) => c.diasParaVencer < 0)
    .sort((a, b) => a.diasParaVencer - b.diasParaVencer)[0];

  const marcarComoPago = async (rowId) => {
    const { error } = await supabase.from("billing").update({ status: "pago" }).eq("id", rowId);
    if (error) { alert("Erro ao marcar como pago: " + error.message); return; }
    setCobranca((prev) => prev.map((c) => (c.rowId === rowId ? { ...c, status: "pago" } : c)));
  };

  const marcarComoPendente = async (rowId) => {
    const { error } = await supabase.from("billing").update({ status: "pendente" }).eq("id", rowId);
    if (error) { alert("Erro ao marcar como pendente: " + error.message); return; }
    setCobranca((prev) => prev.map((c) => (c.rowId === rowId ? { ...c, status: "pendente" } : c)));
  };

  const abrirEdicaoCobranca = (c) => {
    setEditandoCobrancaId(c.rowId);
    // Converte "R$ 250,00" de volta para número editável (250.00)
    const valorNumerico = c.valor.replace(/[^\d,]/g, "").replace(",", ".");
    setRascunhoCobranca({ mes: c.mes, valor: valorNumerico, vencimento: c.vencimentoISO });
  };

  const salvarEdicaoCobranca = async (rowId) => {
    const valorNum = parseFloat(rascunhoCobranca.valor.replace(",", "."));
    if (!rascunhoCobranca.mes || isNaN(valorNum) || valorNum <= 0 || !rascunhoCobranca.vencimento) {
      alert("Preencha mês, valor (maior que zero) e vencimento.");
      return;
    }
    const { error } = await supabase.from("billing")
      .update({ mes: rascunhoCobranca.mes, valor: valorNum, vencimento: rascunhoCobranca.vencimento })
      .eq("id", rowId);
    if (error) { alert("Erro ao salvar: " + error.message); return; }
    setCobranca((prev) => prev.map((c) => (c.rowId === rowId ? {
      ...c,
      mes: rascunhoCobranca.mes,
      valor: `R$ ${valorNum.toFixed(2).replace(".", ",")}`,
      vencimento: new Date(rascunhoCobranca.vencimento + "T00:00:00").toLocaleDateString("pt-BR"),
      vencimentoISO: rascunhoCobranca.vencimento,
    } : c)));
    setEditandoCobrancaId(null);
  };

  const excluirCobranca = async (c) => {
    const confirmar = window.confirm(`Excluir a cobrança de ${c.mes} (${c.valor})? Essa ação não pode ser desfeita.`);
    if (!confirmar) return;
    // Se tinha boleto anexado, apaga do storage também pra não deixar arquivo órfão
    if (c.boletoUrl) {
      const parts = c.boletoUrl.split("/boletos/");
      if (parts[1]) await supabase.storage.from("boletos").remove([decodeURIComponent(parts[1])]);
    }
    const { error } = await supabase.from("billing").delete().eq("id", c.rowId);
    if (error) { alert("Erro ao excluir: " + error.message); return; }
    setCobranca((prev) => prev.filter((row) => row.rowId !== c.rowId));
  };

  const criarCobranca = async () => {
    const valorNum = parseFloat(novaCobranca.valor.replace(",", "."));
    if (!novaCobranca.mes || isNaN(valorNum) || valorNum <= 0 || !novaCobranca.vencimento) {
      alert("Preencha mês, valor (maior que zero) e vencimento.");
      return;
    }
    const { data, error } = await supabase.from("billing")
      .insert({ turma_id: turmaId, mes: novaCobranca.mes, valor: valorNum, vencimento: novaCobranca.vencimento, status: "pendente" })
      .select().single();
    if (error) { alert("Erro ao criar cobrança: " + error.message); return; }
    const nova = {
      mes: data.mes,
      valor: `R$ ${Number(data.valor).toFixed(2).replace(".", ",")}`,
      status: data.status,
      vencimento: new Date(data.vencimento + "T00:00:00").toLocaleDateString("pt-BR"),
      vencimentoISO: data.vencimento,
      boletoUrl: null,
      rowId: data.id,
    };
    setCobranca((prev) => [...prev, nova].sort((a, b) => a.vencimentoISO.localeCompare(b.vencimentoISO)));
    setNovaCobranca({ mes: "", valor: "", vencimento: "" });
    setMostrarNovaCobranca(false);
  };
  const reposicoesPendentes = Object.entries(aulas)
    .filter(([, r]) => typeof r === "object" && r.status === "aRepor" && r.prazo_reposicao)
    .map(([chave, r]) => ({ chave, prazo: r.prazo_reposicao }));

  const hojeDate = new Date();
  const chaveHoje = `${hojeDate.getMonth()}-${hojeDate.getDate()}`;
  const registroHoje = aulas[chaveHoje];
  const reposicaoHoje = registroHoje && registroHoje.status === "reposicaoAgendada" ? registroHoje : null;

  const diasNoMes = new Date(2026, mesAtual + 1, 0).getDate();
  const primeiroDiaSemana = new Date(2026, mesAtual, 1).getDay();
  const celulas = [];
  for (let i = 0; i < primeiroDiaSemana; i++) celulas.push(null);
  for (let d = 1; d <= diasNoMes; d++) celulas.push(d);

  const statusDe = (registro) => (typeof registro === "object" ? registro.status : registro);

  const DIAS_SEMANA_MAP = { "Domingo": 0, "Segunda": 1, "Terça": 2, "Quarta": 3, "Quinta": 4, "Sexta": 5, "Sábado": 6 };

  const dataHoraDaAula = (dataISO, horarioEspecifico) => {
    if (horarioEspecifico) return new Date(`${dataISO}T${horarioEspecifico}:00`);
    if (!turma || !turma.dias_horarios) return null;
    const diaSemana = new Date(dataISO + "T00:00:00").getDay();
    const horarioDoDia = turma.dias_horarios.find((dh) => DIAS_SEMANA_MAP[dh.dia] === diaSemana);
    if (!horarioDoDia) return null;
    return new Date(`${dataISO}T${horarioDoDia.horario}:00`);
  };

  const proximaAula = (() => {
    const agora = new Date();
    const candidatas = Object.entries(aulas)
      .filter(([, r]) => typeof r === "object" && (r.status === "agendada" || r.status === "reposicaoAgendada"))
      .map(([chave, r]) => {
        const [m, d] = chave.split("-").map(Number);
        const dataISO = `2026-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const dataHora = dataHoraDaAula(dataISO, r.horario);
        return dataHora ? { dataHora, reagendada: r.status === "reposicaoAgendada" } : null;
      })
      .filter((c) => c && c.dataHora >= agora)
      .sort((a, b) => a.dataHora - b.dataHora);
    return candidatas[0] || null;
  })();

  const formatarProximaAula = (dataHora) => {
    const diaSemana = dataHora.toLocaleDateString("en-US", { weekday: "short" });
    const mesEDia = dataHora.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const hora = dataHora.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
    return `${diaSemana}, ${mesEDia} — ${hora}`;
  };

  // Streak
  // Individual: conta aulas seguidas sem "Perdida" no calendário (behavior original)
  // Dupla/grupo: conta lesson_records seguidos em que ESSE aluno esteve presente (por data desc)
  let streak = 0;
  if (colegas.length > 0) {
    // Dupla ou grupo — usa lesson_records por presença individual
    const aulasOrdenadas = [...aulasRegistradas].sort((a, b) => b.data.localeCompare(a.data));
    for (const aula of aulasOrdenadas) {
      const faltou = aula.presencas && aula.presencas[studentId] === false;
      if (!faltou) streak++;
      else break;
    }
  } else {
    // Individual — usa calendário como antes
    const diasComStatus = Object.entries(aulas)
      .filter(([, r]) => statusDe(r) === "realizada" || statusDe(r) === "perdida")
      .map(([chave, r]) => {
        const [m, d] = chave.split("-").map(Number);
        return { ordem: m * 100 + d, status: statusDe(r) };
      })
      .sort((a, b) => b.ordem - a.ordem);
    for (const item of diasComStatus) {
      if (item.status === "realizada") streak++;
      else break;
    }
  }

  // Progresso: pega a última unidade registrada em Aulas + Homework (ex: "Unit 4A — ...")
  const sequenciaCurriculo = gerarSequenciaCurriculo(student.nivel || "Beginner");
  const ultimaAulaComUnidade = aulasRegistradas
    .filter((a) => a.unidade)
    .sort((a, b) => b.data.localeCompare(a.data))[0];
  const codigoAtual = ultimaAulaComUnidade ? ultimaAulaComUnidade.unidade : null;
  const indiceAtual = codigoAtual ? sequenciaCurriculo.indexOf(codigoAtual) : -1;
  const unidadeAtual = codigoAtual ? rotuloUnidade(codigoAtual) : "Ainda não iniciado";
  const progressoPercentual = indiceAtual >= 0 ? Math.round(((indiceAtual + 1) / sequenciaCurriculo.length) * 100) : 0;

  if (carregandoDados) {
    return (
      <div style={{ minHeight: "100vh", width: "100%", background: bg, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: "16px" }}>
        <img src={LOGO} alt="Teacher Mari Lessons" style={{ height: "80px", opacity: 0.9 }} />
        <p style={{ fontFamily: "'Poppins', sans-serif", color: dark ? "#FFF" : palette.purple, fontSize: "14px", fontWeight: 500 }}>Carregando seu portal...</p>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", width: "100%", background: bg, padding: "24px", transition: "background 0.2s ease" }}>
      <datalist id="lista-cronogramas">
        {homeworkLinks.map((h, i) => <option key={i} value={h.url}>{h.titulo}</option>)}
      </datalist>
      <div style={{ maxWidth: "1120px", margin: "0 auto" }}>
        <div style={{ background: palette.purple, borderRadius: "18px", padding: "24px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "20px", position: "relative", overflow: "hidden", flexWrap: "wrap", gap: "16px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "14px", position: "relative", zIndex: 1 }}>
            <img src={LOGO} alt="Teacher Mari Lessons" style={{ height: "58px", flexShrink: 0 }} />
            <div>
              <p style={{ color: palette.lightGreen, fontSize: "12px", fontWeight: 600, marginBottom: "4px", letterSpacing: "0.06em", textTransform: "uppercase" }}>StudentHub</p>
              <h1 style={{ color: "#FFF", fontSize: "22px", fontWeight: 600 }}>
                {role === "admin"
                  ? `Portal de ${[student.nome, ...colegas.map((c) => c.nome)].join(" + ")}`
                  : `Welcome back, ${student.nome.split(" ")[0]}!`}
              </h1>
              {role === "admin" && colegas.length > 0 && onSwitchStudent && (
                <div style={{ display: "flex", alignItems: "center", gap: "6px", marginTop: "8px", flexWrap: "wrap" }}>
                  <span style={{ color: `${palette.lightGreen}CC`, fontSize: "11px", fontWeight: 500 }}>Editar/excluir focado em:</span>
                  <span style={{ padding: "3px 10px", borderRadius: "20px", background: palette.orange, color: "#FFF", fontSize: "11px", fontWeight: 600 }}>
                    {student.nome}
                  </span>
                  {colegas.map((c) => (
                    <button key={c.id} onClick={() => onSwitchStudent(c)}
                      style={{ padding: "3px 10px", borderRadius: "20px", background: "rgba(255,255,255,0.12)", color: "#FFF", fontSize: "11px", fontWeight: 600, border: "none", cursor: "pointer" }}>
                      {c.nome}
                    </button>
                  ))}
                </div>
              )}
              {role !== "admin" && (
                <p style={{ color: `${palette.lightGreen}CC`, fontSize: "12px", fontStyle: "italic", marginTop: "4px" }}>{fraseDoDia}</p>
              )}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "10px", position: "relative", zIndex: 1, flexWrap: "wrap" }}>
            <button onClick={() => setDark(!dark)} style={{ width: "36px", height: "36px", borderRadius: "10px", border: "none", background: "rgba(255,255,255,0.12)", cursor: "pointer", color: "#FFF", fontSize: "16px" }}>
              {dark ? "☀" : "☾"}
            </button>
            {role === "admin" && onBack && (
              <button onClick={onBack} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>‹ Alunos</button>
            )}
            {role === "admin" && (
              <button onClick={() => (mostrarEditarTurma ? setMostrarEditarTurma(false) : abrirEdicaoTurma())} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Editar turma</button>
            )}
            {role === "admin" && (
              <button onClick={() => (mostrarEditarAluno ? setMostrarEditarAluno(false) : abrirEdicaoAluno())} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Editar aluno</button>
            )}
            {role === "admin" && (
              <button onClick={() => setMostrarRelatorio(!mostrarRelatorio)} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Relatório mensal</button>
            )}
            {role === "admin" && (
              <button onClick={baixarHistoricoPDF} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Baixar histórico (PDF)</button>
            )}
            {role === "admin" && (
              <button onClick={excluirAluno} style={{ fontSize: "12px", color: "#FFF", background: "#E24B4A", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Excluir aluno</button>
            )}
            <button onClick={onLogout} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Sair</button>
          </div>
        </div>

        {mostrarEditarTurma && rascunhoTurma && (
          <div style={{ background: cardBg, borderRadius: "12px", padding: "16px", marginBottom: "16px" }}>
            <p style={{ marginBottom: "10px", fontSize: "13px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>Editar turma</p>

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Nível</label>
            <select value={rascunhoTurma.nivel} onChange={(e) => setRascunhoTurma((t) => ({ ...t, nivel: e.target.value }))}
              style={{ width: "100%", maxWidth: "280px", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "14px" }}>
              <option>Beginner</option>
              <option>Elementary</option>
              <option>Pre-Intermediate</option>
              <option>Private Advanced Practice</option>
            </select>

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Dia(s) e horário(s)</label>
            {rascunhoTurma.dias_horarios.map((dh, i) => (
              <div key={i} style={{ display: "flex", gap: "8px", marginBottom: "8px", maxWidth: "380px" }}>
                <select value={dh.dia} onChange={(e) => setRascunhoTurma((t) => { const dhs = [...t.dias_horarios]; dhs[i] = { ...dhs[i], dia: e.target.value }; return { ...t, dias_horarios: dhs }; })}
                  style={{ flex: 2, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }}>
                  {["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"].map((d) => <option key={d}>{d}</option>)}
                </select>
                <input type="time" value={dh.horario} onChange={(e) => setRascunhoTurma((t) => { const dhs = [...t.dias_horarios]; dhs[i] = { ...dhs[i], horario: e.target.value }; return { ...t, dias_horarios: dhs }; })}
                  style={{ flex: 1, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />
                {rascunhoTurma.dias_horarios.length > 1 && (
                  <button onClick={() => setRascunhoTurma((t) => ({ ...t, dias_horarios: t.dias_horarios.filter((_, idx) => idx !== i) }))}
                    style={{ padding: "0 12px", borderRadius: "8px", border: "none", cursor: "pointer", background: "#F7C1C1", color: "#791F1F", fontSize: "12px", fontWeight: 600 }}>×</button>
                )}

                    Registrar aula — dia {diaSelecionado.split("-")[1]}/{Number(diaSelecionado.split("-")[0]) + 1}
                  </p>
                  <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px", marginTop: "10px" }}>Horário</label>
                  <input type="time" value={rascunho.horario || ""} onChange={(e) => setRascunho((r) => ({ ...r, horario: e.target.value }))}
                    style={{ width: "160px", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "6px" }} />
                  <p style={{ fontSize: "11px", color: textSecondary, marginBottom: "14px" }}>
                    {(() => {
                      const [m, d] = diaSelecionado.split("-").map(Number);
                      const diaSemana = new Date(2026, m, d).getDay();
                      const diasMap = { "Domingo": 0, "Segunda": 1, "Terça": 2, "Quarta": 3, "Quinta": 4, "Sexta": 5, "Sábado": 6 };
                      const dhMatch = turma && turma.dias_horarios ? turma.dias_horarios.find((dh) => diasMap[dh.dia] === diaSemana) : null;
                      if (dhMatch && rascunho.horario === dhMatch.horario) return "Padrão da turma nesse dia da semana.";
                      if (dhMatch) return `Horário padrão da turma nesse dia é ${dhMatch.horario} — você está usando um horário personalizado.`;
                      return "Esse dia não faz parte da agenda regular da turma — é uma aula extra. Defina o horário livremente.";
                    })()}
                  </p>
                  <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "12px" }}>
                    {Object.entries(statusConfig).filter(([k]) => k !== "reposicaoAgendada").map(([key, cfg]) => (
                      <button key={key} onClick={() => setRascunho((r) => ({ ...r, status: key }))}
                        style={{ padding: "8px 14px", borderRadius: "8px", border: rascunho.status === key ? `2px solid ${palette.purple}` : "none", cursor: "pointer", fontSize: "12px", fontWeight: 600, background: cfg.cor, color: cfg.texto }}>
                        {cfg.label}
                      </button>
                    ))}
                  </div>

                  {rascunho.status === "aRepor" && (
                    <p style={{ fontSize: "12px", color: palette.orange, marginBottom: "14px" }}>
                      Um prazo de 30 dias pra reposição será criado e fixado como lembrete na Home do aluno.
                    </p>
                  )}

                  <p style={{ fontSize: "11px", color: textSecondary, marginBottom: "14px" }}>
                    Conteúdo da aula, feedback e progresso vão em Aulas + Homework.
                  </p>

                  <div style={{ display: "flex", gap: "8px" }}>
                    <button onClick={salvarAula} style={{ padding: "10px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.orange, color: "#FFF" }}>Salvar</button>
                    <button onClick={() => setDiaSelecionado(null)} style={{ padding: "10px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>Cancelar</button>
                  </div>

                  {aulas[diaSelecionado] && (
                    <div style={{ marginTop: "16px", paddingTop: "14px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}` }}>
                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>
                        Mover esta aula para outro dia/horário
                      </label>
                      <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                        <input type="date" value={novoDiaMover} onChange={(e) => setNovoDiaMover(e.target.value)} min="2026-07-01" max="2026-12-13"
                          style={{ flex: "1 1 140px", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />
                        <input type="time" value={novoHorarioMover} onChange={(e) => setNovoHorarioMover(e.target.value)}
                          style={{ flex: "1 1 110px", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />
                        <button onClick={moverAula} style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.purple, color: "#FFF" }}>Mover</button>
                      </div>
                      <p style={{ fontSize: "11px", color: textSecondary, marginTop: "6px" }}>
                        Deixe o horário em branco pra usar o horário padrão da turma nesse dia da semana. Essa é a única forma de trocar o dia/horário de uma aula já marcada.
                      </p>

                      <button onClick={excluirAulaCalendario} style={{ marginTop: "14px", padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: "#F7C1C1", color: "#791F1F" }}>
                        Excluir esta aula do calendário
                      </button>
                    </div>
                  )}
                </div>
              )}

              {role === "admin" && (
                <p style={{ marginTop: "14px", fontSize: "11px", color: textSecondary }}>
                  Clique num dia para registrar a aula.
                </p>
              )}

              <div style={{ display: "flex", gap: "14px", marginTop: "10px", flexWrap: "wrap" }}>
                {Object.entries(statusConfig).map(([key, cfg]) => (
                  <div key={key} style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                    <div style={{ width: "10px", height: "10px", borderRadius: "3px", background: cfg.cor, border: key === "agendada" ? `1px solid ${textSecondary}` : "none" }} />
                    <span style={{ fontSize: "11px", color: textSecondary }}>{cfg.label}</span>
                  </div>
                ))}
                <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                  <div style={{ width: "10px", height: "10px", borderRadius: "3px", background: "#F7C1C1" }} />
                  <span style={{ fontSize: "11px", color: textSecondary }}>Feriado / recesso</span>
                </div>
              </div>
            </div>
          )}

          {active === "materiais" && (
            <div>
              <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                {materiais.filter((m) => m.nivel === (student.nivel || "Beginner")).length === 0 && (
                  <p style={{ fontSize: "13px", color: textSecondary }}>Nenhum material disponível ainda pro nível {student.nivel || "Beginner"}.</p>
                )}
                {materiais.filter((m) => m.nivel === (student.nivel || "Beginner")).map((m) => (
                  <div key={m.id} style={{ padding: "14px 16px", borderRadius: "12px", background: dark ? "#3A2B7A" : palette.cream, display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: "10px" }}>
                    <div>
                      <p style={{ fontSize: "14px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{m.titulo}</p>
                      {m.descricao && <p style={{ marginTop: "2px", fontSize: "13px", color: textSecondary }}>{m.descricao}</p>}
                    </div>
                    <a href={m.url} target="_blank" rel="noopener noreferrer"
                      style={{ flexShrink: 0, padding: "8px 14px", borderRadius: "8px", background: palette.orange, color: "#FFF", fontSize: "12px", fontWeight: 600, textDecoration: "none" }}>
                      Baixar
                    </a>
                  </div>
                ))}
              </div>
              {role === "admin" && (
                <p style={{ marginTop: "14px", fontSize: "11px", color: textSecondary }}>
                  Pra adicionar ou editar materiais, vá em Painel administrativo → Materiais.
                </p>
              )}
            </div>
          )}

          {active === "cobranca" && (
            <div>
              {role === "admin" && (
                <div style={{ marginBottom: "16px" }}>
                  <button onClick={() => setMostrarNovaCobranca(!mostrarNovaCobranca)}
                    style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.orange, color: "#FFF" }}>
                    {mostrarNovaCobranca ? "Fechar" : "+ Nova cobrança"}
                  </button>
                  {mostrarNovaCobranca && (
                    <div style={{ marginTop: "12px", padding: "14px 16px", borderRadius: "12px", background: dark ? "#3A2B7A" : palette.cream, maxWidth: "460px" }}>
                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Mês / referência</label>
                      <input type="text" value={novaCobranca.mes} onChange={(e) => setNovaCobranca((n) => ({ ...n, mes: e.target.value }))}
                        placeholder="Ex: Janeiro 2026"
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "10px" }} />

                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Valor (R$)</label>
                      <input type="text" inputMode="decimal" value={novaCobranca.valor} onChange={(e) => setNovaCobranca((n) => ({ ...n, valor: e.target.value }))}
                        placeholder="Ex: 250,00"
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "10px" }} />

                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Vencimento</label>
                      <input type="date" value={novaCobranca.vencimento} onChange={(e) => setNovaCobranca((n) => ({ ...n, vencimento: e.target.value }))}
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "14px" }} />

                      <button onClick={criarCobranca}
                        style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.purple, color: "#FFF" }}>
                        Criar cobrança
                      </button>
                    </div>
                  )}
                </div>
              )}

              <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {cobranca.length === 0 && (
                <p style={{ fontSize: "13px", color: textSecondary }}>Nenhuma cobrança cadastrada ainda.</p>
              )}
              {cobranca.map((c, i) => {
                const emEdicao = editandoCobrancaId === c.rowId;
                const diasParaVencer = Math.ceil((new Date(c.vencimentoISO + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);
                let statusLabel, statusBg, statusCor;
                if (c.status === "pago") {
                  statusLabel = "Pago"; statusBg = palette.lightGreen; statusCor = palette.green;
                } else if (diasParaVencer < 0) {
                  statusLabel = "Atrasado"; statusBg = "#F7C1C1"; statusCor = "#791F1F";
                } else if (diasParaVencer === 0) {
                  statusLabel = "Vence hoje"; statusBg = palette.orange; statusCor = "#FFF";
                } else {
                  statusLabel = "A vencer"; statusBg = dark ? "#5A4AA0" : "#EEE"; statusCor = textSecondary;
                }
                return (
                <div key={i} style={{ padding: "14px 16px", borderRadius: "12px", background: dark ? "#3A2B7A" : palette.cream }}>
                  {emEdicao ? (
                    <div>
                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Mês / referência</label>
                      <input type="text" value={rascunhoCobranca.mes} onChange={(e) => setRascunhoCobranca((r) => ({ ...r, mes: e.target.value }))}
                        placeholder="Ex: Janeiro 2026"
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "10px" }} />

                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Valor (R$)</label>
                      <input type="text" inputMode="decimal" value={rascunhoCobranca.valor} onChange={(e) => setRascunhoCobranca((r) => ({ ...r, valor: e.target.value }))}
                        placeholder="250,00"
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "10px" }} />

                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Vencimento</label>
                      <input type="date" value={rascunhoCobranca.vencimento} onChange={(e) => setRascunhoCobranca((r) => ({ ...r, vencimento: e.target.value }))}
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "14px" }} />

                      <div style={{ display: "flex", gap: "8px" }}>
                        <button onClick={() => salvarEdicaoCobranca(c.rowId)}
                          style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.orange, color: "#FFF" }}>
                          Salvar
                        </button>
                        <button onClick={() => setEditandoCobrancaId(null)}
                          style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>
                          Cancelar
                        </button>
                      </div>
                    </div>
                  ) : (
                  <React.Fragment>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div>
                      <p style={{ fontSize: "14px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{c.mes}</p>
                      <p style={{ fontSize: "13px", color: textSecondary }}>{c.valor} · vencimento {c.vencimento}</p>
                    </div>
                    <span style={{ fontSize: "12px", fontWeight: 600, padding: "5px 12px", borderRadius: "20px", background: statusBg, color: statusCor }}>
                      {statusLabel}
                    </span>
                  </div>

                  {role === "admin" ? (
                    <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}`, display: "flex", alignItems: "center", flexWrap: "wrap", gap: "8px" }}>
                      <label style={{ display: "inline-block", fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: palette.purple, color: "#FFF", cursor: "pointer" }}>
                        {c.boletoUrl ? "Substituir boleto" : "Subir boleto"}
                        <input type="file" accept="application/pdf,image/*" style={{ display: "none" }}
                          onChange={(e) => e.target.files[0] && anexarBoleto(i, e.target.files[0])} />
                      </label>
                      {c.status !== "pago" ? (
                        <button onClick={() => marcarComoPago(c.rowId)}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: "none", cursor: "pointer", background: palette.lightGreen, color: palette.green }}>
                          Marcar como pago
                        </button>
                      ) : (
                        <button onClick={() => marcarComoPendente(c.rowId)}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>
                          Desmarcar pago
                        </button>
                      )}
                      <button onClick={() => abrirEdicaoCobranca(c)}
                        style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>
                        Editar
                      </button>
                      <button onClick={() => excluirCobranca(c)}
                        style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: "none", cursor: "pointer", background: "#F7C1C1", color: "#791F1F" }}>
                        Excluir
                      </button>
                      {c.nomeArquivo && (
                        <span style={{ fontSize: "12px", color: textSecondary }}>{c.nomeArquivo}</span>
                      )}
                    </div>
                  ) : (
                    c.boletoUrl && (
                      <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}`, display: "flex", gap: "8px" }}>
                        <a href={c.boletoUrl} target="_blank" rel="noopener noreferrer"
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple, textDecoration: "none" }}>
                          Visualizar boleto
                        </a>
                        <a href={c.boletoUrl} download={c.nomeArquivo || "boleto.pdf"}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: palette.orange, color: "#FFF", textDecoration: "none" }}>
                          Baixar boleto
                        </a>
                      </div>
                    )
                  )}
                  {role !== "admin" && !c.boletoUrl && (
                    <p style={{ marginTop: "10px", fontSize: "12px", color: textSecondary }}>Boleto ainda não disponível.</p>
                  )}
                  </React.Fragment>
                  )}
                </div>
                );
              })}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- APP (controla navegação entre login e dashboard) ----------
function App() {
  const { useEffect } = React;
  const [logado, setLogado] = useState(false);
  const [papel, setPapel] = useState("aluno");
  const [alunoSelecionado, setAlunoSelecionado] = useState(null);
  const [carregandoLogin, setCarregandoLogin] = useState(false);
  const [verificandoSessao, setVerificandoSessao] = useState(true);

  useEffect(() => {
    async function restaurarSessao() {
      const { data: sessionData } = await supabase.auth.getSession();
      const user = sessionData.session && sessionData.session.user;
      if (!user) {
        setVerificandoSessao(false);
        return;
      }
      const { data: studentData } = await supabase.from("students").select("*").eq("id", user.id).single();
      if (studentData) {
        setAlunoSelecionado(studentData);
        setPapel("aluno");
      } else {
        setPapel("admin");
      }
      setLogado(true);
      setVerificandoSessao(false);
    }
    restaurarSessao();
  }, []);

  const sair = async () => {
    await supabase.auth.signOut();
    setLogado(false);
    setAlunoSelecionado(null);
  };

  if (verificandoSessao) {
    return (
      <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <p style={{ fontFamily: "'Poppins', sans-serif", color: palette.purple, fontSize: "14px" }}>Carregando...</p>
      </div>
    );
  }

  if (!logado) {
    return (
      <PortalLogin
        onLogin={async (r, user) => {
          if (r === "aluno") {
            setCarregandoLogin(true);
            const { data, error } = await supabase.from("students").select("*").eq("id", user.id).single();
            setCarregandoLogin(false);
            if (error && error.code !== "PGRST116") {
              // erro técnico (rede, permissão) — não é "aluno inexistente"
              alert("Erro ao carregar seus dados: " + error.message + "\nTente novamente em alguns segundos.");
              await supabase.auth.signOut();
              return;
            }
            if (!data) {
              alert("Esse login não está vinculado a nenhum aluno cadastrado. Fale com a Teacher Mari.");
              await supabase.auth.signOut();
              return;
            }
            setAlunoSelecionado(data);
          } else {
            // Tentando entrar como admin: verifica se esse usuário É admin
            // Regra: admin é qualquer conta que NÃO está cadastrada como aluno em `students`
            setCarregandoLogin(true);
            const { data: alunoExistente } = await supabase.from("students").select("id").eq("id", user.id).single();
            setCarregandoLogin(false);
            if (alunoExistente) {
              // É aluno tentando entrar como professora — bloqueia
              alert("Este acesso é só pra Teacher Mari. Alunos devem entrar pela opção \"Aluno\" no login.");
              await supabase.auth.signOut();
              return;
            }
          }
          setPapel(r);
          setLogado(true);
        }}
      />
    );
  }

  if (papel === "admin" && !alunoSelecionado) {
    return <AdminPanel onLogout={sair} onSelectStudent={setAlunoSelecionado} />;
  }

  return (
    <StudentDashboard
      onLogout={sair}
      role={papel}
      student={alunoSelecionado}
      onBack={papel === "admin" ? () => setAlunoSelecionado(null) : null}
      onSwitchStudent={papel === "admin" ? (novoAluno) => setAlunoSelecionado(novoAluno) : null}
      onStudentUpdated={(dados) => setAlunoSelecionado((prev) => (prev ? { ...prev, ...dados } : prev))}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
