// ---------- FLASHCARD ADMIN PANEL ----------
function FlashcardAdminPanel({ students }) {
  const { useState, useEffect, useCallback } = React;

  // Telas: "decks" | "cards" | "progresso" | "assign"
  const [tela, setTela] = useState("decks");
  const [decks, setDecks] = useState([]);
  const [deckAtivo, setDeckAtivo] = useState(null);
  const [cards, setCards] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");
  const [sucesso, setSucesso] = useState("");

  // Busca
  const [busca, setBusca] = useState("");

  // Assign to student
  const [assignDeck, setAssignDeck] = useState(null);
  const [assignStudentId, setAssignStudentId] = useState("");
  const [assignando, setAssignando] = useState(false);

  // Form novo deck
  const [formDeck, setFormDeck] = useState({ nome: "", descricao: "", nivel: "", unidade: "", student_id: "", modoCreacao: "ia_prompt", listaPalavras: "", promptIA: "" });
  const [mostrarFormDeck, setMostrarFormDeck] = useState(false);
  const [editandoDeck, setEditandoDeck] = useState(null);

  // Form novo card
  const [formCard, setFormCard] = useState({ frente: "", verso: "", exemplo: "" });
  const [mostrarFormCard, setMostrarFormCard] = useState(false);
  const [editandoCard, setEditandoCard] = useState(null);

  // Progresso por aluno
  const [progressoAlunos, setProgressoAlunos] = useState([]);
  const [carregandoProgresso, setCarregandoProgresso] = useState(false);

  const flash = (msg, tipo = "sucesso") => {
    if (tipo === "sucesso") { setSucesso(msg); setTimeout(() => setSucesso(""), 3000); }
    else { setErro(msg); setTimeout(() => setErro(""), 4000); }
  };

  // Carrega decks
  const carregarDecks = useCallback(async () => {
    setCarregando(true);
    const { data, error } = await supabase
      .from("flashcard_decks")
      .select("*, flashcards(id)")
      .order("criado_em", { ascending: true });
    if (error) { flash("Erro ao carregar decks: " + error.message, "erro"); }
    else setDecks(data || []);
    setCarregando(false);
  }, []);

  useEffect(() => { carregarDecks(); }, [carregarDecks]);

  // Carrega cards de um deck
  const abrirDeck = async (deck) => {
    setDeckAtivo(deck);
    setTela("cards");
    setCarregando(true);
    const { data, error } = await supabase
      .from("flashcards")
      .select("*")
      .eq("deck_id", deck.id)
      .order("ordem", { ascending: true });
    if (error) flash("Erro ao carregar cards: " + error.message, "erro");
    else setCards(data || []);
    setCarregando(false);
  };

  // Carrega progresso dos alunos num deck
  const abrirProgresso = async (deck) => {
    setDeckAtivo(deck);
    setTela("progresso");
    setCarregandoProgresso(true);
    const { data: cardsDoDeck } = await supabase.from("flashcards").select("id").eq("deck_id", deck.id);
    const cardIds = (cardsDoDeck || []).map(c => c.id);
    const totalCards = cardIds.length;
    if (totalCards === 0) { setProgressoAlunos([]); setCarregandoProgresso(false); return; }
    const { data: progressos } = await supabase
      .from("flashcard_progress")
      .select("student_id, flashcard_id, proxima_revisao, ultima_avaliacao, repeticoes")
      .in("flashcard_id", cardIds);
    // Agrupa por aluno
    const mapaAlunos = {};
    (progressos || []).forEach(p => {
      if (!mapaAlunos[p.student_id]) mapaAlunos[p.student_id] = { vistos: 0, dominados: 0, ultima: null };
      mapaAlunos[p.student_id].vistos++;
      if (p.repeticoes >= 2) mapaAlunos[p.student_id].dominados++;
      if (!mapaAlunos[p.student_id].ultima || p.proxima_revisao > mapaAlunos[p.student_id].ultima) {
        mapaAlunos[p.student_id].ultima = p.proxima_revisao;
      }
    });
    const resultado = Object.entries(mapaAlunos).map(([sid, dados]) => {
      const aluno = students.find(s => s.id === sid);
      return {
        nome: aluno ? aluno.nome : "Aluno removido",
        vistos: dados.vistos,
        dominados: dados.dominados,
        pct: Math.round((dados.dominados / totalCards) * 100),
        totalCards,
        ultimaAtividade: dados.ultima,
      };
    }).sort((a, b) => b.pct - a.pct);
    setProgressoAlunos(resultado);
    setCarregandoProgresso(false);
  };

  // Parse robusto de JSON de cards — repara JSON truncado pela IA
  const parseCardsJSON = (texto) => {
    const clean = texto.replace(/```json|```/g, "").trim();
    try { return JSON.parse(clean); } catch {}
    // Tenta reparar: encontra o último card completo e fecha o array
    let fixed = clean;
    if (!fixed.endsWith("]}")) {
      const lastComplete = fixed.lastIndexOf('"},');
      if (lastComplete > 0) fixed = fixed.slice(0, lastComplete + 2) + "]}";
      else {
        const lastObj = fixed.lastIndexOf('"}');
        if (lastObj > 0) fixed = fixed.slice(0, lastObj + 2) + "]}";
      }
    }
    try { return JSON.parse(fixed); } catch {}
    // Última tentativa: regex para extrair cards individuais
    try {
      const cardMatches = [...clean.matchAll(/"frente"\s*:\s*"([^"]*)"\s*,\s*"verso"\s*:\s*"([^"]*)"\s*,\s*"exemplo"\s*:\s*"([^"]*)"/g)];
      if (cardMatches.length > 0) {
        return { cards: cardMatches.map(m => ({ frente: m[1], verso: m[2], exemplo: m[3] })) };
      }
    } catch {}
    return { cards: [] };
  };

  // Salvar deck (novo ou edição)
  const salvarDeck = async () => {
    if (!formDeck.nome.trim()) { flash("Nome do deck é obrigatório.", "erro"); return; }
    setSalvando(true);
    const payload = {
      nome: formDeck.nome.trim(),
      descricao: formDeck.descricao.trim() || null,
      unidade: formDeck.unidade || null,
      nivel: formDeck.nivel || null,
      student_id: formDeck.student_id || null,
    };
    let error, novoDeckId;
    if (editandoDeck) {
      ({ error } = await supabase.from("flashcard_decks").update(payload).eq("id", editandoDeck.id));
    } else {
      const { data: novoDeck, error: errDeck } = await supabase.from("flashcard_decks").insert(payload).select().single();
      error = errDeck;
      novoDeckId = novoDeck?.id;
    }
    if (error) { setSalvando(false); flash("Erro ao salvar: " + error.message, "erro"); return; }

    if (!editandoDeck && novoDeckId) {
      // Modo IA com prompt livre
      if (formDeck.modoCreacao === "ia_prompt" && formDeck.promptIA?.trim()) {
        try {
          const { data: sessionData } = await supabase.auth.getSession();
          const token = sessionData?.session?.access_token;
          if (!token) throw new Error("Sessão expirada — faça login novamente.");
          const resp = await fetch(ANTHROPIC_PROXY, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({
              model: "claude-haiku-4-5-20251001",
              max_tokens: 1200,
              system: `You are an ESL teacher creating flashcards from a teacher's instructions.
${formDeck.nivel ? `Student level: ${formDeck.nivel}.` : ""}

RULES:
- Use EXACTLY the content the teacher provided. Do NOT add, invent or expand.
- If the teacher listed specific words/phrases, use them exactly.
- Number of cards = number of items provided. Do not add extras unless asked.
- exemplo = one short, natural English sentence using the word/structure.
- Every sentence must be grammatically and pragmatically correct.

Card types:
- Vocabulary: frente = English word/phrase, verso = Portuguese translation
- Q&A: frente = question in English, verso = answer in English
- Grammar: frente = structure/chunk, verso = explanation or example

JSON only, no markdown, no backticks:
{"cards":[{"frente":"...","verso":"...","exemplo":"..."}]}`,
              messages: [{ role: "user", content: `Create flashcards following EXACTLY the content below. Do NOT add content I didn't ask for.${formDeck.nivel ? ` Level: ${formDeck.nivel}.` : ""}\n\n${formDeck.promptIA.trim()}` }],
            }),
          });
          const respText = await resp.text();
          if (!resp.ok) { console.error("Proxy error:", respText); throw new Error(`Erro ${resp.status} no proxy`); }
          const data = JSON.parse(respText);
          const texto = data.content?.[0]?.text || "";
          if (!texto) throw new Error("IA não retornou conteúdo.");
          const parsed = parseCardsJSON(texto);
          if (parsed.cards && parsed.cards.length > 0) {
            const cardsIA = parsed.cards.filter(c => c.frente && c.verso).map((c, i) => ({ deck_id: novoDeckId, frente: c.frente, verso: c.verso, exemplo: c.exemplo || null, ordem: i + 1 }));
            const { error: errCards } = await supabase.from("flashcards").insert(cardsIA);
            if (errCards) throw new Error("Erro ao salvar cards: " + errCards.message);
            flash(`🎯 Deck criado com ${cardsIA.length} cards gerados a partir do seu prompt!`);
          } else {
            flash("Deck criado! A IA não retornou cards — adicione manualmente.");
          }
        } catch (e) {
          console.error("Erro na geração ia_prompt:", e);
          flash(`Deck criado, mas erro ao gerar cards: ${e.message}.`, "erro");
        }

      // Modo lista de palavras
      } else if (formDeck.modoCreacao === "lista" && formDeck.listaPalavras.trim()) {
        const linhas = formDeck.listaPalavras.trim().split("\n").filter(l => l.includes("="));
        const cardsLista = linhas.map((linha, i) => {
          const [parteEsquerda, exemplo] = linha.split("|").map(s => s.trim());
          const [frente, verso] = parteEsquerda.split("=").map(s => s.trim());
          return { deck_id: novoDeckId, frente, verso: verso || "", exemplo: exemplo || null, ordem: i + 1 };
        }).filter(c => c.frente && c.verso);
        if (cardsLista.length > 0) {
          const { error: errCards } = await supabase.from("flashcards").insert(cardsLista);
          if (errCards) { setSalvando(false); flash(`Deck criado mas erro nos cards: ${errCards.message}`, "erro"); carregarDecks(); return; }
        }
        flash(`Deck criado com ${cardsLista.length} cards!`);
      } else {
        flash("Deck criado! Adicione cards manualmente.");
      }
    } else if (editandoDeck) {
      flash("Deck atualizado!");
    }

    setSalvando(false);
    setFormDeck({ nome: "", descricao: "", nivel: "", unidade: "", student_id: "", modoCreacao: "ia_prompt", listaPalavras: "", promptIA: "" });
    setMostrarFormDeck(false);
    setEditandoDeck(null);
    carregarDecks();
  };

  const abrirEdicaoDeck = (deck) => {
    setEditandoDeck(deck);
    setFormDeck({ nome: deck.nome, descricao: deck.descricao || "", nivel: "", unidade: deck.unidade || "", student_id: deck.student_id || "", modoCreacao: "ia_prompt", listaPalavras: "", promptIA: "" });
    setMostrarFormDeck(true);
  };

  const excluirDeck = async (deck) => {
    if (!window.confirm(`Excluir o deck "${deck.nome}" e todos os seus cards? Essa ação não pode ser desfeita.`)) return;
    const { error } = await supabase.from("flashcard_decks").delete().eq("id", deck.id);
    if (error) { flash("Erro ao excluir: " + error.message, "erro"); return; }
    flash("Deck excluído.");
    carregarDecks();
  };

  // Salvar card (novo ou edição)
  const salvarCard = async () => {
    if (!formCard.frente.trim() || !formCard.verso.trim()) { flash("Frente e verso são obrigatórios.", "erro"); return; }
    setSalvando(true);
    const payload = {
      frente: formCard.frente.trim(),
      verso: formCard.verso.trim(),
      exemplo: formCard.exemplo.trim() || null,
      deck_id: deckAtivo.id,
      ordem: editandoCard ? editandoCard.ordem : (cards.length + 1),
    };
    let error;
    if (editandoCard) {
      ({ error } = await supabase.from("flashcards").update(payload).eq("id", editandoCard.id));
    } else {
      ({ error } = await supabase.from("flashcards").insert(payload));
    }
    setSalvando(false);
    if (error) { flash("Erro ao salvar card: " + error.message, "erro"); return; }
    flash(editandoCard ? "Card atualizado!" : "Card adicionado!");
    setFormCard({ frente: "", verso: "", exemplo: "" });
    setMostrarFormCard(false);
    setEditandoCard(null);
    abrirDeck(deckAtivo);
  };

  const abrirEdicaoCard = (card) => {
    setEditandoCard(card);
    setFormCard({ frente: card.frente, verso: card.verso, exemplo: card.exemplo || "" });
    setMostrarFormCard(true);
  };

  const excluirCard = async (card) => {
    if (!window.confirm(`Excluir o card "${card.frente}"?`)) return;
    const { error } = await supabase.from("flashcards").delete().eq("id", card.id);
    if (error) { flash("Erro ao excluir: " + error.message, "erro"); return; }
    flash("Card excluído.");
    abrirDeck(deckAtivo);
  };

  // Assign deck base a aluno específico (cria cópia personalizada)
  const assignToStudent = async () => {
    if (!assignDeck || !assignStudentId) return;
    setAssignando(true);
    // Verifica se já existe deck personalizado desse base pra esse aluno
    const { data: existente } = await supabase.from("flashcard_decks")
      .select("id").eq("student_id", assignStudentId).eq("nome", assignDeck.nome + " (personalizado)").maybeSingle();
    if (existente) {
      flash("Esse aluno já tem uma cópia personalizada desse deck.", "erro");
      setAssignando(false);
      return;
    }
    // Busca os cards do deck base
    const { data: cardsBase } = await supabase.from("flashcards").select("*").eq("deck_id", assignDeck.id);
    // Cria o novo deck personalizado
    const { data: novoDeck, error: errDeck } = await supabase.from("flashcard_decks").insert({
      nome: assignDeck.nome + " (personalizado)",
      descricao: assignDeck.descricao,
      unidade: assignDeck.unidade,
      student_id: assignStudentId,
    }).select().single();
    if (errDeck) { flash("Erro ao criar deck: " + errDeck.message, "erro"); setAssignando(false); return; }
    // Copia os cards
    if (cardsBase && cardsBase.length > 0) {
      const novosCards = cardsBase.map(c => ({ frente: c.frente, verso: c.verso, exemplo: c.exemplo, deck_id: novoDeck.id, ordem: c.ordem }));
      await supabase.from("flashcards").insert(novosCards);
    }
    flash(`Deck atribuído a ${students.find(s => s.id === assignStudentId)?.nome || "aluno"} com ${cardsBase?.length || 0} cards!`);
    setAssignDeck(null);
    setAssignStudentId("");
    setAssignando(false);
    carregarDecks();
  };

  const decksFiltrados = decks.filter(d =>
    !busca.trim() ||
    d.nome.toLowerCase().includes(busca.toLowerCase()) ||
    (d.unidade || "").toLowerCase().includes(busca.toLowerCase()) ||
    (d.descricao || "").toLowerCase().includes(busca.toLowerCase())
  );

  const nomeDeckStudent = (student_id) => {
    if (!student_id) return "Base (todos os alunos)";
    const aluno = students.find(s => s.id === student_id);
    return aluno ? `Personalizado — ${aluno.nome}` : "Aluno específico";
  };

  // ── RENDER ──

  const msgFeedback = (
    <>
      {sucesso && <p style={{ fontSize: "12px", color: palette.green, fontWeight: 600, margin: "0 0 10px" }}>✓ {sucesso}</p>}
      {erro && <p style={{ fontSize: "12px", color: "#E24B4A", fontWeight: 600, margin: "0 0 10px" }}>⚠ {erro}</p>}
    </>
  );

  const inputStyle = { width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", color: palette.purple, marginBottom: "10px" };
  const btnOrange = { padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.orange, color: "#FFF", fontFamily: "'Poppins', sans-serif" };
  const btnGhost = { padding: "9px 16px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "13px", fontWeight: 600, background: "#FFF", color: palette.purple, fontFamily: "'Poppins', sans-serif" };
  const btnRed = { padding: "7px 12px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "12px", fontWeight: 600, background: "#F7C1C1", color: "#791F1F", fontFamily: "'Poppins', sans-serif" };

  // TELA: lista de decks
  if (tela === "decks") return (
    <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px", flexWrap: "wrap", gap: "10px" }}>
        <div>
          <h2 style={{ fontSize: "15px", fontWeight: 700, color: palette.purple, margin: 0 }}>🃏 Gerenciar Flashcards</h2>
          <p style={{ fontSize: "12px", color: `${palette.purple}99`, margin: "4px 0 0" }}>Crie decks base (para todos) ou personalizados por aluno</p>
        </div>
        <button onClick={() => { setEditandoDeck(null); setFormDeck({ nome: "", descricao: "", unidade: "", student_id: "" }); setMostrarFormDeck(true); }} style={btnOrange}>
          + Novo deck
        </button>
      </div>

      {msgFeedback}

      {mostrarFormDeck && (
        <div style={{ background: palette.cream, borderRadius: "12px", padding: "16px", marginBottom: "20px", maxWidth: "540px" }}>
          <p style={{ fontSize: "13px", fontWeight: 600, color: palette.purple, marginBottom: "12px" }}>
            {editandoDeck ? "Editar deck" : "Novo deck"}
          </p>

          {/* Modo de criação — só no novo deck */}
          {!editandoDeck && (
            <div style={{ marginBottom: "16px" }}>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "8px" }}>Como criar os cards?</label>
              <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                {[
                  { v: "ia_prompt", l: "🎯 Gerar com IA a partir de prompt", desc: "Descreva o tema, vocabulário e frases — a IA cria os cards" },
                  { v: "lista", l: "📋 Colar lista de palavras", desc: "Cole sua lista no formato: inglês = português" },
                  { v: "manual", l: "✍️ Adicionar manualmente depois", desc: "Cria o deck vazio e você adiciona card por card" },
                ].map(op => (
                  <label key={op.v} style={{ display: "flex", alignItems: "flex-start", gap: "10px", padding: "10px 12px", borderRadius: "8px", border: `1.5px solid ${formDeck.modoCreacao === op.v ? palette.orange : palette.lavender + "55"}`, background: formDeck.modoCreacao === op.v ? palette.orange + "11" : "#FFF", cursor: "pointer" }}>
                    <input type="radio" name="modoCreacao" checked={formDeck.modoCreacao === op.v} onChange={() => setFormDeck(f => ({ ...f, modoCreacao: op.v, nivel: "", unidade: "", listaPalavras: "", promptIA: "" }))} style={{ accentColor: palette.orange, marginTop: "2px", flexShrink: 0 }} />
                    <div>
                      <p style={{ fontSize: "13px", fontWeight: 600, color: palette.purple, margin: 0 }}>{op.l}</p>
                      <p style={{ fontSize: "11px", color: `${palette.purple}88`, margin: "2px 0 0" }}>{op.desc}</p>
                    </div>
                  </label>
                ))}
              </div>
            </div>
          )}

          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Nome do deck *</label>
          <input value={formDeck.nome} onChange={e => setFormDeck(f => ({ ...f, nome: e.target.value }))}
            placeholder="Ex: Unit 2B – Wh-questions" style={inputStyle} />

          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Descrição (opcional)</label>
          <input value={formDeck.descricao} onChange={e => setFormDeck(f => ({ ...f, descricao: e.target.value }))}
            placeholder="Ex: Números 11-100, perguntas com Wh-" style={inputStyle} />

          {/* Nível e Unidade — obrigatórios para decks base, opcionais para personalizados */}
          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Nível {formDeck.student_id ? "(opcional)" : "*"}</label>
          <select value={formDeck.nivel || ""} onChange={e => setFormDeck(f => ({ ...f, nivel: e.target.value, unidade: "" }))} style={{ ...inputStyle }}>
            <option value="">{formDeck.student_id ? "— Sem nível específico —" : "— Escolha o nível —"}</option>
            {Object.keys(SYLLABUS).map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {formDeck.nivel && (
            <>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Unidade {formDeck.student_id ? "(opcional)" : "*"}</label>
              <select value={formDeck.unidade || ""} onChange={e => setFormDeck(f => ({ ...f, unidade: e.target.value }))} style={{ ...inputStyle }}>
                <option value="">— Escolha a unidade —</option>
                {(SYLLABUS[formDeck.nivel] || []).map(u => <option key={u.id} value={u.id}>{u.t}</option>)}
              </select>
            </>
          )}

          {/* Modo IA com prompt livre */}
          {formDeck.modoCreacao === "ia_prompt" && !editandoDeck && (
            <div>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Descreva o conteúdo do deck *</label>
              <p style={{ fontSize: "11px", color: `${palette.purple}88`, marginBottom: "6px", lineHeight: 1.5 }}>
                Descreva o tema gramatical, vocabulário, frases de exemplo e contexto de uso.
              </p>
              <textarea value={formDeck.promptIA || ""} onChange={e => setFormDeck(f => ({ ...f, promptIA: e.target.value }))}
                placeholder={"Exemplos:\n\n• Verbo to be: I am, you are, he/she/is. Perguntas: Are you a student? Is she from Brazil? Adjetivos: happy, tired, hungry, tall, young.\n\n• Job interview vocabulary: experience, skills, responsibilities. Frases: I have 5 years of experience in... My main responsibility is... I'm good at..."}
                rows={8} style={{ ...inputStyle, resize: "vertical", fontSize: "12px", lineHeight: 1.6 }} />
              {formDeck.promptIA && formDeck.promptIA.trim().length > 20 && (
                <div style={{ background: palette.lightGreen + "44", borderRadius: "8px", padding: "10px 12px", marginTop: "8px", display: "flex", gap: "8px", alignItems: "center" }}>
                  <span>✨</span>
                  <p style={{ fontSize: "12px", color: palette.green, margin: 0, fontWeight: 600 }}>Pronto! A IA vai criar os cards{formDeck.nivel ? ` para ${formDeck.nivel}` : ""} com base na sua descrição.</p>
                </div>
              )}
            </div>
          )}

          {/* Modo lista de palavras */}
          {formDeck.modoCreacao === "lista" && !editandoDeck && (
            <div>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Lista de palavras *</label>
              <p style={{ fontSize: "11px", color: `${palette.purple}88`, marginBottom: "6px", lineHeight: 1.5 }}>
                Uma palavra por linha: <code style={{ background: "#FFF", padding: "1px 6px", borderRadius: "4px" }}>inglês = português</code><br/>
                Exemplo com frase: <code style={{ background: "#FFF", padding: "1px 6px", borderRadius: "4px" }}>a phone = um telefone | Where's my phone?</code>
              </p>
              <textarea value={formDeck.listaPalavras || ""} onChange={e => setFormDeck(f => ({ ...f, listaPalavras: e.target.value }))}
                placeholder={"a phone = um telefone\na key = uma chave | My key is in my bag.\na book = um livro\nwhat = o quê / qual"}
                rows={10} style={{ ...inputStyle, resize: "vertical", fontFamily: "monospace", fontSize: "12px", lineHeight: 1.7 }} />
              {formDeck.listaPalavras && (
                <p style={{ fontSize: "11px", color: palette.green, margin: "4px 0 0", fontWeight: 600 }}>
                  {formDeck.listaPalavras.trim().split("\n").filter(l => l.includes("=")).length} palavras detectadas
                </p>
              )}
            </div>
          )}

          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Aluno específico (deixe em branco para deck base)</label>
          <select value={formDeck.student_id} onChange={e => setFormDeck(f => ({ ...f, student_id: e.target.value }))} style={{ ...inputStyle }}>
            <option value="">— Base (visível para todos os alunos) —</option>
            {students.map(s => <option key={s.id} value={s.id}>{s.nome} ({s.nivel || "—"})</option>)}
          </select>

          {msgFeedback}
          <div style={{ display: "flex", gap: "8px", marginTop: "8px" }}>
            <button onClick={salvarDeck}
              disabled={salvando
                || (!formDeck.student_id && (!formDeck.nivel || !formDeck.unidade))
                || (formDeck.modoCreacao === "ia_prompt" && !formDeck.promptIA?.trim())
              }
              style={{ ...btnOrange, opacity: (salvando || (!formDeck.student_id && (!formDeck.nivel || !formDeck.unidade)) || (formDeck.modoCreacao === "ia_prompt" && !formDeck.promptIA?.trim())) ? 0.7 : 1 }}>
              {salvando
                ? (formDeck.modoCreacao === "ia_prompt" ? "Gerando com IA..." : "Salvando...")
                : editandoDeck ? "Salvar alterações"
                : formDeck.modoCreacao === "ia_prompt" ? "🎯 Criar com IA (Prompt)"
                : formDeck.modoCreacao === "lista" ? "📋 Criar com lista"
                : "Criar deck"}
            </button>
            <button onClick={() => { setMostrarFormDeck(false); setEditandoDeck(null); }} style={btnGhost}>Cancelar</button>
          </div>
        </div>
      )}

      {/* Busca */}
      {!mostrarFormDeck && decks.length > 0 && (
        <div style={{ position: "relative", marginBottom: "16px", maxWidth: "400px" }}>
          <span style={{ position: "absolute", left: "12px", top: "50%", transform: "translateY(-50%)", fontSize: "14px", pointerEvents: "none" }}>🔍</span>
          <input value={busca} onChange={e => setBusca(e.target.value)}
            placeholder="Buscar deck por nome, unidade ou descrição..."
            style={{ ...inputStyle, paddingLeft: "34px", marginBottom: 0 }} />
        </div>
      )}

      {/* Modal Assign to Student */}
      {assignDeck && (
        <div style={{ background: palette.cream, borderRadius: "12px", padding: "16px", marginBottom: "16px", maxWidth: "420px", border: `2px solid ${palette.orange}` }}>
          <p style={{ fontSize: "13px", fontWeight: 700, color: palette.purple, marginBottom: "4px" }}>
            👤 Atribuir deck a aluno
          </p>
          <p style={{ fontSize: "12px", color: `${palette.purple}99`, marginBottom: "12px" }}>
            Uma cópia editável de <strong>{assignDeck.nome}</strong> será criada para o aluno escolhido.
          </p>
          <select value={assignStudentId} onChange={e => setAssignStudentId(e.target.value)} style={{ ...inputStyle }}>
            <option value="">— Escolha um aluno —</option>
            {students.map(s => <option key={s.id} value={s.id}>{s.nome} ({s.nivel || "—"})</option>)}
          </select>
          <div style={{ display: "flex", gap: "8px", marginTop: "8px" }}>
            <button onClick={assignToStudent} disabled={assignando || !assignStudentId}
              style={{ ...btnOrange, opacity: (assignando || !assignStudentId) ? 0.7 : 1 }}>
              {assignando ? "Atribuindo..." : "✓ Atribuir"}
            </button>
            <button onClick={() => { setAssignDeck(null); setAssignStudentId(""); }} style={btnGhost}>Cancelar</button>
          </div>
        </div>
      )}

      {carregando ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Carregando decks...</p>
      ) : decks.length === 0 ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99`, fontStyle: "italic" }}>Nenhum deck criado ainda.</p>
      ) : decksFiltrados.length === 0 ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99`, fontStyle: "italic" }}>Nenhum deck encontrado para "{busca}".</p>
      ) : (() => {
        // Agrupa por nível (pasta), em ordem cronológica dentro de cada grupo
        const niveis = ["Beginner", "Elementary", "Pre-Intermediate", "Intermediate", "Upper-Intermediate", "Advanced", "Geral"];
        const grupos = {};
        decksFiltrados.forEach(deck => {
          // Tenta inferir nível pelo campo nivel do deck ou pelo student
          const grupoKey = deck.nivel || (deck.student_id ? "Personalizados" : "Geral");
          if (!grupos[grupoKey]) grupos[grupoKey] = [];
          grupos[grupoKey].push(deck);
        });
        // Ordena os grupos: níveis conhecidos primeiro, depois o resto
        const ordemGrupos = [...niveis, "Personalizados", ...Object.keys(grupos).filter(k => !niveis.includes(k) && k !== "Personalizados")];
        const gruposOrdenados = ordemGrupos.filter(k => grupos[k]);

        return (
          <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
            {gruposOrdenados.map(nivel => (
              <div key={nivel}>
                {/* Header da pasta */}
                <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px", paddingBottom: "8px", borderBottom: `2px solid ${palette.lavender}44` }}>
                  <span style={{ fontSize: "16px" }}>📁</span>
                  <p style={{ fontSize: "13px", fontWeight: 700, color: palette.purple, margin: 0 }}>{nivel}</p>
                  <span style={{ fontSize: "11px", color: `${palette.purple}66`, fontWeight: 400 }}>{grupos[nivel].length} deck{grupos[nivel].length !== 1 ? "s" : ""}</span>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                  {grupos[nivel]
                    .sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em))
                    .map(deck => (
                    <div key={deck.id} style={{ border: `1px solid ${palette.lavender}44`, borderRadius: "12px", padding: "12px 14px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "10px", flexWrap: "wrap" }}>
                        <div style={{ flex: 1, minWidth: "140px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                            <p style={{ fontSize: "13px", fontWeight: 600, color: palette.purple, margin: 0 }}>{deck.nome}</p>
                            {deck.unidade && <span style={{ fontSize: "10px", fontWeight: 700, padding: "2px 7px", borderRadius: "8px", background: palette.lavender, color: palette.purple }}>{deck.unidade}</span>}
                            {deck.student_id && <span style={{ fontSize: "10px", fontWeight: 600, padding: "2px 7px", borderRadius: "8px", background: palette.orange + "22", color: palette.orange }}>personalizado</span>}
                          </div>
                          {deck.descricao && <p style={{ fontSize: "11px", color: `${palette.purple}88`, margin: "3px 0 0" }}>{deck.descricao}</p>}
                          <p style={{ fontSize: "10px", color: `${palette.purple}66`, margin: "3px 0 0" }}>{(deck.flashcards || []).length} cards · criado em {new Date(deck.criado_em).toLocaleDateString("pt-BR")}</p>
                        </div>
                        <div style={{ display: "flex", gap: "5px", flexWrap: "wrap", flexShrink: 0 }}>
                          <button onClick={() => abrirDeck(deck)} style={{ ...btnOrange, padding: "6px 12px", fontSize: "12px" }}>Ver cards</button>
                          <button onClick={() => { setAssignDeck(deck); setAssignStudentId(""); setMostrarFormDeck(false); }} style={{ ...btnGhost, padding: "6px 10px", fontSize: "12px", background: palette.lavender + "33", borderColor: palette.lavender }}>👤</button>
                          <button onClick={() => abrirProgresso(deck)} style={{ ...btnGhost, padding: "6px 10px", fontSize: "12px" }}>📊</button>
                          <button onClick={() => abrirEdicaoDeck(deck)} style={{ ...btnGhost, padding: "6px 10px", fontSize: "12px" }}>✏️</button>
                          <button onClick={() => excluirDeck(deck)} style={{ ...btnRed, padding: "6px 10px", fontSize: "12px" }}>🗑️</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );

  // TELA: cards de um deck
  if (tela === "cards") return (
    <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "4px", flexWrap: "wrap" }}>
        <button onClick={() => { setTela("decks"); setDeckAtivo(null); setMostrarFormCard(false); setEditandoCard(null); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "13px", color: `${palette.purple}99`, padding: 0, fontFamily: "'Poppins', sans-serif" }}>
          ← Voltar
        </button>
        <h2 style={{ fontSize: "15px", fontWeight: 700, color: palette.purple, margin: 0 }}>{deckAtivo?.nome}</h2>
      </div>
      <p style={{ fontSize: "12px", color: `${palette.purple}99`, marginBottom: "16px" }}>{nomeDeckStudent(deckAtivo?.student_id)}</p>

      {msgFeedback}

      <button onClick={() => { setEditandoCard(null); setFormCard({ frente: "", verso: "", exemplo: "" }); setMostrarFormCard(true); }} style={{ ...btnOrange, marginBottom: "16px" }}>
        + Adicionar card
      </button>

      {mostrarFormCard && (
        <div style={{ background: palette.cream, borderRadius: "12px", padding: "16px", marginBottom: "20px", maxWidth: "500px" }}>
          <p style={{ fontSize: "13px", fontWeight: 600, color: palette.purple, marginBottom: "12px" }}>
            {editandoCard ? "Editar card" : "Novo card"}
          </p>

          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Frente (palavra / pergunta) *</label>
          <input value={formCard.frente} onChange={e => setFormCard(f => ({ ...f, frente: e.target.value }))}
            placeholder="Ex: a phone" style={inputStyle} />

          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Verso (tradução / resposta) *</label>
          <input value={formCard.verso} onChange={e => setFormCard(f => ({ ...f, verso: e.target.value }))}
            placeholder="Ex: um telefone" style={inputStyle} />

          <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "4px" }}>Frase de exemplo (opcional)</label>
          <input value={formCard.exemplo} onChange={e => setFormCard(f => ({ ...f, exemplo: e.target.value }))}
            placeholder="Ex: Where's my phone?" style={inputStyle} />

          {msgFeedback}
          <div style={{ display: "flex", gap: "8px", marginTop: "4px" }}>
            <button onClick={salvarCard} disabled={salvando} style={{ ...btnOrange, opacity: salvando ? 0.7 : 1 }}>
              {salvando ? "Salvando..." : editandoCard ? "Salvar alterações" : "Adicionar card"}
            </button>
            <button onClick={() => { setMostrarFormCard(false); setEditandoCard(null); }} style={btnGhost}>Cancelar</button>
          </div>
        </div>
      )}

      {carregando ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Carregando cards...</p>
      ) : cards.length === 0 ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99`, fontStyle: "italic" }}>Nenhum card neste deck ainda.</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
          {cards.map((card, i) => (
            <div key={card.id} style={{ border: `1px solid ${palette.lavender}44`, borderRadius: "10px", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px", flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: "180px" }}>
                <p style={{ fontSize: "13px", fontWeight: 600, color: palette.purple, margin: 0 }}>{card.frente}</p>
                <p style={{ fontSize: "12px", color: `${palette.purple}88`, margin: "2px 0 0" }}>{card.verso}</p>
                {card.exemplo && <p style={{ fontSize: "11px", color: `${palette.purple}66`, margin: "3px 0 0", fontStyle: "italic" }}>"{card.exemplo}"</p>}
              </div>
              <div style={{ display: "flex", gap: "6px", flexShrink: 0 }}>
                <button onClick={() => abrirEdicaoCard(card)} style={btnGhost}>Editar</button>
                <button onClick={() => excluirCard(card)} style={btnRed}>Excluir</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  // TELA: progresso dos alunos
  if (tela === "progresso") return (
    <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px", flexWrap: "wrap" }}>
        <button onClick={() => setTela("decks")} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "13px", color: `${palette.purple}99`, padding: 0, fontFamily: "'Poppins', sans-serif" }}>
          ← Voltar
        </button>
        <div>
          <h2 style={{ fontSize: "15px", fontWeight: 700, color: palette.purple, margin: 0 }}>📊 Progresso — {deckAtivo?.nome}</h2>
          <p style={{ fontSize: "12px", color: `${palette.purple}99`, margin: "2px 0 0" }}>{deckAtivo?.flashcards?.length || "?"} cards no deck</p>
        </div>
      </div>

      {carregandoProgresso ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Carregando progresso...</p>
      ) : progressoAlunos.length === 0 ? (
        <p style={{ fontSize: "13px", color: `${palette.purple}99`, fontStyle: "italic" }}>Nenhum aluno fez sessão neste deck ainda.</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
          {progressoAlunos.map((aluno, i) => (
            <div key={i} style={{ border: `1px solid ${palette.lavender}44`, borderRadius: "12px", padding: "14px 16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "12px", flexWrap: "wrap", marginBottom: "10px" }}>
                <div>
                  <p style={{ fontSize: "14px", fontWeight: 600, color: palette.purple, margin: 0 }}>{aluno.nome}</p>
                  <p style={{ fontSize: "11px", color: `${palette.purple}99`, margin: "3px 0 0" }}>
                    {aluno.vistos} de {aluno.totalCards} cards vistos · {aluno.dominados} dominados
                  </p>
                  {aluno.ultimaAtividade && (
                    <p style={{ fontSize: "11px", color: `${palette.purple}77`, margin: "2px 0 0" }}>
                      Próxima revisão agendada: {new Date(aluno.ultimaAtividade + "T00:00:00").toLocaleDateString("pt-BR")}
                    </p>
                  )}
                </div>
                <span style={{ fontSize: "18px", fontWeight: 700, color: aluno.pct >= 70 ? palette.green : aluno.pct >= 40 ? palette.orange : "#E24B4A" }}>
                  {aluno.pct}%
                </span>
              </div>
              <div style={{ height: "8px", borderRadius: "4px", background: palette.cream, overflow: "hidden" }}>
                <div style={{ width: `${aluno.pct}%`, height: "100%", background: aluno.pct >= 70 ? palette.lightGreen : aluno.pct >= 40 ? palette.orange : "#F7C1C1", borderRadius: "4px", transition: "width 0.3s" }} />
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  return null;
}

// ---------- FLASHCARD TAB ----------
function FlashcardTab({ student, turma, dark, palette, textSecondary, cardBg }) {
  const { useState, useEffect, useCallback } = React;

  // Estados principais
  const [tela, setTela] = useState("inicio"); // inicio | sessao | resultado | semCards
  const [decks, setDecks] = useState([]);
  const [deckSelecionado, setDeckSelecionado] = useState(null);
  const [modoSelecionado, setModoSelecionado] = useState(null); // "deck" | "revisao_geral" | "revisao_dificeis" | "modo_livre"
  const [decksLivreSelecionados, setDecksLivreSelecionados] = useState([]);
  const [cardsHoje, setCardsHoje] = useState([]);
  const [indiceAtual, setIndiceAtual] = useState(0);
  const [virado, setVirado] = useState(false);
  const [carregando, setCarregando] = useState(true);
  const [salvando, setSalvando] = useState(false);
  const [resultados, setResultados] = useState([]);
  const [erro, setErro] = useState("");
  const [mostrarModoLivre, setMostrarModoLivre] = useState(false);

  const hoje = new Date().toISOString().slice(0, 10);

  // SM-2: calcula próximo intervalo
  const calcularSM2 = (avaliacao, intervaloAtual, facilidadeAtual, repeticoesAtuais) => {
    let q; // qualidade: 0=difícil, 3=ok, 5=fácil
    if (avaliacao === "dificil") q = 0;
    else if (avaliacao === "ok") q = 3;
    else q = 5;

    let novoIntervalo, novaFacilidade, novasRepeticoes;

    if (q < 3) {
      // Errou — reinicia
      novoIntervalo = 1;
      novasRepeticoes = 0;
      novaFacilidade = Math.max(1.3, facilidadeAtual - 0.2);
    } else {
      novasRepeticoes = repeticoesAtuais + 1;
      novaFacilidade = Math.max(1.3, facilidadeAtual + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
      if (novasRepeticoes === 1) novoIntervalo = 1;
      else if (novasRepeticoes === 2) novoIntervalo = 6;
      else novoIntervalo = Math.max(1, Math.round(intervaloAtual * novaFacilidade));
      // Proteção contra NaN
      if (isNaN(novoIntervalo) || novoIntervalo < 1) novoIntervalo = 1;
    }

    const proxData = new Date();
    proxData.setDate(proxData.getDate() + novoIntervalo);
    return {
      intervalo_dias: novoIntervalo,
      facilidade: novaFacilidade,
      repeticoes: novasRepeticoes,
      proxima_revisao: proxData.toISOString().slice(0, 10),
    };
  };

  // Carrega decks disponíveis pro aluno
  const carregarDecks = useCallback(async () => {
    setCarregando(true);
    setErro("");
    try {
      const { data, error } = await supabase
        .from("flashcard_decks")
        .select("*, flashcards(id)")
        .or(`student_id.is.null,student_id.eq.${student.id}`)
        .order("criado_em", { ascending: true });
      if (error) throw error;
      const nivelAluno = student.nivel || "Beginner";

      // Converte label da turma para código
      const labelParaCodigoLocal = (label) => {
        if (!label) return null;
        if (label.startsWith("Practical English ")) return "PE" + label.slice(18).trim();
        if (label.startsWith("Unit ")) return label.slice(5).trim();
        return label;
      };
      const unidadeAtualCodigo = labelParaCodigoLocal(turma && turma.unidade_atual) || labelParaCodigoLocal(student.unidade_atual) || null;

      // Lista de unidades permitidas: atual + todas as anteriores do SYLLABUS
      const todasUnidades = (SYLLABUS[nivelAluno] || []).map(u => u.id);
      let unidadesPermitidas = [];
      if (unidadeAtualCodigo) {
        const idx = todasUnidades.indexOf(unidadeAtualCodigo);
        if (idx >= 0) {
          unidadesPermitidas = todasUnidades.slice(0, idx + 1); // da primeira até a atual (inclusive)
        } else {
          unidadesPermitidas = [unidadeAtualCodigo]; // fallback: só a atual
        }
      }

      const decksFiltrados = (data || []).filter(d => {
        if (!d.flashcards || d.flashcards.length === 0) return false;
        if (d.student_id === student.id) return true; // designado para este aluno — sempre mostra
        if (d.student_id) return false; // designado para OUTRO aluno — nunca mostra
        if (!d.nivel) return false; // sem nível — só aparece se designado (já tratado acima)
        if (d.nivel !== nivelAluno) return false; // nível diferente — nunca mostra
        // Mesmo nível: verificar se a unidade está permitida
        if (!d.unidade) return false; // deck do nível sem unidade — só se designado
        if (unidadesPermitidas.length === 0) return false; // aluno sem unidade definida — só vê designados
        return unidadesPermitidas.includes(d.unidade); // só mostra se for atual ou anterior
      });
      setDecks(decksFiltrados);
    } catch (e) {
      setErro("Erro ao carregar decks: " + e.message);
    }
    setCarregando(false);
  }, [student.id, student.nivel, turma]);

  useEffect(() => { carregarDecks(); }, [carregarDecks]);

  // Carrega os cards de hoje para um deck específico
  const iniciarSessao = async (deck) => {
    setCarregando(true);
    setErro("");
    try {
      // Busca todos os cards do deck
      const { data: cards, error: erroCards } = await supabase
        .from("flashcards")
        .select("*")
        .eq("deck_id", deck.id)
        .order("ordem", { ascending: true });
      if (erroCards) throw erroCards;

      // Busca progresso do aluno pra esses cards
      const cardIds = cards.map(c => c.id);
      const { data: progressos } = await supabase
        .from("flashcard_progress")
        .select("*")
        .eq("student_id", student.id)
        .in("flashcard_id", cardIds);

      const mapaProgresso = {};
      (progressos || []).forEach(p => { mapaProgresso[p.flashcard_id] = p; });

      // Cards de hoje: novos (sem progresso) OU com proxima_revisao <= hoje
      const cardsParaHoje = cards.filter(c => {
        const prog = mapaProgresso[c.id];
        if (!prog) return true; // nunca visto
        return prog.proxima_revisao <= hoje;
      });

      if (cardsParaHoje.length === 0) {
        setCardsHoje([]);
        setDeckSelecionado(deck);
        setTela("semCards");
        setCarregando(false);
        return;
      }

      // Embaralha
      const embaralhados = [...cardsParaHoje].sort(() => Math.random() - 0.5);
      setCardsHoje(embaralhados.map(c => ({ ...c, progresso: mapaProgresso[c.id] || null })));
      setDeckSelecionado(deck);
      setIndiceAtual(0);
      setVirado(false);
      setResultados([]);
      setTela("sessao");
    } catch (e) {
      setErro("Erro ao iniciar sessão: " + e.message);
    }
    setCarregando(false);
  };

  // Avalia um card e salva no Supabase
  const avaliarCard = async (avaliacao) => {
    setSalvando(true);
    const card = cardsHoje[indiceAtual];
    const progAtual = card.progresso;

    const sm2 = calcularSM2(
      avaliacao,
      progAtual ? progAtual.intervalo_dias : 1,
      progAtual ? progAtual.facilidade : 2.5,
      progAtual ? progAtual.repeticoes : 0
    );

    try {
      if (progAtual) {
        await supabase.from("flashcard_progress").update({
          ...sm2,
          ultima_avaliacao: avaliacao,
          atualizado_em: new Date().toISOString(),
        }).eq("id", progAtual.id);
      } else {
        await supabase.from("flashcard_progress").insert({
          student_id: student.id,
          flashcard_id: card.id,
          ...sm2,
          ultima_avaliacao: avaliacao,
        });
      }
    } catch (e) {
      console.warn("Erro ao salvar progresso:", e.message);
    }

    setResultados(prev => [...prev, { card, avaliacao }]);

    if (indiceAtual + 1 < cardsHoje.length) {
      setIndiceAtual(i => i + 1);
      setVirado(false);
    } else {
      setTela("resultado");
    }
    setSalvando(false);
  };

  const reiniciarDeck = () => iniciarSessao(deckSelecionado);
  const voltarInicio = () => { setTela("inicio"); setDeckSelecionado(null); setCardsHoje([]); setResultados([]); setModoSelecionado(null); setDecksLivreSelecionados([]); };

  // Revisão geral — todos os cards vencendo hoje de todos os decks
  const iniciarRevisaoGeral = async () => {
    setCarregando(true);
    setErro("");
    try {
      const todosCardIds = decks.flatMap(d => (d.flashcards || []).map(c => c.id));
      if (todosCardIds.length === 0) { setCardsHoje([]); setModoSelecionado("revisao_geral"); setTela("semCards"); setCarregando(false); return; }
      const { data: cards } = await supabase.from("flashcards").select("*").in("id", todosCardIds);
      const { data: progressos } = await supabase.from("flashcard_progress").select("*").eq("student_id", student.id).in("flashcard_id", todosCardIds);
      const mapaProgresso = {};
      (progressos || []).forEach(p => { mapaProgresso[p.flashcard_id] = p; });
      const cardsParaHoje = (cards || []).filter(c => { const p = mapaProgresso[c.id]; return !p || p.proxima_revisao <= hoje; });
      if (cardsParaHoje.length === 0) { setModoSelecionado("revisao_geral"); setCardsHoje([]); setTela("semCards"); setCarregando(false); return; }
      const embaralhados = [...cardsParaHoje].sort(() => Math.random() - 0.5).map(c => ({ ...c, progresso: mapaProgresso[c.id] || null }));
      setCardsHoje(embaralhados);
      setDeckSelecionado({ nome: "Revisão Geral 🌟" });
      setModoSelecionado("revisao_geral");
      setIndiceAtual(0); setVirado(false); setResultados([]);
      setTela("sessao");
    } catch (e) { setErro("Erro: " + e.message); }
    setCarregando(false);
  };

  // Revisão rápida — só cards marcados como Difícil
  const iniciarRevisaoDificeis = async () => {
    setCarregando(true);
    setErro("");
    try {
      const todosCardIds = decks.flatMap(d => (d.flashcards || []).map(c => c.id));
      if (todosCardIds.length === 0) { setModoSelecionado("revisao_dificeis"); setCardsHoje([]); setTela("semCards"); setCarregando(false); return; }
      const { data: progressosDificeis } = await supabase.from("flashcard_progress").select("*").eq("student_id", student.id).eq("ultima_avaliacao", "dificil").in("flashcard_id", todosCardIds);
      if (!progressosDificeis || progressosDificeis.length === 0) { setModoSelecionado("revisao_dificeis"); setCardsHoje([]); setTela("semCards"); setCarregando(false); return; }
      const idsParaRevisar = progressosDificeis.map(p => p.flashcard_id);
      const { data: cards } = await supabase.from("flashcards").select("*").in("id", idsParaRevisar);
      const mapaProgresso = {};
      progressosDificeis.forEach(p => { mapaProgresso[p.flashcard_id] = p; });
      const embaralhados = [...(cards || [])].sort(() => Math.random() - 0.5).map(c => ({ ...c, progresso: mapaProgresso[c.id] || null }));
      setCardsHoje(embaralhados);
      setDeckSelecionado({ nome: "Revisão Rápida 💪" });
      setModoSelecionado("revisao_dificeis");
      setIndiceAtual(0); setVirado(false); setResultados([]);
      setTela("sessao");
    } catch (e) { setErro("Erro: " + e.message); }
    setCarregando(false);
  };

  // Modo livre — combina decks selecionados
  const iniciarModoLivre = async () => {
    if (decksLivreSelecionados.length === 0) return;
    setCarregando(true);
    try {
      const cardIds = decks.filter(d => decksLivreSelecionados.includes(d.id)).flatMap(d => (d.flashcards || []).map(c => c.id));
      const { data: cards } = await supabase.from("flashcards").select("*").in("id", cardIds);
      const { data: progressos } = await supabase.from("flashcard_progress").select("*").eq("student_id", student.id).in("flashcard_id", cardIds);
      const mapaProgresso = {};
      (progressos || []).forEach(p => { mapaProgresso[p.flashcard_id] = p; });
      const embaralhados = [...(cards || [])].sort(() => Math.random() - 0.5).map(c => ({ ...c, progresso: mapaProgresso[c.id] || null }));
      setCardsHoje(embaralhados);
      setDeckSelecionado({ nome: `Modo Livre (${decksLivreSelecionados.length} decks)` });
      setModoSelecionado("modo_livre");
      setIndiceAtual(0); setVirado(false); setResultados([]);
      setTela("sessao");
    } catch (e) { setErro("Erro: " + e.message); }
    setCarregando(false);
  };

  const corAvaliacao = (av) => av === "facil" ? palette.lightGreen : av === "ok" ? palette.lavender : "#F7C1C1";
  const textoAvaliacao = (av) => av === "facil" ? "Fácil ✓" : av === "ok" ? "Ok" : "Difícil";

  if (carregando) return (
    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", minHeight: "200px" }}>
      <p style={{ color: textSecondary, fontSize: "14px" }}>Carregando flashcards...</p>
    </div>
  );

  if (erro) return (
    <div style={{ padding: "20px", textAlign: "center" }}>
      <p style={{ color: "#E24B4A", fontSize: "13px" }}>{erro}</p>
      <button onClick={carregarDecks} style={{ marginTop: "12px", padding: "8px 16px", borderRadius: "8px", border: "none", cursor: "pointer", background: palette.orange, color: "#FFF", fontSize: "13px", fontWeight: 600 }}>Tentar de novo</button>
    </div>
  );

  // TELA: lista de decks
  if (tela === "inicio") {
    // Converte "Unit 5A" → "5A" ou "Practical English 2" → "PE2"
    const labelParaCodigo = (label) => {
      if (!label) return null;
      if (label.startsWith("Practical English ")) return "PE" + label.slice(18).trim();
      if (label.startsWith("Unit ")) return label.slice(5).trim();
      return label;
    };
    const unidadeAtual = labelParaCodigo(turma && turma.unidade_atual) || labelParaCodigo(student.unidade_atual) || null;
    // Separa deck da unidade atual dos anteriores
    const deckAtual = decks.filter(d => d.unidade === unidadeAtual && !d.student_id);
    const deckPersonalizado = decks.filter(d => d.student_id === student.id);
    const todasUnidadesSyllabus = (SYLLABUS[student.nivel || "Beginner"] || []).map(u => u.id);
    const deckAnteriores = decks
      .filter(d => d.unidade !== unidadeAtual && !d.student_id)
      .sort((a, b) => {
        const idxA = todasUnidadesSyllabus.indexOf(a.unidade);
        const idxB = todasUnidadesSyllabus.indexOf(b.unidade);
        return idxB - idxA; // decrescente: mais recente primeiro
      });

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>

        {/* Header */}
        <div>
          <h2 style={{ fontSize: "17px", fontWeight: 700, color: dark ? "#FFF" : palette.purple, marginBottom: "4px" }}>🃏 Flashcards</h2>
          <p style={{ fontSize: "13px", color: textSecondary, margin: 0 }}>Continue de onde parou.</p>
        </div>

        {decks.length === 0 ? (
          <div style={{ background: dark ? "#3A2B7A" : palette.cream, borderRadius: "14px", padding: "28px", textAlign: "center" }}>
            <p style={{ fontSize: "24px", marginBottom: "8px" }}>📭</p>
            <p style={{ fontSize: "14px", color: textSecondary }}>Nenhum deck disponível ainda. A Teacher Mari vai adicionar em breve!</p>
          </div>
        ) : (
          <>
            {/* ── HERO: unidade atual ── */}
            {(deckAtual.length > 0 || deckPersonalizado.length > 0) && (
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {[...deckAtual, ...deckPersonalizado].map(deck => (
                  <button key={deck.id} onClick={() => iniciarSessao(deck)}
                    style={{ width: "100%", padding: "20px", borderRadius: "16px", border: "none", cursor: "pointer", background: palette.orange, textAlign: "left", fontFamily: "'Poppins', sans-serif", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px" }}>
                    <div>
                      <p style={{ fontSize: "11px", fontWeight: 600, color: "rgba(255,255,255,0.75)", textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 6px" }}>Sua unidade atual</p>
                      <p style={{ fontSize: "16px", fontWeight: 700, color: "#FFF", margin: "0 0 4px" }}>{deck.nome}</p>
                      <p style={{ fontSize: "12px", color: "rgba(255,255,255,0.8)", margin: 0 }}>{(deck.flashcards || []).length} cards{deck.student_id ? " · personalizado" : ""}</p>
                    </div>
                    <span style={{ fontSize: "28px", color: "rgba(255,255,255,0.6)", flexShrink: 0 }}>→</span>
                  </button>
                ))}
              </div>
            )}

            {/* ── OUTROS MODOS: pills ── */}
            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              <p style={{ fontSize: "11px", fontWeight: 700, color: textSecondary, textTransform: "uppercase", letterSpacing: "0.08em", margin: 0 }}>Outros modos</p>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                <button onClick={iniciarRevisaoGeral} disabled={carregando}
                  style={{ padding: "8px 14px", borderRadius: "20px", border: "none", cursor: "pointer", background: palette.orange + "18", color: palette.orange, fontSize: "12px", fontWeight: 600, fontFamily: "'Poppins', sans-serif" }}>
                  🌟 Estudar tudo
                </button>
                <button onClick={iniciarRevisaoDificeis} disabled={carregando}
                  style={{ padding: "8px 14px", borderRadius: "20px", border: "none", cursor: "pointer", background: "#B4A1FF22", color: "#6B52CC", fontSize: "12px", fontWeight: 600, fontFamily: "'Poppins', sans-serif" }}>
                  💪 Treinar os difíceis
                </button>
                <button onClick={() => setMostrarModoLivre(!mostrarModoLivre)}
                  style={{ padding: "8px 14px", borderRadius: "20px", border: "none", cursor: "pointer", background: "#CAE78D44", color: "#4A6A00", fontSize: "12px", fontWeight: 600, fontFamily: "'Poppins', sans-serif" }}>
                  🎯 Montar sessão {mostrarModoLivre ? "▲" : "▼"}
                </button>
              </div>

              {mostrarModoLivre && (
                <div style={{ background: dark ? "#2A1D66" : "#F9F5E8", borderRadius: "14px", padding: "16px", display: "flex", flexDirection: "column", gap: "10px" }}>
                  <p style={{ fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, margin: 0 }}>Selecione os decks:</p>
                  <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                    {decks.map(d => (
                      <label key={d.id} style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", padding: "10px 12px", borderRadius: "10px", background: dark ? "#3A2B7A" : "#FFF", border: `1.5px solid ${decksLivreSelecionados.includes(d.id) ? palette.orange : "transparent"}` }}>
                        <input type="checkbox" checked={decksLivreSelecionados.includes(d.id)}
                          onChange={e => setDecksLivreSelecionados(prev => e.target.checked ? [...prev, d.id] : prev.filter(id => id !== d.id))}
                          style={{ accentColor: palette.orange, width: "16px", height: "16px", flexShrink: 0 }} />
                        <span style={{ fontSize: "13px", fontWeight: 500, color: dark ? "#FFF" : palette.purple, flex: 1 }}>{d.nome}</span>
                        <span style={{ fontSize: "11px", color: textSecondary, whiteSpace: "nowrap" }}>{(d.flashcards || []).length} cards</span>
                      </label>
                    ))}
                  </div>
                  <button onClick={iniciarModoLivre} disabled={decksLivreSelecionados.length === 0 || carregando}
                    style={{ padding: "12px", borderRadius: "10px", border: "none", cursor: decksLivreSelecionados.length === 0 ? "default" : "pointer", background: palette.orange, color: "#FFF", fontSize: "13px", fontWeight: 700, fontFamily: "'Poppins', sans-serif", opacity: decksLivreSelecionados.length === 0 ? 0.45 : 1 }}>
                    Iniciar com {decksLivreSelecionados.length || ""} deck{decksLivreSelecionados.length !== 1 ? "s" : ""}
                  </button>
                </div>
              )}
            </div>

            {/* ── UNIDADES ANTERIORES ── */}
            {deckAnteriores.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                <p style={{ fontSize: "11px", fontWeight: 700, color: textSecondary, textTransform: "uppercase", letterSpacing: "0.08em", margin: 0 }}>Unidades anteriores</p>
                {deckAnteriores.map(deck => (
                  <button key={deck.id} onClick={() => iniciarSessao(deck)}
                    style={{ width: "100%", padding: "14px 16px", borderRadius: "14px", border: `1px solid ${dark ? "#5A4AA0" : "#E8E0FF"}`, cursor: "pointer", background: dark ? "#3A2B7A" : "#FFF", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px", fontFamily: "'Poppins', sans-serif" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <p style={{ fontSize: "13px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, margin: 0 }}>{deck.nome}</p>
                      {deck.descricao && <p style={{ fontSize: "11px", color: textSecondary, margin: "3px 0 0" }}>{deck.descricao}</p>}
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <p style={{ fontSize: "11px", color: textSecondary, margin: "0 0 2px" }}>{(deck.flashcards || []).length} cards</p>
                      <span style={{ fontSize: "14px", color: "#B4A1FF" }}>→</span>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </>
        )}

        {erro && <p style={{ fontSize: "12px", color: "#E24B4A" }}>{erro}</p>}
      </div>
    );
  }

  // TELA: sem cards pra hoje
  if (tela === "semCards") return (
    <div style={{ display: "flex", flexDirection: "column", gap: "16px", alignItems: "center", textAlign: "center", paddingTop: "20px" }}>
      <span style={{ fontSize: "48px" }}>🎉</span>
      <h2 style={{ fontSize: "16px", fontWeight: 700, color: dark ? "#FFF" : palette.purple }}>Tudo em dia!</h2>
      <p style={{ fontSize: "13px", color: textSecondary, maxWidth: "300px" }}>
        Você não tem cards pra revisar hoje em <strong>{deckSelecionado?.nome}</strong>. O sistema vai te trazer de volta quando for a hora certa.
      </p>
      <button onClick={voltarInicio} style={{ padding: "10px 20px", borderRadius: "10px", border: "none", cursor: "pointer", background: palette.orange, color: "#FFF", fontSize: "13px", fontWeight: 600 }}>
        ← Voltar aos decks
      </button>
    </div>
  );

  // TELA: sessão de estudo
  if (tela === "sessao") {
    const card = cardsHoje[indiceAtual];
    const total = cardsHoje.length;
    const pct = Math.round((indiceAtual / total) * 100);

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={voltarInicio} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "13px", color: textSecondary, padding: 0, fontFamily: "'Poppins', sans-serif" }}>← Sair</button>
          <p style={{ fontSize: "13px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{indiceAtual + 1} / {total}</p>
          <p style={{ fontSize: "12px", color: textSecondary }}>{deckSelecionado?.nome}</p>
        </div>

        {/* Barra de progresso */}
        <div style={{ height: "6px", borderRadius: "3px", background: dark ? "#3A2B7A" : palette.cream, overflow: "hidden" }}>
          <div style={{ width: `${pct}%`, height: "100%", background: palette.orange, borderRadius: "3px", transition: "width 0.3s ease" }} />
        </div>

        {/* Card */}
        <div onClick={() => !virado && setVirado(true)}
          style={{ minHeight: "200px", background: dark ? "#3A2B7A" : "#FFF", border: `2px solid ${virado ? palette.orange : (dark ? "#5A4AA0" : palette.lavender + "55")}`, borderRadius: "16px", padding: "28px 24px", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center", cursor: virado ? "default" : "pointer", gap: "12px", transition: "border-color 0.2s", position: "relative" }}>
          <p style={{ fontSize: "11px", fontWeight: 600, color: palette.orange, letterSpacing: "0.08em", textTransform: "uppercase", margin: 0 }}>
            {virado ? "Resposta" : "Palavra / Pergunta"}
          </p>
          <p style={{ fontSize: "22px", fontWeight: 700, color: dark ? "#FFF" : palette.purple, margin: 0, lineHeight: 1.3 }}>
            {virado ? card.verso : card.frente}
          </p>
          {/* TTS — só mostra frente em inglês; verso é português, mas exemplo é inglês */}
          <button onClick={e => { e.stopPropagation(); window.speechSynthesis?.cancel(); const u = new SpeechSynthesisUtterance(virado ? card.frente : card.frente); u.lang = "en-US"; u.rate = 0.85; window.speechSynthesis?.speak(u); }}
            title="Ouvir pronúncia em inglês"
            style={{ background: "none", border: `1.5px solid ${dark ? "#5A4AA0" : palette.lavender + "88"}`, borderRadius: "20px", cursor: "pointer", fontSize: "13px", padding: "4px 12px", color: dark ? "#FFF" : palette.purple, display: "flex", alignItems: "center", gap: "4px" }}>
            🔊 <span style={{ fontSize: "11px", fontWeight: 600 }}>{card.frente}</span>
          </button>
          {virado && card.exemplo && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" }}>
              <p style={{ fontSize: "13px", color: textSecondary, fontStyle: "italic", margin: 0, maxWidth: "320px", lineHeight: 1.5 }}>
                "{card.exemplo}"
              </p>
              <button onClick={e => { e.stopPropagation(); const u = new SpeechSynthesisUtterance(card.exemplo); u.lang = "en-US"; u.rate = 0.85; window.speechSynthesis?.speak(u); }}
                title="Ouvir exemplo" style={{ background: "none", border: "none", cursor: "pointer", fontSize: "12px", color: textSecondary, padding: 0 }}>🔊 ouvir exemplo</button>
            </div>
          )}
          {!virado && (
            <p style={{ fontSize: "12px", color: textSecondary, margin: "4px 0 0" }}>Toque pra revelar →</p>
          )}
        </div>

        {/* Botões de avaliação */}
        {virado && (
          <div style={{ display: "flex", gap: "10px" }}>
            {[
              { av: "dificil", label: "😓 Difícil", bg: "#F7C1C1", cor: "#791F1F" },
              { av: "ok", label: "🙂 Ok", bg: palette.lavender + "44", cor: palette.purple },
              { av: "facil", label: "😄 Fácil", bg: palette.lightGreen + "66", cor: palette.green },
            ].map(({ av, label, bg, cor }) => (
              <button key={av} onClick={() => !salvando && avaliarCard(av)} disabled={salvando}
                style={{ flex: 1, padding: "12px 8px", borderRadius: "12px", border: "none", cursor: salvando ? "default" : "pointer", fontWeight: 600, fontSize: "13px", background: bg, color: cor, opacity: salvando ? 0.7 : 1, fontFamily: "'Poppins', sans-serif" }}>
                {label}
              </button>
            ))}
          </div>
        )}

        <p style={{ fontSize: "11px", color: textSecondary, textAlign: "center", margin: 0 }}>
          {virado ? "Como foi lembrar essa palavra?" : "Pense na resposta antes de revelar."}
        </p>
      </div>
    );
  }

  // TELA: resultado final
  if (tela === "resultado") {
    const faceis = resultados.filter(r => r.avaliacao === "facil").length;
    const oks = resultados.filter(r => r.avaliacao === "ok").length;
    const dificeis = resultados.filter(r => r.avaliacao === "dificil").length;
    const total = resultados.length;

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
        <div style={{ textAlign: "center", padding: "8px 0" }}>
          <span style={{ fontSize: "44px" }}>{faceis === total ? "🏆" : dificeis > total / 2 ? "💪" : "⭐"}</span>
          <h2 style={{ fontSize: "18px", fontWeight: 700, color: dark ? "#FFF" : palette.purple, marginTop: "8px" }}>Sessão completa!</h2>
          <p style={{ fontSize: "13px", color: textSecondary }}>{total} cards revisados</p>
        </div>

        {/* Resumo */}
        <div style={{ display: "flex", gap: "10px" }}>
          {[
            { label: "Fácil", count: faceis, bg: palette.lightGreen + "55", cor: palette.green },
            { label: "Ok", count: oks, bg: palette.lavender + "44", cor: palette.purple },
            { label: "Difícil", count: dificeis, bg: "#F7C1C1", cor: "#791F1F" },
          ].map(({ label, count, bg, cor }) => (
            <div key={label} style={{ flex: 1, background: bg, borderRadius: "10px", padding: "12px 8px", textAlign: "center" }}>
              <p style={{ fontSize: "22px", fontWeight: 700, color: cor, margin: 0 }}>{count}</p>
              <p style={{ fontSize: "11px", color: cor, margin: 0, fontWeight: 600 }}>{label}</p>
            </div>
          ))}
        </div>

        {/* Lista de difíceis */}
        {dificeis > 0 && (
          <div style={{ background: dark ? "#3A2B7A" : palette.cream, borderRadius: "12px", padding: "14px" }}>
            <p style={{ fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "8px" }}>
              😓 Palavras para reforçar:
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              {resultados.filter(r => r.avaliacao === "dificil").map((r, i) => (
                <p key={i} style={{ fontSize: "13px", color: dark ? "#FFF" : palette.purple, margin: 0 }}>
                  • <strong>{r.card.frente}</strong> → {r.card.verso}
                </p>
              ))}
            </div>
          </div>
        )}

        <p style={{ fontSize: "12px", color: textSecondary, textAlign: "center" }}>
          O sistema já agendou sua próxima revisão. Continue praticando! 🚀
        </p>

        <div style={{ display: "flex", gap: "10px" }}>
          <button onClick={voltarInicio} style={{ flex: 1, padding: "12px", borderRadius: "10px", border: "none", cursor: "pointer", background: dark ? "#5A4AA0" : palette.cream, color: dark ? "#FFF" : palette.purple, fontSize: "13px", fontWeight: 600, fontFamily: "'Poppins', sans-serif" }}>
            ← Outros decks
          </button>
          {dificeis > 0 && (
            <button onClick={reiniciarDeck} style={{ flex: 1, padding: "12px", borderRadius: "10px", border: "none", cursor: "pointer", background: palette.orange, color: "#FFF", fontSize: "13px", fontWeight: 600, fontFamily: "'Poppins', sans-serif" }}>
              Revisar de novo
            </button>
          )}
        </div>
      </div>
    );
  }

  return null;
}

// ---------- APP (controla navegação entre login e dashboard) ----------
function App() {
  const { useEffect } = React;
  const [logado, setLogado] = useState(false);
  const [papel, setPapel] = useState("aluno");
  const [alunoSelecionado, setAlunoSelecionado] = useState(null);
  const [carregandoLogin, setCarregandoLogin] = useState(false);
  const [verificandoSessao, setVerificandoSessao] = useState(true);

  useEffect(() => {
    async function restaurarSessao() {
      const { data: sessionData } = await supabase.auth.getSession();
      const user = sessionData.session && sessionData.session.user;
      if (!user) {
        setVerificandoSessao(false);
        return;
      }
      const { data: studentData } = await supabase.from("students").select("*").eq("id", user.id).single();
      if (studentData) {
        setAlunoSelecionado(studentData);
        setPapel("aluno");
      } else {
        setPapel("admin");
      }
      setLogado(true);
      setVerificandoSessao(false);
    }
    restaurarSessao();
  }, []);

  const sair = async () => {
    await supabase.auth.signOut();
    setLogado(false);
    setAlunoSelecionado(null);
  };

  if (verificandoSessao) {
    return (
      <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <p style={{ fontFamily: "'Poppins', sans-serif", color: palette.purple, fontSize: "14px" }}>Carregando...</p>
      </div>
    );
  }

  if (!logado) {
    return (
      <PortalLogin
        onLogin={async (r, user) => {
          if (r === "aluno") {
            setCarregandoLogin(true);
            const { data, error } = await supabase.from("students").select("*").eq("id", user.id).single();
            setCarregandoLogin(false);
            if (error && error.code !== "PGRST116") {
              // erro técnico (rede, permissão) — não é "aluno inexistente"
              alert("Erro ao carregar seus dados: " + error.message + "\nTente novamente em alguns segundos.");
              await supabase.auth.signOut();
              return;
            }
            if (!data) {
              alert("Esse login não está vinculado a nenhum aluno cadastrado. Fale com a Teacher Mari.");
              await supabase.auth.signOut();
              return;
            }
            setAlunoSelecionado(data);
          } else {
            // Tentando entrar como admin: verifica se esse usuário É admin
            // Regra: admin é qualquer conta que NÃO está cadastrada como aluno em `students`
            setCarregandoLogin(true);
            const { data: alunoExistente } = await supabase.from("students").select("id").eq("id", user.id).single();
            setCarregandoLogin(false);
            if (alunoExistente) {
              // É aluno tentando entrar como professora — bloqueia
              alert("Este acesso é só pra Teacher Mari. Alunos devem entrar pela opção \"Aluno\" no login.");
              await supabase.auth.signOut();
              return;
            }
          }
          setPapel(r);
          setLogado(true);
        }}
      />
    );
  }

  if (papel === "admin" && !alunoSelecionado) {
    return <AdminPanel onLogout={sair} onSelectStudent={setAlunoSelecionado} />;
  }

  return (
    <StudentDashboard
      onLogout={sair}
      role={papel}
      student={alunoSelecionado}
      onBack={papel === "admin" ? () => setAlunoSelecionado(null) : null}
      onSwitchStudent={papel === "admin" ? (novoAluno) => setAlunoSelecionado(novoAluno) : null}
      onStudentUpdated={(dados) => setAlunoSelecionado((prev) => {
        if (!prev) return prev;
        const { turmas: novasTurmas, ...restoDosDados } = dados;
        return {
          ...prev,
          ...restoDosDados,
          turmas: novasTurmas ? { ...(prev.turmas || {}), ...novasTurmas } : prev.turmas,
        };
      })}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
