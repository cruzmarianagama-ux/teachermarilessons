    setRascunho(existente
      ? { ...existente, horario: existente.horario || horarioPadrao }
      : { status: "agendada", horario: horarioPadrao });
    if (chave) {
      const [y, m, d] = chave.split("-").map(Number);
      setNovoDiaMover(`${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
      setNovoHorarioMover((existente && existente.horario) || "");
    }
  };

  // Só atualiza turmas.unidade_atual se a nova aula for a mais recente com unidade registrada.
  // Isso evita que registrar/editar uma aula retroativa faça o portal "voltar" pra uma unidade antiga.
  const deveAtualizarUnidadeAtual = (dataISO, ignorarRowId = null) => {
    const outras = aulasRegistradas.filter((a) => a.unidade && a.rowId !== ignorarRowId);
    if (outras.length === 0) return true;
    const dataMaisRecente = outras.reduce((max, a) => (a.data > max ? a.data : max), outras[0].data);
    return dataISO >= dataMaisRecente;
  };

  const salvarAula = async () => {
    const [y, m, d] = diaSelecionado.split("-").map(Number);
    const dataISO = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

    let prazoReposicao = null;
    if (rascunho.status === "aRepor") {
      const dataAula = new Date(dataISO + "T00:00:00");
      dataAula.setDate(dataAula.getDate() + 30);
      prazoReposicao = `${dataAula.getFullYear()}-${String(dataAula.getMonth() + 1).padStart(2, "0")}-${String(dataAula.getDate()).padStart(2, "0")}`;
    }

    const { data, error } = await supabase
      .from("lessons")
      .upsert({ turma_id: turmaId, data: dataISO, status: rascunho.status, prazo_reposicao: prazoReposicao, horario: rascunho.horario || null }, { onConflict: "turma_id,data" })
      .select().single();
    if (error) {
      alert("Erro ao salvar a aula: " + error.message);
      return;
    }
    setAulas((prev) => ({ ...prev, [diaSelecionado]: { status: rascunho.status, horario: rascunho.horario || null, prazo_reposicao: prazoReposicao, rowId: data.id } }));

    setDiaSelecionado(null);
  };

  const moverAula = async () => {
    if (!novoDiaMover) return;
    const dataAntiga = (() => {
      const [y, m, d] = diaSelecionado.split("-").map(Number);
      return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    })();
    if (novoDiaMover === dataAntiga && !novoHorarioMover) return;

    const novaData = new Date(novoDiaMover + "T00:00:00");
    const novaChave = `${novaData.getFullYear()}-${novaData.getMonth()}-${novaData.getDate()}`;
    const registroDestinoExistente = aulas[novaChave];
    if (novoDiaMover !== dataAntiga && registroDestinoExistente && registroDestinoExistente.status !== "cancelada") {
      alert("Já existe uma aula marcada nesse dia. Escolha outro dia ou mova/apague a aula existente primeiro.");
      return;
    }

    const registroOrigem = aulas[diaSelecionado];
    const temRegistroReal = registroOrigem && registroOrigem.rowId;
    const statusOriginal = registroOrigem && registroOrigem.status;
    const mudouDia = novoDiaMover !== dataAntiga;
    const viraReposicao = statusOriginal === "aRepor" && mudouDia;

    // Descobre horário default do dia destino se não foi fornecido
    let horarioFinal = novoHorarioMover;
    if (!horarioFinal && turma && turma.dias_horarios) {
      const diaSemanaDestino = novaData.getDay();
      const dhMatch = turma.dias_horarios.find((dh) => DIAS_SEMANA_MAP[dh.dia] === diaSemanaDestino);
      if (dhMatch) horarioFinal = dhMatch.horario;
    }

    if (temRegistroReal) {
      // UPDATE do registro existente para nova data/horário
      const atualizacao = { data: novoDiaMover, horario: horarioFinal || null };
      if (mudouDia) {
        atualizacao.data_original = registroOrigem.data_original || dataAntiga;
      }
      if (viraReposicao) {
        atualizacao.status = "reposicaoAgendada";
        atualizacao.prazo_reposicao = null;
      }
      const { error } = await supabase.from("lessons").update(atualizacao).eq("id", registroOrigem.rowId);
      if (error) { alert("Erro ao mover a aula: " + error.message); return; }
    } else {
      // Aula implícita — INSERT registro na nova data
      const { error } = await supabase.from("lessons").insert({
        turma_id: turmaId,
        data: novoDiaMover,
        status: "agendada",
        horario: horarioFinal || null,
        data_original: mudouDia ? dataAntiga : null,
      });
      if (error) { alert("Erro ao mover a aula: " + error.message); return; }
    }

    // Se mudou de dia E a data antiga era dia oficial → INSERT cancelada pra não voltar como implícita
    if (mudouDia) {
      const diaSemanaAntigo = new Date(dataAntiga + "T00:00:00").getDay();
      const antigoEraOficial = turma && turma.dias_horarios && turma.dias_horarios.some((dh) => DIAS_SEMANA_MAP[dh.dia] === diaSemanaAntigo);
      if (antigoEraOficial && !temRegistroReal) {
        // Só insere cancelada se a origem era implícita (o UPDATE do registro real já "sumiu" com a data antiga)
        await supabase.from("lessons").upsert({ turma_id: turmaId, data: dataAntiga, status: "cancelada", prazo_reposicao: null, horario: null }, { onConflict: "turma_id,data" });
      } else if (antigoEraOficial && temRegistroReal) {
        // Registro real foi movido pra nova data; agora precisa criar cancelada na data antiga
        await supabase.from("lessons").insert({ turma_id: turmaId, data: dataAntiga, status: "cancelada", prazo_reposicao: null, horario: null });
      }
    }

    // Recarrega estado buscando do banco pra garantir consistência
    setLoadKey((k) => k + 1);
    setMesAtual(novaData.getMonth());
    setAnoAtual(novaData.getFullYear());
    setDiaSelecionado(null);
  };

  const avisarNaoComparecimento = async (chave) => {
    const [y, m, d] = chave.split("-").map(Number);
    const dataISO = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const horarioAula = dataHoraDaAula(dataISO, aulas[chave] && aulas[chave].horario);

    const confirmar = window.confirm("Avisar que você não vai comparecer a essa aula?");
    if (!confirmar) return;

    const agora = new Date();
    const horasAteAula = horarioAula ? (horarioAula - agora) / (1000 * 60 * 60) : 0;
    const novoStatus = horasAteAula >= 3 ? "aRepor" : "perdida";

    let prazoReposicao = null;
    if (novoStatus === "aRepor") {
      const prazo = new Date(dataISO + "T00:00:00");
      prazo.setDate(prazo.getDate() + 30);
      prazoReposicao = `${prazo.getFullYear()}-${String(prazo.getMonth() + 1).padStart(2, "0")}-${String(prazo.getDate()).padStart(2, "0")}`;
    }

    const { data, error } = await supabase
      .from("lessons")
      .upsert({ turma_id: turmaId, data: dataISO, status: novoStatus, prazo_reposicao: prazoReposicao, aviso_pendente: true }, { onConflict: "turma_id,data" })
      .select().single();

    if (!error) {
      setAulas((prev) => ({ ...prev, [chave]: { status: novoStatus, prazo_reposicao: prazoReposicao, aviso_pendente: true, rowId: data.id } }));
      alert(novoStatus === "aRepor"
        ? "Aviso registrado! Essa aula virou 'A repor', com prazo de 30 dias."
        : "Aviso registrado com menos de 3h de antecedência — essa aula foi marcada como 'Perdida'.");
    }
  };

  const excluirAulaCalendario = async () => {
    const confirmar = window.confirm("Excluir esta aula do calendário? Isso não apaga nenhum registro de Aulas + Homework vinculado.");
    if (!confirmar) return;
    const [y, m, d] = diaSelecionado.split("-").map(Number);
    const dataISO = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const registroExistente = aulas[diaSelecionado];

    if (registroExistente && registroExistente.rowId) {
      // Tem registro real → deleta do banco
      const { error } = await supabase.from("lessons").delete().eq("id", registroExistente.rowId);
      if (error) { alert("Erro ao excluir a aula: " + error.message); return; }
      // Se era dia oficial da turma, precisa marcar como cancelada pra não voltar como agendada implícita
      const diaSemana = new Date(dataISO + "T00:00:00").getDay();
      const ehDiaOficial = turma && turma.dias_horarios && turma.dias_horarios.some((dh) => DIAS_SEMANA_MAP[dh.dia] === diaSemana);
      if (ehDiaOficial) {
        const { data, error: erroCancelada } = await supabase
          .from("lessons")
          .insert({ turma_id: turmaId, data: dataISO, status: "cancelada", prazo_reposicao: null, horario: null })
          .select().single();
        if (erroCancelada) { alert("Erro ao marcar como cancelada: " + erroCancelada.message); return; }
        setAulas((prev) => ({ ...prev, [diaSelecionado]: { status: "cancelada", rowId: data.id } }));
      } else {
        setAulas((prev) => { const copia = { ...prev }; delete copia[diaSelecionado]; return copia; });
      }
    } else {
      // Aula implícita (do dia oficial, sem registro) → insere cancelada pra suprimir
      const { data, error } = await supabase
        .from("lessons")
        .upsert({ turma_id: turmaId, data: dataISO, status: "cancelada", prazo_reposicao: null, horario: null }, { onConflict: "turma_id,data" })
        .select().single();
      if (error) { alert("Erro ao excluir a aula: " + error.message); return; }
      setAulas((prev) => ({ ...prev, [diaSelecionado]: { status: "cancelada", rowId: data.id } }));
    }
    setDiaSelecionado(null);
  };

  const registrarAula = async () => {
    if (!novaAula.data || !novaAula.assunto) return;
    const { data, error } = await supabase
      .from("lesson_records")
      .insert({ turma_id: turmaId, data: novaAula.data, assunto: novaAula.assunto, unidade: novaAula.unidade || null, cronograma_url: novaAula.cronogramaUrl, embeds: novaAula.embeds, presencas: novaAula.presencas || {}, homework: novaAula.homework || null, materiais_aula: novaAula.materiaisAula || [], conteudo_ensinado: novaAula.conteudoEnsinado || null, para_proxima_aula: novaAula.paraProximaAula || null })
      .select().single();
    if (error) {
      alert("Erro ao registrar a aula: " + error.message);
      return;
    }
    setAulasRegistradas((prev) => [{ ...novaAula, rowId: data.id }, ...prev]);
    if (novaAula.unidade && deveAtualizarUnidadeAtual(novaAula.data)) {
      const label = rotuloUnidade(novaAula.unidade);
      await supabase.from("turmas").update({ unidade_atual: label }).eq("id", turmaId);
      setTurma((t) => (t ? { ...t, unidade_atual: label } : t));
    }

    // Marca essa mesma data como "Realizada" no calendário, já que a aula foi dada de fato
    const { data: lessonData, error: lessonError } = await supabase
      .from("lessons")
      .upsert({ turma_id: turmaId, data: novaAula.data, status: "realizada", prazo_reposicao: null }, { onConflict: "turma_id,data" })
      .select().single();
    if (!lessonError) {
      const d = new Date(novaAula.data + "T00:00:00");
      const chave = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      setAulas((prev) => ({ ...prev, [chave]: { ...(prev[chave] || {}), status: "realizada", prazo_reposicao: null, rowId: lessonData.id } }));
    }
    // Salta o navegador de mês pra onde a aula foi registrada (senão ela "some" da view atual)
    const dataNova = new Date(novaAula.data + "T00:00:00");
    setMesHomework(dataNova.getMonth());
    setAnoHomework(dataNova.getFullYear());
    setNovaAula({ data: "", assunto: "", unidade: "", cronogramaUrl: "", embeds: [], presencas: {}, homework: "", materiaisAula: [], conteudoEnsinado: "", paraProximaAula: "" });
  };

  const salvarEdicaoAulaRegistrada = async () => {
    const { error } = await supabase
      .from("lesson_records")
      .update({ data: rascunhoAulaRegistrada.data, assunto: rascunhoAulaRegistrada.assunto, unidade: rascunhoAulaRegistrada.unidade || null, cronograma_url: rascunhoAulaRegistrada.cronogramaUrl, embeds: rascunhoAulaRegistrada.embeds || [], presencas: rascunhoAulaRegistrada.presencas || {}, homework: rascunhoAulaRegistrada.homework || null, materiais_aula: rascunhoAulaRegistrada.materiaisAula || [], conteudo_ensinado: rascunhoAulaRegistrada.conteudoEnsinado || null, para_proxima_aula: rascunhoAulaRegistrada.paraProximaAula || null })
      .eq("id", rascunhoAulaRegistrada.rowId);
    if (error) {
      alert("Erro ao salvar as alterações: " + error.message);
      return;
    }
    setAulasRegistradas((prev) => prev.map((a) => (a.rowId === rascunhoAulaRegistrada.rowId ? { ...rascunhoAulaRegistrada } : a)));
    setCronogramaAberto({ ...rascunhoAulaRegistrada });
    // Se editou a data pra outro mês, sincroniza o navegador pra apontar pro novo mês
    const dataEditada = new Date(rascunhoAulaRegistrada.data + "T00:00:00");
    setMesHomework(dataEditada.getMonth());
    setAnoHomework(dataEditada.getFullYear());
    if (rascunhoAulaRegistrada.unidade && deveAtualizarUnidadeAtual(rascunhoAulaRegistrada.data, rascunhoAulaRegistrada.rowId)) {
      const label = rotuloUnidade(rascunhoAulaRegistrada.unidade);
      await supabase.from("turmas").update({ unidade_atual: label }).eq("id", turmaId);
      setTurma((t) => (t ? { ...t, unidade_atual: label } : t));
    }
    setEditandoAulaRegistrada(false);
  };

  const alternarHomeworkConcluido = async (lessonRecordId) => {
    if (role === "admin") return; // só o próprio aluno marca o seu homework
    const atual = !!homeworkStatus[lessonRecordId];
    const novoValor = !atual;
    setHomeworkStatus((prev) => ({ ...prev, [lessonRecordId]: novoValor }));
    const { error } = await supabase
      .from("homework_status")
      .upsert({ lesson_record_id: lessonRecordId, student_id: studentId, concluido: novoValor, updated_at: new Date().toISOString() }, { onConflict: "lesson_record_id,student_id" });
    if (error) {
      setHomeworkStatus((prev) => ({ ...prev, [lessonRecordId]: atual })); // desfaz se der erro
    }
  };

  const excluirAulaRegistrada = async () => {
    const confirmar = window.confirm(`Excluir o registro de "${cronogramaAberto.assunto}"? Isso também vai desmarcar essa aula do calendário.`);
    if (!confirmar) return;
    const dataDoRegistro = cronogramaAberto.data;
    const { error } = await supabase.from("lesson_records").delete().eq("id", cronogramaAberto.rowId);
    if (error) { alert("Erro ao excluir: " + error.message); return; }
    // Também remove a entrada correspondente no calendário (lessons), já que estão vinculados
    await supabase.from("lessons").delete().eq("turma_id", turmaId).eq("data", dataDoRegistro);
    setAulasRegistradas((prev) => prev.filter((a) => a.rowId !== cronogramaAberto.rowId));
    const d = new Date(dataDoRegistro + "T00:00:00");
    const chaveCalendario = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    setAulas((prev) => { const copia = { ...prev }; delete copia[chaveCalendario]; return copia; });
    setCronogramaAberto(null);
  };

  const baixarHistoricoPDF = () => {

    y += 6;
    doc.text(`Gerado em: ${new Date().toLocaleDateString("pt-BR")}`, 14, y);

    doc.text("Aulas + Homework registrados", 14, y);
    y += 8;

    const entradasCalendario = Object.entries(aulas)
      .map(([chave, r]) => {

        return { data: `${String(d).padStart(2, "0")}/${String(m + 1).padStart(2, "0")}/${y}`, status: statusDe(r), ordem: y * 10000 + m * 100 + d };
      })
      .sort((a, b) => a.ordem - b.ordem);

      if (y > 275) { doc.addPage(); y = 20; }

  const gerarRelatorioMensal = () => {
    setRelatorioCarregando(true);
    const { mes, ano } = relatorioMesAno;

    const aulasDoMes = Object.entries(aulas)
      .filter(([chave]) => {
        const partes = chave.split("-").map(Number);
        return partes[0] === ano && partes[1] === mes;
      })
      .map(([, r]) => (typeof r === "object" ? r : { status: r }))
      .filter((a) => a.status !== "cancelada");

    const scheduledClasses = aulasDoMes.length;
    const completedClasses = aulasDoMes.filter((a) => a.status === "realizada").length;
    const toReschedule = aulasDoMes.filter((a) => a.status === "aRepor").length;
    const attendancePct = scheduledClasses > 0 ? Math.round((completedClasses / scheduledClasses) * 100) : 0;

    const inicioMes = new Date(ano, mes, 1);
    const fimMes = new Date(ano, mes + 1, 0, 23, 59, 59);
    const registrosDoMes = aulasRegistradas
      .filter((r) => { const d = new Date(r.data + "T00:00:00"); return d >= inicioMes && d <= fimMes; })
      .sort((a, b) => new Date(a.data) - new Date(b.data));

    const unidadesDoMes = [...new Set(registrosDoMes.filter((r) => r.unidade).map((r) => r.unidade))];
    const learningJourney = unidadesDoMes.map((unidade) => {
      const topico = obterTopico(student.nivel || "Beginner", unidade);
      return {
        unidade,
        rotulo: topico ? topico.t : rotuloUnidade(unidade),
        assuntos: topico ? [...topico.items] : registrosDoMes.filter((r) => r.unidade === unidade).map((r) => r.assunto),
      };
    });

    const sequencia = gerarSequenciaCurriculo(student.nivel || "Beginner");
    const registrosComUnidade = aulasRegistradas.filter((r) => r.unidade).sort((a, b) => new Date(a.data) - new Date(b.data));
    const antesDoMes = registrosComUnidade.filter((r) => new Date(r.data + "T00:00:00") < inicioMes);
    const ateFimDoMes = registrosComUnidade.filter((r) => new Date(r.data + "T00:00:00") <= fimMes);
    const idxInicio = antesDoMes.length > 0 ? sequencia.indexOf(antesDoMes[antesDoMes.length - 1].unidade) : -1;
    const idxFim = ateFimDoMes.length > 0 ? sequencia.indexOf(ateFimDoMes[ateFimDoMes.length - 1].unidade) : -1;
    const pctInicio = idxInicio >= 0 ? Math.round(((idxInicio + 1) / sequencia.length) * 100) : 0;
    const pctFim = idxFim >= 0 ? Math.round(((idxFim + 1) / sequencia.length) * 100) : 0;

    const proximasUnidades = (idxFim >= 0 ? sequencia.slice(idxFim + 1, idxFim + 4) : sequencia.slice(0, 3)).map((c) => {
      const topico = obterTopico(student.nivel || "Beginner", c);
      return topico ? (topico.items[0] || topico.t) : rotuloUnidade(c);
    });
    const proxMes = mes === 11 ? 0 : mes + 1;
    const proxAno = mes === 11 ? ano + 1 : ano;
    const aulasProxMes = Object.entries(aulas).filter(([chave]) => Number(chave.split("-")[0]) === proxMes).length;

    const classDay = turma && turma.dias_horarios && turma.dias_horarios.length > 0 ? turma.dias_horarios.map((dh) => dh.dia).join(", ") : "—";

    const notasAuto = [];
    if (attendancePct === 100 && scheduledClasses > 0) notasAuto.push("Congratulations on your perfect attendance this month!");
    notasAuto.push("Don't forget your homework and exercises available on the Student Portal. Practice makes perfect!");
    notasAuto.push("Keep going! Your effort is bringing great results.");

    setRelatorio({
      mesNome: `${meses[mes]} ${ano}`,
      proxMesNome: `${meses[proxMes]} ${proxAno}`,
      studentName: student.nome,
      classDay,
      currentLevel: student.nivel || "-",
      scheduledClasses, completedClasses, attendancePct, toReschedule,
      learningJourney,
      pctInicio, pctFim,
      aulasProxMes,
      achieve: proximasUnidades,
      notas: notasAuto,
    });
    setRelatorioCarregando(false);
  };

  const dataHoraDaAula = (dataISO, horarioEspecifico) => {
    if (horarioEspecifico) return new Date(`${dataISO}T${horarioEspecifico}:00`);
    if (!turma || !turma.dias_horarios) return null;
    const diaSemana = new Date(dataISO + "T00:00:00").getDay();

  const proximaAula = (() => {

    //    Isso pega: aulas extras em dias não oficiais, aulas movidas, agendadas explícitas em dias oficiais.
    Object.entries(aulas)
      .filter(([, r]) => typeof r === "object" && (r.status === "agendada" || r.status === "reposicaoAgendada"))
      .forEach(([chave, r]) => {
        const [y, m, d] = chave.split("-").map(Number);
        const dataISO = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        if (diasSemAula[dataISO]) return;
        // Prioriza horário salvo no registro; se não tiver, tenta o padrão da turma pra esse dia da semana
        let dataHora;
        if (r.horario) {
          dataHora = new Date(`${dataISO}T${r.horario}:00`);
        } else {
          dataHora = dataHoraDaAula(dataISO, null);
        }
        if (dataHora && dataHora >= agora) {
          candidatas.push({ dataHora, reagendada: r.status === "reposicaoAgendada" });

    // 2. Dias regulares da turma sem NENHUM registro (agendadas implícitas) — próximos 90 dias
    if (turma && turma.dias_horarios && turma.dias_horarios.length > 0) {
      const diasMap = { "Domingo": 0, "Segunda": 1, "Terça": 2, "Quarta": 3, "Quinta": 4, "Sexta": 5, "Sábado": 6 };
      for (let offset = 0; offset <= 90; offset++) {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        d.setHours(0, 0, 0, 0);
        const diaSemana = d.getDay();
        const dataISO = d.toISOString().slice(0, 10);
        if (turma.data_fim && dataISO > turma.data_fim) break;
        if (diasSemAula[dataISO]) continue;
        const dh = turma.dias_horarios.find((dh) => diasMap[dh.dia] === diaSemana);
        if (!dh) continue;
        const chave = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
        // Se já existe qualquer registro (agendada/realizada/cancelada/aRepor/etc), o bloco 1 já cuidou
        if (aulas[chave]) continue;
        const dataHora = new Date(`${dataISO}T${dh.horario}:00`);
        if (dataHora >= agora) { candidatas.push({ dataHora, reagendada: false }); break; }
      }
    }

    candidatas.sort((a, b) => a.dataHora - b.dataHora);
    return candidatas[0] || null;
  })();

  const formatarProximaAula = (dataHora) => {
    const diaSemana = dataHora.toLocaleDateString("en-US", { weekday: "short" });
    const mesEDia = dataHora.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const hora = dataHora.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
    return `${diaSemana}, ${mesEDia} — ${hora}`;
  };

  // Streak
  // Individual: conta aulas seguidas sem "Perdida" no calendário (behavior original)
  // Dupla/grupo: conta lesson_records seguidos em que ESSE aluno esteve presente (por data desc)
  let streak = 0;
  if (colegas.length > 0) {
    // Dupla ou grupo — usa lesson_records por presença individual
    const aulasOrdenadas = [...aulasRegistradas].sort((a, b) => b.data.localeCompare(a.data));
    for (const aula of aulasOrdenadas) {
      const faltou = aula.presencas && aula.presencas[studentId] === false;
      if (!faltou) streak++;
      else break;
    }
  } else {
    // Individual — usa calendário como antes
    const diasComStatus = Object.entries(aulas)
      .filter(([, r]) => statusDe(r) === "realizada" || statusDe(r) === "perdida")
      .map(([chave, r]) => {
        const [y, m, d] = chave.split("-").map(Number);
        return { ordem: y * 10000 + m * 100 + d, status: statusDe(r) };
      })
      .sort((a, b) => b.ordem - a.ordem);
    for (const item of diasComStatus) {
      if (item.status === "realizada") streak++;
      else break;
    }
  }

  const ultimaAulaComUnidade = aulasRegistradas
    .filter((a) => a.unidade)
    .sort((a, b) => b.data.localeCompare(a.data))[0];
  const codigoAtual = ultimaAulaComUnidade ? ultimaAulaComUnidade.unidade : null;
  const indiceAtual = codigoAtual ? sequenciaCurriculo.indexOf(codigoAtual) : -1;
  const unidadeAtual = codigoAtual ? rotuloUnidade(codigoAtual) : "Ainda não iniciado";
  const progressoPercentual = indiceAtual >= 0 ? Math.round(((indiceAtual + 1) / sequenciaCurriculo.length) * 100) : 0;

  if (carregandoDados) {

      <div style={{ minHeight: "100vh", width: "100%", background: bg, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: "16px" }}>

      </div>

                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "14px" }} />

                      <button onClick={criarCobranca}
                        style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.purple, color: "#FFF" }}>
                        Criar cobrança
                      </button>
                    </div>
                  )}
                </div>
              )}

              <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {cobranca.length === 0 && (
                <p style={{ fontSize: "13px", color: textSecondary }}>Nenhuma cobrança cadastrada ainda.</p>
              )}
              {cobranca.map((c, i) => {
                const emEdicao = editandoCobrancaId === c.rowId;
                const diasParaVencer = Math.ceil((new Date(c.vencimentoISO + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);
                let statusLabel, statusBg, statusCor;
                if (c.status === "pago") {
                  statusLabel = "Pago"; statusBg = palette.lightGreen; statusCor = palette.green;
                } else if (diasParaVencer < 0) {
                  statusLabel = "Atrasado"; statusBg = "#F7C1C1"; statusCor = "#791F1F";
                } else if (diasParaVencer === 0) {
                  statusLabel = "Vence hoje"; statusBg = palette.orange; statusCor = "#FFF";
                } else {
                  statusLabel = "A vencer"; statusBg = dark ? "#5A4AA0" : "#EEE"; statusCor = textSecondary;
                }
                return (
                <div key={i} style={{ padding: "14px 16px", borderRadius: "12px", background: dark ? "#3A2B7A" : palette.cream }}>
                  {emEdicao ? (
                    <div>
                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Mês / referência</label>
                      <input type="text" value={rascunhoCobranca.mes} onChange={(e) => setRascunhoCobranca((r) => ({ ...r, mes: e.target.value }))}
                        placeholder={`Ex: Janeiro ${new Date().getFullYear()}`}
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "10px" }} />

                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Valor (R$)</label>
                      <input type="text" inputMode="decimal" value={rascunhoCobranca.valor} onChange={(e) => setRascunhoCobranca((r) => ({ ...r, valor: e.target.value }))}
                        placeholder="250,00"
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "10px" }} />

                      <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Vencimento</label>
                      <input type="date" value={rascunhoCobranca.vencimento} onChange={(e) => setRascunhoCobranca((r) => ({ ...r, vencimento: e.target.value }))}
                        style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "14px" }} />

                      <div style={{ display: "flex", gap: "8px" }}>
                        <button onClick={() => salvarEdicaoCobranca(c.rowId)}
                          style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: palette.orange, color: "#FFF" }}>
                          Salvar
                        </button>
                        <button onClick={() => setEditandoCobrancaId(null)}
                          style={{ padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>
                          Cancelar
                        </button>
                      </div>
                    </div>
                  ) : (
                  <React.Fragment>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div>
                      <p style={{ fontSize: "14px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{c.mes}</p>
                      <p style={{ fontSize: "13px", color: textSecondary }}>{c.valor} · vencimento {c.vencimento}</p>
                    </div>
                    <span style={{ fontSize: "12px", fontWeight: 600, padding: "5px 12px", borderRadius: "20px", background: statusBg, color: statusCor }}>
                      {statusLabel}
                    </span>
                  </div>

                  {role === "admin" ? (
                    <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}`, display: "flex", alignItems: "center", flexWrap: "wrap", gap: "8px" }}>
                      <label style={{ display: "inline-block", fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: palette.purple, color: "#FFF", cursor: "pointer" }}>
                        {c.boletoUrl ? "Substituir boleto" : "Subir boleto"}
                        <input type="file" accept="application/pdf,image/*" style={{ display: "none" }}
                          onChange={(e) => e.target.files[0] && anexarBoleto(i, e.target.files[0])} />
                      </label>
                      {c.status !== "pago" ? (
                        <button onClick={() => marcarComoPago(c.rowId)}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: "none", cursor: "pointer", background: palette.lightGreen, color: palette.green }}>
                          Marcar como pago
                        </button>
                      ) : (
                        <button onClick={() => marcarComoPendente(c.rowId)}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>
                          Desmarcar pago
                        </button>
                      )}
                      <button onClick={() => abrirEdicaoCobranca(c)}
                        style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple }}>
                        Editar
                      </button>
                      <button onClick={() => excluirCobranca(c)}
                        style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", border: "none", cursor: "pointer", background: "#F7C1C1", color: "#791F1F" }}>
                        Excluir
                      </button>
                      {c.nomeArquivo && (
                        <span style={{ fontSize: "12px", color: textSecondary }}>{c.nomeArquivo}</span>
                      )}
                    </div>
                  ) : (
                    c.boletoUrl && (
                      <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}`, display: "flex", gap: "8px" }}>
                        <a href={c.boletoUrl} target="_blank" rel="noopener noreferrer"
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple, textDecoration: "none" }}>
                          Visualizar boleto
                        </a>
                        <a href={c.boletoUrl} download={c.nomeArquivo || "boleto.pdf"}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: palette.orange, color: "#FFF", textDecoration: "none" }}>
                          Baixar boleto
                        </a>
                      </div>
                    )
                  )}
                  {role !== "admin" && !c.boletoUrl && (
                    <p style={{ marginTop: "10px", fontSize: "12px", color: textSecondary }}>Boleto ainda não disponível.</p>
                  )}
                  </React.Fragment>
                  )}
                </div>
                );
              })}
              </div>
            </div>
          )}

          {active === "flashcards" && (
            <FlashcardTab
              student={student}
              turma={turma}
              dark={dark}
              palette={palette}
              textSecondary={textSecondary}
              cardBg={cardBg}
            />
          )}

          {active === "ia" && (
            <PraticarComIA
              student={student}
              turma={turma}
              dark={dark}
              palette={palette}
              textSecondary={textSecondary}
              cardBg={cardBg}
            />
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- SELETOR DE ESCOPO (componente global pra evitar bug de foco) ----------
function SeletorEscopo({ config, setConfig, label, unidadeAluno, unidadesEstudadas, unidadesAnteriores, dark, palette, inputStyle, cardIA, nome }) {
  const temUnidade = !!unidadeAluno;
  const temAnteriores = unidadesAnteriores && unidadesAnteriores.length > 0;
  return (
    <div style={{ ...cardIA, marginBottom: "16px" }}>
      <p style={{ fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, margin: "0 0 10px" }}>{label || "Sobre qual conteúdo?"}</p>
      <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
        {[
          { v: "unidade_atual", l: temUnidade ? `📍 Minha unidade atual (Unit ${unidadeAluno})` : "📍 Minha unidade atual (não definida)", disabled: !temUnidade },
          { v: "unidade_especifica", l: "📚 Escolher uma unidade", disabled: false },
          { v: "prompt_livre", l: "✏️ Escrever meu próprio tema", disabled: false },
        ].map(op => (
          <label key={op.v} style={{ display: "flex", alignItems: "center", gap: "8px", cursor: op.disabled ? "default" : "pointer", fontSize: "13px", color: dark ? "#FFF" : palette.purple, opacity: op.disabled ? 0.45 : 1 }}>
            <input type="radio" name={nome || "escopo"} checked={config.modo === op.v} disabled={op.disabled}
              onChange={() => !op.disabled && setConfig(c => ({ ...c, modo: op.v }))} style={{ accentColor: palette.orange }} />
            {op.l}
          </label>
        ))}
      </div>
      {config.modo === "unidade_especifica" && (
        <select value={config.unidade} onChange={e => setConfig(c => ({ ...c, unidade: e.target.value }))}
          style={{ ...inputStyle, marginTop: "10px" }}>
          <option value="">— Escolha uma unidade —</option>
          {unidadesEstudadas.map(u => <option key={u} value={u}>Unit {u}</option>)}
        </select>
      )}
      {config.modo === "prompt_livre" && (
        <input
          value={config.prompt_livre || config.tema_livre || ""}
          onChange={e => setConfig(c => ({ ...c, prompt_livre: e.target.value, tema_livre: e.target.value }))}
          placeholder="Ex: verb to be no present, numbers, daily routines..."
          style={{ ...inputStyle, marginTop: "10px" }}
        />
      )}
    </div>
  );
}

// ---------- PRATICAR COM IA ----------
function PraticarComIA({ student, turma, dark, palette, textSecondary, cardBg }) {
  const { useState, useRef, useEffect } = React;

  const [secao, setSecao] = useState("menu");
  const [carregandoIA, setCarregandoIA] = useState(false);

  // Exercícios
  const [exConfig, setExConfig] = useState({ modo: "unidade_atual", unidade: "", prompt_livre: "" });
  const [exerciciosGerados, setExerciciosGerados] = useState(null);
  const [respostasEx, setRespostasEx] = useState({});
  const [gabarito, setGabarito] = useState(false);

  // Escrita
  const [escritaConfig, setEscritaConfig] = useState({ modo: "unidade_atual", unidade: "", tema_livre: "" });
  const [escritaTarefa, setEscritaTarefa] = useState(null);
  const [textoEscrita, setTextoEscrita] = useState("");
  const [correcaoEscrita, setCorrecaoEscrita] = useState(null);

  // Chat
  const [chatConfig, setChatConfig] = useState({ modo: "unidade_atual", unidade: "", tema_livre: "" });
  const [chatIniciado, setChatIniciado] = useState(false);
  const [mensagensChat, setMensagensChat] = useState([]);
  const [inputChat, setInputChat] = useState("");
  const [feedbackChat, setFeedbackChat] = useState(null);
  const chatFimRef = useRef(null);

  // Dúvidas
  const [perguntaDuvida, setPerguntaDuvida] = useState("");
  const [respostaDuvida, setRespostaDuvida] = useState(null);

  // Exemplos
  const [palavraExemplo, setPalavraExemplo] = useState("");
  const [exemploGerado, setExemploGerado] = useState(null);

  useEffect(() => {
    if (chatFimRef.current) chatFimRef.current.scrollIntoView({ behavior: "smooth" });
  }, [mensagensChat]);

  const nivelAluno = student.nivel || "Beginner";
  const studentId = student.id; // usado no log de IA

  // Converte "Unit 5A" → "5A" ou "Practical English 2" → "PE2"
  const labelParaCodigo = (label) => {
    if (!label) return null;
    if (label.startsWith("Practical English ")) return "PE" + label.slice(18).trim();
    if (label.startsWith("Unit ")) return label.slice(5).trim();
    return label; // já é código
  };
  const unidadeAluno = labelParaCodigo(turma && turma.unidade_atual) || labelParaCodigo(student.unidade_atual) || null;
  const temUnidadeDefinida = !!unidadeAluno;

  // Unidades ANTERIORES à atual (não inclui a atual)
  const unidadesAnteriores = (() => {
    const nivel = SYLLABUS[nivelAluno] ? nivelAluno : "Beginner";
    const todas = SYLLABUS[nivel].map(u => u.id);
    if (!unidadeAluno) return [];
    const idx = todas.indexOf(unidadeAluno);
    return idx > 0 ? todas.slice(0, idx) : [];
  })();

  // Unidades estudadas = anteriores + atual
  const unidadesEstudadas = unidadeAluno ? [...unidadesAnteriores, unidadeAluno] : [];

  // Helper — extrai conteúdo gramatical e vocabulário do SYLLABUS
  const getSyllabusInfo = (u) => {
    const info = (SYLLABUS[nivelAluno] || []).find(x => x.id === u);
    if (!info) return `Unit ${u}`;
    return `Unit ${u} — Student can-do objectives (derive the grammar structures and vocabulary from these):\n${info.items.map(item => `- ${item}`).join("\n")}`;
  };

  // Helper — múltiplas unidades
  const getSyllabusInfoMulti = (unidades) => {
    return unidades.map(u => {
      const info = (SYLLABUS[nivelAluno] || []).find(x => x.id === u);
      if (!info) return `Unit ${u}`;
      return `Unit ${u}:\n${info.items.map(item => `- ${item}`).join("\n")}`;
    }).join("\n\n");
  };

  // Chamada ao proxy seguro
  const chamarIA = async (systemPrompt, messages, maxTokens = 800) => {
    const { data: sessionData } = await supabase.auth.getSession();
    const token = sessionData?.session?.access_token;
    if (!token) throw new Error("Sessão expirada. Faça login novamente.");
    const resp = await fetch(ANTHROPIC_PROXY, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: maxTokens,
        system: systemPrompt,
        messages,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `Erro ${resp.status} na API`);
    }
    const data = await resp.json();
    if (!data.content || !data.content[0] || !data.content[0].text) {
      throw new Error("Resposta inesperada da IA. Tente novamente.");
    }
    return data.content[0].text;
  };

  // ── GERADOR DE EXERCÍCIOS ──
  const contextoExercicios = () => {
    if (exConfig.modo === "unidade_atual" && unidadeAluno) return `Current unit: ${getSyllabusInfo(unidadeAluno)}`;
    if (exConfig.modo === "unidade_especifica") return `Specific unit: ${getSyllabusInfo(exConfig.unidade)}`;
    if (exConfig.modo === "mesclar") return `Review of previous units:\n${getSyllabusInfoMulti(unidadesAnteriores)}`;
    return exConfig.prompt_livre;
  };

  const gerarExercicios = async () => {
    setCarregandoIA(true);
    setExerciciosGerados(null);
    setRespostasEx({});
    setGabarito(false);
    try {
      const ctx = contextoExercicios();
      const system = `You are an ESL teacher creating multiple choice exercises for a ${nivelAluno} level adult Brazilian student.

Level: ${nivelAluno}
Content: ${ctx}

The objectives may be in Portuguese — derive the English grammar and vocabulary from them.

RULES:
1. Every sentence must be 100% grammatically and pragmatically correct. Use natural English a native speaker would say.
2. Use ONLY vocabulary and grammar from the content above. Do not introduce new structures.
3. Short, simple sentences appropriate for ${nivelAluno} level (max 8 words per sentence).
4. Each question must have exactly one correct answer and three plausible but clearly wrong distractors.
5. Explanation must be short (1 sentence), clear, in English.

Create exactly 8 multiple choice questions.
JSON only, no markdown, no backticks:
{"titulo":"...","exercicios":[{"tipo":"multiple_choice","pergunta":"...","opcoes":["a) ...","b) ...","c) ...","d) ..."],"resposta":"a","explicacao":"..."}]}`;
      const prompt = exConfig.modo === "prompt_livre"
        ? `Create 8 multiple choice questions about: ${exConfig.prompt_livre}. Level: ${nivelAluno}.`
        : `Create 8 multiple choice questions based on: ${ctx}. Level: ${nivelAluno}.`;
      const resposta = await chamarIA(system, [{ role: "user", content: prompt }], 1200);
      const dados = JSON.parse(resposta.replace(/```json|```/g, "").trim());
      setExerciciosGerados(dados);
    } catch (e) { alert("Erro ao gerar exercícios: " + e.message); }
    setCarregandoIA(false);
  };

  // ── ESCRITA — gera tarefa ──
  const contextoEscrita = () => {
    if (escritaConfig.modo === "unidade_atual" && unidadeAluno) return `Current unit: ${getSyllabusInfo(unidadeAluno)}`;
    if (escritaConfig.modo === "unidade_especifica") return `Specific unit: ${getSyllabusInfo(escritaConfig.unidade)}`;
    if (escritaConfig.modo === "mesclar") return `Review of previous units:\n${getSyllabusInfoMulti(unidadesAnteriores)}`;
    return escritaConfig.tema_livre;
  };

  const gerarTarefaEscrita = async () => {
    setCarregandoIA(true);
    setEscritaTarefa(null);
    setCorrecaoEscrita(null);
    setTextoEscrita("");
    try {
      const ctx = contextoEscrita();
      const system = `You are an expert ESL teacher trained in Oxford/Cambridge methodology, creating a writing task for a ${nivelAluno} level adult Brazilian student.

STUDENT CONTEXT:
Level: ${nivelAluno}
${ctx}

HOW TO READ THE OBJECTIVES:
The objectives above are in Portuguese. Derive the grammar structures, vocabulary and sentence patterns from them.
Examples: "Falar sobre família" → family vocabulary (mother, father, sister), possessives (my, his, her), simple sentences about family.

RULES — in order of priority:

1. ZERO ERRORS: Every sentence in the task, model, tips and keywords must be 100% correct. No grammatical, pragmatic or vocabulary errors. If in doubt, rephrase.

2. UNIT CONTENT FIRST: The writing task must practice exactly the grammar structures and vocabulary from the unit objectives above. The model paragraph must use ONLY structures the student has studied. Keywords must come from the unit content.

3. PRAGMATIC ACCURACY: Use natural English a native speaker would write.
   NEVER use "I want..." for requests (use "Can I have..." / "I'd like..."). NEVER use "I have X years" for age (use "I am X years old").

4. STYLE: Oxford/Cambridge writing task style — clear context, real-life purpose, communicative. Each generation must be DIFFERENT.

For ${nivelAluno}: task achievable in 3-5 very simple sentences.

JSON only, no markdown:
{"titulo":"Task title","tarefa":"Clear instruction about what to write","modelo":"Model paragraph (3-5 simple sentences) using only known grammar/vocabulary","dicas":["Use [grammar structure]","Include [vocabulary]","Remember [grammar rule]"],"palavras_chave":["word1","word2","word3","word4","word5"]}`;
      const resposta = await chamarIA(system, [{ role: "user", content: `Create a unique, practical writing task. Context: ${ctx}. Focus on grammar and vocabulary, not on the unit title.` }], 700);
      const dados = JSON.parse(resposta.replace(/```json|```/g, "").trim());
      setEscritaTarefa(dados);
    } catch (e) { alert("Erro ao gerar tarefa: " + e.message); }
    setCarregandoIA(false);
  };

  const corrigirEscrita = async () => {
    if (!textoEscrita.trim()) return;
    setCarregandoIA(true);
    setCorrecaoEscrita(null);
    try {
      const system = `You are an expert ESL teacher trained in Oxford/Cambridge methodology, correcting a ${nivelAluno} level adult student's writing.
The writing task was: "${escritaTarefa?.tarefa || "Free writing"}"
Be encouraging and clear. Respond ONLY with valid JSON, no markdown:
{
  "avaliacao": "Great job! / Good effort! / Keep practicing!",
  "nota": "A / B / C (based on effort and accuracy)",
  "erros": [{"original": "...", "correto": "...", "explicacao": "..."}],
  "versao_corrigida": "The full corrected text",
  "elogio": "One specific thing they did well",
  "proximos_passos": "One suggestion to improve"
}
If no errors, return empty array. Keep explanations simple for ${nivelAluno} level.
IMPORTANT: Your corrected version must be both grammatically and pragmatically accurate. Fix not only grammar errors but also unnatural expressions — e.g., correct "I want a coffee" to "Can I have a coffee?" in ordering contexts, or "I have 25 years" to "I am 25 years old".`;
      const resposta = await chamarIA(system, [{ role: "user", content: `Student wrote: "${textoEscrita}"` }], 800);
      setCorrecaoEscrita(JSON.parse(resposta.replace(/```json|```/g, "").trim()));
    } catch (e) { alert("Erro ao corrigir: " + e.message); }
    setCarregandoIA(false);
  };

  // ── CHATBOT ──
  const contextoChat = () => {
    if (chatConfig.modo === "unidade_atual" && unidadeAluno) return `Current unit: ${getSyllabusInfo(unidadeAluno)}`;
    if (chatConfig.modo === "unidade_especifica") return `Specific unit: ${getSyllabusInfo(chatConfig.unidade)}`;
    if (chatConfig.modo === "mesclar") return `Review of previous units:\n${getSyllabusInfoMulti(unidadesAnteriores)}`;
    return chatConfig.tema_livre;
  };

  const iniciarChat = async () => {
    setChatIniciado(true);
    setMensagensChat([]);
    setFeedbackChat(null);
    setCarregandoIA(true);
    try {
      const ctx = contextoChat();
      const system = `You are an expert ESL teacher trained in Oxford/Cambridge communicative approach, acting as a conversation partner for a ${nivelAluno} level adult Brazilian student.

STUDENT CONTEXT:
Level: ${nivelAluno}
${ctx}

HOW TO READ: The objectives are in Portuguese. Derive the grammar and vocabulary from them.
Example: "Apresentar-se" → use greetings, introductions, verb to be. "Falar sobre família" → use family words, possessives.

RULES — in order of priority:

1. ZERO ERRORS: YOUR responses must be 100% correct — grammatically and pragmatically. You are the model. Never produce a sentence with any error.

2. UNIT CONTENT FIRST: Use ONLY grammar structures and vocabulary from the unit objectives above. Your questions and responses must practice exactly what the student is learning.

3. PRAGMATIC ACCURACY: Use natural English. Never say "I want" for requests, "I have X years" for age, etc.

4. CONVERSATION STYLE:
- For ${nivelAluno}: very short sentences (max 6-8 words)
- DO NOT correct student mistakes during conversation — let them pass
- Keep responses to 2 sentences max. Be warm and encouraging.
- If student writes in Portuguese: "Try in English! You can say: [hint]"
- Ask follow-up questions using the unit vocabulary`;
      const abertura = await chamarIA(system, [{ role: "user", content: "Start with a warm 1-sentence greeting and one simple question related to the unit topic." }], 120);

  // ── EXEMPLOS ──
  if (secao === "exemplos") return (
    <div>
      {headerSecao("Ver exemplos", "💡")}
      <p style={{ fontSize: "13px", color: textSecondary, marginBottom: "14px" }}>Digite uma palavra ou expressão em inglês e veja 3 exemplos de uso.</p>
      <div style={{ display: "flex", gap: "8px", marginBottom: "16px" }}>

      {exemploGerado && (
        <div>
          <div style={{ ...cardIA, borderLeft: `4px solid ${palette.orange}` }}>

              <p style={{ fontSize: "18px", fontWeight: 700, color: dark ? "#FFF" : palette.purple, margin: 0 }}>{exemploGerado.palavra}</p>

              </div>
