function PortalLogin({ onLogin }) {
  const [role, setRole] = useState("aluno");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");
  const [modoRecuperar, setModoRecuperar] = useState(false);
  const [mensagemRecuperar, setMensagemRecuperar] = useState("");
  const isAdmin = role === "admin";

  const entrar = async () => {
    setErro("");
    if (!email || !senha) {
      setErro("Preencha e-mail e senha.");
      return;
    }
    setCarregando(true);
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
    setCarregando(false);
    if (error) {
      setErro("E-mail ou senha incorretos.");
      return;
    }
    onLogin(role, data.user);
  };

  const recuperarSenha = async () => {
    setMensagemRecuperar("");
    if (!email) {
      setMensagemRecuperar("Digite seu e-mail no campo acima primeiro.");
      return;
    }
    setCarregando(true);
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    setCarregando(false);
    setMensagemRecuperar(error ? "Erro ao enviar. Confira o e-mail e tente de novo." : "Se esse e-mail estiver cadastrado, enviamos um link de recuperação.");
  };

    <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" }}>

              </h1>

              <svg width="180" height="14" viewBox="0 0 180 14" style={{ display: "block", margin: "6px auto 0" }}>

              </svg>
            </div>
          )}
        </div>
        <div style={{ padding: "28px 32px 32px" }}>
          {!modoRecuperar && (
            <div style={{ display: "flex", background: palette.cream, borderRadius: "12px", padding: "4px", marginBottom: "24px" }}>
              <button onClick={() => setRole("aluno")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: "6px", padding: "10px 12px", borderRadius: "9px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "14px", background: role === "aluno" ? palette.orange : "transparent", color: role === "aluno" ? "#FFF" : palette.purple }}>

  if (!iso) return "";
  const [ano, mes, dia] = iso.split("-");
  return `${dia}/${mes}/${ano}`;

// Retorna a sequência real do currículo lendo do SYLLABUS (fonte única de verdade)
function gerarSequenciaCurriculo(nivel) {
  const nivelValido = SYLLABUS[nivel] ? nivel : "Beginner";
  return SYLLABUS[nivelValido].map((u) => u.id);
}

function rotuloUnidade(codigo) {
  if (!codigo) return "";
  return codigo.startsWith("PE") ? `Practical English ${codigo.slice(2)}` : `Unit ${codigo}`;
}

// Busca o título oficial e os can-do statements de uma unidade no currículo (English File)
function obterTopico(nivel, codigo) {
  const nivelValido = SYLLABUS[nivel] ? nivel : "Beginner";
  const unidade = SYLLABUS[nivelValido].find((u) => u.id === codigo);
  return unidade || null;
}

const homeworkLinks = [

function PlanejadorSemanalEnxuto({ students, onSelectStudent }) {
  const { useEffect } = React;
  const DIAS_LABELS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  const DIAS_NOMES = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

  // Estado: data de referência da semana (o Domingo dessa semana). Muda com ‹ ›
  const [inicioSemana, setInicioSemana] = useState(() => {
    const hoje = new Date();
    const domingo = new Date(hoje);
    domingo.setDate(hoje.getDate() - hoje.getDay());
    domingo.setHours(0, 0, 0, 0);
    return domingo;
  });
  const [lessonsDaSemana, setLessonsDaSemana] = useState([]);
  const [diasSemAula, setDiasSemAula] = useState({});
  const [ultimoPlanoPorTurma, setUltimoPlanoPorTurma] = useState({}); // { turma_id: "para_proxima_aula do último registro" }
  const [carregando, setCarregando] = useState(true);

  // Calcula as datas da semana (Dom -> Sáb)
  const datasSemana = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(inicioSemana);
    d.setDate(inicioSemana.getDate() + i);
    return d;
  });
  const isoDe = (data) => {
    const y = data.getFullYear();
    const m = String(data.getMonth() + 1).padStart(2, "0");
    const d = String(data.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  };
  const fimSemana = new Date(inicioSemana);
  fimSemana.setDate(inicioSemana.getDate() + 6);

  // Agrupa alunos por turma
  const turmasMap = new Map();
  students.forEach((s) => {
    if (!s.turma_id) return;
    if (!turmasMap.has(s.turma_id)) turmasMap.set(s.turma_id, []);
    turmasMap.get(s.turma_id).push(s);
  });
  const turmas = Array.from(turmasMap.values()).map((alunos) => {
    const ordenados = [...alunos].sort((a, b) => a.nome.localeCompare(b.nome));
    return {
      turma_id: ordenados[0].turma_id,
      representante: ordenados[0],
      nomes: ordenados.map((a) => a.nome).join(" + "),
      nivel: ordenados[0].nivel,
      unidadeAtual: (ordenados[0].turmas && ordenados[0].turmas.unidade_atual) || null,
      diasHorarios: (ordenados[0].turmas && ordenados[0].turmas.dias_horarios) || [],
      dataFim: (ordenados[0].turmas && ordenados[0].turmas.data_fim) || null,
    };
  });

  useEffect(() => {
    async function carregar() {
      setCarregando(true);
      const inicio = isoDe(inicioSemana);
      const fim = isoDe(fimSemana);
      const turmaIds = turmas.map((t) => t.turma_id);
      // Puxa lessons da semana + dias sem aula + último "para próxima aula" por turma
      const [lessonsRes, diasRes, recordsRes] = await Promise.all([
        supabase.from("lessons").select("*").gte("data", inicio).lte("data", fim),
        supabase.from("dias_sem_aula").select("*").gte("data", inicio).lte("data", fim),
        turmaIds.length > 0
          ? supabase.from("lesson_records").select("turma_id, data, para_proxima_aula").in("turma_id", turmaIds).order("data", { ascending: false })
          : Promise.resolve({ data: [] }),
      ]);
      setLessonsDaSemana(lessonsRes.data || []);
      const diasObj = {};
      (diasRes.data || []).forEach((d) => { diasObj[d.data] = d.motivo || "Sem aula"; });
      setDiasSemAula(diasObj);
      // Pega o mais recente "para_proxima_aula" por turma (records vem ordenado por data desc)
      const ultimoObj = {};
      (recordsRes.data || []).forEach((r) => {
        if (!ultimoObj[r.turma_id] && r.para_proxima_aula) ultimoObj[r.turma_id] = r.para_proxima_aula;
      });
      setUltimoPlanoPorTurma(ultimoObj);
      setCarregando(false);
    }
    carregar();
  }, [inicioSemana.getTime(), students.length]);

  const irSemanaAnterior = () => {
    const nova = new Date(inicioSemana);
    nova.setDate(inicioSemana.getDate() - 7);
    setInicioSemana(nova);
  };
  const irProximaSemana = () => {
    const nova = new Date(inicioSemana);
    nova.setDate(inicioSemana.getDate() + 7);
    setInicioSemana(nova);
  };
  const irEstaSemana = () => {
    const hoje = new Date();
    const domingo = new Date(hoje);
    domingo.setDate(hoje.getDate() - hoje.getDay());
    domingo.setHours(0, 0, 0, 0);
    setInicioSemana(domingo);
  };

  // Movidas: aulas que TINHAM data original nessa semana mas foram remarcadas
  const movidasSet = new Set(); // "turma_id|dataOriginal"
  lessonsDaSemana.forEach((l) => {
    if (l.data_original) movidasSet.add(`${l.turma_id}|${l.data_original}`);
  });

  // Constrói lista de aulas por dia
  const aulasPorDia = datasSemana.map((data) => {
    const dataISO = isoDe(data);
    const diaSemanaNome = DIAS_NOMES[data.getDay()];
    const feriado = diasSemAula[dataISO];
    const aulas = [];
    if (!feriado) {
      // Aulas regulares (do dias_horarios) que NÃO foram movidas
      turmas.forEach((t) => {
        // Turma encerrada — não gera aulas depois da data_fim
        if (t.dataFim && dataISO > t.dataFim) return;
        (t.diasHorarios || []).forEach((dh) => {
          if (dh.dia !== diaSemanaNome) return;
          if (movidasSet.has(`${t.turma_id}|${dataISO}`)) return;
          const lesson = lessonsDaSemana.find((l) => l.turma_id === t.turma_id && l.data === dataISO);
          // Aula excluída explicitamente do calendário → não aparece no painel
          if (lesson && lesson.status === "cancelada") return;
          aulas.push({
            turma_id: t.turma_id,
            representante: t.representante,
            nomes: t.nomes,
            nivel: t.nivel,
            unidade: t.unidadeAtual,
            horario: dh.horario,
            status: lesson ? lesson.status : "agendada",
            vindaDe: null,
          });
        });
      });
      // Aulas que foram REMARCADAS pra esse dia (data_original diferente)
      lessonsDaSemana.forEach((lesson) => {
        if (lesson.data !== dataISO || !lesson.data_original || lesson.data_original === dataISO) return;
        if (lesson.status === "cancelada") return;
        const alunosTurma = turmasMap.get(lesson.turma_id);
        if (!alunosTurma) return;
        const ordenados = [...alunosTurma].sort((a, b) => a.nome.localeCompare(b.nome));
        const t = turmas.find((x) => x.turma_id === lesson.turma_id);
        if (!t) return;
        // Evita duplicar
        const jaListado = aulas.some((a) => a.turma_id === lesson.turma_id && a.horario === (lesson.horario || ""));

        const dataOrig = new Date(lesson.data_original + "T00:00:00");
        aulas.push({
          turma_id: lesson.turma_id,
          representante: t.representante,
          nomes: t.nomes,
          nivel: t.nivel,
          unidade: t.unidadeAtual,
          horario: lesson.horario || "—",
          status: lesson.status,
          vindaDe: `${dataOrig.getDate()}/${dataOrig.getMonth() + 1}`,
        });
      });
      aulas.sort((a, b) => (a.horario || "").localeCompare(b.horario || ""));
    }
    return { data, dataISO, feriado, aulas };
  });

  const totalAulas = aulasPorDia.reduce((s, d) => s + d.aulas.length, 0);
  const rotuloSemana = `${inicioSemana.getDate()}/${inicioSemana.getMonth() + 1} – ${fimSemana.getDate()}/${fimSemana.getMonth() + 1}/${fimSemana.getFullYear()}`;
  const hojeISO = isoDe(new Date());

  const corDoStatus = (status) => {
    if (status === "realizada") return { bg: palette.lightGreen, fg: palette.green, label: "✓" };
    if (status === "aRepor") return { bg: "#FFDDB5", fg: palette.orange, label: "A repor" };
    if (status === "perdida") return { bg: "#F7C1C1", fg: "#791F1F", label: "Perdida" };
    if (status === "reposicaoAgendada") return { bg: palette.lavender, fg: palette.purple, label: "Repos." };
    return null; // agendada = sem badge
  };

  return (
    <div>
      <div style={{ background: "#FFF", borderRadius: "16px", padding: "18px 20px", marginBottom: "16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "12px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
          <button onClick={irSemanaAnterior} style={{ border: "none", background: palette.cream, cursor: "pointer", color: palette.purple, fontSize: "18px", padding: "6px 12px", borderRadius: "8px" }}>‹</button>
          <p style={{ margin: 0, fontSize: "15px", fontWeight: 600, color: palette.purple }}>{rotuloSemana}</p>
          <button onClick={irProximaSemana} style={{ border: "none", background: palette.cream, cursor: "pointer", color: palette.purple, fontSize: "18px", padding: "6px 12px", borderRadius: "8px" }}>›</button>
          <button onClick={irEstaSemana} style={{ border: `1px solid ${palette.lavender}55`, background: "#FFF", cursor: "pointer", color: palette.purple, fontSize: "12px", fontWeight: 600, padding: "6px 12px", borderRadius: "8px" }}>Esta semana</button>
        </div>
        <p style={{ margin: 0, fontSize: "12px", color: `${palette.purple}99` }}>
          {totalAulas} {totalAulas === 1 ? "aula" : "aulas"} na semana
        </p>
      </div>

      {carregando && <p style={{ fontSize: "13px", color: `${palette.purple}99`, padding: "20px" }}>Carregando semana...</p>}

      {!carregando && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: "10px" }}>
          {aulasPorDia.map(({ data, dataISO, feriado, aulas }, i) => {
            const isHoje = dataISO === hojeISO;
            return (
              <div key={i} style={{ display: "flex", flexDirection: "column", gap: "8px", minWidth: 0 }}>
                <div style={{ padding: "8px 12px", borderRadius: "10px 10px 0 0", background: isHoje ? palette.orange : (feriado ? "#F7C1C1" : "#FFF"), color: isHoje ? "#FFF" : (feriado ? "#791F1F" : palette.purple), textAlign: "center" }}>
                  <p style={{ margin: 0, fontSize: "11px", fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase" }}>
                    {DIAS_LABELS[i]} · {data.getDate()}/{data.getMonth() + 1}
                  </p>
                </div>
                <div style={{ background: "#FFF", borderRadius: "0 0 10px 10px", padding: "8px", flex: 1, display: "flex", flexDirection: "column", gap: "8px", minHeight: "80px" }}>
                  {feriado && (
                    <div style={{ padding: "10px 8px", textAlign: "center", background: "#FCF0F0", borderRadius: "8px", border: "1px dashed #F7C1C1" }}>
                      <p style={{ margin: 0, fontSize: "11px", fontWeight: 700, color: "#791F1F", textTransform: "uppercase" }}>Feriado</p>
                      <p style={{ margin: "4px 0 0 0", fontSize: "11px", color: "#791F1F" }}>{feriado}</p>
                    </div>
                  )}
                  {!feriado && aulas.length === 0 && (
                    <p style={{ margin: "10px 6px", fontSize: "11px", color: `${palette.purple}66`, fontStyle: "italic" }}>Sem aulas</p>
                  )}
                  {!feriado && aulas.map((a, j) => {
                    const cor = corDoStatus(a.status);
                    return (
                      <button key={j} onClick={() => onSelectStudent(a.representante)}
                        style={{ padding: "10px", borderRadius: "8px", background: palette.cream, border: "none", cursor: "pointer", textAlign: "left", fontFamily: "'Poppins', sans-serif", display: "block" }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "4px", gap: "4px" }}>
                          <span style={{ fontSize: "10px", fontWeight: 700, padding: "2px 6px", borderRadius: "8px", background: "#FFF", color: palette.purple }}>{a.horario}</span>
                          {cor && (
                            <span style={{ fontSize: "9px", fontWeight: 700, padding: "2px 6px", borderRadius: "8px", background: cor.bg, color: cor.fg }}>
                              {cor.label}
                            </span>
                          )}
                        </div>
                        <p style={{ margin: 0, fontSize: "12px", fontWeight: 600, color: palette.purple, lineHeight: 1.3, wordBreak: "break-word" }}>{a.nomes}</p>
                        <p style={{ margin: "2px 0 0 0", fontSize: "10px", color: `${palette.purple}99` }}>
                          {a.nivel}{a.unidade ? ` · ${a.unidade}` : ""}
                        </p>
                        {a.vindaDe && (
                          <p style={{ margin: "4px 0 0 0", fontSize: "10px", color: palette.orange, fontWeight: 500 }}>🔁 vinda de {a.vindaDe}</p>
                        )}
                        {ultimoPlanoPorTurma[a.turma_id] && a.status !== "realizada" && (
                          <div style={{ marginTop: "6px", paddingTop: "6px", borderTop: `1px dashed ${palette.lavender}88` }}>
                            <p style={{ margin: 0, fontSize: "9px", fontWeight: 700, color: palette.orange, letterSpacing: "0.05em", textTransform: "uppercase" }}>Plano:</p>
                            <p style={{ margin: "2px 0 0 0", fontSize: "10px", color: palette.purple, lineHeight: 1.3, wordBreak: "break-word" }}>
                              {ultimoPlanoPorTurma[a.turma_id]}
                            </p>
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------- CERTIFICADO ADMIN ----------
function CertificadoAdmin({ students }) {
  const { useState, useEffect, useRef } = React;
  const canvasRef = useRef(null);
  const logoRef = useRef(null);
  const today = new Date().toISOString().split("T")[0];
  const [template, setTemplate] = useState(0);
  const [form, setForm] = useState({ nome: "", nivel: "", data: today, professor: "Teacher Mari" });
  const [manualNome, setManualNome] = useState("");

  const LOGO_URL = "https://raw.githubusercontent.com/cruzmarianagama-ux/logos/main/1%20(3).png";

  const TEMPLATES = [
    { id: 0, label: "Prestige",       emoji: "🏅" },
    { id: 1, label: "Cream & Purple", emoji: "✨" },
    { id: 2, label: "Classic",        emoji: "🏛️" },
    { id: 3, label: "Forest",         emoji: "🌿" },
    { id: 4, label: "Blush",          emoji: "🎀" },
  ];

  useEffect(() => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => { logoRef.current = img; draw(); };
    img.onerror = () => { logoRef.current = null; draw(); };
    img.src = LOGO_URL;
  }, []);

  useEffect(() => { draw(); }, [form, template, manualNome]);

  function formatDate(dateStr) {
    if (!dateStr) return "";
    const [y, m, d] = dateStr.split("-");
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return months[parseInt(m)-1] + " " + parseInt(d) + ", " + y;
  }

  function resolvedName() {
    return form.nome === "__manual" ? (manualNome || "[Student Name]") : (form.nome || "[Student Name]");
  }

  function drawLogoAt(ctx, x, y, size) {
    if (logoRef.current) ctx.drawImage(logoRef.current, x - size/2, y, size, size);
  }

  // Wrap + draw centered text, returns final Y
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    let currentY = y;
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i] + " ";
      if (ctx.measureText(test).width > maxWidth && i > 0) {
        ctx.fillText(line.trim(), x, currentY);
        line = words[i] + " ";
        currentY += lineHeight;
      } else {
        line = test;
      }
    }
    ctx.fillText(line.trim(), x, currentY);
    return currentY;
  }

  // Shared body text block — large, dark, readable
  function bodyText(ctx, W, nivel, startY, mainColor, italicColor, maxW) {
    const course = nivel || "[Level]";
    ctx.textAlign = "center";

    // "for successfully completing..."
    ctx.fillStyle = mainColor;
    ctx.font = "400 26px Poppins, sans-serif";
    const line1 = "for successfully completing the " + course + " at Teacher Mari Lessons.";
    let y = wrapText(ctx, line1, W/2, startY, maxW, 40);
    y += 52;

    // Paragraph
    ctx.fillStyle = italicColor;
    ctx.font = "italic 24px Georgia, serif";
    const para = "Your dedication has strengthened your English skills and brought you one step closer to communicating with confidence and fluency. We are proud of your progress and excited to see where your English journey takes you next.";
    y = wrapText(ctx, para, W/2, y, maxW, 38);
    y += 52;

    // Congratulations
    ctx.fillStyle = mainColor;
    ctx.font = "700 26px Poppins, sans-serif";
    ctx.fillText("Congratulations!", W/2, y);
    return y;
  }

  function sigBlock(ctx, W, y, professor, lineColor, nameColor) {
    ctx.strokeStyle = lineColor; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(W/2-140, y); ctx.lineTo(W/2+140, y); ctx.stroke();
    ctx.fillStyle = nameColor;
    ctx.font = "italic bold 26px Georgia, serif";
    ctx.textAlign = "center";
    ctx.fillText(professor || "Teacher Mari", W/2, y + 36);
    ctx.fillStyle = "#999";
    ctx.font = "400 18px Poppins, sans-serif";
    ctx.fillText("English Teacher · Teacher Mari Lessons", W/2, y + 62);
  }

  // Shared card layout — used by all 5 templates
  function drawCard(ctx, W, H, f, bgOuter, bgCard, topBar, accentColor, titleColor, nameColor, mainText, italicText, starColor) {
    ctx.fillStyle = bgOuter; ctx.fillRect(0,0,W,H);
    const pad = 24;
    ctx.fillStyle = bgCard; ctx.fillRect(pad,pad,W-pad*2,H-pad*2);
    ctx.fillStyle = topBar; ctx.fillRect(pad,pad,W-pad*2,12);
    ctx.fillStyle = bgOuter; ctx.fillRect(pad,H-pad-12,W-pad*2,12);
    ctx.strokeStyle = accentColor + "33"; ctx.lineWidth = 1;
    ctx.strokeRect(36,44,W-72,H-88);
    ctx.fillStyle = bgOuter + "0D";
    ctx.beginPath(); ctx.arc(W-80,80,180,0,Math.PI*2); ctx.fill();

    // Logo
    drawLogoAt(ctx, W/2, 52, 115);

    // Title
    ctx.fillStyle = titleColor;
    ctx.font = "700 20px Poppins, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CERTIFICATE OF COMPLETION", W/2, 204);

    // Double rule
    ctx.strokeStyle = accentColor; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W/2-220,216); ctx.lineTo(W/2+220,216); ctx.stroke();
    ctx.strokeStyle = accentColor + "44"; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(W/2-220,221); ctx.lineTo(W/2+220,221); ctx.stroke();

    // Awarded to
    ctx.fillStyle = "#777";
    ctx.font = "italic 22px Georgia, serif";
    ctx.fillText("This certificate is awarded to", W/2, 262);

    // Name
    const nome = f.nome;
    ctx.fillStyle = nameColor;
    ctx.font = "italic 60px Georgia, serif";
    ctx.fillText(nome, W/2, 342);
    const nw = ctx.measureText(nome).width;
    ctx.strokeStyle = accentColor; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W/2-Math.min(nw/2,380),356); ctx.lineTo(W/2+Math.min(nw/2,380),356); ctx.stroke();

    // Body
    const lastY = bodyText(ctx, W, f.nivel, 410, mainText, italicText, 860);

    // Date
    ctx.fillStyle = "#aaa"; ctx.font = "400 18px Poppins, sans-serif";
    ctx.fillText(formatDate(f.data), W/2, lastY + 64);

    // Sig (no stars)
    sigBlock(ctx, W, lastY + 108, f.professor, accentColor, titleColor);
  }

  function draw() {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const W = 1400, H = 1100;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,W,H);
    const f = { ...form, nome: resolvedName() };

    if (template === 0) {
      // Prestige: dark green outer, cream card, orange topbar
      drawCard(ctx,W,H,f, "#04392F","#FAEAD3","#FF5C23","#FF5C23","#04392F","#04392F","#1a1a1a","#2a2a2a","#FF5C23");
    } else if (template === 1) {
      // Cream & Purple: dark purple outer, cream card, orange topbar
      drawCard(ctx,W,H,f, "#1D1050","#FAEAD3","#FF5C23","#FF5C23","#1D1050","#1D1050","#1a1a1a","#2a2a2a","#B4A1FF");
    } else if (template === 2) {
      // Classic: cream outer, white card, dark green topbar + accents
      drawCard(ctx,W,H,f, "#04392F","#FAEAD3","#04392F","#04392F","#04392F","#04392F","#1a1a1a","#2a2a2a","#CAE78D");
    } else if (template === 3) {
      // Forest: dark green outer, white card, lime topbar
      drawCard(ctx,W,H,f, "#04392F","#FFFFFF","#CAE78D","#04392F","#04392F","#04392F","#1a1a1a","#2a2a2a","#CAE78D");
    } else {
      // Blush: lavender outer, cream card, orange topbar
      drawCard(ctx,W,H,f, "#B4A1FF","#FAEAD3","#FF5C23","#B4A1FF","#1D1050","#1D1050","#1a1a1a","#2a2a2a","#FF5C23");
    }
  }

  function downloadCert() {
    draw();
    const canvas = canvasRef.current;
    const link = document.createElement("a");
    const nome = resolvedName().replace(/\s+/g,"-").toLowerCase();
    link.download = "certificate-" + nome + "-" + TEMPLATES[template].label.toLowerCase().replace(/[\s&]+/g,"-") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  function setField(k, v) { setForm(f => ({...f, [k]: v})); }

  const iS = { width:"100%", boxSizing:"border-box", padding:"8px 10px", borderRadius:"8px", border:"1px solid " + palette.lavender, fontFamily:"Poppins,sans-serif", fontSize:"13px", color:palette.purple, background:"#fff" };
  const lS = { fontSize:"12px", color:palette.purple + "99", display:"block", marginBottom:"4px", fontWeight:600 };

  return React.createElement("div", { style:{ background:"#FFF", borderRadius:"16px", padding:"24px" } },
    React.createElement("p", { style:{ fontSize:"14px", fontWeight:700, color:palette.purple, marginBottom:"4px" } }, "Certificate Generator"),
    React.createElement("p", { style:{ fontSize:"12px", color:palette.purple+"99", marginBottom:"20px" } }, "Fill in the details, pick a template, and download the PNG to send on WhatsApp! 🎉"),
    React.createElement("p", { style:lS }, "Template"),
    React.createElement("div", { style:{ display:"flex", gap:"8px", marginBottom:"20px", flexWrap:"wrap" } },
      TEMPLATES.map(t => React.createElement("button", {
        key: t.id, onClick: () => setTemplate(t.id),
        style:{ padding:"8px 14px", borderRadius:"10px", border:"2px solid "+(template===t.id?palette.orange:palette.lavender), background:template===t.id?palette.orange:"#fff", color:template===t.id?"#fff":palette.purple, fontFamily:"Poppins,sans-serif", fontSize:"12px", fontWeight:600, cursor:"pointer" }
      }, t.emoji+" "+t.label))
    ),
    React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginBottom:"12px" } },
      React.createElement("div", null,
        React.createElement("label", { style:lS }, "Student name"),
        React.createElement("select", { style:iS, value:form.nome, onChange:e=>setField("nome",e.target.value) },
          React.createElement("option", { value:"" }, "— select student —"),
          (students||[]).map(s => React.createElement("option", { key:s.id, value:s.nome }, s.nome)),
          React.createElement("option", { value:"__manual" }, "✏️ Type manually")
        ),
        form.nome==="__manual" && React.createElement("input", { style:{...iS,marginTop:"6px"}, placeholder:"Type student name", value:manualNome, onChange:e=>setManualNome(e.target.value) })
      ),
      React.createElement("div", null,
        React.createElement("label", { style:lS }, "Level completed"),
        React.createElement("input", { style:iS, placeholder:"e.g. Beginner — Book 1", value:form.nivel, onChange:e=>setField("nivel",e.target.value) })
      )
    ),
    React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginBottom:"20px" } },
      React.createElement("div", null,
        React.createElement("label", { style:lS }, "Date"),
        React.createElement("input", { type:"date", style:iS, value:form.data, onChange:e=>setField("data",e.target.value) })
      ),
      React.createElement("div", null,
        React.createElement("label", { style:lS }, "Signature name"),
        React.createElement("input", { style:iS, value:form.professor, onChange:e=>setField("professor",e.target.value) })
      )
    ),
    React.createElement("button", { onClick:downloadCert, style:{ background:palette.orange, color:"#fff", border:"none", borderRadius:"10px", padding:"10px 22px", fontFamily:"Poppins,sans-serif", fontWeight:700, fontSize:"14px", cursor:"pointer", marginBottom:"20px" } }, "⬇ Download certificate (PNG)"),
    React.createElement("p", { style:{ fontSize:"11px", color:palette.purple+"88", marginBottom:"8px" } }, "Preview — "+TEMPLATES[template].emoji+" "+TEMPLATES[template].label),
    React.createElement("canvas", { ref:canvasRef, style:{ width:"100%", borderRadius:"12px", border:"1px solid "+palette.lavender+"44", display:"block" } })
  );
}

    const hojeISO = isoDe(hoje);
    const amanhaISO = isoDe(amanha);
    const DIAS_MAP = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
    const diaHoje = DIAS_MAP[hoje.getDay()];
    const diaAmanha = DIAS_MAP[amanha.getDay()];

    // Agrupa turmas -> alunos pra poder juntar nome do aluno em cobranças/reposições
    const alunosPorTurma = new Map();
    (students || []).forEach((s) => {
      if (!s.turma_id) return;
      if (!alunosPorTurma.has(s.turma_id)) alunosPorTurma.set(s.turma_id, []);
      alunosPorTurma.get(s.turma_id).push(s);
    });
    const infoTurma = (turma_id) => {
      const alunos = alunosPorTurma.get(turma_id) || [];
      const ordenados = [...alunos].sort((a, b) => a.nome.localeCompare(b.nome));
      return {
        nomes: ordenados.map((a) => a.nome).join(" + "),
        representante: ordenados[0] || null,
        modalidade: (ordenados[0] && ordenados[0].turmas && ordenados[0].turmas.modalidade) || null,
      };
    };

    // Aulas cadastradas em `lessons` pra hoje e amanhã
    const { data: lessonsData } = await supabase.from("lessons").select("*").in("data", [hojeISO, amanhaISO]);

    // Aulas que TINHAM como data original hoje ou amanhã mas foram MOVIDAS pra outro dia
    // Serve pra saber que o horário regular daquele dia foi remarcado — não conta como "sem entrada"
    const { data: movidasData } = await supabase.from("lessons").select("turma_id, data, data_original, horario").in("data_original", [hojeISO, amanhaISO]);
    const movidasSet = new Set(); // "turma_id|dataOriginal|horarioRegular"
    (movidasData || []).forEach((l) => {
      // Como a lesson pode ter horário customizado, uso o horário original que era esperado
      // Simplificação: uso só turma_id + data_original — se qualquer lesson da turma teve data_original = hoje, aquela aula foi movida
      movidasSet.add(`${l.turma_id}|${l.data_original}`);
    });

    // Cobranças em aberto (não pagas, vencimento no passado) — lista detalhada
    const { data: billingData } = await supabase.from("billing").select("*").neq("status", "pago");
    const cobrAtrasadas = (billingData || [])
      .filter((b) => b.vencimento && b.vencimento < hojeISO)
      .map((b) => {
        const info = infoTurma(b.turma_id);
        const diasAtraso = Math.floor((new Date(hojeISO + "T00:00:00") - new Date(b.vencimento + "T00:00:00")) / 86400000);
        return {
          rowId: b.id,
          turma_id: b.turma_id,
          nomes: info.nomes || "(turma sem alunos)",
          representante: info.representante,
          mes: b.mes,
          valor: `R$ ${Number(b.valor).toFixed(2).replace(".", ",")}`,
          vencimento: new Date(b.vencimento + "T00:00:00").toLocaleDateString("pt-BR"),
          diasAtraso,
        };
      })
      .sort((a, b) => b.diasAtraso - a.diasAtraso);
    setCobrancasAbertoLista(cobrAtrasadas);

    // Reposições pendentes — lista detalhada
    const { data: aRepor } = await supabase.from("lessons").select("*").eq("status", "aRepor");
    const reposicoes = (aRepor || [])
      .map((l) => {
        const info = infoTurma(l.turma_id);
        const diasSemReposicao = Math.floor((new Date(hojeISO + "T00:00:00") - new Date(l.data + "T00:00:00")) / 86400000);
        return {
          rowId: l.id,
          turma_id: l.turma_id,
          nomes: info.nomes || "(turma sem alunos)",
          representante: info.representante,
          dataAula: new Date(l.data + "T00:00:00").toLocaleDateString("pt-BR"),
          prazo_reposicao: l.prazo_reposicao,
          prazoBR: l.prazo_reposicao ? new Date(l.prazo_reposicao + "T00:00:00").toLocaleDateString("pt-BR") : null,
          diasSemReposicao,
        };
      })
      .sort((a, b) => b.diasSemReposicao - a.diasSemReposicao);
    setReposicoesPendentesLista(reposicoes);

    // Agrupa turmas pra gerar as aulas do dia (baseado em dias_horarios da turma)
    const turmasMap = new Map();
    (students || []).forEach((s) => {
      if (!s.turma_id) return;
      if (!turmasMap.has(s.turma_id)) turmasMap.set(s.turma_id, { alunos: [], turma: s.turmas || null });
      turmasMap.get(s.turma_id).alunos.push(s);
    });

    const construirAulas = (diaSemana, dataISO) => {
      const lista = [];
      turmasMap.forEach(({ alunos, turma }, turma_id) => {
        if (!turma || !turma.dias_horarios) return;
        // Turma encerrada — não gera mais aulas esperadas
        if (turma.data_fim && dataISO > turma.data_fim) return;
        turma.dias_horarios.forEach((dh) => {
          if (dh.dia !== diaSemana) return;
          // Pula se essa aula regular foi MOVIDA pra outro dia
          if (movidasSet.has(`${turma_id}|${dataISO}`)) return;
          const lesson = (lessonsData || []).find((l) => l.turma_id === turma_id && l.data === dataISO);
          // Aula excluída explicitamente do calendário → não aparece
          if (lesson && lesson.status === "cancelada") return;
          const status = lesson ? lesson.status : "agendada";
          const nomes = [...alunos].sort((a, b) => a.nome.localeCompare(b.nome)).map((a) => a.nome).join(" + ");
          const representante = [...alunos].sort((a, b) => a.nome.localeCompare(b.nome))[0];
          lista.push({ turma_id, horario: dh.horario, nomes, representante, nivel: representante.nivel, unidade: turma.unidade_atual, status, vindaDe: null });
        });
      });
      // Também mostra aulas que foram REMARCADAS pra este dia (com data_original diferente)
      // Isso pega aulas movidas de outro dia + reposições agendadas — que aparecem em `lessons` com data = hoje
      (lessonsData || []).forEach((lesson) => {
        if (lesson.data !== dataISO || !lesson.data_original || lesson.data_original === dataISO) return;
        if (lesson.status === "cancelada") return;
        // Ver se essa aula já foi contabilizada acima (turma tem horário regular hoje)
        const turmaData = turmasMap.get(lesson.turma_id);
        if (!turmaData) return;
        const alunos = turmaData.alunos;
        const nomes = [...alunos].sort((a, b) => a.nome.localeCompare(b.nome)).map((a) => a.nome).join(" + ");
        const representante = [...alunos].sort((a, b) => a.nome.localeCompare(b.nome))[0];
        // Evita duplicar se essa turma já apareceu (aula movida pra o mesmo horário regular)
        const jaListado = lista.some((a) => a.turma_id === lesson.turma_id && a.horario === lesson.horario);
        if (jaListado) return;
        const dataOrig = new Date(lesson.data_original + "T00:00:00");
        const vindaDe = `${dataOrig.getDate()}/${dataOrig.getMonth() + 1}`;
        lista.push({
          turma_id: lesson.turma_id,
          horario: lesson.horario || "",
          nomes, representante,
          nivel: representante.nivel,
          unidade: (turmaData.turma && turmaData.turma.unidade_atual) || null,
          status: lesson.status,
          vindaDe,
        });
      });
      // Ordena por horário
      return lista.sort((a, b) => (a.horario || "").localeCompare(b.horario || ""));
    };

    setAulasHoje(construirAulas(diaHoje, hojeISO));
    setAulasAmanha(construirAulas(diaAmanha, amanhaISO));
  };

  useEffect(() => { if (students.length > 0) carregarDashboardAdmin(); }, [students, tickRelogio]);

  // Aniversariantes: extrai do students (que já tem nascimento carregado)
  const aniversariantes = (() => {
    const hoje = new Date();
    const hojeM = hoje.getMonth();
    const hojeD = hoje.getDate();
    return (students || [])
      .filter((s) => s.nascimento)
      .map((s) => {
        const partes = s.nascimento.split("-"); // "YYYY-MM-DD"
        const mes = Number(partes[1]) - 1;
        const dia = Number(partes[2]);
        // Calcula quantos dias faltam pro próximo aniversário (a partir de hoje)
        const proximo = new Date(hoje.getFullYear(), mes, dia);
        if (proximo < new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())) {
          proximo.setFullYear(hoje.getFullYear() + 1);
        }
        const diasAte = Math.round((proximo - new Date(hoje.getFullYear(), hojeM, hojeD)) / 86400000);
        const isHoje = mes === hojeM && dia === hojeD;
        return { nome: s.nome, dia, mes, diasAte, isHoje, aluno: s };
      })
      .filter((a) => a.diasAte <= 45) // mostra até ~1.5 mês adiante
      .sort((a, b) => a.diasAte - b.diasAte);
  })();

  const carregarAlunos = async () => {
    setCarregando(true);
    const { data } = await supabase.from("students").select("*, turmas(modalidade, dias_horarios, frequencia, unidade_atual, data_fim)").order("nome");
    setStudents(data || []);
    setCarregando(false);
  };

  useEffect(() => { carregarAlunos(); carregarDiasSemAula(); carregarAvisos(); carregarMateriaisAdmin(); }, []);

  const carregarMateriaisAdmin = async () => {
    const { data } = await supabase.from("materiais").select("*").order("created_at", { ascending: false });
    setMateriaisAdmin(data || []);
  };

  const salvarMaterialAdmin = async () => {
    if (!novoMaterial.titulo || !novoMaterial.url) {
      alert("Preencha pelo menos o título e o link.");
      return;
    }
    if (editandoMaterialId) {
      const { error } = await supabase.from("materiais").update({ titulo: novoMaterial.titulo, descricao: novoMaterial.descricao, url: novoMaterial.url }).eq("id", editandoMaterialId);
      if (error) { alert("Erro ao salvar: " + error.message); return; }
      setMateriaisAdmin((prev) => prev.map((m) => (m.id === editandoMaterialId ? { ...m, ...novoMaterial } : m)));
    } else {
      const { data, error } = await supabase.from("materiais").insert({ titulo: novoMaterial.titulo, descricao: novoMaterial.descricao, url: novoMaterial.url, nivel: nivelSelecionado }).select().single();
      if (error) { alert("Erro ao salvar: " + error.message); return; }
      setMateriaisAdmin((prev) => [data, ...prev]);
    }
    setNovoMaterial({ titulo: "", descricao: "", url: "" });
    setEditandoMaterialId(null);
    setMostrarFormMaterial(false);
  };

  const editarMaterialAdmin = (m) => {
    setNovoMaterial({ titulo: m.titulo, descricao: m.descricao || "", url: m.url });
    setEditandoMaterialId(m.id);
    setMostrarFormMaterial(true);
  };

  const excluirMaterialAdmin = async (id) => {
    const confirmar = window.confirm("Excluir este material? Essa ação não pode ser desfeita.");
    if (!confirmar) return;
    const { error } = await supabase.from("materiais").delete().eq("id", id);
    if (error) { alert("Erro ao excluir: " + error.message); return; }
    setMateriaisAdmin((prev) => prev.filter((m) => m.id !== id));
  };

  const carregarAvisos = async () => {
    const { data } = await supabase
      .from("lessons")
      .select("id, data, status, turma_id, turmas(students(nome))")
      .eq("aviso_pendente", true)
      .order("data");
    setAvisos(data || []);
  };

  const dispensarAviso = async (lessonId) => {
    const { error } = await supabase.from("lessons").update({ aviso_pendente: false }).eq("id", lessonId);
    if (error) { alert("Erro ao dispensar aviso: " + error.message); return; }
    setAvisos((prev) => prev.filter((a) => a.id !== lessonId));
  };

  const carregarDiasSemAula = async () => {
    const { data } = await supabase.from("dias_sem_aula").select("*");
    const obj = {};
    (data || []).forEach((d) => { obj[d.data] = d.motivo || "Sem aula"; });
    setDiasSemAula(obj);
  };

  const alternarDiaSemAula = async (iso, motivoAtual) => {
    if (motivoAtual) {
      await supabase.from("dias_sem_aula").delete().eq("data", iso);
      setDiasSemAula((prev) => { const copia = { ...prev }; delete copia[iso]; return copia; });
    } else {
      const motivo = window.prompt("Motivo (opcional, ex: Feriado, Recesso):", "") || "Sem aula";
      const { error } = await supabase.from("dias_sem_aula").insert({ data: iso, motivo });
      if (error) { alert("Erro ao marcar dia sem aula: " + error.message); return; }
      setDiasSemAula((prev) => ({ ...prev, [iso]: motivo }));
    }
  };

  const baixarBackupGeral = async () => {
    setExportando(true);
    const [turmasRes, studentsRes, lessonsRes, recordsRes, billingRes, diasSemAulaRes] = await Promise.all([
      supabase.from("turmas").select("*"),
      supabase.from("students").select("*"),
      supabase.from("lessons").select("*"),
      supabase.from("lesson_records").select("*"),
      supabase.from("billing").select("*"),
      supabase.from("dias_sem_aula").select("*"),
    ]);
    const backup = {
      geradoEm: new Date().toISOString(),
      turmas: turmasRes.data || [],
      alunos: studentsRes.data || [],
      aulas: lessonsRes.data || [],
      registrosHomework: recordsRes.data || [],
      financeiro: billingRes.data || [],
      diasSemAula: diasSemAulaRes.data || [],
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backup-portal-teacher-mari-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setExportando(false);
  };


  const cadastrarTurma = async () => {
    setStatusForm({ tipo: "", texto: "" });
    for (const a of novaTurma.alunos) {
      if (!a.nome || !a.email || a.senha.length < 6) {
        setStatusForm({ tipo: "erro", texto: "Preencha nome, e-mail e senha (mín. 6 caracteres) de todos os alunos." });
        return;
      }
    }

    const { data: turmasExistentes } = await supabase.from("turmas").select("dias_horarios, students(id)");
    const turmasComAlunos = (turmasExistentes || []).filter((t) => t.students && t.students.length > 0);
    const conflitos = [];
    turmasComAlunos.forEach((t) => {
      (t.dias_horarios || []).forEach((dh) => {
        novaTurma.diasHorarios.forEach((novoDh) => {
          if (dh.dia === novoDh.dia && dh.horario === novoDh.horario) {
            conflitos.push(`${dh.dia} ${dh.horario}`);
          }
        });
      });
    });
    if (conflitos.length > 0) {
      const confirmar = window.confirm(`Você já tem outra turma marcada em: ${conflitos.join(", ")}. Quer cadastrar mesmo assim?`);
      if (!confirmar) return;
    }
    setEnviando(true);
    const { data: sessionData } = await supabase.auth.getSession();
    if (!sessionData.session) {
      setStatusForm({ tipo: "erro", texto: "Sua sessão expirou. Saia e entre de novo pra continuar." });
      setEnviando(false);
      return;
    }
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/create-turma`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${sessionData.session.access_token}`,
      },
      body: JSON.stringify(novaTurma),
    });
    const resultado = await resp.json();
    setEnviando(false);
    if (!resp.ok) {
      setStatusForm({ tipo: "erro", texto: resultado.error || "Erro ao cadastrar turma." });
      return;
    }

    // Se definiu data de término, aplica na turma recém criada e apaga aulas fora do período
    if (novaTurma.dataFim) {
      try {
        // Busca a turma recém criada: mesma data_inicio, criada agora
        const { data: turmasRecentes } = await supabase.from("turmas")
          .select("id")
          .eq("data_inicio", novaTurma.dataInicio)
          .order("created_at", { ascending: false })
          .limit(1);
        if (turmasRecentes && turmasRecentes.length > 0) {
          const turmaId = turmasRecentes[0].id;
          await supabase.from("turmas").update({ data_fim: novaTurma.dataFim }).eq("id", turmaId);
          await supabase.from("lessons").delete().eq("turma_id", turmaId).gt("data", novaTurma.dataFim);
          await supabase.from("lesson_records").delete().eq("turma_id", turmaId).gt("data", novaTurma.dataFim);
        }
      } catch (e) {
        console.warn("Falha ao aplicar data_fim:", e);
      }
    }
    const linksWhatsapp = novaTurma.alunos
      .filter((a) => a.telefone)
      .map((a) => {
        const tel = a.telefone.replace(/\D/g, "");
        const msg = encodeURIComponent(`Hello, ${a.nome}! Seu acesso ao StudentHub (portal da Teacher Mari Lessons) está pronto 🎉\n\nClique em: www.teachermarilessons.com.br/studenthub \n\nAcesse com:\nE-mail: ${a.email}\nSenha: ${a.senha}\n\nVocê pode trocar a senha depois de entrar.\n\n⚠️ INSTALE COMO APP NO SEU CELULAR: 📱\n\n• Android/Chrome: vai aparecer um banner "Adicionar à tela inicial" (ou toque no ícone de instalação na barra de endereço)\n• iPhone/Safari: toque no ícone de Compartilhar (quadrado com seta) → "Adicionar à Tela de Início"`);
        return { nome: a.nome, url: `https://wa.me/${tel}?text=${msg}` };
      });
    setStatusForm({ tipo: "sucesso", texto: `Turma cadastrada com ${novaTurma.alunos.length} aluno(s)!`, whatsappLinks: linksWhatsapp });
    setNovaTurma({
      modalidade: "individual", frequencia: "1x", nivel: "Beginner",
      diasHorarios: [{ dia: "Segunda", horario: "19:00" }],
      alunos: [{ nome: "", email: "", senha: "", telefone: "" }],
      dataInicio: new Date().toISOString().slice(0, 10),
      dataFim: "",
    });
    carregarAlunos();
  };

  return (
    <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, padding: "24px" }}>
      <div style={{ maxWidth: "1120px", margin: "0 auto" }}>
        <div style={{ background: palette.purple, borderRadius: "18px", padding: "24px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "20px", position: "relative", overflow: "hidden", flexWrap: "wrap", gap: "16px" }}>
          <div style={{ position: "absolute", top: 0, right: 0, width: "120px", height: "120px", background: palette.orange, borderRadius: "0 0 0 120px", opacity: 0.15 }} />
          <div style={{ position: "relative", zIndex: 1 }}>
            <p style={{ color: palette.lightGreen, fontSize: "12px", fontWeight: 600, marginBottom: "4px", letterSpacing: "0.06em", textTransform: "uppercase" }}>Painel administrativo</p>
            <h1 style={{ color: "#FFF", fontSize: "22px", fontWeight: 600 }}>Olá, Teacher Mari!</h1>
          </div>
          <button onClick={onLogout} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer", position: "relative", zIndex: 1 }}>Sair</button>
        </div>

        {avisos.length > 0 && (
          <div style={{ background: "#F7C1C133", border: "1px solid #F7C1C1", borderRadius: "12px", padding: "14px 16px", marginBottom: "20px" }}>
            <p style={{ fontSize: "13px", fontWeight: 600, color: palette.purple, marginBottom: "10px" }}>
              ⚠️ {avisos.length === 1 ? "1 aviso de não comparecimento" : `${avisos.length} avisos de não comparecimento`}
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              {avisos.map((a) => {
                const nomes = a.turmas && a.turmas.students ? a.turmas.students.map((s) => s.nome).join(", ") : "Aluno";
                const statusLabel = a.status === "aRepor" ? "vai repor" : "faltou (perdida)";
                return (
                  <div key={a.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#FFF", borderRadius: "8px", padding: "10px 12px", gap: "10px", flexWrap: "wrap" }}>
                    <span style={{ fontSize: "12px", color: palette.purple }}>
                      <strong>{nomes}</strong> avisou não comparecimento na aula de {formatarDataBR(a.data)} — {statusLabel}
                    </span>
                    <button onClick={() => dispensarAviso(a.id)}
                      style={{ fontSize: "11px", fontWeight: 600, padding: "5px 10px", borderRadius: "6px", border: "none", cursor: "pointer", background: palette.cream, color: palette.purple, flexShrink: 0 }}>
                      Dispensar
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: "6px", marginBottom: "20px", flexWrap: "wrap" }}>
          <button onClick={() => setAbaAdmin("alunos")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "alunos" ? palette.orange : "#FFF", color: abaAdmin === "alunos" ? "#FFF" : palette.purple }}>
            Alunos
          </button>
          <button onClick={() => setAbaAdmin("calendario")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "calendario" ? palette.orange : "#FFF", color: abaAdmin === "calendario" ? "#FFF" : palette.purple }}>
            Calendário geral
          </button>
          <button onClick={() => setAbaAdmin("planejador")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "planejador" ? palette.orange : "#FFF", color: abaAdmin === "planejador" ? "#FFF" : palette.purple }}>
            📋 Planejador Semanal
          </button>
          <button onClick={() => { setAbaAdmin("materiais"); setNivelSelecionado(null); }}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "materiais" ? palette.orange : "#FFF", color: abaAdmin === "materiais" ? "#FFF" : palette.purple }}>
            Materiais
          </button>
          <button onClick={() => setAbaAdmin("certificados")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "certificados" ? palette.orange : "#FFF", color: abaAdmin === "certificados" ? "#FFF" : palette.purple }}>
            🎓 Certificados
          </button>
          <button onClick={() => setAbaAdmin("flashcards")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "flashcards" ? palette.orange : "#FFF", color: abaAdmin === "flashcards" ? "#FFF" : palette.purple }}>
            🃏 Flashcards
          </button>

        </div>

        {abaAdmin === "planejador" && (
          <PlanejadorSemanalEnxuto students={students} onSelectStudent={onSelectStudent} />

                      </span>

            </div>

        <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px", marginBottom: "20px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: mostrarForm ? "16px" : "0" }}>
            <p style={{ fontSize: "14px", fontWeight: 600, color: palette.purple }}>Cadastrar turma</p>
            <button onClick={() => setMostrarForm(!mostrarForm)}
              style={{ padding: "8px 14px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "12px", fontWeight: 600, background: palette.orange, color: "#FFF" }}>

          </div>

          {mostrarForm && (
            <div>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Modalidade</label>
              <div style={{ display: "flex", gap: "8px", marginBottom: "14px" }}>
                {["individual", "dupla", "grupo"].map((m) => (
                  <button key={m} onClick={() => mudarModalidade(m)}
                    style={{ flex: 1, padding: "9px", borderRadius: "8px", border: novaTurma.modalidade === m ? `2px solid ${palette.purple}` : `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: novaTurma.modalidade === m ? palette.cream : "#FFF", color: palette.purple, textTransform: "capitalize" }}>
                    {m === "grupo" ? "Grupo (3-6)" : m}
                  </button>

              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Frequência</label>
              <div style={{ display: "flex", gap: "8px", marginBottom: "14px" }}>
                {["1x", "2x"].map((f) => (
                  <button key={f} onClick={() => setNovaTurma((t) => ({ ...t, frequencia: f }))}
                    style={{ flex: 1, padding: "9px", borderRadius: "8px", border: novaTurma.frequencia === f ? `2px solid ${palette.purple}` : `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: novaTurma.frequencia === f ? palette.cream : "#FFF", color: palette.purple }}>
                    {f} por semana
                  </button>
                ))}
              </div>

              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Dia(s) e horário(s)</label>
              {novaTurma.diasHorarios.map((dh, i) => (
                <div key={i} style={{ display: "flex", gap: "8px", marginBottom: "8px" }}>
                  <select value={dh.dia} onChange={(e) => atualizarHorario(i, "dia", e.target.value)}
                    style={{ flex: 2, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }}>

                  {novaTurma.diasHorarios.length > 1 && (

                style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "6px" }} />

              <input type="date" value={novaTurma.dataFim} onChange={(e) => setNovaTurma((t) => ({ ...t, dataFim: e.target.value }))}

                style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "6px" }} />
              <p style={{ fontSize: "11px", color: `${palette.purple}99`, marginBottom: "16px" }}>

                <div key={i} style={{ background: palette.cream, borderRadius: "10px", padding: "12px", marginBottom: "10px" }}>

                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
                      <span style={{ fontSize: "11px", fontWeight: 600, color: `${palette.purple}99` }}>Aluno {i + 1}</span>
                      {novaTurma.alunos.length > 3 && (
                        <button onClick={() => removerAlunoGrupo(i)} style={{ fontSize: "11px", color: "#E24B4A", background: "none", border: "none", cursor: "pointer", fontWeight: 600 }}>remover</button>
                      )}

                  )}
                  <input type="text" value={a.nome} onChange={(e) => atualizarAluno(i, "nome", e.target.value)}
                    placeholder="Nome do aluno"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "8px" }} />
                  <input type="email" value={a.email} onChange={(e) => atualizarAluno(i, "email", e.target.value)}
                    placeholder="E-mail"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "8px" }} />
                  <input type="text" value={a.senha} onChange={(e) => atualizarAluno(i, "senha", e.target.value)}
                    placeholder="Senha provisória (mín. 6 caracteres)"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "8px" }} />
                  <input type="tel" value={a.telefone} onChange={(e) => atualizarAluno(i, "telefone", e.target.value)}
                    placeholder="Telefone WhatsApp (opcional)"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />

              ))}

                <button onClick={adicionarAlunoGrupo} style={{ marginBottom: "16px", padding: "6px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: "#FFF", color: palette.purple }}>

                </button>

              {statusForm.texto && (
                <div style={{ marginBottom: "12px" }}>

        <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px" }}>

            <p style={{ margin: 0, fontSize: "14px", fontWeight: 600, color: palette.purple }}>Turmas</p>
            <div style={{ position: "relative", flex: "1 1 240px", maxWidth: "360px" }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={palette.purple} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                style={{ position: "absolute", left: "12px", top: "50%", transform: "translateY(-50%)", opacity: 0.6, pointerEvents: "none" }}>
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                value={buscaTurma}
                onChange={(e) => setBuscaTurma(e.target.value)}
                placeholder="Buscar por nome, nível ou modalidade..."
                style={{ width: "100%", padding: "8px 12px 8px 36px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", color: palette.purple, outline: "none", boxSizing: "border-box" }} />
              {buscaTurma && (
                <button onClick={() => setBuscaTurma("")}
                  style={{ position: "absolute", right: "8px", top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", color: palette.purple, fontSize: "16px", fontWeight: 600, padding: "4px 8px", lineHeight: 1, opacity: 0.6 }}>
                  ×
                </button>
              )}
            </div>
          </div>
          {carregando && <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Carregando...</p>}
          {!carregando && students.length === 0 && (
            <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Nenhuma turma cadastrada ainda.</p>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            {(() => {
              // Normaliza texto pra busca (remove acentos, case-insensitive)
              const normalizar = (t) => (t || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
              const termoBusca = normalizar(buscaTurma.trim());

              // Agrupa alunos por turma_id — cada turma vira uma entrada, e alunos avulsos (sem turma) aparecem individualmente
              const turmasMap = new Map();
              const semTurma = [];
              students.forEach((s) => {
                if (!s.turma_id) { semTurma.push(s); return; }
                if (!turmasMap.has(s.turma_id)) turmasMap.set(s.turma_id, []);
                turmasMap.get(s.turma_id).push(s);
              });
              const listaTurmasCompleta = Array.from(turmasMap.values()).map((alunosDaTurma) => {
                const alunosOrdenados = [...alunosDaTurma].sort((a, b) => a.nome.localeCompare(b.nome));
                return { representante: alunosOrdenados[0], todos: alunosOrdenados };
              }).sort((a, b) => a.representante.nome.localeCompare(b.representante.nome));

              // Aplica filtro se tem termo de busca
              const listaTurmas = termoBusca ? listaTurmasCompleta.filter(({ representante: s, todos }) => {
                const modalidadeLabel = s.turmas ? { individual: "Individual", dupla: "Dupla", grupo: "Grupo" }[s.turmas.modalidade] : "";
                const camposBuscaveis = [
                  ...todos.map((a) => a.nome),
                  s.nivel || "",
                  modalidadeLabel,
                ].map(normalizar).join(" ");
                return camposBuscaveis.includes(termoBusca);
              }) : listaTurmasCompleta;

              const semTurmaFiltrado = termoBusca
                ? semTurma.filter((s) => normalizar(s.nome).includes(termoBusca))
                : semTurma;

              if (termoBusca && listaTurmas.length === 0 && semTurmaFiltrado.length === 0) {
                return (
                  <p style={{ fontSize: "13px", color: `${palette.purple}99`, textAlign: "center", padding: "20px 8px" }}>
                    Nenhuma turma encontrada com "{buscaTurma}".
                  </p>
                );
              }

              return (
                <React.Fragment>
                  {listaTurmas.map(({ representante: s, todos }) => {
                    const modalidadeLabel = s.turmas ? { individual: "Individual", dupla: "Dupla", grupo: "Grupo" }[s.turmas.modalidade] : null;
                    const horarios = s.turmas && s.turmas.dias_horarios ? s.turmas.dias_horarios.map((dh) => `${dh.dia} ${dh.horario}`).join(", ") : "";
                    const nomesJuntos = todos.map((a) => a.nome).join(" + ");
                    return (
                      <button key={s.turma_id} onClick={() => onSelectStudent(s)}
                        style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", borderRadius: "12px", background: palette.cream, border: "none", cursor: "pointer", width: "100%", textAlign: "left" }}>
                        <div>
                          <p style={{ fontSize: "14px", fontWeight: 600, color: palette.purple }}>{nomesJuntos}</p>
                          <p style={{ fontSize: "12px", color: `${palette.purple}99`, marginTop: "2px" }}>
                            {s.nivel} · {(s.turmas && s.turmas.unidade_atual) || "sem unidade registrada"}{horarios ? ` · ${horarios}` : ""}
                          </p>
                        </div>
                        <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
                          {modalidadeLabel && (
                            <span style={{ fontSize: "11px", fontWeight: 600, padding: "4px 10px", borderRadius: "20px", background: palette.lavender, color: palette.purple }}>
                              {modalidadeLabel}
                            </span>
                          )}
                          <span style={{ color: palette.purple }}>→</span>
                        </div>
                      </button>
                    );
                  })}
                  {semTurmaFiltrado.map((s) => (
                    <button key={s.id} onClick={() => onSelectStudent(s)}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", borderRadius: "12px", background: palette.cream, border: "none", cursor: "pointer", width: "100%", textAlign: "left" }}>
                      <div>
                        <p style={{ fontSize: "14px", fontWeight: 600, color: palette.purple }}>{s.nome}</p>
                        <p style={{ fontSize: "12px", color: `${palette.purple}99`, marginTop: "2px" }}>Sem turma</p>
                      </div>
                      <span style={{ color: palette.purple }}>→</span>
                    </button>
                  ))}
                </React.Fragment>
              );
            })()}
          </div>
        </div>
        </React.Fragment>
        )}
      </div>
    </div>
  );
}

// Converte URLs comuns pra versão que aceita embed (Wordwall e YouTube bloqueiam iframe nas URLs regulares).
// Também aceita código iframe colado inteiro (ex: '<iframe src="..." ...>') e extrai o src.
function normalizarUrlEmbed(url) {
  if (!url) return url;
  const original = url.trim();
  // Se colou código iframe inteiro, pega só o src
  const iframeSrc = original.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
  if (iframeSrc) return iframeSrc[1];
  // Se já é URL de embed do Wordwall (com ou sem params), usa direto
  if (/wordwall\.net\/embed\//.test(original)) return original;
  // URL regular do Wordwall: /resource/ ou /play/ com ID (pode ter letras + números)
  const wordwall = original.match(/wordwall\.net\/(?:resource|play)\/([A-Za-z0-9]+)/);
  if (wordwall) return `https://wordwall.net/embed/${wordwall[1]}`;
  // YouTube
  const youtubeWatch = original.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if (youtubeWatch) return `https://www.youtube.com/embed/${youtubeWatch[1]}`;
  return original;
}

function IframeAltoAutomatico({ src, title, alturaMinima, alturaPadrao, alturaMaxima }) {
  const { useRef, useState: useStateLocal, useEffect } = React;
  const iframeRef = useRef(null);
  const cleanupRef = useRef(null);
  const alturaAtualRef = useRef(null);
  const debounceTimerRef = useRef(null);

  // Detecta o tipo de conteúdo pra escolher altura inicial adequada
  // Wordwall/YouTube são cross-origin (não conseguimos medir), então precisam de tamanho realista
  // Sites próprios (teachermarilessons.com.br) são same-origin, começam pequenos e crescem via ResizeObserver
  const detectarTipoConteudo = (url) => {
    if (!url) return "outro";
    if (/wordwall/i.test(url)) return "wordwall";
    if (/youtube|youtu\.be/i.test(url)) return "youtube";
    if (/teachermarilessons\.com\.br/i.test(url)) return "proprio";
    return "outro";
  };

  const tipo = detectarTipoConteudo(src);
  const alturaInicial = alturaPadrao || (
    tipo === "wordwall" ? 600 :
    tipo === "youtube" ? 500 :
    tipo === "proprio" ? 800 :
    600
  );
  // Teto máximo: se o iframe tentar crescer além disso, para e deixa scroll interno.
  // Weekly plans reais raramente ultrapassam 2000px — teto de 1800 é seguro sem cortar conteúdo real.
  const alturaMax = alturaMaxima || (
    tipo === "proprio" ? 1800 :
    tipo === "wordwall" ? 700 :
    tipo === "youtube" ? 600 :
    1500
  );
  const alturaMin = alturaMinima || 400;

  const [altura, setAltura] = useStateLocal(Math.min(alturaInicial, alturaMax));
  const embedSrc = normalizarUrlEmbed(src);

  // Ajuste com debounce e threshold — só reage a mudanças reais, não a oscilações pequenas
  const agendarAjuste = () => {
    if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    debounceTimerRef.current = setTimeout(() => {
      try {
        const iframe = iframeRef.current;
        if (!iframe || !iframe.contentWindow) return;
        const doc = iframe.contentWindow.document;
        if (!doc) return;
        const alturaReal = Math.max(
          doc.body ? doc.body.scrollHeight : 0,
          doc.documentElement ? doc.documentElement.scrollHeight : 0,
          doc.body ? doc.body.offsetHeight : 0,
          doc.documentElement ? doc.documentElement.offsetHeight : 0,
        );
        if (alturaReal <= 0) return;
        // Aplica teto máximo pra não crescer além do razoável (evita "página infinita")
        const novaAltura = Math.min(alturaMax, Math.max(alturaReal + 30, alturaMin));
        // Só atualiza se a mudança for significativa (mais de 8px) — filtra tremores
        if (alturaAtualRef.current === null || Math.abs(novaAltura - alturaAtualRef.current) > 8) {
          alturaAtualRef.current = novaAltura;
          setAltura(novaAltura);
        }
      } catch (e) {
        // Cross-origin (Wordwall/YouTube): mantém altura inicial
      }
    }, 150);
  };

  const onLoadHandler = () => {
    agendarAjuste();
    if (cleanupRef.current) cleanupRef.current();

    // Re-mede em intervalos crescentes pra pegar conteúdo que carrega depois do load inicial
    const timers = [300, 700, 1200, 2000, 3500, 5500, 8500, 12500].map((delay) => setTimeout(agendarAjuste, delay));

    // Também observa mudanças contínuas de tamanho (quando aluno interage: clica em aba, expande resposta, etc)
    let resizeObs = null;
    try {
      const iframe = iframeRef.current;
      const doc = iframe && iframe.contentWindow && iframe.contentWindow.document;
      if (doc && typeof ResizeObserver !== "undefined") {
        resizeObs = new ResizeObserver(() => agendarAjuste());
        if (doc.body) resizeObs.observe(doc.body);
        if (doc.documentElement) resizeObs.observe(doc.documentElement);
      }
    } catch (e) {
      // Cross-origin: sem ResizeObserver, altura inicial vale
    }

    cleanupRef.current = () => {
      timers.forEach((t) => clearTimeout(t));
      if (resizeObs) { try { resizeObs.disconnect(); } catch (e) {} }
      if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    };
  };

  useEffect(() => {
    return () => {
      if (cleanupRef.current) cleanupRef.current();
    };
  }, []);

  return (
    <div style={{ marginBottom: "20px" }}>
      <iframe ref={iframeRef} src={embedSrc} title={title} scrolling="auto" onLoad={onLoadHandler}
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write"
        allowFullScreen
        style={{ width: "100%", height: `${altura}px`, border: "none", borderRadius: "12px", background: "#FFF", display: "block" }} />
      <a href={src} target="_blank" rel="noopener noreferrer"
        style={{ display: "inline-block", marginTop: "6px", fontSize: "11px", color: palette.purple, textDecoration: "underline", fontWeight: 500 }}>
        Se não carregar aqui, abra em nova aba →
      </a>
    </div>
  );
}

  const salvarTurma = async () => {

    await supabase.from("students").update({ nivel: rascunhoTurma.nivel }).eq("turma_id", turmaId);

    // Apaga aulas fora do período novo (incluindo os registros pedagógicos correspondentes)
    if (novaDataFim) {
      await supabase.from("lessons").delete().eq("turma_id", turmaId).gt("data", novaDataFim);
      await supabase.from("lesson_records").delete().eq("turma_id", turmaId).gt("data", novaDataFim);
    }

    // Cleanup: se mudou os dias/horários da turma, limpa lessons futuras que ficaram obsoletas
    const diasMudaram = JSON.stringify(turma.dias_horarios) !== JSON.stringify(rascunhoTurma.dias_horarios);
    if (diasMudaram) {
      const hojeISO = new Date().toISOString().slice(0, 10);
      const DIAS_MAP = { "Domingo": 0, "Segunda": 1, "Terça": 2, "Quarta": 3, "Quinta": 4, "Sexta": 5, "Sábado": 6 };
      const novosDias = new Set((rascunhoTurma.dias_horarios || []).map((dh) => DIAS_MAP[dh.dia]));

      // 1. Deleta canceladas futuras (ficaram sem propósito com o novo dia)
      await supabase.from("lessons").delete().eq("turma_id", turmaId).eq("status", "cancelada").gte("data", hojeISO);

      // 2. Busca lessons agendadas futuras e deleta as que caem em dias que saíram do novo dias_horarios
      const { data: lessonsFuturas } = await supabase
        .from("lessons")
        .select("id, data, status")
        .eq("turma_id", turmaId)
        .gte("data", hojeISO)
        .eq("status", "agendada");

      if (lessonsFuturas && lessonsFuturas.length > 0) {
        const idsParaDeletar = lessonsFuturas
          .filter((l) => {
            const [y, m, d] = l.data.split("-").map(Number);
            const diaSemana = new Date(y, m - 1, d).getDay();
            return !novosDias.has(diaSemana);
          })
          .map((l) => l.id);
        if (idsParaDeletar.length > 0) {
          await supabase.from("lessons").delete().in("id", idsParaDeletar);
        }
      }
    }

    setTurma((t) => ({ ...t, nivel: rascunhoTurma.nivel, dias_horarios: rascunhoTurma.dias_horarios, link_aula: rascunhoTurma.link_aula || null, data_fim: novaDataFim }));

  const salvarRecado = async () => {

  const abrirEdicaoAluno = () => {

  const salvarEdicaoAluno = async () => {

      setStatusEdicaoAluno({ tipo: "erro", texto: "Nome não pode ficar vazio." });

    const resp = await fetch(`${SUPABASE_URL}/functions/v1/update-student`, {

      body: JSON.stringify({ studentId, nome: rascunhoAluno.nome, telefone: rascunhoAluno.telefone, novoEmail: rascunhoAluno.novoEmail || null }),
    });

    setSalvandoAluno(false);
    if (!resp.ok) {
      setStatusEdicaoAluno({ tipo: "erro", texto: resultado.error || "Erro ao salvar." });

    }
    // Salva data de nascimento direto na tabela students (não passa pela edge function)
    if (rascunhoAluno.nascimento !== (student.nascimento || "")) {

    setTimeout(() => setMostrarEditarAluno(false), 1200);
  };
  const [mostrarTrocaSenha, setMostrarTrocaSenha] = useState(false);
  const [novaSenha, setNovaSenha] = useState("");
  const [confirmarSenha, setConfirmarSenha] = useState("");
  const [mensagemSenha, setMensagemSenha] = useState("");

  const trocarSenha = async () => {

      setMensagemSenha("Erro: a senha precisa ter pelo menos 6 caracteres.");

    }

    if (error) {
      setMensagemSenha("Erro: " + error.message);

    setConfirmarSenha("");

  const studentId = student.id;
  const turmaId = student.turma_id;

  useEffect(() => {
    let ativo = true; // evita race condition se admin trocar de aluno antes das queries terminarem

    const isPrimeiraCargaOuTrocaDeTurma = !turma || (turma && turma.id !== turmaId);
    if (isPrimeiraCargaOuTrocaDeTurma) setCarregandoDados(true);

    async function carregarDados() {
      const { data: turmaData } = await supabase.from("turmas").select("*").eq("id", turmaId).single();
      if (!ativo) return;
      setTurma(turmaData || null);

      const { data: materiaisData } = await supabase.from("materiais").select("*").order("created_at", { ascending: false });
      if (!ativo) return;

      if (!ativo) return;
      setColegas((colegasData || []).filter((c) => c.id !== studentId));

      const { data: lessonsData } = await supabase

      if (!ativo) return;
      const hojeISO = new Date().toISOString().slice(0, 10);
      const expiradas = (lessonsData || []).filter((l) => l.status === "aRepor" && l.prazo_reposicao && l.prazo_reposicao < hojeISO);
      if (expiradas.length > 0) {

        if (!ativo) return;
        expiradas.forEach((l) => { l.status = "perdida"; });
      }
      const aulasObj = {};
      (lessonsData || []).forEach((l) => {
        const d = new Date(l.data + "T00:00:00");
        aulasObj[`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`] = { status: l.status, prazo_reposicao: l.prazo_reposicao, horario: l.horario, data_original: l.data_original, rowId: l.id };
      });
      setAulas(aulasObj);

      // Carrega feriados / dias sem aula (globais, marcados por Mari no Calendário Geral do admin)

      })));

      const { data: homeworkStatusData } = await supabase.from("homework_status").select("*").eq("student_id", studentId);
      if (!ativo) return;

      const { data: billingData } = await supabase

      if (!ativo) return;
      setCobranca((billingData || []).map((b) => ({

        vencimento: new Date(b.vencimento + "T00:00:00").toLocaleDateString("pt-BR"), vencimentoISO: b.vencimento, boletoUrl: b.boleto_url, rowId: b.id,
      })));

      setCarregandoDados(false);
    }
    carregarDados();
    return () => { ativo = false; };
  }, [turmaId, studentId, loadKey]);

  // Refetch silencioso quando o aluno volta a focar o app (troca de aba, minimiza+volta, etc.)
  useEffect(() => {
    const onVisibilityChange = () => {
      if (document.visibilityState === "visible") setLoadKey((k) => k + 1);
    };
    document.addEventListener("visibilitychange", onVisibilityChange);
    return () => document.removeEventListener("visibilitychange", onVisibilityChange);
  }, []);

  const anexarBoleto = async (index, file) => {
    const registro = cobranca[index];
    // Supabase Storage não aceita acentos, espaços, parênteses e outros caracteres especiais na key
    // Normaliza (remove acentos), troca espaços/símbolos por _, e mantém só ASCII seguro
    const nomeSanitizado = file.name
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "") // tira os acentos
      .replace(/[^a-zA-Z0-9._-]/g, "_") // qualquer caractere fora do seguro vira _
      .replace(/_+/g, "_"); // colapsa múltiplos _ seguidos
    const caminho = `${turmaId}/${registro.rowId}-${nomeSanitizado}`;
    const { error: erroUpload } = await supabase.storage.from("boletos").upload(caminho, file, { upsert: true });
    if (erroUpload) { alert("Erro ao subir boleto: " + erroUpload.message); return; }
    const { data: urlData } = supabase.storage.from("boletos").getPublicUrl(caminho);
    await supabase.from("billing").update({ boleto_url: urlData.publicUrl }).eq("id", registro.rowId);
    // Mostra o nome original pra Mari (com acentos), mas guarda internamente o sanitizado
    setCobranca((prev) => prev.map((c, i) => (i === index ? { ...c, boletoUrl: urlData.publicUrl, nomeArquivo: file.name } : c)));
  };

    // Se está cancelada, tratamos como implícita — o admin abre pra reagendar/registrar do zero

    // Descobre o horário padrão da turma pra esse dia da semana (se houver), pra usar como sugestão

    if (chave && turma && turma.dias_horarios) {

      if (dhMatch) horarioPadrao = dhMatch.horario;
