<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/cruzmarianagama-ux/logos/main/9%20(3).png">

<script type="text/babel">
const { useState } = React;

const SUPABASE_URL = "https://tsqgdqzqcnglmlrezuec.supabase.co";
const SUPABASE_KEY = "sb_publishable_m8ekIywbNClgrVDCn_9ydg_omvBcXtx";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const palette = {
  orange: "#FF5C23",
  purple: "#1D1050",
  green: "#04392F",
  lightGreen: "#CAE78D",
  lavender: "#B4A1FF",
  cream: "#FAEAD3",
};

const LOGO = "https://raw.githubusercontent.com/cruzmarianagama-ux/logos/main/1%20(3).png";

// ---------- LOGIN ----------
function PortalLogin({ onLogin }) {
  const [role, setRole] = useState("aluno");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");
  const [modoRecuperar, setModoRecuperar] = useState(false);
  const [mensagemRecuperar, setMensagemRecuperar] = useState("");
  const isAdmin = role === "admin";

  const entrar = async () => {
    setErro("");
    if (!email || !senha) {
      setErro("Preencha e-mail e senha.");
      return;
    }
    setCarregando(true);
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
    setCarregando(false);
    if (error) {
      setErro("E-mail ou senha incorretos.");
      return;
    }
    onLogin(role, data.user);
  };

  const recuperarSenha = async () => {
    setMensagemRecuperar("");
    if (!email) {
      setMensagemRecuperar("Digite seu e-mail no campo acima primeiro.");
      return;
    }
    setCarregando(true);
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    setCarregando(false);
    setMensagemRecuperar(error ? "Erro ao enviar. Confira o e-mail e tente de novo." : "Se esse e-mail estiver cadastrado, enviamos um link de recuperação.");
  };

  return (
    <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" }}>
      <div style={{ width: "100%", maxWidth: "460px", background: "#FFFFFF", borderRadius: "20px", overflow: "hidden", boxShadow: "0 20px 50px rgba(29,16,80,0.12)" }}>
        <div style={{ background: palette.purple, padding: "48px 32px 32px", position: "relative", textAlign: "center" }}>
          <div style={{ position: "absolute", top: 0, right: 0, width: "160px", height: "160px", background: palette.orange, borderRadius: "0 0 0 160px", opacity: 0.15 }} />
          <div style={{ position: "absolute", bottom: 0, left: 0, width: "100px", height: "100px", background: palette.lightGreen, borderRadius: "0 100px 0 0", opacity: 0.12 }} />
          <img src={LOGO} alt="Teacher Mari Lessons" style={{ height: "150px", maxWidth: "85%", objectFit: "contain", display: "block", margin: "0 auto 18px", position: "relative", zIndex: 1 }} />
          <h1 style={{ color: "#FFFFFF", fontSize: "20px", fontWeight: 600, lineHeight: 1.3, position: "relative", zIndex: 1, margin: 0 }}>
            {modoRecuperar ? "Recuperar senha" : "Entrar no portal"}
          </h1>
        </div>
        <div style={{ padding: "28px 32px 32px" }}>
          {!modoRecuperar && (
            <div style={{ display: "flex", background: palette.cream, borderRadius: "12px", padding: "4px", marginBottom: "24px" }}>
              <button onClick={() => setRole("aluno")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: "6px", padding: "10px 12px", borderRadius: "9px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "14px", background: role === "aluno" ? palette.orange : "transparent", color: role === "aluno" ? "#FFF" : palette.purple }}>
                Aluno
              </button>
              <button onClick={() => setRole("admin")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: "6px", padding: "10px 12px", borderRadius: "9px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "14px", background: role === "admin" ? palette.purple : "transparent", color: role === "admin" ? "#FFF" : palette.purple }}>
                Professora
              </button>
            </div>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
            <div>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>E-mail</label>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com"
                style={{ width: "100%", padding: "11px 14px", borderRadius: "10px", border: `1.5px solid ${palette.lavender}55`, fontSize: "14px", outline: "none", color: palette.purple }} />
            </div>
            {!modoRecuperar && (
              <div>
                <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Senha</label>
                <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} placeholder="••••••••"
                  onKeyDown={(e) => e.key === "Enter" && entrar()}
                  style={{ width: "100%", padding: "11px 14px", borderRadius: "10px", border: `1.5px solid ${palette.lavender}55`, fontSize: "14px", outline: "none", color: palette.purple }} />
              </div>
            )}
            {erro && <p style={{ fontSize: "12px", color: "#E24B4A", margin: 0 }}>{erro}</p>}
            {mensagemRecuperar && <p style={{ fontSize: "12px", color: mensagemRecuperar.startsWith("Erro") ? "#E24B4A" : palette.green, margin: 0 }}>{mensagemRecuperar}</p>}

            {!modoRecuperar ? (
              <button onClick={entrar} disabled={carregando} style={{ marginTop: "8px", padding: "13px", borderRadius: "10px", border: "none", cursor: carregando ? "default" : "pointer", fontWeight: 600, fontSize: "15px", background: isAdmin ? palette.purple : palette.orange, color: "#FFF", opacity: carregando ? 0.7 : 1 }}>
                {carregando ? "Entrando..." : "Entrar →"}
              </button>
            ) : (
              <button onClick={recuperarSenha} disabled={carregando} style={{ marginTop: "8px", padding: "13px", borderRadius: "10px", border: "none", cursor: carregando ? "default" : "pointer", fontWeight: 600, fontSize: "15px", background: palette.orange, color: "#FFF", opacity: carregando ? 0.7 : 1 }}>
                {carregando ? "Enviando..." : "Enviar link de recuperação"}
              </button>
            )}
          </div>
          <p onClick={() => { setModoRecuperar(!modoRecuperar); setErro(""); setMensagemRecuperar(""); }}
            style={{ textAlign: "center", fontSize: "12px", color: palette.purple, marginTop: "18px", cursor: "pointer", fontWeight: 600, textDecoration: "underline" }}>
            {modoRecuperar ? "Voltar pro login" : "Esqueci minha senha"}
          </p>
        </div>
      </div>
    </div>
  );
}

// ---------- DASHBOARD ----------
const tabs = [
  { id: "home", label: "Home" },
  { id: "homework", label: "Aulas + Homework" },
  { id: "calendario", label: "Calendar" },
  { id: "cobranca", label: "Financeiro" },
];

const meses = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const statusConfig = {
  agendada: { cor: palette.orange, texto: "#FFFFFF", label: "Agendada" },
  realizada: { cor: palette.lightGreen, texto: palette.green, label: "Realizada" },
  aRepor: { cor: palette.orange, texto: "#FFFFFF", label: "A repor" },
  perdida: { cor: "#F7C1C1", texto: "#791F1F", label: "Perdida" },
};

const homeworkLinks = [
  { titulo: "Unit 1A — Weekly Plan", url: "https://teachermarilessons.com.br/beginner/unit1a" },
  { titulo: "Unit 4A — Weekly Plan", url: "https://teachermarilessons.com.br/beginner/unit4a" },
  { titulo: "Unit 5B — Present Simple Questions", url: "https://teachermarilessons.com.br/beginner/unit5b" },
];

function AdminPanel({ onLogout, onSelectStudent, session }) {
  const { useEffect } = React;
  const [abaAdmin, setAbaAdmin] = useState("alunos");
  const [exportando, setExportando] = useState(false);
  const [students, setStudents] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [diasSemAula, setDiasSemAula] = useState({});
  const [mesCalGeral, setMesCalGeral] = useState(6);
  const [novaTurma, setNovaTurma] = useState({
    modalidade: "individual",
    frequencia: "1x",
    nivel: "Beginner",
    diasHorarios: [{ dia: "Segunda", horario: "19:00" }],
    alunos: [{ nome: "", email: "", senha: "", telefone: "" }],
  });
  const [statusForm, setStatusForm] = useState({ tipo: "", texto: "" });
  const [enviando, setEnviando] = useState(false);

  const vagasPorModalidade = { individual: 1, dupla: 2, grupo: 6 };

  const mudarModalidade = (modalidade) => {
    const min = modalidade === "grupo" ? 3 : vagasPorModalidade[modalidade];
    const alunosAtuais = novaTurma.alunos.slice(0, min);
    while (alunosAtuais.length < min) alunosAtuais.push({ nome: "", email: "", senha: "", telefone: "" });
    setNovaTurma((t) => ({ ...t, modalidade, alunos: alunosAtuais }));
  };

  const atualizarAluno = (index, campo, valor) => {
    setNovaTurma((t) => {
      const alunos = [...t.alunos];
      alunos[index] = { ...alunos[index], [campo]: valor };
      return { ...t, alunos };
    });
  };

  const adicionarAlunoGrupo = () => {
    if (novaTurma.alunos.length >= 6) return;
    setNovaTurma((t) => ({ ...t, alunos: [...t.alunos, { nome: "", email: "", senha: "", telefone: "" }] }));
  };

  const removerAlunoGrupo = (index) => {
    if (novaTurma.alunos.length <= 3) return;
    setNovaTurma((t) => ({ ...t, alunos: t.alunos.filter((_, i) => i !== index) }));
  };

  const atualizarHorario = (index, campo, valor) => {
    setNovaTurma((t) => {
      const dh = [...t.diasHorarios];
      dh[index] = { ...dh[index], [campo]: valor };
      return { ...t, diasHorarios: dh };
    });
  };

  const adicionarHorario = () => {
    setNovaTurma((t) => ({ ...t, diasHorarios: [...t.diasHorarios, { dia: "Segunda", horario: "19:00" }] }));
  };

  const removerHorario = (index) => {
    if (novaTurma.diasHorarios.length <= 1) return;
    setNovaTurma((t) => ({ ...t, diasHorarios: t.diasHorarios.filter((_, i) => i !== index) }));
  };

  const carregarAlunos = async () => {
    setCarregando(true);
    const { data } = await supabase.from("students").select("*, turmas(modalidade, dias_horarios, frequencia, unidade_atual)").order("nome");
    setStudents(data || []);
    setCarregando(false);
  };

  useEffect(() => { carregarAlunos(); carregarDiasSemAula(); }, []);

  const carregarDiasSemAula = async () => {
    const { data } = await supabase.from("dias_sem_aula").select("*");
    const obj = {};
    (data || []).forEach((d) => { obj[d.data] = d.motivo || "Sem aula"; });
    setDiasSemAula(obj);
  };

  const alternarDiaSemAula = async (iso, motivoAtual) => {
    if (motivoAtual) {
      await supabase.from("dias_sem_aula").delete().eq("data", iso);
      setDiasSemAula((prev) => { const copia = { ...prev }; delete copia[iso]; return copia; });
    } else {
      const motivo = window.prompt("Motivo (opcional, ex: Feriado, Recesso):", "") || "Sem aula";
      const { error } = await supabase.from("dias_sem_aula").insert({ data: iso, motivo });
      if (!error) setDiasSemAula((prev) => ({ ...prev, [iso]: motivo }));
    }
  };

  const baixarBackupGeral = async () => {
    setExportando(true);
    const [turmasRes, studentsRes, lessonsRes, recordsRes, billingRes, diasSemAulaRes] = await Promise.all([
      supabase.from("turmas").select("*"),
      supabase.from("students").select("*"),
      supabase.from("lessons").select("*"),
      supabase.from("lesson_records").select("*"),
      supabase.from("billing").select("*"),
      supabase.from("dias_sem_aula").select("*"),
    ]);
    const backup = {
      geradoEm: new Date().toISOString(),
      turmas: turmasRes.data || [],
      alunos: studentsRes.data || [],
      aulas: lessonsRes.data || [],
      registrosHomework: recordsRes.data || [],
      financeiro: billingRes.data || [],
      diasSemAula: diasSemAulaRes.data || [],
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backup-portal-teacher-mari-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setExportando(false);
  };


  const cadastrarTurma = async () => {
    setStatusForm({ tipo: "", texto: "" });
    for (const a of novaTurma.alunos) {
      if (!a.nome || !a.email || a.senha.length < 6) {
        setStatusForm({ tipo: "erro", texto: "Preencha nome, e-mail e senha (mín. 6 caracteres) de todos os alunos." });
        return;
      }
    }

    const { data: turmasExistentes } = await supabase.from("turmas").select("dias_horarios");
    const conflitos = [];
    (turmasExistentes || []).forEach((t) => {
      (t.dias_horarios || []).forEach((dh) => {
        novaTurma.diasHorarios.forEach((novoDh) => {
          if (dh.dia === novoDh.dia && dh.horario === novoDh.horario) {
            conflitos.push(`${dh.dia} ${dh.horario}`);
          }
        });
      });
    });
    if (conflitos.length > 0) {
      const confirmar = window.confirm(`Você já tem outra turma marcada em: ${conflitos.join(", ")}. Quer cadastrar mesmo assim?`);
      if (!confirmar) return;
    }
    setEnviando(true);
    const { data: sessionData } = await supabase.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/create-turma`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${sessionData.session.access_token}`,
      },
      body: JSON.stringify(novaTurma),
    });
    const resultado = await resp.json();
    setEnviando(false);
    if (!resp.ok) {
      setStatusForm({ tipo: "erro", texto: resultado.error || "Erro ao cadastrar turma." });
      return;
    }
    const linksWhatsapp = novaTurma.alunos
      .filter((a) => a.telefone)
      .map((a) => {
        const tel = a.telefone.replace(/\D/g, "");
        const msg = encodeURIComponent(`Oi ${a.nome}! Seu acesso ao portal da Teacher Mari Lessons está pronto 🎉\n\nAcesse com:\nE-mail: ${a.email}\nSenha: ${a.senha}\n\nVocê pode trocar a senha depois de entrar.`);
        return { nome: a.nome, url: `https://wa.me/${tel}?text=${msg}` };
      });
    setStatusForm({ tipo: "sucesso", texto: `Turma cadastrada com ${novaTurma.alunos.length} aluno(s)!`, whatsappLinks: linksWhatsapp });
    setNovaTurma({
      modalidade: "individual", frequencia: "1x", nivel: "Beginner",
      diasHorarios: [{ dia: "Segunda", horario: "19:00" }],
      alunos: [{ nome: "", email: "", senha: "", telefone: "" }],
    });
    carregarAlunos();
  };

  return (
    <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, padding: "24px" }}>
      <div style={{ width: "100%" }}>
        <div style={{ background: palette.purple, borderRadius: "18px", padding: "24px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "20px", position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: 0, right: 0, width: "120px", height: "120px", background: palette.orange, borderRadius: "0 0 0 120px", opacity: 0.15 }} />
          <div style={{ position: "relative", zIndex: 1 }}>
            <p style={{ color: palette.lightGreen, fontSize: "12px", fontWeight: 600, marginBottom: "4px", letterSpacing: "0.06em", textTransform: "uppercase" }}>Painel administrativo</p>
            <h1 style={{ color: "#FFF", fontSize: "22px", fontWeight: 600 }}>Olá, Teacher Mari!</h1>
          </div>
          <button onClick={onLogout} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer", position: "relative", zIndex: 1 }}>Sair</button>
        </div>

        <div style={{ display: "flex", gap: "6px", marginBottom: "20px" }}>
          <button onClick={() => setAbaAdmin("alunos")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "alunos" ? palette.orange : "#FFF", color: abaAdmin === "alunos" ? "#FFF" : palette.purple }}>
            Alunos
          </button>
          <button onClick={() => setAbaAdmin("calendario")}
            style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", background: abaAdmin === "calendario" ? palette.orange : "#FFF", color: abaAdmin === "calendario" ? "#FFF" : palette.purple }}>
            Calendário geral
          </button>
        </div>

        {abaAdmin === "calendario" && (
          <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px" }}>
            <p style={{ marginBottom: "6px", fontSize: "14px", fontWeight: 600, color: palette.purple }}>Dias sem aula</p>
            <p style={{ marginBottom: "16px", fontSize: "12px", color: `${palette.purple}99` }}>
              Marque feriados, recessos ou qualquer dia em que você não dará aula. Toda turma nova já pula esses dias automaticamente ao gerar o calendário.
            </p>

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "16px", maxWidth: "360px" }}>
              <button onClick={() => setMesCalGeral((m) => Math.max(6, m - 1))} style={{ border: "none", background: "transparent", cursor: "pointer", color: palette.purple, fontSize: "18px" }}>‹</button>
              <p style={{ margin: 0, fontSize: "15px", fontWeight: 600, color: palette.purple }}>
                {["January","February","March","April","May","June","July","August","September","October","November","December"][mesCalGeral]} 2026
              </p>
              <button onClick={() => setMesCalGeral((m) => Math.min(11, m + 1))} style={{ border: "none", background: "transparent", cursor: "pointer", color: palette.purple, fontSize: "18px" }}>›</button>
            </div>

            {(() => {
              const diasNoMes = new Date(2026, mesCalGeral + 1, 0).getDate();
              const primeiroDia = new Date(2026, mesCalGeral, 1).getDay();
              const celulas = [];
              for (let i = 0; i < primeiroDia; i++) celulas.push(null);
              for (let d = 1; d <= diasNoMes; d++) celulas.push(d);
              return (
                <div style={{ maxWidth: "360px" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "4px", marginBottom: "6px" }}>
                    {["S","M","T","W","T","F","S"].map((d, i) => (
                      <div key={i} style={{ textAlign: "center", fontSize: "11px", color: `${palette.purple}99`, fontWeight: 600 }}>{d}</div>
                    ))}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: "4px" }}>
                    {celulas.map((dia, i) => {
                      if (!dia) return <div key={i} />;
                      const iso = `2026-${String(mesCalGeral + 1).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
                      const bloqueado = diasSemAula[iso];
                      return (
                        <button key={i} onClick={() => alternarDiaSemAula(iso, bloqueado)}
                          title={bloqueado || ""}
                          style={{ aspectRatio: "1", borderRadius: "8px", border: bloqueado ? "none" : `0.5px solid #EEE`, background: bloqueado ? "#F7C1C1" : "transparent", color: bloqueado ? "#791F1F" : palette.purple, fontSize: "12px", fontWeight: bloqueado ? 600 : 400, cursor: "pointer" }}>
                          {dia}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })()}
            <p style={{ marginTop: "14px", fontSize: "11px", color: `${palette.purple}99` }}>Clique num dia pra marcar como sem aula. Clique de novo pra desmarcar.</p>
          </div>
        )}

        {abaAdmin === "alunos" && (
        <React.Fragment>

        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: "12px" }}>
          <button onClick={baixarBackupGeral} disabled={exportando}
            style={{ padding: "8px 14px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: exportando ? "default" : "pointer", fontSize: "12px", fontWeight: 600, background: "#FFF", color: palette.purple, opacity: exportando ? 0.7 : 1 }}>
            {exportando ? "Gerando backup..." : "Baixar backup completo (JSON)"}
          </button>
        </div>

        <div style={{ display: "flex", gap: "12px", flexWrap: "wrap", marginBottom: "20px" }}>
          <div style={{ flex: "1 1 140px", background: "#FFF", borderRadius: "12px", padding: "16px" }}>
            <p style={{ fontSize: "12px", color: `${palette.purple}99` }}>Total de alunos</p>
            <p style={{ marginTop: "4px", fontSize: "20px", fontWeight: 600, color: palette.purple }}>{students.length}</p>
          </div>
          <div style={{ flex: "1 1 140px", background: "#FFF", borderRadius: "12px", padding: "16px" }}>
            <p style={{ fontSize: "12px", color: `${palette.purple}99` }}>Total de turmas</p>
            <p style={{ marginTop: "4px", fontSize: "20px", fontWeight: 600, color: palette.purple }}>{new Set(students.map((s) => s.turma_id).filter(Boolean)).size}</p>
          </div>
        </div>

        <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px", marginBottom: "20px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: mostrarForm ? "16px" : "0" }}>
            <p style={{ fontSize: "14px", fontWeight: 600, color: palette.purple }}>Cadastrar turma</p>
            <button onClick={() => setMostrarForm(!mostrarForm)}
              style={{ padding: "8px 14px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "12px", fontWeight: 600, background: palette.orange, color: "#FFF" }}>
              {mostrarForm ? "Fechar" : "+ Nova turma"}
            </button>
          </div>

          {mostrarForm && (
            <div>
              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Modalidade</label>
              <div style={{ display: "flex", gap: "8px", marginBottom: "14px" }}>
                {["individual", "dupla", "grupo"].map((m) => (
                  <button key={m} onClick={() => mudarModalidade(m)}
                    style={{ flex: 1, padding: "9px", borderRadius: "8px", border: novaTurma.modalidade === m ? `2px solid ${palette.purple}` : `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: novaTurma.modalidade === m ? palette.cream : "#FFF", color: palette.purple, textTransform: "capitalize" }}>
                    {m === "grupo" ? "Grupo (3-6)" : m}
                  </button>
                ))}
              </div>

              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Frequência</label>
              <div style={{ display: "flex", gap: "8px", marginBottom: "14px" }}>
                {["1x", "2x"].map((f) => (
                  <button key={f} onClick={() => setNovaTurma((t) => ({ ...t, frequencia: f }))}
                    style={{ flex: 1, padding: "9px", borderRadius: "8px", border: novaTurma.frequencia === f ? `2px solid ${palette.purple}` : `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: novaTurma.frequencia === f ? palette.cream : "#FFF", color: palette.purple }}>
                    {f} por semana
                  </button>
                ))}
              </div>

              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Dia(s) e horário(s)</label>
              {novaTurma.diasHorarios.map((dh, i) => (
                <div key={i} style={{ display: "flex", gap: "8px", marginBottom: "8px" }}>
                  <select value={dh.dia} onChange={(e) => atualizarHorario(i, "dia", e.target.value)}
                    style={{ flex: 2, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }}>
                    {["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"].map((d) => <option key={d}>{d}</option>)}
                  </select>
                  <input type="time" value={dh.horario} onChange={(e) => atualizarHorario(i, "horario", e.target.value)}
                    style={{ flex: 1, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />
                  {novaTurma.diasHorarios.length > 1 && (
                    <button onClick={() => removerHorario(i)} style={{ padding: "0 12px", borderRadius: "8px", border: "none", cursor: "pointer", background: "#F7C1C1", color: "#791F1F", fontSize: "12px", fontWeight: 600 }}>×</button>
                  )}
                </div>
              ))}
              <button onClick={adicionarHorario} style={{ marginBottom: "14px", padding: "6px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: "#FFF", color: palette.purple }}>
                + adicionar horário
              </button>

              <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "6px" }}>Nível</label>
              <select value={novaTurma.nivel} onChange={(e) => setNovaTurma((t) => ({ ...t, nivel: e.target.value }))}
                style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "16px" }}>
                <option>Beginner</option>
                <option>Elementary</option>
                <option>Pre-Intermediate</option>
              </select>

              <p style={{ fontSize: "12px", fontWeight: 600, color: palette.purple, marginBottom: "10px" }}>
                {novaTurma.modalidade === "individual" ? "Dados do aluno" : `Alunos da turma (${novaTurma.alunos.length})`}
              </p>

              {novaTurma.alunos.map((a, i) => (
                <div key={i} style={{ background: palette.cream, borderRadius: "10px", padding: "12px", marginBottom: "10px" }}>
                  {novaTurma.modalidade === "grupo" && (
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
                      <span style={{ fontSize: "11px", fontWeight: 600, color: `${palette.purple}99` }}>Aluno {i + 1}</span>
                      {novaTurma.alunos.length > 3 && (
                        <button onClick={() => removerAlunoGrupo(i)} style={{ fontSize: "11px", color: "#E24B4A", background: "none", border: "none", cursor: "pointer", fontWeight: 600 }}>remover</button>
                      )}
                    </div>
                  )}
                  <input type="text" value={a.nome} onChange={(e) => atualizarAluno(i, "nome", e.target.value)}
                    placeholder="Nome do aluno"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "8px" }} />
                  <input type="email" value={a.email} onChange={(e) => atualizarAluno(i, "email", e.target.value)}
                    placeholder="E-mail"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "8px" }} />
                  <input type="text" value={a.senha} onChange={(e) => atualizarAluno(i, "senha", e.target.value)}
                    placeholder="Senha provisória (mín. 6 caracteres)"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "8px" }} />
                  <input type="tel" value={a.telefone} onChange={(e) => atualizarAluno(i, "telefone", e.target.value)}
                    placeholder="Telefone WhatsApp (opcional)"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />
                </div>
              ))}

              {novaTurma.modalidade === "grupo" && novaTurma.alunos.length < 6 && (
                <button onClick={adicionarAlunoGrupo} style={{ marginBottom: "16px", padding: "6px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, cursor: "pointer", fontSize: "12px", fontWeight: 600, background: "#FFF", color: palette.purple }}>
                  + adicionar aluno
                </button>
              )}

              {statusForm.texto && (
                <div style={{ marginBottom: "12px" }}>
                  <p style={{ fontSize: "12px", color: statusForm.tipo === "erro" ? "#E24B4A" : palette.green, margin: 0 }}>{statusForm.texto}</p>
                  {statusForm.whatsappLinks && statusForm.whatsappLinks.length > 0 && (
                    <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "8px" }}>
                      {statusForm.whatsappLinks.map((w, i) => (
                        <a key={i} href={w.url} target="_blank" rel="noopener noreferrer"
                          style={{ display: "inline-block", padding: "8px 14px", borderRadius: "8px", background: "#25D366", color: "#FFF", fontSize: "12px", fontWeight: 600, textDecoration: "none", width: "fit-content" }}>
                          Enviar credenciais pra {w.nome} no WhatsApp
                        </a>
                      ))}
                    </div>
                  )}
                </div>
              )}

              <button onClick={cadastrarTurma} disabled={enviando}
                style={{ padding: "10px 18px", borderRadius: "8px", border: "none", cursor: enviando ? "default" : "pointer", fontSize: "13px", fontWeight: 600, background: palette.purple, color: "#FFF", opacity: enviando ? 0.7 : 1 }}>
                {enviando ? "Cadastrando..." : "Cadastrar turma"}
              </button>
              <p style={{ fontSize: "11px", color: `${palette.purple}99`, marginTop: "10px" }}>
                {novaTurma.modalidade === "individual" ? "O aluno terá seu próprio portal." : "Todos os alunos da turma acessam o mesmo calendário, homework e financeiro."}
              </p>
            </div>
          )}
        </div>

        <div style={{ background: "#FFF", borderRadius: "16px", padding: "20px" }}>
          <p style={{ marginBottom: "14px", fontSize: "14px", fontWeight: 600, color: palette.purple }}>Alunos</p>
          {carregando && <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Carregando...</p>}
          {!carregando && students.length === 0 && (
            <p style={{ fontSize: "13px", color: `${palette.purple}99` }}>Nenhum aluno cadastrado ainda.</p>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            {students.map((s) => {
              const colegasS = students.filter((c) => c.id !== s.id && s.turma_id && c.turma_id === s.turma_id).map((c) => c.nome);
              const modalidadeLabel = s.turmas ? { individual: "Individual", dupla: "Dupla", grupo: "Grupo" }[s.turmas.modalidade] : null;
              const horarios = s.turmas && s.turmas.dias_horarios ? s.turmas.dias_horarios.map((dh) => `${dh.dia} ${dh.horario}`).join(", ") : "";
              return (
                <button key={s.id} onClick={() => onSelectStudent(s)}
                  style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", borderRadius: "12px", background: palette.cream, border: "none", cursor: "pointer", width: "100%", textAlign: "left" }}>
                  <div>
                    <p style={{ fontSize: "14px", fontWeight: 600, color: palette.purple }}>{s.nome}</p>
                    <p style={{ fontSize: "12px", color: `${palette.purple}99`, marginTop: "2px" }}>
                      {s.nivel} · {(s.turmas && s.turmas.unidade_atual) || "sem unidade registrada"}{horarios ? ` · ${horarios}` : ""}
                    </p>
                    {colegasS.length > 0 && (
                      <p style={{ fontSize: "11px", color: `${palette.purple}77`, marginTop: "2px" }}>com {colegasS.join(", ")}</p>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
                    {modalidadeLabel && (
                      <span style={{ fontSize: "11px", fontWeight: 600, padding: "4px 10px", borderRadius: "20px", background: palette.lavender, color: palette.purple }}>
                        {modalidadeLabel}
                      </span>
                    )}
                    <span style={{ color: palette.purple }}>→</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
        </React.Fragment>
        )}
      </div>
    </div>
  );
}

function StudentDashboard({ onLogout, role, student, onBack }) {
  const { useEffect } = React;
  const [active, setActive] = useState("home");
  const [dark, setDark] = useState(false);
  const [mesAtual, setMesAtual] = useState(6);
  const [aulas, setAulas] = useState({});
  const [cronogramaAberto, setCronogramaAberto] = useState(null);
  const [editandoAulaRegistrada, setEditandoAulaRegistrada] = useState(false);
  const [rascunhoAulaRegistrada, setRascunhoAulaRegistrada] = useState(null);
  const [aulasRegistradas, setAulasRegistradas] = useState([]);
  const [novaAula, setNovaAula] = useState({ data: "", assunto: "", cronogramaUrl: homeworkLinks[0].url, embeds: [] });
  const [novoEmbed, setNovoEmbed] = useState({ titulo: "", url: "" });
  const [cobranca, setCobranca] = useState([]);
  const [diaSelecionado, setDiaSelecionado] = useState(null);
  const [rascunho, setRascunho] = useState({ status: "realizada", conteudo: "", feedback: "" });
  const [carregandoDados, setCarregandoDados] = useState(true);
  const [turma, setTurma] = useState(null);
  const [colegas, setColegas] = useState([]);
  const [mostrarEditarTurma, setMostrarEditarTurma] = useState(false);
  const [mostrarEditarAluno, setMostrarEditarAluno] = useState(false);
  const [rascunhoAluno, setRascunhoAluno] = useState(null);
  const [statusEdicaoAluno, setStatusEdicaoAluno] = useState({ tipo: "", texto: "" });
  const [salvandoAluno, setSalvandoAluno] = useState(false);
  const [rascunhoTurma, setRascunhoTurma] = useState(null);

  const abrirEdicaoTurma = () => {
    if (turma) setRascunhoTurma({ nivel: turma.nivel, dias_horarios: [...turma.dias_horarios] });
    setMostrarEditarTurma(true);
  };

  const salvarTurma = async () => {
    const { error } = await supabase
      .from("turmas")
      .update({ nivel: rascunhoTurma.nivel, dias_horarios: rascunhoTurma.dias_horarios })
      .eq("id", turmaId);
    if (!error) {
      setTurma((t) => ({ ...t, nivel: rascunhoTurma.nivel, dias_horarios: rascunhoTurma.dias_horarios }));
      setMostrarEditarTurma(false);
    }
  };

  const abrirEdicaoAluno = () => {
    setRascunhoAluno({ nome: student.nome, telefone: student.telefone || "", email: "", novoEmail: "" });
    setStatusEdicaoAluno({ tipo: "", texto: "" });
    setMostrarEditarAluno(true);
  };

  const salvarEdicaoAluno = async () => {
    setStatusEdicaoAluno({ tipo: "", texto: "" });
    if (!rascunhoAluno.nome) {
      setStatusEdicaoAluno({ tipo: "erro", texto: "Nome não pode ficar vazio." });
      return;
    }
    setSalvandoAluno(true);
    const { data: sessionData } = await supabase.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/update-student`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${sessionData.session.access_token}` },
      body: JSON.stringify({ studentId, nome: rascunhoAluno.nome, telefone: rascunhoAluno.telefone, novoEmail: rascunhoAluno.novoEmail || null }),
    });
    const resultado = await resp.json();
    setSalvandoAluno(false);
    if (!resp.ok) {
      setStatusEdicaoAluno({ tipo: "erro", texto: resultado.error || "Erro ao salvar." });
      return;
    }
    setStatusEdicaoAluno({ tipo: "sucesso", texto: "Dados atualizados!" });
    setTimeout(() => setMostrarEditarAluno(false), 1200);
  };
  const [mostrarTrocaSenha, setMostrarTrocaSenha] = useState(false);
  const [novaSenha, setNovaSenha] = useState("");
  const [mensagemSenha, setMensagemSenha] = useState("");

  const trocarSenha = async () => {
    setMensagemSenha("");
    if (novaSenha.length < 6) {
      setMensagemSenha("Erro: a senha precisa ter pelo menos 6 caracteres.");
      return;
    }
    const { error } = await supabase.auth.updateUser({ password: novaSenha });
    if (error) {
      setMensagemSenha("Erro: " + error.message);
      return;
    }
    setMensagemSenha("Senha alterada com sucesso!");
    setNovaSenha("");
  };

  const studentId = student.id;
  const turmaId = student.turma_id;

  useEffect(() => {
    async function carregarDados() {
      setCarregandoDados(true);

      const { data: turmaData } = await supabase.from("turmas").select("*").eq("id", turmaId).single();
      setTurma(turmaData || null);

      const { data: colegasData } = await supabase.from("students").select("id, nome").eq("turma_id", turmaId);
      setColegas((colegasData || []).filter((c) => c.id !== studentId));

      const { data: lessonsData } = await supabase
        .from("lessons").select("*").eq("turma_id", turmaId);
      const aulasObj = {};
      (lessonsData || []).forEach((l) => {
        const d = new Date(l.data + "T00:00:00");
        aulasObj[`${d.getMonth()}-${d.getDate()}`] = { status: l.status, conteudo: l.conteudo || "", feedback: l.feedback || "", prazo_reposicao: l.prazo_reposicao, rowId: l.id };
      });
      setAulas(aulasObj);

      const { data: recordsData } = await supabase
        .from("lesson_records").select("*").eq("turma_id", turmaId).order("data", { ascending: false });
      setAulasRegistradas((recordsData || []).map((r) => ({
        data: r.data, assunto: r.assunto, cronogramaUrl: r.cronograma_url, embeds: r.embeds || [], rowId: r.id,
      })));

      const { data: billingData } = await supabase
        .from("billing").select("*").eq("turma_id", turmaId).order("vencimento", { ascending: true });
      setCobranca((billingData || []).map((b) => ({
        mes: b.mes, valor: `R$ ${Number(b.valor).toFixed(2).replace(".", ",")}`, status: b.status,
        vencimento: new Date(b.vencimento + "T00:00:00").toLocaleDateString("pt-BR"), boletoUrl: b.boleto_url, rowId: b.id,
      })));

      setCarregandoDados(false);
    }
    carregarDados();
  }, [turmaId]);

  const anexarBoleto = async (index, file) => {
    const registro = cobranca[index];
    const caminho = `${turmaId}/${registro.rowId}-${file.name}`;
    const { error: erroUpload } = await supabase.storage.from("boletos").upload(caminho, file, { upsert: true });
    if (erroUpload) { alert("Erro ao subir boleto: " + erroUpload.message); return; }
    const { data: urlData } = supabase.storage.from("boletos").getPublicUrl(caminho);
    await supabase.from("billing").update({ boleto_url: urlData.publicUrl }).eq("id", registro.rowId);
    setCobranca((prev) => prev.map((c, i) => (i === index ? { ...c, boletoUrl: urlData.publicUrl, nomeArquivo: file.name } : c)));
  };

  const [novoDiaMover, setNovoDiaMover] = useState("");

  const abrirDia = (chave) => {
    if (role !== "admin") return;
    setDiaSelecionado(chave);
    const existente = aulas[chave];
    setRascunho(existente || { status: "realizada", conteudo: "", feedback: "" });
    if (chave) {
      const [m, d] = chave.split("-").map(Number);
      setNovoDiaMover(`2026-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    }
  };

  const salvarAula = async () => {
    const [m, d] = diaSelecionado.split("-").map(Number);
    const dataISO = `2026-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

    let prazoReposicao = null;
    if (rascunho.status === "aRepor") {
      const dataAula = new Date(dataISO + "T00:00:00");
      dataAula.setDate(dataAula.getDate() + 30);
      prazoReposicao = `${dataAula.getFullYear()}-${String(dataAula.getMonth() + 1).padStart(2, "0")}-${String(dataAula.getDate()).padStart(2, "0")}`;
    }

    const { data, error } = await supabase
      .from("lessons")
      .upsert({ turma_id: turmaId, data: dataISO, status: rascunho.status, conteudo: rascunho.conteudo, feedback: rascunho.feedback, prazo_reposicao: prazoReposicao }, { onConflict: "turma_id,data" })
      .select().single();
    if (!error) {
      setAulas((prev) => ({ ...prev, [diaSelecionado]: { ...rascunho, prazo_reposicao: prazoReposicao, rowId: data.id } }));
    }

    // Se marcada como realizada e o conteúdo foi preenchido, registra também em Aulas + Homework
    if (rascunho.status === "realizada" && rascunho.assunto) {
      const { data: registro, error: erroRegistro } = await supabase
        .from("lesson_records")
        .insert({ turma_id: turmaId, data: dataISO, assunto: rascunho.assunto, cronograma_url: rascunho.cronogramaUrl || null, embeds: [] })
        .select().single();
      if (!erroRegistro) {
        setAulasRegistradas((prev) => [{ data: dataISO, assunto: rascunho.assunto, cronogramaUrl: rascunho.cronogramaUrl, embeds: [], rowId: registro.id }, ...prev]);
        const label = rascunho.assunto.split("—")[0].trim();
        await supabase.from("turmas").update({ unidade_atual: label }).eq("id", turmaId);
        setTurma((t) => (t ? { ...t, unidade_atual: label } : t));
      }
    }

    setDiaSelecionado(null);
  };

  const moverAula = async () => {
    if (!novoDiaMover) return;
    const dataAntiga = (() => {
      const [m, d] = diaSelecionado.split("-").map(Number);
      return `2026-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    })();
    if (novoDiaMover === dataAntiga) return;

    const novaData = new Date(novoDiaMover + "T00:00:00");
    const novaChave = `${novaData.getMonth()}-${novaData.getDate()}`;
    if (aulas[novaChave]) {
      alert("Já existe uma aula marcada nesse dia. Escolha outro dia ou mova/apague a aula existente primeiro.");
      return;
    }

    const { error } = await supabase
      .from("lessons")
      .update({ data: novoDiaMover })
      .eq("turma_id", turmaId)
      .eq("data", dataAntiga);

    if (error) {
      alert("Erro ao mover a aula: " + error.message);
      return;
    }

    setAulas((prev) => {
      const copia = { ...prev };
      const registro = copia[diaSelecionado];
      delete copia[diaSelecionado];
      copia[novaChave] = registro;
      return copia;
    });
    setMesAtual(novaData.getMonth());
    setDiaSelecionado(null);
  };

  const excluirAulaCalendario = async () => {
    const confirmar = window.confirm("Excluir esta aula do calendário? Isso não apaga nenhum registro de Aulas + Homework vinculado.");
    if (!confirmar) return;
    const { error } = await supabase.from("lessons").delete().eq("turma_id", turmaId).eq("data", (() => {
      const [m, d] = diaSelecionado.split("-").map(Number);
      return `2026-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    })());
    if (!error) {
      setAulas((prev) => { const copia = { ...prev }; delete copia[diaSelecionado]; return copia; });
      setDiaSelecionado(null);
    }
  };

  const adicionarEmbed = () => {
    if (!novoEmbed.url) return;
    setNovaAula((a) => ({ ...a, embeds: [...a.embeds, novoEmbed] }));
    setNovoEmbed({ titulo: "", url: "" });
  };

  const registrarAula = async () => {
    if (!novaAula.data || !novaAula.assunto) return;
    const { data, error } = await supabase
      .from("lesson_records")
      .insert({ turma_id: turmaId, data: novaAula.data, assunto: novaAula.assunto, cronograma_url: novaAula.cronogramaUrl, embeds: novaAula.embeds })
      .select().single();
    if (!error) {
      setAulasRegistradas((prev) => [{ ...novaAula, rowId: data.id }, ...prev]);
      const label = novaAula.assunto.split("—")[0].trim();
      await supabase.from("turmas").update({ unidade_atual: label }).eq("id", turmaId);
      setTurma((t) => (t ? { ...t, unidade_atual: label } : t));
    }
    setNovaAula({ data: "", assunto: "", cronogramaUrl: homeworkLinks[0].url, embeds: [] });
  };

  const salvarEdicaoAulaRegistrada = async () => {
    const { error } = await supabase
      .from("lesson_records")
      .update({ data: rascunhoAulaRegistrada.data, assunto: rascunhoAulaRegistrada.assunto, cronograma_url: rascunhoAulaRegistrada.cronogramaUrl })
      .eq("id", rascunhoAulaRegistrada.rowId);
    if (!error) {
      setAulasRegistradas((prev) => prev.map((a) => (a.rowId === rascunhoAulaRegistrada.rowId ? { ...rascunhoAulaRegistrada } : a)));
      setCronogramaAberto({ ...rascunhoAulaRegistrada });
    }
    setEditandoAulaRegistrada(false);
  };

  const excluirAulaRegistrada = async () => {
    const confirmar = window.confirm(`Excluir o registro de "${cronogramaAberto.assunto}"? Essa ação não pode ser desfeita.`);
    if (!confirmar) return;
    const { error } = await supabase.from("lesson_records").delete().eq("id", cronogramaAberto.rowId);
    if (!error) {
      setAulasRegistradas((prev) => prev.filter((a) => a.rowId !== cronogramaAberto.rowId));
      setCronogramaAberto(null);
    }
  };

  const baixarHistoricoPDF = () => {
    const doc = new window.jspdf.jsPDF();
    let y = 20;

    doc.setFontSize(16);
    doc.text(`Histórico de aulas — ${student.nome}`, 14, y);
    y += 8;
    doc.setFontSize(11);
    doc.text(`Nível: ${student.nivel || "-"}  |  Unidade atual: ${(turma && turma.unidade_atual) || "-"}`, 14, y);
    y += 6;
    doc.text(`Gerado em: ${new Date().toLocaleDateString("pt-BR")}`, 14, y);
    y += 10;

    doc.setFontSize(13);
    doc.text("Aulas + Homework registrados", 14, y);
    y += 8;
    doc.setFontSize(10);
    if (aulasRegistradas.length === 0) {
      doc.text("Nenhum registro.", 14, y);
      y += 6;
    }
    aulasRegistradas.forEach((a) => {
      if (y > 270) { doc.addPage(); y = 20; }
      doc.setFont(undefined, "bold");
      doc.text(`${a.data} — ${a.assunto}`, 14, y);
      y += 6;
      doc.setFont(undefined, "normal");
      if (a.cronogramaUrl) {
        doc.text(`Cronograma: ${a.cronogramaUrl}`, 14, y);
        y += 6;
      }
      y += 3;
    });

    y += 6;
    if (y > 260) { doc.addPage(); y = 20; }
    doc.setFontSize(13);
    doc.text("Calendário de aulas", 14, y);
    y += 8;
    doc.setFontSize(10);
    const entradasCalendario = Object.entries(aulas)
      .map(([chave, r]) => {
        const [m, d] = chave.split("-").map(Number);
        return { data: `${String(d).padStart(2, "0")}/${String(m + 1).padStart(2, "0")}/2026`, status: statusDe(r), feedback: typeof r === "object" ? r.feedback : "", ordem: m * 100 + d };
      })
      .sort((a, b) => a.ordem - b.ordem);
    entradasCalendario.forEach((e) => {
      if (y > 275) { doc.addPage(); y = 20; }
      const label = statusConfig[e.status] ? statusConfig[e.status].label : e.status;
      doc.text(`${e.data} — ${label}${e.feedback ? " — " + e.feedback : ""}`, 14, y);
      y += 6;
    });

    doc.save(`historico-${student.nome.replace(/\s+/g, "-").toLowerCase()}.pdf`);
  };

  const excluirAluno = async () => {
    const confirmacao = window.confirm(`Tem certeza que quer excluir ${student.nome}? Isso apaga login, aulas, homework e cobrança — não pode ser desfeito.`);
    if (!confirmacao) return;
    const { data: sessionData } = await supabase.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/delete-student`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${sessionData.session.access_token}` },
      body: JSON.stringify({ studentId }),
    });
    if (!resp.ok) {
      const resultado = await resp.json();
      alert("Erro ao excluir: " + (resultado.error || "tente novamente."));
      return;
    }
    alert(`${student.nome} foi excluído(a).`);
    onBack();
  };

  const bg = dark ? palette.purple : palette.cream;
  const cardBg = dark ? "#2A1D66" : "#FFFFFF";
  const textSecondary = dark ? `${palette.lavender}CC` : `${palette.purple}99`;
  const cobrancaVencida = cobranca.find((c) => c.status === "pendente");
  const reposicoesPendentes = Object.entries(aulas)
    .filter(([, r]) => typeof r === "object" && r.status === "aRepor" && r.prazo_reposicao)
    .map(([chave, r]) => ({ chave, prazo: r.prazo_reposicao }));

  const diasNoMes = new Date(2026, mesAtual + 1, 0).getDate();
  const primeiroDiaSemana = new Date(2026, mesAtual, 1).getDay();
  const celulas = [];
  for (let i = 0; i < primeiroDiaSemana; i++) celulas.push(null);
  for (let d = 1; d <= diasNoMes; d++) celulas.push(d);

  const statusDe = (registro) => (typeof registro === "object" ? registro.status : registro);

  // Streak: conta aulas seguidas sem "Perdida", olhando o histórico em ordem cronológica
  const diasComStatus = Object.entries(aulas)
    .filter(([, r]) => statusDe(r) === "realizada" || statusDe(r) === "perdida")
    .map(([chave, r]) => {
      const [m, d] = chave.split("-").map(Number);
      return { ordem: m * 100 + d, status: statusDe(r) };
    })
    .sort((a, b) => b.ordem - a.ordem);
  let streak = 0;
  for (const item of diasComStatus) {
    if (item.status === "realizada") streak++;
    else break;
  }

  // Progresso: pega a última unidade registrada em Aulas + Homework (ex: "Unit 4A — ...")
  const totalUnidadesBeginner = 26;
  const ultimaAula = aulasRegistradas[0];
  const matchUnidade = ultimaAula && ultimaAula.assunto.match(/Unit\s*(\d+)/i);
  const unidadeAtual = ultimaAula ? ultimaAula.assunto.split("—")[0].trim() : "Ainda não iniciado";
  const progressoPercentual = matchUnidade ? Math.min(100, Math.round((Number(matchUnidade[1]) / totalUnidadesBeginner) * 100)) : 0;

  const feedbacksRecentes = Object.entries(aulas)
    .filter(([, r]) => typeof r === "object" && r.feedback)
    .map(([chave, r]) => {
      const [m, d] = chave.split("-").map(Number);
      return { data: `${String(d).padStart(2, "0")}/${String(m + 1).padStart(2, "0")}`, texto: r.feedback, ordem: m * 100 + d };
    })
    .sort((a, b) => b.ordem - a.ordem)
    .slice(0, 4);

  return (
    <div style={{ minHeight: "100vh", width: "100%", background: bg, padding: "24px", transition: "background 0.2s ease" }}>
      <div style={{ width: "100%" }}>
        <div style={{ background: palette.purple, borderRadius: "18px", padding: "24px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "20px", position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: 0, right: 0, width: "120px", height: "120px", background: palette.orange, borderRadius: "0 0 0 120px", opacity: 0.15 }} />
          <div style={{ position: "relative", zIndex: 1 }}>
            <p style={{ color: palette.lightGreen, fontSize: "12px", fontWeight: 600, marginBottom: "4px", letterSpacing: "0.06em", textTransform: "uppercase" }}>Teacher Mari Lessons</p>
            <h1 style={{ color: "#FFF", fontSize: "22px", fontWeight: 600 }}>
              {role === "admin" ? `Portal de ${student.nome}` : `Welcome back, ${student.nome.split(" ")[0]}!`}
            </h1>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "12px", position: "relative", zIndex: 1 }}>
            <button onClick={() => setDark(!dark)} style={{ width: "36px", height: "36px", borderRadius: "10px", border: "none", background: "rgba(255,255,255,0.12)", cursor: "pointer", color: "#FFF", fontSize: "16px" }}>

            </button>
            {role === "admin" && onBack && (

            {role === "admin" && (

            {role === "admin" && (

            {role === "admin" && (

            {role === "admin" && (

            <button onClick={onLogout} style={{ fontSize: "12px", color: "#FFF", background: "rgba(255,255,255,0.12)", border: "none", borderRadius: "10px", padding: "8px 12px", cursor: "pointer" }}>Sair</button>
            <div style={{ width: "44px", height: "44px", borderRadius: "50%", background: palette.orange, display: "flex", alignItems: "center", justifyContent: "center", color: "#FFF", fontWeight: 600 }}>C</div>
          </div>
        </div>

        {mostrarEditarTurma && rascunhoTurma && (
          <div style={{ background: cardBg, borderRadius: "12px", padding: "16px", marginBottom: "16px" }}>

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Nível</label>
            <select value={rascunhoTurma.nivel} onChange={(e) => setRascunhoTurma((t) => ({ ...t, nivel: e.target.value }))}
              style={{ width: "100%", maxWidth: "280px", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "14px" }}>
              <option>Beginner</option>
              <option>Elementary</option>
              <option>Pre-Intermediate</option>

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Dia(s) e horário(s)</label>
            {rascunhoTurma.dias_horarios.map((dh, i) => (
              <div key={i} style={{ display: "flex", gap: "8px", marginBottom: "8px", maxWidth: "380px" }}>
                <select value={dh.dia} onChange={(e) => setRascunhoTurma((t) => { const dhs = [...t.dias_horarios]; dhs[i] = { ...dhs[i], dia: e.target.value }; return { ...t, dias_horarios: dhs }; })}
                  style={{ flex: 2, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }}>
                  {["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"].map((d) => <option key={d}>{d}</option>)}
                </select>
                <input type="time" value={dh.horario} onChange={(e) => setRascunhoTurma((t) => { const dhs = [...t.dias_horarios]; dhs[i] = { ...dhs[i], horario: e.target.value }; return { ...t, dias_horarios: dhs }; })}
                  style={{ flex: 1, padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif" }} />
                {rascunhoTurma.dias_horarios.length > 1 && (
                  <button onClick={() => setRascunhoTurma((t) => ({ ...t, dias_horarios: t.dias_horarios.filter((_, idx) => idx !== i) }))}
                    style={{ padding: "0 12px", borderRadius: "8px", border: "none", cursor: "pointer", background: "#F7C1C1", color: "#791F1F", fontSize: "12px", fontWeight: 600 }}>×</button>

              </div>
            ))}
            <button onClick={() => setRascunhoTurma((t) => ({ ...t, dias_horarios: [...t.dias_horarios, { dia: "Segunda", horario: "19:00" }] }))}

            <div style={{ display: "flex", gap: "8px" }}>

              <button onClick={() => setMostrarEditarTurma(false)} style={{ padding: "10px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: dark ? "#5A4AA0" : palette.cream, color: dark ? "#FFF" : palette.purple }}>Cancelar</button>
            </div>
          </div>
        )}

        {mostrarEditarAluno && rascunhoAluno && (

            <p style={{ marginBottom: "10px", fontSize: "13px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>Editar dados de {student.nome}</p>

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Nome</label>
            <input type="text" value={rascunhoAluno.nome} onChange={(e) => setRascunhoAluno((r) => ({ ...r, nome: e.target.value }))}
              style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "12px" }} />

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Telefone</label>
            <input type="tel" value={rascunhoAluno.telefone} onChange={(e) => setRascunhoAluno((r) => ({ ...r, telefone: e.target.value }))}
              style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "12px" }} />

            <label style={{ display: "block", fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, marginBottom: "6px" }}>Novo e-mail (deixe em branco pra manter o atual)</label>
            <input type="email" value={rascunhoAluno.novoEmail} onChange={(e) => setRascunhoAluno((r) => ({ ...r, novoEmail: e.target.value }))}
              placeholder="novo@email.com"
              style={{ width: "100%", padding: "9px 12px", borderRadius: "8px", border: `1px solid ${palette.lavender}55`, fontSize: "13px", fontFamily: "'Poppins', sans-serif", marginBottom: "12px" }} />

            {statusEdicaoAluno.texto && (
              <p style={{ fontSize: "12px", marginBottom: "12px", color: statusEdicaoAluno.tipo === "erro" ? "#E24B4A" : palette.green }}>{statusEdicaoAluno.texto}</p>
            )}

            <div style={{ display: "flex", gap: "8px" }}>
              <button onClick={salvarEdicaoAluno} disabled={salvandoAluno} style={{ padding: "10px 16px", borderRadius: "8px", border: "none", cursor: salvandoAluno ? "default" : "pointer", fontSize: "13px", fontWeight: 600, background: palette.orange, color: "#FFF", opacity: salvandoAluno ? 0.7 : 1 }}>
                {salvandoAluno ? "Salvando..." : "Salvar"}
              </button>
              <button onClick={() => setMostrarEditarAluno(false)} style={{ padding: "10px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: dark ? "#5A4AA0" : palette.cream, color: dark ? "#FFF" : palette.purple }}>Cancelar</button>
            </div>
          </div>
        )}

        {cobrancaVencida && (!turma || turma.modalidade !== "grupo") && (
          <div onClick={() => setActive("cobranca")} style={{ display: "flex", alignItems: "center", gap: "10px", background: `${palette.orange}1A`, border: `1px solid ${palette.orange}`, borderRadius: "12px", padding: "12px 16px", marginBottom: "16px", cursor: "pointer" }}>
            <span style={{ fontSize: "13px", color: dark ? "#FFF" : palette.purple, fontWeight: 500 }}>
              🔔 Pagamento vence em {cobrancaVencida.vencimento} — {cobrancaVencida.mes}
            </span>
          </div>
        )}

        {reposicoesPendentes.length > 0 && (
          <div onClick={() => setActive("calendario")} style={{ display: "flex", alignItems: "center", gap: "10px", background: "#F7C1C11A", border: "1px solid #F7C1C1", borderRadius: "12px", padding: "12px 16px", marginBottom: "16px", cursor: "pointer" }}>
            <span style={{ fontSize: "13px", color: dark ? "#FFF" : palette.purple, fontWeight: 500 }}>
              📌 {reposicoesPendentes.length === 1 ? "1 aula a repor" : `${reposicoesPendentes.length} aulas a repor`} — prazo até {new Date(reposicoesPendentes[0].prazo + "T00:00:00").toLocaleDateString("pt-BR")}{reposicoesPendentes.length > 1 ? " (a mais próxima)" : ""}
            </span>
          </div>
        )}

        <div style={{ display: "flex", gap: "6px", marginBottom: "20px", overflowX: "auto" }}>
          {tabs.filter((tab) => tab.id !== "cobranca" || !turma || turma.modalidade !== "grupo").map((tab) => {
            const isActive = active === tab.id;
            return (
              <button key={tab.id} onClick={() => setActive(tab.id)}
                style={{ padding: "10px 14px", borderRadius: "10px", border: "none", cursor: "pointer", fontWeight: 600, fontSize: "13px", whiteSpace: "nowrap", background: isActive ? palette.orange : cardBg, color: isActive ? "#FFF" : (dark ? "#FFF" : palette.purple), flexShrink: 0 }}>
                {tab.label}
              </button>
            );
          })}
        </div>

        <div style={{ background: cardBg, borderRadius: "16px", padding: "24px", minHeight: "340px" }}>
          {active === "home" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "18px" }}>
              <div style={{ display: "flex", gap: "12px", flexWrap: "wrap" }}>
                <div style={{ flex: "1 1 140px", background: dark ? "#3A2B7A" : palette.cream, borderRadius: "12px", padding: "16px" }}>
                  <p style={{ fontSize: "12px", color: textSecondary }}>Level</p>
                  <p style={{ marginTop: "4px", fontSize: "16px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{student.nivel || "-"}</p>
                </div>
                <div style={{ flex: "1 1 140px", background: dark ? "#3A2B7A" : palette.cream, borderRadius: "12px", padding: "16px" }}>
                  <p style={{ fontSize: "12px", color: textSecondary }}>Current unit</p>
                  <p style={{ marginTop: "4px", fontSize: "16px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{unidadeAtual}</p>
                </div>
                <div style={{ flex: "1 1 140px", background: dark ? "#3A2B7A" : palette.cream, borderRadius: "12px", padding: "16px", display: "flex", alignItems: "center", gap: "8px" }}>
                  <span style={{ fontSize: "20px" }}>🔥</span>
                  <div>
                    <p style={{ fontSize: "12px", color: textSecondary }}>Streak</p>
                    <p style={{ fontSize: "16px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{streak} aulas seguidas</p>
                  </div>
                </div>
              </div>

              <div>
                <p style={{ marginBottom: "8px", fontSize: "13px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>Course progress</p>
                <div style={{ height: "10px", borderRadius: "6px", background: dark ? "#3A2B7A" : palette.cream, overflow: "hidden" }}>
                  <div style={{ width: `${progressoPercentual}%`, height: "100%", background: palette.orange, borderRadius: "6px", transition: "width 0.3s ease" }} />
                </div>
                <p style={{ marginTop: "6px", fontSize: "12px", color: textSecondary }}>{unidadeAtual} of English File Beginner ({progressoPercentual}%)</p>
              </div>

              <div style={{ background: dark ? "#3A2B7A" : palette.cream, borderRadius: "12px", padding: "16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div>
                  <p style={{ fontSize: "12px", color: textSecondary }}>Next lesson</p>
                  <p style={{ marginTop: "4px", fontSize: "15px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>Wed, Jul 16 — 7:00 PM</p>
                </div>
                <span style={{ color: dark ? "#FFF" : palette.purple }}>→</span>
              </div>

              <div>
                <p style={{ marginBottom: "8px", fontSize: "13px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>💬 Recados da Teacher Mari</p>
                <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                  {feedbacksRecentes.length === 0 && (
                    <p style={{ fontSize: "13px", color: textSecondary }}>Nenhum recado ainda.</p>
                  )}
                  {feedbacksRecentes.map((f, i) => (
                    <div key={i} style={{ borderLeft: `3px solid ${palette.lightGreen}`, paddingLeft: "12px" }}>
                      <p style={{ fontSize: "11px", color: palette.orange, fontWeight: 600 }}>{f.data}</p>
                      <p style={{ marginTop: "2px", fontSize: "13px", color: textSecondary }}>{f.texto}</p>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}`, paddingTop: "16px" }}>

                  style={{ fontSize: "12px", fontWeight: 600, color: dark ? "#FFF" : palette.purple, background: "none", border: "none", cursor: "pointer", padding: 0 }}>
                  {mostrarTrocaSenha ? "Cancelar" : "Alterar minha senha"}

                      </div>

                      <button onClick={excluirAulaCalendario} style={{ marginTop: "14px", padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "13px", fontWeight: 600, background: "#F7C1C1", color: "#791F1F" }}>

              <p style={{ marginTop: "14px", fontSize: "11px", color: textSecondary }}>

          {active === "cobranca" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>

                <div key={i} style={{ padding: "14px 16px", borderRadius: "12px", background: dark ? "#3A2B7A" : palette.cream }}>

                    <div>
                      <p style={{ fontSize: "14px", fontWeight: 600, color: dark ? "#FFF" : palette.purple }}>{c.mes}</p>
                      <p style={{ fontSize: "13px", color: textSecondary }}>{c.valor} · vencimento {c.vencimento}</p>
                    </div>
                    <span style={{ fontSize: "12px", fontWeight: 600, padding: "5px 12px", borderRadius: "20px", background: c.status === "pendente" ? palette.orange : (dark ? "#5A4AA0" : "#EEE"), color: c.status === "pendente" ? "#FFF" : textSecondary }}>
                      {c.status === "pendente" ? "Vence em breve" : "Próxima cobrança"}
                    </span>
                  </div>

                  {role === "admin" ? (
                    <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}` }}>
                      <label style={{ display: "inline-block", fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: palette.purple, color: "#FFF", cursor: "pointer" }}>
                        {c.boletoUrl ? "Substituir boleto" : "Subir boleto"}
                        <input type="file" accept="application/pdf,image/*" style={{ display: "none" }}
                          onChange={(e) => e.target.files[0] && anexarBoleto(i, e.target.files[0])} />
                      </label>
                      {c.nomeArquivo && (
                        <span style={{ marginLeft: "10px", fontSize: "12px", color: textSecondary }}>{c.nomeArquivo}</span>
                      )}
                    </div>
                  ) : (
                    c.boletoUrl && (
                      <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: `0.5px solid ${dark ? "#5A4AA0" : "#E5DCC8"}`, display: "flex", gap: "8px" }}>
                        <a href={c.boletoUrl} target="_blank" rel="noopener noreferrer"
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: dark ? "#5A4AA0" : "#FFF", color: dark ? "#FFF" : palette.purple, textDecoration: "none" }}>
                          Visualizar boleto

                        <a href={c.boletoUrl} download={c.nomeArquivo || "boleto.pdf"}
                          style={{ fontSize: "12px", fontWeight: 600, padding: "8px 14px", borderRadius: "8px", background: palette.orange, color: "#FFF", textDecoration: "none" }}>
                          Baixar boleto
                        </a>
                      </div>
                    )
                  )}
                  {role !== "admin" && !c.boletoUrl && (
                    <p style={{ marginTop: "10px", fontSize: "12px", color: textSecondary }}>Boleto ainda não disponível.</p>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- APP (controla navegação entre login e dashboard) ----------
function App() {
  const { useEffect } = React;
  const [logado, setLogado] = useState(false);
  const [papel, setPapel] = useState("aluno");
  const [alunoSelecionado, setAlunoSelecionado] = useState(null);
  const [carregandoLogin, setCarregandoLogin] = useState(false);
  const [verificandoSessao, setVerificandoSessao] = useState(true);

  useEffect(() => {
    async function restaurarSessao() {
      const { data: sessionData } = await supabase.auth.getSession();
      const user = sessionData.session && sessionData.session.user;
      if (!user) {
        setVerificandoSessao(false);
        return;
      }
      const { data: studentData } = await supabase.from("students").select("*").eq("id", user.id).single();
      if (studentData) {
        setAlunoSelecionado(studentData);
        setPapel("aluno");
      } else {
        setPapel("admin");
      }
      setLogado(true);
      setVerificandoSessao(false);
    }
    restaurarSessao();
  }, []);

  const sair = async () => {
    await supabase.auth.signOut();
    setLogado(false);
    setAlunoSelecionado(null);
  };

  if (verificandoSessao) {
    return (
      <div style={{ minHeight: "100vh", width: "100%", background: palette.cream, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <p style={{ fontFamily: "'Poppins', sans-serif", color: palette.purple, fontSize: "14px" }}>Carregando...</p>
      </div>
    );
  }

  if (!logado) {
    return (
      <PortalLogin
        onLogin={async (r, user) => {
          if (r === "aluno") {
            setCarregandoLogin(true);
            const { data, error } = await supabase.from("students").select("*").eq("id", user.id).single();
            setCarregandoLogin(false);
            if (error && error.code !== "PGRST116") {
              // erro técnico (rede, permissão) — não é "aluno inexistente"
              alert("Erro ao carregar seus dados: " + error.message + "\nTente novamente em alguns segundos.");
              await supabase.auth.signOut();
              return;
            }
            if (!data) {
              alert("Esse login não está vinculado a nenhum aluno cadastrado. Fale com a Teacher Mari.");
              await supabase.auth.signOut();
              return;
            }
            setAlunoSelecionado(data);
          }
          setPapel(r);
          setLogado(true);
        }}
      />
    );
  }

  if (papel === "admin" && !alunoSelecionado) {
    return <AdminPanel onLogout={sair} onSelectStudent={setAlunoSelecionado} />;
  }

  return (
    <StudentDashboard
      onLogout={sair}
      role={papel}
      student={alunoSelecionado}
      onBack={papel === "admin" ? () => setAlunoSelecionado(null) : null}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
