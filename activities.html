    answers.forEach((block,i)=>{const sel=block.querySelector('.poll-opt.selected');const ta=block.querySelector('.poll-textarea');text+=`Q${i+1}: ${sel?sel.textContent:'—'}${ta.value?' — '+ta.value:''}\n`;});
    navigator.clipboard.writeText(text).then(()=>alert('Copied!'));
  };
  c.appendChild(shareBtn);
}

/* ── STORY SEQUENCING ── */
function gameStorySequence(c,content){
  const sentences=(content.sentences||[]).filter(s=>s.trim());
  if(!sentences.length){c.innerHTML='<p class="empty-msg">No sentences.</p>';return;}
  const sh=shuffle(sentences.map((s,i)=>({text:s,idx:i})));
  const answer=[];
  c.innerHTML=`${content.title?`<h3 style="color:var(--cream);margin-bottom:12px;">${H(content.title)}</h3>`:''}`;
  const scoreEl=document.createElement('div');scoreEl.className='play-score';c.appendChild(scoreEl);
  const wrap=document.createElement('div');wrap.className='story-wrap';
  const bankLabel=document.createElement('p');bankLabel.style.cssText='color:rgba(250,234,211,.5);font-size:12px;margin-bottom:6px;';bankLabel.textContent='Sentences — click to add to your story:';
  const bank=document.createElement('div');bank.className='story-bank';
  const ansLabel=document.createElement('p');ansLabel.style.cssText='color:rgba(250,234,211,.5);font-size:12px;margin:12px 0 6px;';ansLabel.textContent='Your story order (click to remove):';
  const az=document.createElement('div');az.className='story-answer';
  function render(){
    bank.innerHTML='';az.innerHTML='';
    sh.forEach((s,i)=>{if(!answer.includes(i)){const card=document.createElement('div');card.className='story-card';card.textContent=s.text;card.onclick=()=>{answer.push(i);render();};bank.appendChild(card);}});
    if(!bank.children.length)bank.innerHTML='<span style="color:rgba(250,234,211,.3);font-size:12px;">All sentences placed</span>';
    answer.forEach((si,pos)=>{const card=document.createElement('div');card.className='story-card in-answer';card.textContent=`${pos+1}. ${sh[si].text}`;card.onclick=()=>{answer.splice(pos,1);render();};az.appendChild(card);});
    if(!az.children.length)az.innerHTML='<span style="color:rgba(250,234,211,.3);font-size:12px;">Click sentences above to build your story</span>';
  }
  render();
  const checkBtn=document.createElement('button');checkBtn.className='btn btn-primary';checkBtn.style.marginTop='12px';checkBtn.textContent='Check order';
  checkBtn.onclick=()=>{
    if(answer.length!==sentences.length){alert('Place all sentences first.');return;}
    let correct=0;
    az.querySelectorAll('.story-card').forEach((card,pos)=>{const ok=sh[answer[pos]].idx===pos;card.classList.toggle('sel-ok',ok);card.classList.toggle('sel-wrong',!ok);if(ok)correct++;});
    scoreEl.textContent=`${correct} / ${sentences.length} in correct position`;
    if(correct===sentences.length)setTimeout(()=>showResult(c,correct,sentences.length,()=>gameStorySequence(c,content)),800);
  };
  wrap.appendChild(bankLabel);wrap.appendChild(bank);wrap.appendChild(ansLabel);wrap.appendChild(az);wrap.appendChild(checkBtn);c.appendChild(wrap);
}

/* ── MEMORY GAME ── */
async function gameMemory(c,content){
  const pairs=(content.pairs||[]).filter(p=>p.a.trim()&&p.b.trim());
  if(!pairs.length){c.innerHTML='<p class="empty-msg">No pairs.</p>';return;}
  c.innerHTML='<p class="play-score">Preparing…</p>';
  const imgUrls={};
  await Promise.all(pairs.map(async(p,i)=>{if(p.imageKeyword){try{const r=await fetch(`https://pixabay.com/api/?key=${PIXABAY_KEY}&q=${encodeURIComponent(p.imageKeyword)}&per_page=3&page=1&safesearch=true&image_type=photo`);const d=await r.json();imgUrls[i]=d.hits?.[0]?.previewURL||'';}catch{imgUrls[i]='';}}}) );
  c.innerHTML='';
  // Build card deck: pair A + pair B for each pair, shuffled
  const deck=[];
  pairs.forEach((p,i)=>{deck.push({val:p.a,pairIdx:i,side:'a',img:imgUrls[i]});deck.push({val:p.b,pairIdx:i,side:'b'});});
  const sh=shuffle(deck);
  const cols=Math.ceil(Math.sqrt(sh.length*1.2));
  const grid=document.createElement('div');grid.className='memory-grid';grid.style.gridTemplateColumns=`repeat(${Math.min(cols,6)},90px)`;
  let flippedCards=[],matched=new Set(),locked=false,moves=0;
  const scoreEl=document.createElement('div');scoreEl.className='play-score';scoreEl.textContent=`Pairs: 0 / ${pairs.length}`;c.appendChild(scoreEl);
  sh.forEach((card,i)=>{
    const mc=document.createElement('div');mc.className='mem-card';
    const inner=document.createElement('div');inner.className='mem-inner';
    const back=document.createElement('div');back.className='mem-face mem-back';back.textContent='?';
    const front=document.createElement('div');front.className='mem-face mem-front';
    if(card.img){const img=document.createElement('img');img.src=card.img;img.alt=card.val;front.appendChild(img);}
    else{front.textContent=card.val;}
    inner.appendChild(back);inner.appendChild(front);mc.appendChild(inner);
    mc.onclick=()=>{
      if(locked||mc.classList.contains('flipped')||matched.has(i))return;
      mc.classList.add('flipped');flippedCards.push({el:mc,card,idx:i});
      if(flippedCards.length===2){moves++;locked=true;
        const[a,b]=flippedCards;
        if(a.card.pairIdx===b.card.pairIdx&&a.card.side!==b.card.side){
          a.el.classList.add('matched');b.el.classList.add('matched');matched.add(a.idx);matched.add(b.idx);flippedCards=[];locked=false;
          scoreEl.textContent=`Pairs: ${matched.size/2} / ${pairs.length}`;
          if(matched.size===sh.length)setTimeout(()=>showResult(c,pairs.length,pairs.length,()=>gameMemory(c,content)),600);
        }else{setTimeout(()=>{a.el.classList.remove('flipped');b.el.classList.remove('flipped');flippedCards=[];locked=false;},900);}
      }
    };
    grid.appendChild(mc);
  });
  c.appendChild(grid);
}

/* ── HANGMAN ── */
function gameHangman(c,content){
  const words=(content.words||[]).filter(w=>w.trim()).map(w=>w.toUpperCase());
  if(!words.length){c.innerHTML='<p class="empty-msg">No words.</p>';return;}
  const word=words[Math.floor(Math.random()*words.length)];
  let errors=0,guessed=new Set();const MAX=6;
  c.innerHTML='';
  const wrap=document.createElement('div');wrap.className='hangman-wrap';c.appendChild(wrap);
  function svgParts(n){const base=`<svg class="hangman-svg" width="200" height="200" viewBox="0 0 200 200"><line x1="20" y1="190" x2="180" y2="190" stroke="var(--cream)" stroke-width="4"/><line x1="60" y1="190" x2="60" y2="20" stroke="var(--cream)" stroke-width="4"/><line x1="60" y1="20" x2="130" y2="20" stroke="var(--cream)" stroke-width="4"/><line x1="130" y1="20" x2="130" y2="45" stroke="var(--cream)" stroke-width="4"/>`;const parts=['<circle cx="130" cy="58" r="13" stroke="var(--cream)" stroke-width="3" fill="none"/>','<line x1="130" y1="71" x2="130" y2="120" stroke="var(--cream)" stroke-width="3"/>','<line x1="130" y1="80" x2="105" y2="100" stroke="var(--cream)" stroke-width="3"/>','<line x1="130" y1="80" x2="155" y2="100" stroke="var(--cream)" stroke-width="3"/>','<line x1="130" y1="120" x2="110" y2="150" stroke="var(--cream)" stroke-width="3"/>','<line x1="130" y1="120" x2="150" y2="150" stroke="var(--cream)" stroke-width="3"/>'];return base+parts.slice(0,n).join('')+'</svg>';}
  function render(){
    wrap.innerHTML='';
    wrap.innerHTML=svgParts(errors);
    const wordEl=document.createElement('div');wordEl.className='hangman-word';
    word.split('').forEach(l=>{const lb=document.createElement('div');lb.className='hangman-letter';lb.textContent=guessed.has(l)?l:'';wordEl.appendChild(lb);});
    wrap.appendChild(wordEl);
    const status=document.createElement('p');status.style.cssText='color:var(--cream);font-size:13px;';
    const won=word.split('').every(l=>guessed.has(l));
    const lost=errors>=MAX;
    if(won)status.textContent=`🎉 You got it! The word was ${word}`;
    else if(lost)status.textContent=`💀 Game over! The word was ${word}`;
    else status.textContent=`${MAX-errors} mistake${MAX-errors===1?'':'s'} left`;
    wrap.appendChild(status);
    const kbd=document.createElement('div');kbd.className='hangman-keyboard';
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{const btn=document.createElement('button');btn.className='hangman-key';btn.textContent=l;if(guessed.has(l)){btn.classList.add(word.includes(l)?'used-ok':'used-wrong');btn.classList.add('disabled');}btn.onclick=()=>{if(won||lost||guessed.has(l))return;guessed.add(l);if(!word.includes(l))errors++;render();};kbd.appendChild(btn);});
    wrap.appendChild(kbd);
    if(won||lost){const again=document.createElement('button');again.className='check-btn';again.textContent='Play again 🔄';again.onclick=()=>gameHangman(c,content);wrap.appendChild(again);}
  }
  render();
}

/* ── CROSSWORD ── */
function gameCrossword(c,content){
  const clues=(content.clues||[]).filter(cl=>cl.word&&cl.clue);
  if(!clues.length){c.innerHTML='<p class="empty-msg">No clues.</p>';return;}
  const SIZE=15;const grid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  clues.forEach(cl=>{const word=(cl.word||'').toUpperCase();const r=parseInt(cl.row)||0,col=parseInt(cl.col)||0,dir=cl.direction==='down';for(let i=0;i<word.length;i++){const nr=dir?r+i:r,nc=dir?col:col+i;if(nr<SIZE&&nc<SIZE)grid[nr][nc]={letter:word[i],number:null};}});
  clues.forEach((cl,idx)=>{const r=parseInt(cl.row)||0,col=parseInt(cl.col)||0;if(grid[r]?.[col])grid[r][col].number=idx+1;});
  const minR=clues.reduce((a,cl)=>Math.min(a,parseInt(cl.row)||0),99),maxR=clues.reduce((a,cl)=>Math.max(a,parseInt(cl.row)||0+(cl.direction==='down'?(cl.word||'').length:0)),0);
  const minC=clues.reduce((a,cl)=>Math.min(a,parseInt(cl.col)||0),99),maxC=clues.reduce((a,cl)=>Math.max(a,parseInt(cl.col)||0+(cl.direction==='across'?(cl.word||'').length:0)),0);
  c.innerHTML='';
  const gWrap=document.createElement('div');gWrap.style.overflowX='auto';
  const gEl=document.createElement('div');gEl.className='cw-grid';gEl.style.gridTemplateColumns=`repeat(${maxC-minC+1},1fr)`;
  for(let r=minR;r<=maxR;r++){for(let co=minC;co<=maxC;co++){const cell=document.createElement('div');cell.className='cw-cell';const data=grid[r]?.[co];if(data){cell.classList.add('white');if(data.number){const num=document.createElement('span');num.className='cw-num';num.textContent=data.number;cell.appendChild(num);}const inp=document.createElement('input');inp.maxLength=1;inp.dataset.r=r;inp.dataset.c=co;inp.dataset.answer=data.letter;inp.oninput=e=>{e.target.value=e.target.value.toUpperCase().slice(-1);};cell.appendChild(inp);}else{cell.classList.add('black');}gEl.appendChild(cell);}}
  gWrap.appendChild(gEl);c.appendChild(gWrap);
  const clueDiv=document.createElement('div');clueDiv.className='cw-clues';
  const across=clues.filter(cl=>cl.direction==='across');const down=clues.filter(cl=>cl.direction==='down');
  clueDiv.innerHTML=`<div><h4>Across</h4>${across.map((cl,i)=>`<div class="cw-clue"><b>${clues.indexOf(cl)+1}.</b> ${H(cl.clue)}</div>`).join('')}</div><div><h4>Down</h4>${down.map(cl=>`<div class="cw-clue"><b>${clues.indexOf(cl)+1}.</b> ${H(cl.clue)}</div>`).join('')}</div>`;
  c.appendChild(clueDiv);
  const checkBtn=document.createElement('button');checkBtn.className='check-btn';checkBtn.textContent='Check ✓';let score=0;
  checkBtn.onclick=()=>{score=0;let total=0;gEl.querySelectorAll('input').forEach(inp=>{total++;const ok=inp.value.toUpperCase()===inp.dataset.answer;inp.classList.toggle('ok',ok);inp.classList.toggle('wrong',!ok&&inp.value!=='');if(ok)score++;});if(score===total)showResult(c,score,total,()=>gameCrossword(c,content));};
  c.appendChild(checkBtn);
}

/* ── SPIN THE WHEEL ── */
function gameSpinWheel(c,content){
  const items=(content.items||[]).filter(s=>s.trim());
  if(!items.length){c.innerHTML='<p class="empty-msg">No items.</p>';return;}
  c.innerHTML='';
  const wrap=document.createElement('div');wrap.className='spin-wrap';c.appendChild(wrap);
  const COLORS=['#FF5C23','#B4A1FF','#CAE78D','#04392F','#1D1050','#FAEAD3','#a87be8','#7c5cbf'];
  const cWrap=document.createElement('div');cWrap.className='spin-canvas-wrap';
  const canvas=document.createElement('canvas');canvas.width=300;canvas.height=300;
  const pointer=document.createElement('div');pointer.className='spin-pointer';pointer.textContent='▼';
  cWrap.appendChild(canvas);cWrap.appendChild(pointer);
  const ctx=canvas.getContext('2d');const R=145,cx=150,cy=150;const arc=2*Math.PI/items.length;
  let angle=0,spinning=false;
  function draw(rot){
    ctx.clearRect(0,0,300,300);
    items.forEach((item,i)=>{const start=rot+i*arc,end=start+arc;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,start,end);ctx.closePath();ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(start+arc/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 13px Poppins,sans-serif';const maxLen=12;const txt=item.length>maxLen?item.slice(0,maxLen)+'…':item;ctx.fillText(txt,R-10,5);ctx.restore();});
    ctx.beginPath();ctx.arc(cx,cy,16,0,2*Math.PI);ctx.fillStyle=COLORS[0];ctx.fill();
  }
  draw(0);
  const resultEl=document.createElement('div');resultEl.className='spin-result';
  const spinBtn=document.createElement('button');spinBtn.className='btn btn-primary';spinBtn.textContent='🎡 Spin!';
  spinBtn.onclick=()=>{if(spinning)return;spinning=true;resultEl.textContent='';const totalRot=2*Math.PI*(5+Math.random()*5);const dur=3000;const start=performance.now();function step(now){const elapsed=Math.min(1,(now-start)/dur);const ease=1-Math.pow(1-elapsed,4);const rot=ease*totalRot;angle=rot;draw(angle);if(elapsed<1){requestAnimationFrame(step);}else{spinning=false;const finalAngle=((2*Math.PI-(angle%(2*Math.PI)))+Math.PI/2-arc/2)%(2*Math.PI);const idx=Math.floor(finalAngle/(2*Math.PI)*items.length)%items.length;resultEl.textContent='👉 '+items[idx];}}
  requestAnimationFrame(step);};
  wrap.appendChild(cWrap);wrap.appendChild(spinBtn);wrap.appendChild(resultEl);
}

/* ── TIME PRESSURE QUIZ ── */
function gameTimePressure(c,content){
  const qs=(content.questions||[]).filter(q=>q.question.trim());
  if(!qs.length){c.innerHTML='<p class="empty-msg">No questions.</p>';return;}
  const secs=parseInt(content.seconds)||15;
  let qi=0,score=0;
  function renderQ(){
    c.innerHTML='';
    if(qi>=qs.length){showResult(c,score,qs.length,()=>gameTimePressure(c,content));return;}
    const q=qs[qi];const opts=typeof q.options==='string'?q.options.split('|').map(s=>s.trim()):(q.options||[]);const ci=parseInt(q.correctIndex)||0;
    const timerBar=document.createElement('div');timerBar.className='tp-timer-bar';timerBar.innerHTML='<div class="tp-timer-fill" style="width:100%"></div>';c.appendChild(timerBar);
    const fill=timerBar.querySelector('.tp-timer-fill');
    const qInfo=document.createElement('div');qInfo.className='play-score';qInfo.textContent=`Q${qi+1}/${qs.length} — Score: ${score}`;c.appendChild(qInfo);
    const qText=document.createElement('div');qText.style.cssText='color:var(--cream);font-size:17px;font-weight:700;margin:12px 0 16px;';qText.textContent=q.question;c.appendChild(qText);
    const optsWrap=document.createElement('div');optsWrap.className='quiz-options';c.appendChild(optsWrap);
    const fb=document.createElement('div');fb.style.cssText='color:var(--lime);font-size:13px;font-weight:700;margin-top:10px;min-height:20px;';c.appendChild(fb);
    let answered=false;
    const endQ=(userAns)=>{
      if(answered)return;answered=true;clearInterval(timer);
      const ok=userAns===ci;if(ok)score++;
      optsWrap.querySelectorAll('.quiz-option').forEach((btn,oi)=>{btn.classList.add('disabled');if(oi===ci)btn.classList.add('sel-ok');else if(oi===userAns&&!ok)btn.classList.add('sel-wrong');});
      fb.textContent=ok?'✅ Correct!':'❌ Answer: '+opts[ci];fb.style.color=ok?'var(--lime)':'#ff6b6b';
      setTimeout(()=>{qi++;renderQ();},1400);
    };
    opts.forEach((opt,oi)=>{const btn=document.createElement('button');btn.className='quiz-option';btn.textContent=opt;btn.onclick=()=>endQ(oi);optsWrap.appendChild(btn);});
    let elapsed=0;
    const timer=setInterval(()=>{elapsed+=100;const pct=Math.max(0,100-(elapsed/(secs*1000)*100));fill.style.width=pct+'%';if(pct<30)fill.classList.add('warning');if(elapsed>=secs*1000){clearInterval(timer);endQ(-1);}},100);
  }
  renderQ();
}

/* ── STUDENT MODE ── */
async function initStudent(){
  const p=new URLSearchParams(location.search);const actId=p.get('activity');if(!actId)return false;
  const{data,error}=await sb.from('activities').select('*').eq('id',actId).single();
  if(error||!data){document.body.innerHTML='<p style="color:#fff;text-align:center;padding:60px;font-size:16px;">Activity not found.<br>Ask your teacher for the correct link.</p>';return true;}
  document.getElementById('studentBadge').style.display='inline';
  document.querySelectorAll('.tab-btn').forEach(b=>b.style.display='none');
  document.getElementById('mainView').style.display='none';
  const play=document.getElementById('playScreen');play.classList.add('active');play.style.position='static';
  document.getElementById('playCloseBtn').style.display='none';
  document.getElementById('playTitle').textContent=data.name;
  document.getElementById('playTemplateTag').textContent=(TMAP[data.template]||{name:data.template}).name;
  const body=document.getElementById('playBody');
  const games={
    'image-match':gameImageMatch,'word-search':gameWordSearch,'flashcard-flip':gameFlashcard,
    'category-sort':gameCategorySort,'odd-one-out':gameOddOneOut,'quiz':gameQuiz,
    'fill-in':gameFillIn,'reorder':gameReorder,'error-correction':gameErrorCorrection,
    'sentence-builder':gameSentenceBuilder,'conjugation':gameConjugation,
    'listen-choose':gameListenChoose,'listen-spell':gameListenSpell,'stress-marker':gameStressMarker,
    'conv-prompt':gameConvPrompt,'opinion-poll':gameOpinionPoll,'story-sequence':gameStorySequence,
    'memory-game':gameMemory,'hangman':gameHangman,'crossword':gameCrossword,
    'spin-wheel':gameSpinWheel,'time-pressure':gameTimePressure
  };
  const fn=games[data.template];if(fn)fn(body,data.content);
  return true;
}

/* ── INIT ── */
(async function(){
  const isStudent=await initStudent();
  if(!isStudent){await fetchActivities();}
})();
