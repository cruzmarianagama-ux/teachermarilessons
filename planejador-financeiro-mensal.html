<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejador Financeiro Mensal — Teacher Mari</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

:root{
  --orange:#FF5C23;
  --purple:#1D1050;
  --green-dark:#04392F;
  --green-light:#CAE78D;
  --lavender:#B4A1FF;
  --cream:#FAEAD3;
  --white:#FFFFFF;
  --danger:#D8404A;
  --gray:#6B6478;
  --radius:18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Poppins', sans-serif;
  background:var(--cream);
  color:var(--purple);
  padding:24px;
  min-height:100vh;
}
.app{ max-width:1100px; margin:0 auto; }

.header-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.header h1{ font-size:1.5rem; font-weight:800; color:var(--purple); }
.header h1 span{ color:var(--orange); }
.header .subtitle{ font-size:0.82rem; color:var(--gray); font-weight:500; margin-top:2px; }
.header-actions{ display:flex; gap:8px; }
.btn-ghost{
  font-family:'Poppins', sans-serif; background:transparent; color:var(--purple);
  border:1.5px solid #E4DCC8; padding:7px 13px; border-radius:999px; font-size:0.76rem; font-weight:600; cursor:pointer;
}
.btn-ghost:hover{ background:var(--white); }

.month-tabs-wrap{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:20px; scrollbar-width:thin; }
.month-tab{
  font-family:'Poppins', sans-serif; flex:0 0 auto; background:transparent; color:var(--purple);
  border:none; padding:8px 15px; border-radius:999px; font-weight:600; font-size:0.8rem; cursor:pointer;
  opacity:0.5; white-space:nowrap; transition:all 0.15s ease;
}
.month-tab:hover{ opacity:0.8; }
.month-tab.active{ background:var(--purple); color:#fff; opacity:1; }
.month-tab.overview{ background:var(--orange); color:var(--white); opacity:1; }
.month-tab.overview.active{ background:var(--purple); }
.neg-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--danger); margin-left:5px; }

.panels-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; margin-bottom:24px; }
.panel{ background:var(--white); border-radius:var(--radius); margin-bottom:18px; overflow:hidden; }
.panels-grid .panel{ margin-bottom:0; }
@media (max-width:780px){ .panels-grid{ grid-template-columns:1fr; } }
.panel-head{ display:flex; justify-content:space-between; align-items:baseline; padding:18px 20px 4px; }
.panel-head h2{ font-size:1rem; font-weight:700; }
.panel-head .total{ font-size:0.95rem; font-weight:800; color:var(--purple); }
.panel-hint{ font-size:0.76rem; color:var(--gray); padding:0 20px 14px; }

/* List rows */
.list-row{
  display:flex; align-items:center; gap:12px; padding:13px 20px;
  border-top:1px solid #F0E8D8;
}
.list-row:first-child{ border-top:none; }
.row-icon{
  flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1.05rem;
}
.row-main{ flex:1; min-width:0; }
.row-name{ font-size:0.9rem; font-weight:700; color:var(--purple); }
.row-sub{ font-size:0.76rem; color:var(--gray); margin-top:1px; }
.row-amount{ font-size:0.92rem; font-weight:800; white-space:nowrap; text-align:right; }
.row-amount.income{ color:var(--green-dark); }
.row-amount.expense{ color:var(--danger); }
.row-actions{ display:flex; gap:2px; flex:0 0 auto; }
.icon-btn{
  background:transparent; border:none; cursor:pointer; font-size:0.95rem; color:var(--gray);
  padding:5px 6px; border-radius:8px;
}
.icon-btn:hover{ background:var(--cream); color:var(--purple); }
.icon-btn.danger:hover{ color:var(--danger); }
.check-circle{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:2px solid #D9CFB8;
  background:transparent; display:flex; align-items:center; justify-content:center;
  font-size:0.72rem; color:transparent; cursor:pointer; padding:0;
}
.check-circle:hover{ border-color:var(--orange); }
.check-circle.checked{ background:var(--green-dark); border-color:var(--green-dark); color:#fff; }
.list-row.is-checked .row-name{ text-decoration:line-through; opacity:0.55; }
.list-row.is-checked .row-sub{ opacity:0.55; }
.list-row.is-checked .row-amount{ opacity:0.55; }
.row-day{ font-size:0.7rem; color:var(--gray); font-weight:600; flex:0 0 auto; min-width:34px; text-align:center; background:var(--cream); border-radius:8px; padding:4px 0;}

.empty-row{ padding:18px 20px; font-size:0.84rem; color:var(--gray); text-align:center; }

/* Add toggle + form */
.add-toggle{
  display:flex; align-items:center; gap:8px; padding:13px 20px; border-top:1px solid #F0E8D8;
  cursor:pointer; color:var(--orange); font-weight:700; font-size:0.86rem; background:transparent; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left; font-family:'Poppins',sans-serif;
}
.add-toggle:hover{ background:var(--cream); }
.add-form{ padding:6px 20px 18px; border-top:1px solid #F0E8D8; }
.add-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.add-grid .full{ grid-column:1 / -1; }
.add-form label{ font-size:0.7rem; font-weight:600; color:var(--gray); display:block; margin-bottom:4px; }
input, select{
  font-family:'Poppins', sans-serif; padding:9px 11px; border:1.5px solid #E4DCC8; border-radius:10px;
  font-size:0.84rem; color:var(--purple); background:var(--cream); width:100%;
}
input:focus, select:focus{ outline:none; border-color:var(--orange); }
button{ font-family:'Poppins', sans-serif; cursor:pointer; border:none; border-radius:10px; font-weight:600; }
.btn-primary{ background:var(--orange); color:#fff; padding:10px 18px; font-size:0.84rem; }
.btn-primary:hover{ opacity:0.9; }
.btn-text{ background:transparent; color:var(--gray); padding:10px 12px; font-size:0.84rem; }

/* Edit row (inline) */
.edit-row{ padding:13px 20px; border-top:1px solid #F0E8D8; }
.edit-row:first-child{ border-top:none; }
.edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.edit-grid .full{ grid-column:1 / -1; }
.edit-actions{ display:flex; gap:8px; justify-content:flex-end; }

/* Summary panel */
.summary-list .list-row{ justify-content:space-between; }
.summary-list .row-name{ font-weight:600; font-size:0.86rem; color:var(--gray); }
.summary-list .row-amount{ font-size:1rem; }
.saldo-banner{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--orange); color:#fff; padding:18px 20px; border-radius:var(--radius); margin-bottom:18px;
}
.saldo-banner.negative{ background:var(--danger); }
.saldo-banner .label{ font-size:0.82rem; font-weight:600; opacity:0.9; }
.saldo-banner .value{ font-size:1.4rem; font-weight:800; }

.goal-compare{ padding:14px 20px; font-size:0.84rem; color:var(--gray); display:flex; justify-content:space-between; border-top:1px solid #F0E8D8;}
.goal-compare b{ color:var(--purple); }
.diff-positive{ color:var(--green-dark); font-weight:700; }
.diff-negative{ color:var(--danger); font-weight:700; }

/* Goals panels (overview) */
.goal-fields{ padding:6px 20px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.goal-fields label{ font-size:0.7rem; font-weight:600; color:var(--gray); display:block; margin-bottom:4px; }
.goal-fields .full{ grid-column:1/-1; }
.progress-track{ margin:0 20px 16px; height:10px; background:var(--cream); border-radius:999px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--orange); border-radius:999px; }

/* Month overview list */
.month-line{ display:flex; align-items:center; gap:12px; padding:13px 20px; border-top:1px solid #F0E8D8; cursor:pointer; }
.month-line:first-child{ border-top:none; }
.month-line:hover{ background:var(--cream); }
.month-line .name{ font-weight:700; font-size:0.86rem; width:70px; flex:0 0 auto; }
.month-line .bar-bg{ flex:1; height:8px; background:#F0E8D8; border-radius:999px; overflow:hidden; }
.month-line .bar-fill{ height:100%; border-radius:999px; }
.month-line .bar-fill.pos{ background:var(--green-light); }
.month-line .bar-fill.neg{ background:var(--danger); }
.month-line .saldo{ font-weight:800; font-size:0.86rem; width:100px; flex:0 0 auto; text-align:right; }
.month-line .saldo.negative{ color:var(--danger); }

@media (max-width:680px){
  .add-grid, .edit-grid, .goal-fields{ grid-template-columns:1fr; }
  .month-line .name{ width:54px; font-size:0.78rem;}
  .month-line .saldo{ width:80px; font-size:0.78rem;}
}
.lock-overlay{
  position:fixed; inset:0; background:var(--cream); display:flex; align-items:center; justify-content:center;
  z-index:9999; padding:20px;
}
.lock-box{
  background:var(--white); border-radius:var(--radius); padding:32px 28px; max-width:340px; width:100%;
  text-align:center; box-shadow:0 8px 24px rgba(29,16,80,0.12);
}
.lock-box h2{ font-size:1.1rem; font-weight:800; color:var(--purple); margin-bottom:6px; }
.lock-box p{ font-size:0.82rem; color:var(--gray); margin-bottom:18px; }
.lock-box input{ text-align:center; margin-bottom:10px; }
.lock-box .lock-error{ color:var(--danger); font-size:0.78rem; min-height:16px; margin-bottom:8px; }
.lock-box button{ width:100%; }
.app-hidden{ display:none; }
</style>
</head>
<body>

<div class="lock-overlay" id="lock-overlay">
  <div class="lock-box">
    <h2>🔒 Acesso Restrito</h2>
    <p>Digite a senha pra acessar o planejador financeiro</p>
    <input type="password" id="lock-password" placeholder="Senha" onkeydown="if(event.key==='Enter') checkPassword()">
    <div class="lock-error" id="lock-error"></div>
    <button class="btn-primary" onclick="checkPassword()">Entrar</button>
  </div>
</div>

<div class="app app-hidden" id="app-content">
  <div class="header-top">
    <div>
      <h1 class="header">Planejador <span>Financeiro</span></h1>
      <div class="subtitle">Lance uma vez, acompanhe automaticamente nos próximos meses</div>
      <div class="subtitle" style="margin-top:4px;">💾 Dados salvos neste navegador · use Exportar/Importar pra levar pra outro dispositivo</div>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" onclick="exportData()">⬇ Exportar</button>
      <button class="btn-ghost" onclick="document.getElementById('import-file').click()">⬆ Importar</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <div class="month-tabs-wrap" id="month-tabs"></div>
  <div id="view-root"></div>
</div>

<script>
const CATEGORIAS = ["Moradia","Alimentação","Transporte","Lazer","Saúde","Trabalho/Material","Outros"];
const CAT_ICONS = {"Moradia":"🏠","Alimentação":"🍽️","Transporte":"🚗","Lazer":"🎉","Saúde":"💊","Trabalho/Material":"💼","Outros":"📦"};
const TIPOS_RENDA = ["Garantida","Variável"];
const RENDA_ICONS = {"Garantida":"✅","Variável":"🔄"};
const N_MONTHS = 18;
const MONTH_NAMES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

function monthKeyOf(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function monthIndex(key){ const [y,m]=key.split('-').map(Number); return y*12+m; }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return `${MONTH_NAMES[m-1]}/${String(y).slice(2)}`; }

const today = new Date();
const MONTHS = [];
for(let i=0;i<N_MONTHS;i++){
  const d = new Date(today.getFullYear(), today.getMonth()+i, 1);
  MONTHS.push(monthKeyOf(d.getFullYear(), d.getMonth()+1));
}

let state = {
  fixedItems: [], installments: [], overrides: {}, status: {},
  savingsGoal: { monthlyTarget: 0 },
  emergencyFund: { monthsGoal: 6, currentSaved: 0 }
};
let currentView = MONTHS[0];
let editingFixedId = null;
let editingInstallmentId = null;
let addingOpen = { inc:false, exp:false, parc:false };

const fmt = (n) => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = () => 'id-' + Math.random().toString(36).slice(2,10);

function loadState(){
  try{
    const raw = localStorage.getItem('monthly-finance-planner');
    if(raw) state = {...state, ...JSON.parse(raw)};
  }catch(e){}
  if(!state.fixedItems) state.fixedItems=[];
  if(!state.installments) state.installments=[];
  if(!state.overrides) state.overrides={};
  if(!state.status) state.status={};
  if(!state.savingsGoal) state.savingsGoal={monthlyTarget:0};
  if(!state.emergencyFund) state.emergencyFund={monthsGoal:6,currentSaved:0};
  render();
}
function persist(){
  try{ localStorage.setItem('monthly-finance-planner', JSON.stringify(state)); }
  catch(e){ console.error('Erro ao salvar:', e); alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado.'); }
}
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `financeiro-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm('Isso vai substituir todos os dados atuais pelos do arquivo importado. Continuar?')) return;
      state = parsed; await persist(); render();
    }catch(err){ alert('Não foi possível ler esse arquivo. Verifique se é um backup válido.'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function effectiveAmount(item, mKey){
  const idx = monthIndex(mKey);
  if(idx < monthIndex(item.startMonth)) return 0;
  const ov = state.overrides[item.id];
  if(ov){
    let bestKey=null, bestIdx=-Infinity;
    for(const k in ov){ const ki = monthIndex(k); if(ki<=idx && ki>bestIdx){ bestIdx=ki; bestKey=k; } }
    if(bestKey!==null) return ov[bestKey];
  }
  return item.amount;
}
function setOverride(itemId, mKey, value){
  if(!state.overrides[itemId]) state.overrides[itemId]={};
  state.overrides[itemId][mKey]=value;
}
function isChecked(itemId, mKey){
  return !!(state.status[itemId] && state.status[itemId][mKey]);
}
function toggleStatus(itemId, mKey){
  if(!state.status[itemId]) state.status[itemId]={};
  state.status[itemId][mKey] = !state.status[itemId][mKey];
  persist(); render();
}
function activeFixed(type, mKey){
  return state.fixedItems.filter(it=>it.type===type && monthIndex(mKey)>=monthIndex(it.startMonth));
}
function installmentsStatusForMonth(mKey){
  const idx = monthIndex(mKey);
  const novas=[], andamento=[];
  state.installments.forEach(it=>{
    const startIdx = monthIndex(it.startMonth);
    const diff = idx - startIdx;
    if(diff>=0 && diff < it.totalInstallments){
      const parcelaAtual = diff+1;
      const restante = (it.totalInstallments - parcelaAtual + 1) * it.installmentValue;
      const obj = {...it, parcelaAtual, restante};
      if(parcelaAtual===1) novas.push(obj); else andamento.push(obj);
    }
  });
  return {novas, andamento};
}
function monthTotals(mKey){
  const incItems = activeFixed('entrada', mKey);
  const incGarantida = incItems.filter(it=>it.category==='Garantida').reduce((s,it)=>s+effectiveAmount(it,mKey),0);
  const incVariavel = incItems.filter(it=>it.category==='Variável').reduce((s,it)=>s+effectiveAmount(it,mKey),0);
  const inc = incGarantida + incVariavel;
  const incRecebido = incItems.filter(it=>isChecked(it.id,mKey)).reduce((s,it)=>s+effectiveAmount(it,mKey),0);
  const incPendente = inc - incRecebido;

  const expItems = activeFixed('saida', mKey);
  const exp = expItems.reduce((s,it)=>s+effectiveAmount(it,mKey),0);
  const expPago = expItems.filter(it=>isChecked(it.id,mKey)).reduce((s,it)=>s+effectiveAmount(it,mKey),0);
  const expPendente = exp - expPago;

  const {novas, andamento} = installmentsStatusForMonth(mKey);
  const allParc = [...novas,...andamento];
  const parcTotal = allParc.reduce((s,it)=>s+it.installmentValue,0);
  const parcPago = allParc.filter(it=>isChecked(it.id,mKey)).reduce((s,it)=>s+it.installmentValue,0);
  const parcPendente = parcTotal - parcPago;

  const saldo = inc - exp - parcTotal;
  return {inc, incGarantida, incVariavel, incRecebido, incPendente, exp, expPago, expPendente, parcTotal, parcPago, parcPendente, saldo, novas, andamento};
}
function fixedMonthlyExpenseTotal(mKey){
  return activeFixed('saida', mKey).reduce((s,it)=>s+effectiveAmount(it,mKey),0);
}

// ---------------- Rendering ----------------
function renderTabs(){
  const wrap = document.getElementById('month-tabs');
  let html = `<button class="month-tab overview ${currentView==='overview'?'active':''}" onclick="switchView('overview')">📊 Geral</button>`;
  html += MONTHS.map(m => {
    const neg = monthTotals(m).saldo < 0;
    return `<button class="month-tab ${currentView===m?'active':''}" onclick="switchView('${m}')">${monthLabel(m)}${neg?'<span class="neg-dot"></span>':''}</button>`;
  }).join('');
  wrap.innerHTML = html;
}
function switchView(v){ currentView=v; editingFixedId=null; editingInstallmentId=null; addingOpen={inc:false,exp:false,parc:false}; render(); }
function render(){
  renderTabs();
  document.getElementById('view-root').innerHTML = currentView==='overview' ? renderOverview() : renderMonth(currentView);
}

function buildLineChartSVG(rows){
  const W=820, H=180, padL=40, padR=15, padT=16, padB=24;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const vals = rows.map(r=>r.saldo);
  const maxV = Math.max(...vals, 0), minV = Math.min(...vals, 0);
  const range = (maxV-minV)||1;
  const xStep = innerW/(rows.length-1);
  const yOf = (v) => padT + innerH - ((v-minV)/range)*innerH;
  const xOf = (i) => padL + i*xStep;
  const zeroY = yOf(0);
  const points = rows.map((r,i)=>`${xOf(i)},${yOf(r.saldo)}`).join(' ');
  const dots = rows.map((r,i)=>`<circle cx="${xOf(i)}" cy="${yOf(r.saldo)}" r="3" fill="${r.saldo<0?'#D8404A':'#04392F'}"/>`).join('');
  const labels = rows.map((r,i)=> i%3===0 ? `<text x="${xOf(i)}" y="${H-6}" font-size="9" fill="#6B6478" text-anchor="middle">${monthLabel(r.m)}</text>` : '').join('');
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; font-family:Poppins,sans-serif;">
    <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="#E4DCC8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polyline points="${points}" fill="none" stroke="#FF5C23" stroke-width="2.5"/>
    ${dots}${labels}
  </svg>`;
}

function renderOverview(){
  const rows = MONTHS.map(m=>({m, ...monthTotals(m)}));
  const maxAbs = Math.max(1, ...rows.map(r=>Math.abs(r.saldo)));
  const monthLines = rows.map(r=>{
    const pct = Math.min(100, (Math.abs(r.saldo)/maxAbs)*100);
    const cls = r.saldo<0 ? 'neg' : 'pos';
    return `
      <div class="month-line" onclick="switchView('${r.m}')">
        <span class="name">${monthLabel(r.m)}</span>
        <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
        <span class="saldo ${r.saldo<0?'negative':''}">${fmt(r.saldo)}</span>
      </div>`;
  }).join('');

  const sg = state.savingsGoal;
  const ef = state.emergencyFund;
  const fixedExpNow = fixedMonthlyExpenseTotal(MONTHS[0]);
  const efMeta = (ef.monthsGoal||0) * fixedExpNow;
  const efFaltam = Math.max(0, efMeta - (ef.currentSaved||0));
  const efPct = efMeta>0 ? Math.min(100, (ef.currentSaved/efMeta)*100) : 0;

  return `
    <div class="panel">
      <div class="panel-head"><h2>Evolução do Saldo</h2></div>
      <div class="panel-hint">Tendência nos próximos ${N_MONTHS} meses</div>
      <div style="padding:0 12px 16px;">${buildLineChartSVG(rows)}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Todos os Meses</h2></div>
      <div class="panel-hint">Toque num mês pra ver o detalhe</div>
      ${monthLines}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Meta de Economia Mensal</h2></div>
      <div class="panel-hint">Comparada automaticamente com o saldo de cada mês</div>
      <div class="goal-fields">
        <div class="full">
          <label>Meta mensal (R$)</label>
          <input type="number" id="savings-target" value="${sg.monthlyTarget||0}" step="0.01">
        </div>
      </div>
      <div style="padding:0 20px 16px;"><button class="btn-primary" onclick="saveSavingsGoal()">Salvar meta</button></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Reserva de Emergência</h2></div>
      <div class="panel-hint">Baseado nas saídas fixas de ${monthLabel(MONTHS[0])}: ${fmt(fixedExpNow)}/mês</div>
      <div class="goal-fields">
        <div><label>Meses de cobertura</label><input type="number" id="ef-months" value="${ef.monthsGoal||0}" min="0"></div>
        <div><label>Guardado atualmente (R$)</label><input type="number" id="ef-saved" value="${ef.currentSaved||0}" step="0.01"></div>
      </div>
      <div style="padding:0 20px 14px;"><button class="btn-primary" onclick="saveEmergencyFund()">Salvar</button></div>
      <div class="progress-track"><div class="progress-fill" style="width:${efPct}%"></div></div>
      <div class="goal-compare"><span>Meta da reserva: <b>${fmt(efMeta)}</b></span><span>Faltam: <b class="${efFaltam>0?'diff-negative':'diff-positive'}">${fmt(efFaltam)}</b></span></div>
      <div class="goal-compare" style="border-top:none; padding-top:0;"><span>Progresso</span><span><b>${efPct.toFixed(0)}%</b></span></div>
    </div>
  `;
}

function fixedListRows(type, mKey){
  const items = [...activeFixed(type, mKey)].sort((a,b)=>(a.day||99)-(b.day||99));
  if(items.length===0) return `<div class="empty-row">Nenhum item cadastrado ainda.</div>`;
  return items.map(it=>{
    if(editingFixedId===it.id) return fixedEditRow(it, type, mKey);
    const val = effectiveAmount(it, mKey);
    const icon = type==='entrada' ? (RENDA_ICONS[it.category]||'💰') : (CAT_ICONS[it.category]||'📦');
    const iconBg = type==='entrada' ? 'var(--green-light)' : '#F3E3C4';
    const checked = isChecked(it.id, mKey);
    const dayText = it.day ? `dia ${it.day}` : '';
    return `
      <div class="list-row ${checked?'is-checked':''}">
        <button class="check-circle ${checked?'checked':''}" title="${type==='entrada'?'Marcar como recebido':'Marcar como pago'}" onclick="toggleStatus('${it.id}','${mKey}')">✓</button>
        ${it.day?`<div class="row-day">${it.day}</div>`:''}
        <div class="row-icon" style="background:${iconBg}">${icon}</div>
        <div class="row-main">
          <div class="row-name">${it.name}</div>
          <div class="row-sub">${it.category}${it.note?' · '+it.note:''}</div>
        </div>
        <div class="row-amount ${type==='entrada'?'income':'expense'}">${fmt(val)}</div>
        <div class="row-actions">
          <button class="icon-btn" title="Editar" onclick="editFixed('${it.id}')">✎</button>
          <button class="icon-btn" title="Duplicar" onclick="duplicateFixed('${it.id}','${mKey}')">⧉</button>
          <button class="icon-btn danger" title="Excluir" onclick="deleteFixed('${it.id}')">✕</button>
        </div>
      </div>`;
  }).join('');
}

function fixedEditRow(it, type, mKey){
  const catOptions = type==='entrada' ? TIPOS_RENDA : CATEGORIAS;
  const val = effectiveAmount(it, mKey);
  return `
    <div class="edit-row">
      <div class="edit-grid">
        <div><label>Descrição</label><input type="text" id="ef-name-${it.id}" value="${it.name}"></div>
        <div><label>${type==='entrada'?'Tipo de Renda':'Categoria'}</label>
          <select id="ef-cat-${it.id}">${catOptions.map(c=>`<option ${c===it.category?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div><label>Valor (R$)</label><input type="number" step="0.01" id="ef-val-${it.id}" value="${val}"></div>
        <div><label>Dia do mês (opcional)</label><input type="number" min="1" max="31" id="ef-day-${it.id}" value="${it.day||''}"></div>
        <div class="full"><label>Observação</label><input type="text" id="ef-note-${it.id}" value="${it.note||''}"></div>
      </div>
      <div class="edit-actions">
        <button class="btn-text" onclick="cancelFixedEdit()">Cancelar</button>
        <button class="btn-primary" onclick="saveFixedEdit('${it.id}','${mKey}')">Salvar</button>
      </div>
    </div>`;
}

function addToggleAndForm(kind, mKey, label, fieldsHtml, onSubmit){
  const open = addingOpen[kind];
  return `
    <button class="add-toggle" onclick="toggleAdd('${kind}')">${open?'– Fechar':'+ '+label}</button>
    ${open ? `<div class="add-form">${fieldsHtml}<button class="btn-primary" onclick="${onSubmit}">Adicionar</button></div>` : ''}
  `;
}

function installmentListRow(it, mKey){
  if(editingInstallmentId===it.id) return installmentEditRow(it);
  const checked = isChecked(it.id, mKey);
  return `
    <div class="list-row ${checked?'is-checked':''}">
      <button class="check-circle ${checked?'checked':''}" title="Marcar como pago" onclick="toggleStatus('${it.id}','${mKey}')">✓</button>
      ${it.day?`<div class="row-day">${it.day}</div>`:''}
      <div class="row-icon" style="background:#FFE0D1">${CAT_ICONS[it.category]||'💳'}</div>
      <div class="row-main">
        <div class="row-name">${it.name}</div>
        <div class="row-sub">${it.category} · parcela ${it.parcelaAtual}/${it.totalInstallments} · resta ${fmt(it.restante)}</div>
      </div>
      <div class="row-amount expense">${fmt(it.installmentValue)}</div>
      <div class="row-actions">
        <button class="icon-btn" title="Editar" onclick="startInstallmentEdit('${it.id}')">✎</button>
        <button class="icon-btn danger" title="Excluir" onclick="deleteInstallment('${it.id}')">✕</button>
      </div>
    </div>`;
}
function installmentEditRow(it){
  return `
    <div class="edit-row">
      <div class="edit-grid">
        <div><label>Descrição</label><input type="text" id="edit-name-${it.id}" value="${it.name}"></div>
        <div><label>Categoria</label><select id="edit-cat-${it.id}">${CATEGORIAS.map(c=>`<option ${c===it.category?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>Valor da Parcela</label><input type="number" step="0.01" id="edit-val-${it.id}" value="${it.installmentValue}"></div>
        <div><label>Nº de Parcelas</label><input type="number" min="1" id="edit-n-${it.id}" value="${it.totalInstallments}"></div>
        <div class="full"><label>Dia do mês (opcional)</label><input type="number" min="1" max="31" id="edit-day-${it.id}" value="${it.day||''}"></div>
      </div>
      <div class="edit-actions">
        <button class="btn-text" onclick="cancelInstallmentEdit()">Cancelar</button>
        <button class="btn-primary" onclick="saveInstallmentEdit('${it.id}')">Salvar</button>
      </div>
    </div>`;
}

function renderMonth(mKey){
  const t = monthTotals(mKey);
  const incRows = fixedListRows('entrada', mKey);
  const expRows = fixedListRows('saida', mKey);
  const novasSorted = [...t.novas].sort((a,b)=>(a.day||99)-(b.day||99));
  const andSorted = [...t.andamento].sort((a,b)=>(a.day||99)-(b.day||99));
  const novasRows = t.novas.length===0 ? `<div class="empty-row">Nenhuma conta nova lançada neste mês.</div>` : novasSorted.map(it=>installmentListRow(it, mKey)).join('');
  const andRows = t.andamento.length===0 ? `<div class="empty-row">Nenhuma parcela em andamento de meses anteriores.</div>` : andSorted.map(it=>installmentListRow(it, mKey)).join('');

  const sg = state.savingsGoal.monthlyTarget||0;
  const diff = t.saldo - sg;

  const incFields = `
    <div class="add-grid">
      <div><label>Descrição</label><input type="text" id="inc-name" placeholder="Ex: Aulas fixas"></div>
      <div><label>Tipo de Renda</label><select id="inc-tipo">${TIPOS_RENDA.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div><label>Valor (R$)</label><input type="number" id="inc-amount" step="0.01"></div>
      <div><label>Dia do mês (opcional)</label><input type="number" id="inc-day" min="1" max="31" placeholder="Ex: 5"></div>
      <div class="full"><label>Observação</label><input type="text" id="inc-note" placeholder="Opcional"></div>
    </div>`;
  const expFields = `
    <div class="add-grid">
      <div><label>Descrição</label><input type="text" id="exp-name" placeholder="Ex: Aluguel"></div>
      <div><label>Categoria</label><select id="exp-tipo">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div><label>Valor (R$)</label><input type="number" id="exp-amount" step="0.01"></div>
      <div><label>Dia do mês (opcional)</label><input type="number" id="exp-day" min="1" max="31" placeholder="Ex: 10"></div>
      <div class="full"><label>Observação</label><input type="text" id="exp-note" placeholder="Opcional"></div>
    </div>`;
  const parcFields = `
    <div class="add-grid">
      <div><label>Descrição</label><input type="text" id="parc-name" placeholder="Ex: Telefone novo"></div>
      <div><label>Categoria</label><select id="parc-cat">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div><label>Valor da Parcela</label><input type="number" id="parc-amount" step="0.01"></div>
      <div><label>Nº de Parcelas</label><input type="number" id="parc-n" min="1"></div>
      <div><label>Dia do mês (opcional)</label><input type="number" id="parc-day" min="1" max="31" placeholder="Ex: 15"></div>
      <div class="full"><label>Observação</label><input type="text" id="parc-note" placeholder="Opcional"></div>
    </div>`;

  return `
    <div class="saldo-banner ${t.saldo<0?'negative':''}">
      <span class="label">Saldo de ${monthLabel(mKey)}</span>
      <span class="value">${fmt(t.saldo)}</span>
    </div>

    <div class="panels-grid">
      <div class="panel">
        <div class="panel-head"><h2>Entradas Fixas</h2><span class="total">${fmt(t.inc)}</span></div>
        <div class="panel-hint">Edite o valor aqui se mudar só neste mês — segue automático pros próximos</div>
        ${incRows}
        ${addToggleAndForm('inc', mKey, 'Adicionar Entrada Fixa', incFields, `addFixed('entrada','${mKey}')`)}
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Saídas Fixas</h2><span class="total">${fmt(t.exp)}</span></div>
        <div class="panel-hint">Edite o valor aqui se mudar só neste mês — segue automático pros próximos</div>
        ${expRows}
        ${addToggleAndForm('exp', mKey, 'Adicionar Saída Fixa', expFields, `addFixed('saida','${mKey}')`)}
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Contas / Parcelas Novas</h2><span class="total">${fmt(t.novas.reduce((s,i)=>s+i.installmentValue,0))}</span></div>
        <div class="panel-hint">Lance assim que fizer a compra — aparece automaticamente nos próximos meses até acabar</div>
        ${novasRows}
        ${addToggleAndForm('parc', mKey, 'Adicionar Conta/Parcela', parcFields, `addInstallment('${mKey}')`)}
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Parcelas em Andamento</h2><span class="total">${fmt(t.andamento.reduce((s,i)=>s+i.installmentValue,0))}</span></div>
        <div class="panel-hint">De meses anteriores — atualiza automaticamente</div>
        ${andRows}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Resumo</h2></div>
      <div class="summary-list">
        <div class="list-row"><span class="row-name">Entradas Garantidas</span><span class="row-amount income">${fmt(t.incGarantida)}</span></div>
        <div class="list-row"><span class="row-name">Entradas Variáveis</span><span class="row-amount income">${fmt(t.incVariavel)}</span></div>
        <div class="list-row"><span class="row-name">　↳ já recebido</span><span class="row-amount income">${fmt(t.incRecebido)}</span></div>
        <div class="list-row"><span class="row-name">　↳ a receber</span><span class="row-amount">${fmt(t.incPendente)}</span></div>
        <div class="list-row"><span class="row-name">Saídas Fixas</span><span class="row-amount expense">${fmt(t.exp)}</span></div>
        <div class="list-row"><span class="row-name">　↳ já pago</span><span class="row-amount expense">${fmt(t.expPago)}</span></div>
        <div class="list-row"><span class="row-name">　↳ a pagar</span><span class="row-amount">${fmt(t.expPendente)}</span></div>
        <div class="list-row"><span class="row-name">Parcelas (Novas + Andamento)</span><span class="row-amount expense">${fmt(t.parcTotal)}</span></div>
        <div class="list-row"><span class="row-name">　↳ já pago</span><span class="row-amount expense">${fmt(t.parcPago)}</span></div>
        <div class="list-row"><span class="row-name">　↳ a pagar</span><span class="row-amount">${fmt(t.parcPendente)}</span></div>
      </div>
      <div class="goal-compare"><span>Meta de economia deste mês: <b>${fmt(sg)}</b></span><span>Diferença: <b class="${diff>=0?'diff-positive':'diff-negative'}">${fmt(diff)}</b></span></div>
    </div>
  `;
}

// ---------------- Actions ----------------
function toggleAdd(kind){ addingOpen[kind] = !addingOpen[kind]; render(); }

function addFixed(type, mKey){
  const nameEl = document.getElementById(type==='entrada'?'inc-name':'exp-name');
  const tipoEl = document.getElementById(type==='entrada'?'inc-tipo':'exp-tipo');
  const amountEl = document.getElementById(type==='entrada'?'inc-amount':'exp-amount');
  const noteEl = document.getElementById(type==='entrada'?'inc-note':'exp-note');
  const dayEl = document.getElementById(type==='entrada'?'inc-day':'exp-day');
  const name = nameEl.value.trim();
  const amount = parseFloat(amountEl.value);
  const day = parseInt(dayEl.value);
  if(!name || isNaN(amount)) return;
  state.fixedItems.push({ id: uid(), type, name, category: tipoEl.value, amount, note: noteEl.value.trim(), startMonth: mKey, day: isNaN(day)?null:day });
  addingOpen[type==='entrada'?'inc':'exp'] = false;
  persist(); render();
}
function editFixed(id){ editingFixedId = id; render(); }
function cancelFixedEdit(){ editingFixedId = null; render(); }
function saveFixedEdit(id, mKey){
  const it = state.fixedItems.find(i=>i.id===id);
  if(!it) return;
  const name = document.getElementById(`ef-name-${id}`).value.trim();
  const cat = document.getElementById(`ef-cat-${id}`).value;
  const val = parseFloat(document.getElementById(`ef-val-${id}`).value);
  const note = document.getElementById(`ef-note-${id}`).value.trim();
  const day = parseInt(document.getElementById(`ef-day-${id}`).value);
  if(!name || isNaN(val)) return;
  it.name = name; it.category = cat; it.note = note; it.day = isNaN(day)?null:day;
  setOverride(id, mKey, val);
  editingFixedId = null;
  persist(); render();
}
function duplicateFixed(itemId, mKey){
  const it = state.fixedItems.find(i=>i.id===itemId);
  if(!it) return;
  state.fixedItems.push({ id: uid(), type: it.type, name: it.name+' (cópia)', category: it.category, amount: it.amount, note: it.note, startMonth: mKey });
  persist(); render();
}
function deleteFixed(itemId){
  state.fixedItems = state.fixedItems.filter(it=>it.id!==itemId);
  delete state.overrides[itemId];
  persist(); render();
}
function addInstallment(mKey){
  const name = document.getElementById('parc-name').value.trim();
  const category = document.getElementById('parc-cat').value;
  const amount = parseFloat(document.getElementById('parc-amount').value);
  const n = parseInt(document.getElementById('parc-n').value);
  const note = document.getElementById('parc-note').value.trim();
  const day = parseInt(document.getElementById('parc-day').value);
  if(!name || isNaN(amount) || isNaN(n) || n<1) return;
  state.installments.push({ id: uid(), name, category, installmentValue: amount, totalInstallments: n, startMonth: mKey, note, day: isNaN(day)?null:day });
  addingOpen.parc = false;
  persist(); render();
}
function deleteInstallment(id){
  state.installments = state.installments.filter(it=>it.id!==id);
  persist(); render();
}
function startInstallmentEdit(id){ editingInstallmentId = id; render(); }
function cancelInstallmentEdit(){ editingInstallmentId = null; render(); }
function saveInstallmentEdit(id){
  const it = state.installments.find(i=>i.id===id);
  if(!it) return;
  const name = document.getElementById(`edit-name-${id}`).value.trim();
  const category = document.getElementById(`edit-cat-${id}`).value;
  const val = parseFloat(document.getElementById(`edit-val-${id}`).value);
  const n = parseInt(document.getElementById(`edit-n-${id}`).value);
  const day = parseInt(document.getElementById(`edit-day-${id}`).value);
  if(!name || isNaN(val) || isNaN(n) || n<1) return;
  it.name=name; it.category=category; it.installmentValue=val; it.totalInstallments=n; it.day = isNaN(day)?null:day;
  editingInstallmentId = null;
  persist(); render();
}
function saveSavingsGoal(){
  const v = parseFloat(document.getElementById('savings-target').value);
  state.savingsGoal.monthlyTarget = isNaN(v) ? 0 : v;
  persist(); render();
}
function saveEmergencyFund(){
  const months = parseFloat(document.getElementById('ef-months').value);
  const saved = parseFloat(document.getElementById('ef-saved').value);
  state.emergencyFund.monthsGoal = isNaN(months) ? 0 : months;
  state.emergencyFund.currentSaved = isNaN(saved) ? 0 : saved;
  persist(); render();
}

const LOCK_PASSWORD = 'Iram2912';
function checkPassword(){
  const input = document.getElementById('lock-password').value;
  const errorEl = document.getElementById('lock-error');
  if(input === LOCK_PASSWORD){
    try{ localStorage.setItem('pfm-unlocked', 'true'); }catch(e){}
    unlockApp();
  } else {
    errorEl.textContent = 'Senha incorreta. Tente novamente.';
    document.getElementById('lock-password').value = '';
  }
}
function unlockApp(){
  document.getElementById('lock-overlay').style.display = 'none';
  document.getElementById('app-content').classList.remove('app-hidden');
  loadState();
}

let alreadyUnlocked = false;
try{ alreadyUnlocked = localStorage.getItem('pfm-unlocked') === 'true'; }catch(e){}
if(alreadyUnlocked){ unlockApp(); }
</script>
